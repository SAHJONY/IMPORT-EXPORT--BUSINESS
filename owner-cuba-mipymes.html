city:.35;pointer-events:none}.ownership{margin:14px 0 8px;padding:16px;border:1px solid #3d3325;background:linear-gradient(180deg,#17140f,#11151b);border-radius:14px}.ownership h3{margin:0 0 12px;font-size:14px;color:#f0d68b}.ownergrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.ownerfield{border:1px solid #2b2a26;background:#101216;border-radius:10px;padding:10px}.ownerfield .k{color:#aa9a72}.ownerstatus{display:inline-block;margin-top:10px;border-radius:999px;padding:5px 8px;font-size:11px;border:1px solid #51462f;color:#e4c773}.ownerstatus.verified{border-color:#315844;color:#78efb8}.row{padding:10px 0;border-bottom:1px solid #222935}.k{font-size:11px;color:#8f9baa;text-transform:uppercase;letter-spacing:.08em}.v{margin-top:4px;white-space:pre-wrap;word-break:break-word}.v a{color:#9ec5ff}.hint{font-size:12px;color:#7f8a99;margin-top:6px}@media(max-width:640px){.wrap{padding:14px}.title{font-size:28px}.panel{padding:16px}.modalhead{top:-16px}.grid,.ownergrid{grid-template-columns:1fr}.comm{flex:1 1 calc(50% - 8px)}}</style></head><body><div class="wrap"><div class="top"><div><div class="eyebrow">SAHJONY LLC · GLOBAL TRADE CRM</div><div class="title">Cuba MIPYMEs</div><div class="muted">Evidence-backed public-source intelligence. Listed or registered ≠ qualified buyer or current RFQ.</div></div><div class="muted" id="status">Loading…</div></div><div class="stats"><div class="stat"><span class="muted">Unique records</span><b id="count">—</b></div><div class="stat"><span class="muted">Target</span><b>15,000+</b></div><div class="stat"><span class="muted">Remaining</span><b id="remaining">—</b></div></div><div class="controls"><div class="searchbox"><input id="q" type="search" autocomplete="off" placeholder="Search record #, company, owner, representative, sector, municipality, phone, email, product…" aria-label="Search Cuba private actors"><button class="clear" id="clearSearch" type="button">Clear</button><div class="hint">Searches across every loaded field instantly, including ownership/representative fields and record number.</div></div><select id="sector"><option value="">All sectors</option></select></div><div id="grid" class="grid"></div><div class="pager"><button id="prev">Previous</button><span id="pageinfo" class="muted"></span><button id="next">Next</button></div></div><div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="mname"><div class="panel" id="panel"><div class="modalhead"><h2 id="mname"></h2><button class="close" id="closeModal" type="button">Close</button></div><div id="communications" class="commbar"></div><div id="ownership"></div><div id="detail"></div></div></div><script>let records=[],page=1,lastFocus=null;const TARGET=15000,PAGE_SIZE=120;const grid=document.getElementById('grid'),q=document.getElementById('q'),sector=document.getElementById('sector'),modal=document.getElementById('modal'),panel=document.getElementById('panel'),prev=document.getElementById('prev'),next=document.getElementById('next'),pageinfo=document.getElementById('pageinfo'),closeModal=document.getElementById('closeModal'),clearSearch=document.getElementById('clearSearch'),communications=document.getElementById('communications'),ownership=document.getElementById('ownership');const safe=v=>v===null||v===undefined||v===''?'—':String(v);const esc=v=>safe(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const first=(r,keys)=>{for(const k of keys){if(r&&r[k])return String(r[k]).trim()}return''};const digits=v=>String(v||'').replace(/\D/g,'');function ownershipInfo(r){const legal=first(r,['legal_owner','owner_name','owners','ownership_name']);const beneficial=first(r,['beneficial_owner','beneficial_owners','ubo_name']);const representative=first(r,['representative_name','legal_representative','representative','buyer_name']);const role=first(r,['representative_role','owner_role','ownership_role']);const pct=first(r,['ownership_percentage','owner_percentage','share_percentage']);const source=first(r,['ownership_source_url','ownership_source','source_url']);const explicitStatus=first(r,['ownership_verification_status','ownership_status']);const hasOwner=!!(legal||beneficial);const status=explicitStatus||(hasOwner?'PUBLIC_SOURCE_OWNER_DATA':'NOT_PUBLICLY_VERIFIED');return{legal,beneficial,representative,role,pct,source,status,hasOwner}}const searchable=r=>{const o=ownershipInfo(r);return [...Object.values(r||{}),o.legal,o.beneficial,o.representative,o.role,o.status].map(v=>safe(v)).join(' ').toLowerCase()};function filtered(){const term=q.value.trim().toLowerCase(),sec=sector.value;return records.filter(r=>(!sec||safe(r.product_category)===sec)&&(!term||searchable(r).includes(term)))}function render(){const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));if(page>pages)page=pages;const start=(page-1)*PAGE_SIZE,visible=rows.slice(start,start+PAGE_SIZE);grid.innerHTML=visible.length?visible.map((r,i)=>{const o=ownershipInfo(r);return `<div class="card" tabindex="0" role="button" data-i="${start+i}"><div class="recordno">#${Number(r.record_number).toLocaleString()}</div><div class="name"><button class="nameLink" type="button" data-i="${start+i}">${esc(r.buyer_company)}</button></div><div class="pill">${esc(r.product_category)}</div><div class="ownerpill">Ownership: ${esc(o.hasOwner?'PUBLIC SOURCE':'VERIFY')}</div><div class="desc">${esc(r.product_description||r.evidence_summary)}</div><div class="muted" style="margin-top:10px;font-size:12px">${esc(r.destination)} · ${esc(r.external_reference)}</div></div>`}).join(''):'<div class="empty">No records match this search or filter.</div>';document.querySelectorAll('.card').forEach(c=>{const open=()=>openRecord(rows[Number(c.dataset.i)],c);c.onclick=e=>{if(e.target.closest('.nameLink'))return;open()};c.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('.nameLink')){e.preventDefault();open()}}});document.querySelectorAll('.nameLink').forEach(b=>{b.onclick=e=>{e.stopPropagation();openRecord(rows[Number(b.dataset.i)],b)}});pageinfo.textContent=`${rows.length.toLocaleString()} matches · page ${page.toLocaleString()} of ${pages.toLocaleString()}`;prev.disabled=page<=1;next.disabled=page>=pages}function commLink(label,href,enabled=true,primary=false){return `<a class="comm ${primary?'primary ':''}${enabled?'':'disabled'}" ${enabled?`href="${esc(href)}"`:''}>${label}</a>`}function buildComms(r){const name=first(r,['buyer_company','company_name','business_name']);const email=first(r,['public_email','email']);const phone=first(r,['public_phone','phone','buyer_contact']);let wa=first(r,['whatsapp']);let waDigits=digits(wa||phone);if(waDigits&&waDigits.length===8)waDigits='53'+waDigits;const base=`/owner/communications-os?contact=${encodeURIComponent(name)}&record=${encodeURIComponent(r.record_number)}`;return [commLink('💬 Chat',base+'&channel=chat',true),commLink('✉️ Email',email?`mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent('SAHJONY LLC — '+name)}`:'',!!email),commLink('📞 Phone',phone?`tel:+${digits(phone)}`:'',!!digits(phone)),commLink('🟢 WhatsApp',waDigits?`https://wa.me/${waDigits}`:'',!!waDigits),commLink('🎙️ Audio',base+'&channel=voice'+(phone?`&phone=${encodeURIComponent(phone)}`:''),true),commLink('🎥 Video',base+'&channel=video',true),commLink('⚡ Communication OS',base,true,true)].join('')}function buildOwnership(r){const o=ownershipInfo(r);const sourceHtml=o.source&&/^https?:\/\//i.test(o.source)?`<a href="${esc(o.source)}" target="_blank" rel="noopener noreferrer">Open ownership evidence/source</a>`:esc(o.source||'Not publicly verified');return `<section class="ownership"><h3>Ownership & Control Intelligence</h3><div class="ownergrid"><div class="ownerfield"><div class="k">Legal owner(s)</div><div class="v">${esc(o.legal||'Not publicly verified')}</div></div><div class="ownerfield"><div class="k">Beneficial owner / UBO</div><div class="v">${esc(o.beneficial||'Not publicly verified')}</div></div><div class="ownerfield"><div class="k">Public representative</div><div class="v">${esc(o.representative||'Not published / not verified')}</div></div><div class="ownerfield"><div class="k">Role / ownership share</div><div class="v">${esc([o.role,o.pct].filter(Boolean).join(' · ')||'Not publicly verified')}</div></div><div class="ownerfield"><div class="k">Ownership evidence</div><div class="v">${sourceHtml}</div></div><div class="ownerfield"><div class="k">Verification rule</div><div class="v">Representative ≠ owner unless the public source explicitly establishes ownership.</div></div></div><span class="ownerstatus ${o.hasOwner?'verified':''}">${esc(o.status)}</span></section>`}function openRecord(r,trigger){lastFocus=trigger||document.activeElement;document.getElementById('mname').textContent=`#${Number(r.record_number).toLocaleString()} · ${safe(r.buyer_company)}`;communications.innerHTML=buildComms(r);ownership.innerHTML=buildOwnership(r);document.getElementById('detail').innerHTML=Object.entries(r).map(([k,v])=>{const label=esc(k.replaceAll('_',' '));if((k==='source_url'||k==='website'||k==='ownership_source_url')&&v){const href=String(v);if(/^https?:\/\//i.test(href))return `<div class="row"><div class="k">${label}</div><div class="v"><a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(href)}</a></div></div>`}return `<div class="row"><div class="k">${label}</div><div class="v">${esc(v)}</div></div>`}).join('');panel.scrollTop=0;modal.classList.add('open');document.body.style.overflow='hidden';closeModal.focus()}function closeRecord(){modal.classList.remove('open');document.body.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus()}q.oninput=()=>{page=1;render()};sector.onchange=()=>{page=1;render()};clearSearch.onclick=()=>{q.value='';page=1;render();q.focus()};prev.onclick=()=>{if(page>1){page--;render();window.scrollTo({top:0,behavior:'smooth'})}};next.onclick=()=>{page++;render();window.scrollTo({top:0,behavior:'smooth'})};closeModal.onclick=closeRecord;modal.onclick=e=>{if(e.target===modal)closeRecord()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeRecord()});fetch('/crm/cuba-mipymes/list',{cache:'no-store'}).then(async r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(d=>{const seen=new Set();records=(d.records||[]).filter(r=>{const key=safe(r.buyer_company).trim().toLowerCase();if(!key||key==='—'||seen.has(key))return false;seen.add(key);return true}).map((r,i)=>({...r,record_number:i+1}));document.getElementById('count').textContent=records.length.toLocaleString();document.getElementById('remaining').textContent=Math.max(0,TARGET-records.length).toLocaleString();document.getElementById('status').textContent=`${records.length.toLocaleString()} unique records · Supabase · ownership shown only when evidence exists`;[...new Set(records.map(r=>r.product_category).filter(Boolean))].sort().forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sector.appendChild(o)});render()}).catch(()=>{document.getElementById('status').textContent='CRM data unavailable';grid.innerHTML='<div class="empty">The Cuba MIPYME CRM API is not reachable. This page is fail-closed and will not fabricate records.</div>';prev.disabled=true;next.disabled=true});</script></body></html>
