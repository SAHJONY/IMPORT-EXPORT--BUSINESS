<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAHJONY LLC · Cuba MIPYMEs CRM</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:Inter,system-ui,-apple-system,sans-serif;margin:0;background:#0b0d10;color:#f5f7fa}.wrap{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}.eyebrow{font-size:12px;letter-spacing:.16em;color:#9aa4b2}.title{font-size:34px;font-weight:750;margin:4px 0}.muted{color:#9aa4b2}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:#12161c;border:1px solid #242b35;border-radius:14px;padding:14px 18px;min-width:150px}.stat b{font-size:24px;display:block}.controls{position:sticky;top:0;z-index:8;display:flex;gap:10px;flex-wrap:wrap;margin:18px 0;padding:12px 0;background:linear-gradient(#0b0d10 70%,rgba(11,13,16,.92))}.searchbox{position:relative;min-width:280px;flex:1}.searchbox input,.controls select{width:100%;background:#12161c;color:#fff;border:1px solid #2a323d;border-radius:12px;padding:13px 14px}.searchbox input{padding-right:92px}.clear{position:absolute;right:7px;top:7px;border:0;border-radius:8px;padding:6px 10px;background:#222935;color:#d8dee9;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}.card{background:#12161c;border:1px solid #242b35;border-radius:14px;padding:16px;cursor:pointer;transition:.15s transform,.15s border-color}.card:hover{border-color:#667085;transform:translateY(-1px)}.name{font-weight:700;font-size:18px}.pill{display:inline-block;margin-top:8px;border:1px solid #344054;border-radius:999px;padding:5px 8px;font-size:11px;color:#cbd5e1}.desc{margin-top:10px;color:#cbd5e1;font-size:13px;line-height:1.45;max-height:74px;overflow:hidden}.empty{padding:28px;background:#12161c;border-radius:14px;color:#aab3bf}.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin:22px 0}.pager button{background:#12161c;color:#fff;border:1px solid #2a323d;border-radius:9px;padding:9px 13px;cursor:pointer}.pager button:disabled{opacity:.4;cursor:not-allowed}.modal{position:fixed;inset:0;background:rgba(0,0,0,.76);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999;overscroll-behavior:contain}.modal.open{display:flex}.panel{position:relative;width:min(900px,calc(100vw - 28px));max-height:min(86vh,900px);overflow:auto;background:#11151b;border:1px solid #2b3440;border-radius:18px;padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.6)}.modalhead{position:sticky;top:-22px;z-index:2;background:#11151b;padding:18px 0 12px;border-bottom:1px solid #222935;margin-bottom:8px}.modalhead h2{margin:0;padding-right:110px}.close{position:absolute;right:0;top:14px;background:#222935;color:#fff;border:1px solid #384252;border-radius:9px;padding:8px 12px;cursor:pointer}.row{padding:10px 0;border-bottom:1px solid #222935}.k{font-size:11px;color:#8f9baa;text-transform:uppercase;letter-spacing:.08em}.v{margin-top:4px;white-space:pre-wrap;word-break:break-word}.v a{color:#9ec5ff}.hint{font-size:12px;color:#7f8a99;margin-top:6px}@media(max-width:640px){.wrap{padding:14px}.title{font-size:28px}.controls{top:0}.panel{padding:16px}.modalhead{top:-16px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow">SAHJONY LLC · GLOBAL TRADE CRM</div>
      <div class="title">Cuba MIPYMEs</div>
      <div class="muted">Evidence-backed public-source intelligence. Listed or registered ≠ qualified buyer or current RFQ.</div>
    </div>
    <div class="muted" id="status">Loading…</div>
  </div>
  <div class="stats">
    <div class="stat"><span class="muted">Unique records</span><b id="count">—</b></div>
    <div class="stat"><span class="muted">Target</span><b>15,000+</b></div>
    <div class="stat"><span class="muted">Remaining</span><b id="remaining">—</b></div>
  </div>
  <div class="controls">
    <div class="searchbox">
      <input id="q" type="search" autocomplete="off" placeholder="Search company, sector, municipality, phone, email, product…" aria-label="Search Cuba private actors">
      <button class="clear" id="clearSearch" type="button">Clear</button>
      <div class="hint">Searches across every loaded field instantly.</div>
    </div>
    <select id="sector"><option value="">All sectors</option></select>
  </div>
  <div id="grid" class="grid"></div>
  <div class="pager"><button id="prev">Previous</button><span id="pageinfo" class="muted"></span><button id="next">Next</button></div>
</div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="mname">
  <div class="panel" id="panel">
    <div class="modalhead"><h2 id="mname"></h2><button class="close" id="closeModal" type="button">Close</button></div>
    <div id="detail"></div>
  </div>
</div>
<script>
let records=[],page=1,lastFocus=null;
const TARGET=15000,PAGE_SIZE=120;
const grid=document.getElementById('grid'),q=document.getElementById('q'),sector=document.getElementById('sector'),modal=document.getElementById('modal'),panel=document.getElementById('panel'),prev=document.getElementById('prev'),next=document.getElementById('next'),pageinfo=document.getElementById('pageinfo'),closeModal=document.getElementById('closeModal'),clearSearch=document.getElementById('clearSearch');
const safe=v=>v===null||v===undefined||v===''?'—':String(v);
const esc=v=>safe(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const searchable=r=>Object.values(r||{}).map(v=>safe(v)).join(' ').toLowerCase();
function filtered(){const term=q.value.trim().toLowerCase(),sec=sector.value;return records.filter(r=>(!sec||safe(r.product_category)===sec)&&(!term||searchable(r).includes(term)))}
function render(){const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));if(page>pages)page=pages;const start=(page-1)*PAGE_SIZE,visible=rows.slice(start,start+PAGE_SIZE);grid.innerHTML=visible.length?visible.map((r,i)=>`<div class="card" tabindex="0" role="button" data-i="${start+i}"><div class="name">${esc(r.buyer_company)}</div><div class="pill">${esc(r.product_category)}</div><div class="desc">${esc(r.product_description||r.evidence_summary)}</div><div class="muted" style="margin-top:10px;font-size:12px">${esc(r.destination)} · ${esc(r.external_reference)}</div></div>`).join(''):'<div class="empty">No records match this search or filter.</div>';document.querySelectorAll('.card').forEach(c=>{const open=()=>openRecord(rows[Number(c.dataset.i)],c);c.onclick=open;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}});pageinfo.textContent=`${rows.length.toLocaleString()} matches · page ${page.toLocaleString()} of ${pages.toLocaleString()}`;prev.disabled=page<=1;next.disabled=page>=pages}
function openRecord(r,trigger){lastFocus=trigger||document.activeElement;document.getElementById('mname').textContent=safe(r.buyer_company);document.getElementById('detail').innerHTML=Object.entries(r).map(([k,v])=>{const label=esc(k.replaceAll('_',' '));if((k==='source_url'||k==='website')&&v){const href=String(v);if(/^https?:\/\//i.test(href))return `<div class="row"><div class="k">${label}</div><div class="v"><a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(href)}</a></div></div>`}return `<div class="row"><div class="k">${label}</div><div class="v">${esc(v)}</div></div>`}).join('');panel.scrollTop=0;modal.classList.add('open');document.body.style.overflow='hidden';closeModal.focus()}
function closeRecord(){modal.classList.remove('open');document.body.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus()}
q.oninput=()=>{page=1;render()};sector.onchange=()=>{page=1;render()};clearSearch.onclick=()=>{q.value='';page=1;render();q.focus()};prev.onclick=()=>{if(page>1){page--;render();window.scrollTo({top:0,behavior:'smooth'})}};next.onclick=()=>{page++;render();window.scrollTo({top:0,behavior:'smooth'})};closeModal.onclick=closeRecord;modal.onclick=e=>{if(e.target===modal)closeRecord()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeRecord()});
fetch('/crm/cuba-mipymes/list',{cache:'no-store'}).then(async r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(d=>{const seen=new Set();records=(d.records||[]).filter(r=>{const key=safe(r.buyer_company).trim().toLowerCase();if(!key||key==='—'||seen.has(key))return false;seen.add(key);return true});document.getElementById('count').textContent=records.length.toLocaleString();document.getElementById('remaining').textContent=Math.max(0,TARGET-records.length).toLocaleString();document.getElementById('status').textContent=`${records.length.toLocaleString()} unique records · Supabase · ${d.classification||''}`;[...new Set(records.map(r=>r.product_category).filter(Boolean))].sort().forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sector.appendChild(o)});render()}).catch(()=>{document.getElementById('status').textContent='CRM data unavailable';grid.innerHTML='<div class="empty">The Cuba MIPYME CRM API is not reachable. This page is fail-closed and will not fabricate records.</div>';prev.disabled=true;next.disabled=true});
</script>
</body>
</html>
