<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Conversion Dashboard · SAHJONY Owner</title><style>:root{--b:#050b13;--p:#0c1d2d;--l:rgba(255,255,255,.12);--t:#f7fbff;--m:#9db1c0;--g:#79efb5;--c:#68dcff}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top a{color:var(--t)}h1{font-size:clamp(42px,7vw,72px);margin:40px 0 10px}.lead{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:24px}.card{border:1px solid var(--l);border-radius:18px;background:var(--p);padding:20px}.card small{color:var(--c)}.card strong{display:block;font-size:34px;margin:8px 0}.ok{color:var(--g)}.events{margin-top:18px;color:var(--m);font-size:12px;line-height:1.7}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><strong>SAHJONY OWNER · 90-DAY CONVERSION</strong><a href="/owner">Owner OS</a></div><h1>Conversion, not impressions.</h1><p class="lead">First-party counters only. No IP, user-agent, email, phone or browser fingerprint is stored by this instrumentation layer.</p><section id="grid" class="grid"><article class="card">Loading…</article></section><div id="events" class="events"></div></main><script>const token=sessionStorage.getItem('sahjony.owner.token');if(!token)location.replace('/owner-login');const names={rfq_submit_rate_pct:'RFQ submit rate',call_click_rate_pct:'Trade desk call-click rate',whatsapp_handoff_rate_pct:'WhatsApp handoff rate',supplier_registration_completion_pct:'Supplier registration completion'};(async()=>{const r=await fetch('/owner/conversion-dashboard',{headers:{Authorization:'Bearer '+token},cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.detail||'Unavailable');document.getElementById('grid').innerHTML=Object.entries(j.target_status).map(([k,v])=>`<article class="card"><small>${names[k]||k}</small><strong class="${v.met?'ok':''}">${v.actual}%</strong><span>90-day target: ${v.target}% · ${v.met?'MET':'BUILDING'}</span></article>`).join('');document.getElementById('events').textContent='Event counts · '+Object.entries(j.event_counts).map(([k,v])=>k+': '+v).join(' · ')})().catch(e=>document.getElementById('grid').innerHTML='<article class="card">'+String(e.message||e)+'</article>');</script><script src="/global-language.js" defer></script></body></html>
