<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06111d"><title>Rastrear envío · SAHJONY</title><style>body{margin:0;background:#06111d;color:#f5f9fd;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:28px}.brand{font-weight:900;letter-spacing:.12em;font-size:12px}.card{margin-top:24px;border:1px solid #28445e;border-radius:18px;background:#0b1c2d;padding:22px}.ref{font-size:30px;font-weight:900;margin:8px 0}.muted{color:#9db4c8}.stage{display:inline-block;margin:12px 0;padding:8px 10px;border-radius:999px;background:#17334a}.event{border-top:1px solid #203c54;padding:14px 0}.event:first-child{border-top:0}.bad{color:#ffb4ba}</style></head><body><main class="wrap"><div class="brand">SAHJONY · SECURE PACKAGE TRACKING</div><section class="card" id="box">Cargando seguimiento…</section></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const token=location.pathname.split('/').filter(Boolean).pop();fetch('/tracking/public/'+encodeURIComponent(token),{cache:'no-store'}).then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.detail||'Código de rastreo inválido');const s=j.shipment,m=j.milestones||[];document.getElementById('box').innerHTML='<div class="muted">Número de seguimiento</div><div class="ref">'+esc(s.tracking_reference)+'</div><div>'+esc(s.origin_name||'Origen')+' → '+esc(s.destination_name||'Destino')+'</div><div class="stage">'+esc((s.current_stage||'pendiente').replaceAll('_',' ').toUpperCase())+'</div><div class="muted">Ubicación actual: '+esc(s.current_location||'Pendiente de escaneo')+'</div><h3>Historial</h3>'+(m.length?m.map(x=>'<div class="event"><b>'+esc(x.event_label)+'</b><div class="muted">'+esc(x.location_name||'')+(x.event_time?' · '+esc(String(x.event_time).replace('T',' ').slice(0,16)):'')+'</div></div>').join(''):'<div class="muted">Todavía no hay eventos visibles.</div>')}).catch(e=>document.getElementById('box').innerHTML='<div class="bad">'+esc(e.message)+'</div>');</script></body></html>
