<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#050b13">
<title>SAHJONY · Execution Priority</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7fbff;background:#050b13;--panel:#0b1b2b;--line:rgba(255,255,255,.1);--muted:#91a8ba;--green:#5df29d;--gold:#dfbd73;--cyan:#5ad8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,rgba(90,216,255,.12),transparent 28%),radial-gradient(circle at 90% 0,rgba(223,189,115,.1),transparent 28%),#050b13}.shell{width:min(1240px,calc(100% - 24px));margin:12px auto 50px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:rgba(8,20,32,.92);position:sticky;top:8px;z-index:3;backdrop-filter:blur(16px)}.brand{font-weight:900;letter-spacing:.12em;font-size:12px}.top a{color:var(--green);text-decoration:none;font-size:11px}.hero{margin-top:14px;padding:30px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#0d2133,#08151f)}.ey{font-size:9px;letter-spacing:.18em;color:var(--gold);font-weight:900}.hero h1{font-size:clamp(40px,7vw,76px);line-height:.94;letter-spacing:-.05em;margin:10px 0}.hero h1 span{color:var(--green)}.hero p{max-width:860px;color:#aec1cf;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}.card{padding:20px;border:1px solid var(--line);border-radius:16px;background:#091827}.rank{display:flex;justify-content:space-between;gap:12px;color:var(--cyan);font-size:10px;letter-spacing:.1em}.card strong{display:block;font-size:22px;margin:12px 0 8px}.card p{color:var(--muted);font-size:12px;line-height:1.55}.meter{height:7px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden;margin-top:14px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));width:var(--w)}.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.links a{padding:8px 10px;border:1px solid var(--line);border-radius:9px;color:#dbe8f2;text-decoration:none;font-size:10px}.section{margin-top:12px;padding:22px;border:1px solid var(--line);border-radius:16px;background:#081723}.section h2{margin:0 0 12px;font-size:22px}.gates{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.gate{padding:12px;border:1px solid var(--line);border-radius:12px;color:#bbcedb;font-size:11px;line-height:1.45}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{padding:14px;border:1px solid var(--line);border-radius:12px}.kpi small{color:var(--muted);font-size:9px}.kpi strong{display:block;margin-top:7px;font-size:20px}.status{color:var(--green);font-size:10px}.error{color:#ff9ba2}.foot{margin-top:12px;color:#8097a8;font-size:10px;line-height:1.55}@media(max-width:760px){.grid,.gates,.kpis{grid-template-columns:1fr}.hero{padding:22px 18px}.shell{width:calc(100% - 16px)}}
</style>
</head><body><main class="shell">
<header class="top"><div class="brand">SAHJONY GLOBAL TRADE · OWNER EXECUTION</div><div><span id="status" class="status">LOADING</span> · <a href="/owner/">Owner OS</a></div></header>
<section class="hero"><div class="ey">REVENUE-FIRST OPERATING DOCTRINE</div><h1>Close what matters.<br><span>Collect the cash.</span></h1><p id="doctrine">Find demand → qualify → source → protect economics → negotiate → document → close → collect → repeat.</p></section>
<section id="priorities" class="grid"></section>
<section class="section"><h2>Non-negotiable stage gates</h2><div id="gates" class="gates"></div></section>
<section class="section"><h2>7-day scorecard</h2><div id="kpi7" class="kpis"></div></section>
<section class="section"><h2>30-day scorecard</h2><div id="kpi30" class="kpis"></div></section>
<div class="foot" id="policy"></div>
</main>
<script>
const token=sessionStorage.getItem('sahjony.owner.token');if(!token)location.replace('/owner-login');
const pretty=s=>String(s).replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
async function load(){try{const r=await fetch('/owner/execution-priority/plan',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();document.getElementById('status').textContent='ACTIVE';document.getElementById('doctrine').textContent=d.doctrine;document.getElementById('priorities').innerHTML=d.priorities.map(p=>`<article class="card"><div class="rank"><span>0${p.rank} · ${p.key.toUpperCase()}</span><span>${p.allocation_pct}% FOCUS</span></div><strong>${p.name}</strong><p>${p.objective}</p><div class="meter" style="--w:${p.allocation_pct}%"><i></i></div><div class="links">${p.links.map(x=>`<a href="${x}">Open</a>`).join('')}</div></article>`).join('');document.getElementById('gates').innerHTML=d.stage_gates.map((g,i)=>`<div class="gate"><b>${String(i+1).padStart(2,'0')}</b> · ${g}</div>`).join('');for(const [id,obj] of [['kpi7',d.kpi_7_day],['kpi30',d.kpi_30_day]])document.getElementById(id).innerHTML=Object.entries(obj).map(([k,v])=>`<div class="kpi"><small>${pretty(k)}</small><strong>${v}</strong></div>`).join('');document.getElementById('policy').innerHTML=`<b>Development gate:</b> ${d.development_gate}<br><b>Inventory:</b> ${d.inventory_policy}<br><b>Status policy:</b> ${d.status_policy}`;}catch(e){document.getElementById('status').textContent='ERROR';document.getElementById('status').className='status error';document.getElementById('policy').textContent='Unable to load execution plan: '+e.message;}}
load();
</script></body></html>
