<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAHJONY LLC | Global Trade World Clock</title><style>body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#07090d;color:#f5f7fa;margin:0}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:#9ca7b5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:22px}.card{background:#10141c;border:1px solid #222a36;border-radius:18px;padding:18px}.open{border-color:#476a52}.closed{opacity:.78}.time{font-size:28px;font-weight:700;margin:8px 0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#1b2230;font-size:12px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input{background:#0d1118;color:#fff;border:1px solid #2b3442;border-radius:12px;padding:11px 13px;min-width:260px}button{background:#f5f7fa;color:#080a0e;border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.status{margin-top:8px}.section{margin-top:28px}code{color:#b9d4ff}</style></head><body><div class="wrap"><div class="top"><div><h1>Global Trade World Clock</h1><div class="muted">SAHJONY LLC · Follow-the-sun 24/7 trade operations</div></div><div class="pill" id="utc">UTC</div></div><div class="controls"><input id="tz" placeholder="IANA timezone e.g. Asia/Shanghai"><button onclick="lookup()">Check timezone</button><button onclick="load()">Refresh hubs</button></div><div id="lookup" class="card" style="display:none"></div><div class="section"><h2>Trade hubs open now</h2><div class="muted">SOFIA can use this to prioritize inbound and consented follow-up during each counterparty's local business hours.</div><div id="grid" class="grid"></div></div></div><script>const fmt=d=>new Date(d).toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});async function load(){document.getElementById('utc').textContent='UTC '+new Date().toISOString().slice(0,19).replace('T',' ');const r=await fetch('/crm/world-clock/hubs');const d=await r.json();document.getElementById('grid').innerHTML=(d.hubs||[]).map(x=>`<div class="card ${x.currently_in_working_hours?'open':'closed'}"><div class="pill">${x.currently_in_working_hours?'WORKING HOURS OPEN':'CLOSED / QUEUE'}</div><h3>${x.city}</h3><div class="time">${new Date(x.local_time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div><div>${new Date(x.local_time).toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'})}</div><div class="muted">${x.timezone} · ${x.utc_offset}</div>${x.next_work_start_local?`<div class="status muted">Next opening: ${fmt(x.next_work_start_local)}</div>`:''}</div>`).join('')||'<div class="muted">No data.</div>'}async function lookup(){const tz=document.getElementById('tz').value.trim();if(!tz)return;const el=document.getElementById('lookup');el.style.display='block';const r=await fetch('/crm/world-clock/now?tz='+encodeURIComponent(tz));const d=await r.json();if(!r.ok){el.textContent=d.detail||'Timezone not found';return}el.innerHTML=`<b>${d.timezone}</b><div class="time">${new Date(d.local_time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div><div>${d.weekday} · ${d.local_date} · ${d.utc_offset}</div><div class="status">${d.currently_in_working_hours?'Local business hours are OPEN':'Outside default local business hours'}</div>`}load();setInterval(load,60000)</script></body></html>
