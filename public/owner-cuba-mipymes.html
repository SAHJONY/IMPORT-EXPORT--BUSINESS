<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAHJONY LLC · Cuba MIPYMEs CRM</title><style>body{font-family:Inter,system-ui,-apple-system,sans-serif;margin:0;background:#0b0d10;color:#f5f7fa}.wrap{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}.eyebrow{font-size:12px;letter-spacing:.16em;color:#9aa4b2}.title{font-size:34px;font-weight:750;margin:4px 0}.muted{color:#9aa4b2}.nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.nav a{background:#12161c;border:1px solid #242b35;border-radius:10px;padding:10px 12px;color:#fff;text-decoration:none}.nav a.active{border-color:#5ad8ff}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:#12161c;border:1px solid #242b35;border-radius:14px;padding:14px 18px;min-width:150px}.stat b{font-size:24px;display:block}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.controls input,.controls select{background:#12161c;color:#fff;border:1px solid #2a323d;border-radius:10px;padding:12px}.controls input{min-width:280px;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}.card{background:#12161c;border:1px solid #242b35;border-radius:14px;padding:16px;cursor:pointer}.card:hover{border-color:#667085}.name{font-weight:700;font-size:18px}.pill{display:inline-block;margin-top:8px;border:1px solid #344054;border-radius:999px;padding:5px 8px;font-size:11px;color:#cbd5e1}.desc{margin-top:10px;color:#cbd5e1;font-size:13px;line-height:1.45;max-height:74px;overflow:hidden}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.panel{width:min(900px,100%);max-height:88vh;overflow:auto;background:#11151b;border:1px solid #2b3440;border-radius:18px;padding:20px}.close{float:right;background:#222935;color:#fff;border:0;border-radius:9px;padding:8px 11px;cursor:pointer}.row{padding:10px 0;border-bottom:1px solid #222935}.k{font-size:11px;color:#8f9baa;text-transform:uppercase;letter-spacing:.08em}.v{margin-top:4px;white-space:pre-wrap;word-break:break-word}.v a{color:#9ec5ff}.empty{padding:28px;background:#12161c;border-radius:14px;color:#aab3bf}</style></head><body><div class="wrap"><div class="top"><div><div class="eyebrow">SAHJONY LLC · GLOBAL TRADE CRM</div><div class="title">Cuba MIPYMEs</div><div class="muted">Clickable public-registry intelligence. Registered ≠ qualified buyer or RFQ.</div></div><div class="muted" id="status">Loading…</div></div><div class="nav"><a href="/owner">Owner OS</a><a href="/owner/crm-countries">CRM by Country</a><a class="active" href="/owner/cuba-mipymes">Cuba MIPYMEs</a><a href="/owner/cuba-us-desk">Cuba Department</a></div><div class="stats"><div class="stat"><span class="muted">Loaded records</span><b id="count">—</b></div><div class="stat"><span class="muted">Batch target</span><b>500</b></div><div class="stat"><span class="muted">Remaining</span><b id="remaining">—</b></div></div><div class="controls"><input id="q" placeholder="Search company, sector, municipality, product…"><select id="sector"><option value="">All sectors</option></select></div><div id="grid" class="grid"></div></div><div id="modal" class="modal"><div class="panel"><button class="close" onclick="modal.classList.remove('open')">Close</button><h2 id="mname"></h2><div id="detail"></div></div></div><script>let records=[];const grid=document.getElementById('grid'),q=document.getElementById('q'),sector=document.getElementById('sector'),modal=document.getElementById('modal');const safe=v=>v===null||v===undefined||v===''?'—':String(v);function render(){const term=q.value.trim().toLowerCase(),sec=sector.value;const rows=records.filter(r=>(!sec||safe(r.product_category)===sec)&&(!term||JSON.stringify(r).toLowerCase().includes(term)));grid.innerHTML=rows.length?rows.map(r=>`<div class="card" data-i="${records.indexOf(r)}"><div class="name">${safe(r.buyer_company)}</div><div class="pill">${safe(r.product_category)}</div><div class="desc">${safe(r.product_description||r.evidence_summary)}</div><div class="muted" style="margin-top:10px;font-size:12px">${safe(r.destination)} · ${safe(r.external_reference)}</div></div>`).join(''):'<div class="empty">No records match this filter.</div>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openRecord(records[Number(c.dataset.i)]));}function openRecord(r){document.getElementById('mname').textContent=safe(r.buyer_company);document.getElementById('detail').innerHTML=Object.entries(r).map(([k,v])=>`<div class="row"><div class="k">${k.replaceAll('_',' ')}</div><div class="v">${k==='source_url'&&v?`<a href="${v}" target="_blank" rel="noopener">${v}</a>`:safe(v)}</div></div>`).join('');modal.classList.add('open')}q.oninput=render;sector.onchange=render;modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};fetch('/cuba-mipymes-api/list',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{records=d.records||[];document.getElementById('count').textContent=records.length;document.getElementById('remaining').textContent=Math.max(0,500-records.length);document.getElementById('status').textContent=`${records.length} records · ${d.classification||''}`;[...new Set(records.map(r=>r.product_category).filter(Boolean))].sort().forEach(s=>sector.insertAdjacentHTML('beforeend',`<option>${s}</option>`));render()}).catch(()=>{document.getElementById('status').textContent='CRM data unavailable';grid.innerHTML='<div class="empty">The Cuba MIPYME CRM API is not reachable. This page is fail-closed and will not fabricate records.</div>'});</script><script src="/owner-corridor-navigation.js" defer></script></body></html>
