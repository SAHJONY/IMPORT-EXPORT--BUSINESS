<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Import‑Export Business – Ultra Premium Hero</title>
  <style>
    html,body{margin:0;padding:0;height:100%;font-family:Arial,Helvetica,sans-serif;overflow:hidden;}
    .hero{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;}
    .hero video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-2;}
    .overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:-1;}
    .content{text-align:center;z-index:1;}
    .content h1{font-size:4rem;margin:0;letter-spacing:2px;}
    .content p{font-size:1.5rem;margin:20px 0;}
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.cta{display:inline-block;padding:15px 30px;background:#ff6200;border-radius:5px;color:#fff;text-decoration:none;font-size:1.2rem;transition:background .3s;}.cta.secondary{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.5)}
    .cta:hover{background:#e55300;}.cta.secondary:hover{background:rgba(0,0,0,.7)}
    @media(max-width:768px){.content h1{font-size:2.5rem;} .content p{font-size:1rem;}}
  </style>
</head>
<body>
  <section class="hero">
    <video autoplay muted loop playsinline>
      <source src="https://assets.mixkit.co/videos/preview/mixkit-planet-rotating-3200-2042-large.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>
    <div class="content">
      <h1>Powering Global Trade</h1>
      <p>Seamless import‑export solutions for any product, any country.</p>
      <div class="actions"><a href="/dashboard" class="cta">Enter Dashboard</a><a href="/?lang=es" class="cta secondary" data-no-translate="true">Español</a></div>
    </div>
  </section>
  <script src="/global-language.js" defer></script>
</body>
</html>
