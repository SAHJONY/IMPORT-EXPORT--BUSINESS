<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050b13"><meta name="robots" content="noindex,nofollow"><title>SAHJONY · Direct Messages</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#050b13;color:#f6fbff;--line:rgba(255,255,255,.1);--muted:#90a8ba;--cyan:#5ad8ff;--green:#62efa5;--panel:#091725;--red:#ff7782}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0,rgba(90,216,255,.12),transparent 32%),radial-gradient(circle at 88% 0,rgba(98,239,165,.08),transparent 28%),#050b13}.shell{min-height:100vh;width:min(850px,100%);margin:auto;display:flex;flex-direction:column}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);background:rgba(5,11,19,.94);backdrop-filter:blur(18px)}.brand strong{font-size:11px;letter-spacing:.14em}.brand small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.state{font-size:9px;font-weight:900;color:var(--green)}.hero{padding:16px 15px 12px}.hero h1{margin:0;font-size:26px;letter-spacing:-.035em}.hero p{margin:5px 0 0;color:var(--muted);font-size:11px;line-height:1.45}.notify{margin-top:10px;border:1px solid var(--line);border-radius:11px;background:#081623;color:#dcecf5;padding:9px 11px;font-size:9px;cursor:pointer}.messages{flex:1;display:flex;flex-direction:column;gap:8px;padding:8px 13px 120px}.msg{max-width:82%;padding:10px 12px;border-radius:15px;border:1px solid var(--line);background:#0a1a29;box-shadow:0 8px 30px rgba(0,0,0,.12)}.msg.contact{align-self:flex-end;background:linear-gradient(145deg,#12394c,#102f3c);border-color:rgba(90,216,255,.25)}.msg.ai,.msg.owner{align-self:flex-start}.msg.system{align-self:center;max-width:94%;background:#171a14;border-color:rgba(227,193,111,.28)}.sender{font-size:8px;color:var(--cyan);font-weight:900;letter-spacing:.08em;text-transform:uppercase}.msg.system .sender{color:#e3c16f}.body{margin-top:5px;font-size:13px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere}.meta{margin-top:5px;color:#71889a;font-size:8px}.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(850px,100%);display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(5,11,19,.96);border-top:1px solid var(--line);backdrop-filter:blur(18px)}textarea{resize:none;min-height:46px;max-height:130px;border:1px solid var(--line);border-radius:14px;padding:13px;background:#081623;color:#f6fbff;font:inherit;font-size:13px;outline:0}button.send{border:0;border-radius:14px;padding:0 17px;background:linear-gradient(135deg,var(--cyan),var(--green));color:#031017;font-weight:900;cursor:pointer}button:disabled{opacity:.4}.empty{color:var(--muted);text-align:center;padding:50px 20px}.error{color:#ffd0d4;background:#261218;border:1px solid rgba(255,119,130,.3);border-radius:12px;padding:12px;margin:12px;font-size:11px}@media(max-width:560px){.msg{max-width:90%}.hero h1{font-size:23px}}
</style><script src="/global-language.js" defer></script></head><body><main class="shell"><header class="top"><div class="brand"><strong>SAHJONY GLOBAL TRADE</strong><small>DIRECT MESSAGES · SOFIA 24/7</small></div><div id="state" class="state">CONNECTING</div></header><section class="hero"><h1 id="title">Secure business conversation</h1><p id="subtitle">Direct Internet messaging with SAHJONY. No SMS carrier is required.</p><button id="notify" class="notify" hidden>Enable browser notifications</button></section><section id="messages" class="messages"><div class="empty">Loading conversation…</div></section><div id="error"></div><section class="composer"><textarea id="text" placeholder="Type a message…" maxlength="12000"></textarea><button id="send" class="send">Send</button></section></main><script>
const q=new URLSearchParams(location.search),thread=q.get('thread'),token=q.get('token'),$=id=>document.getElementById(id);let lastIds=new Set(),firstLoad=true,busy=false;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function senderLabel(s){return s==='contact'?'You':s==='owner'?'SAHJONY Owner':s==='system'?'SAHJONY Notification':'Sofía · SAHJONY'}function state(t,bad=false){$('state').textContent=t;$('state').style.color=bad?'#ff7782':'#62efa5'}function showError(t=''){$('error').innerHTML=t?`<div class="error">${esc(t)}</div>`:''}function notifyMessage(m){if(firstLoad||m.sender==='contact'||document.visibilityState==='visible'||Notification.permission!=='granted')return;new Notification(m.kind==='notification'?'SAHJONY Notification':'New SAHJONY message',{body:String(m.text||'').slice(0,180)})}
async function join(){if(!thread||!token)throw new Error('This secure chat link is incomplete.');const r=await fetch(`/communications-os/text/threads/${encodeURIComponent(thread)}/join?token=${encodeURIComponent(token)}`,{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.detail||'Chat unavailable');const t=j.thread;$('title').textContent=t.contact_name?`Conversation with ${t.contact_name}`:'Secure business conversation';$('subtitle').textContent=`${t.company||'SAHJONY Global Trade'} · Sofia available 24/7 · expires ${new Date(t.expires_at).toLocaleDateString()}`;state('ONLINE');if('Notification'in window&&Notification.permission==='default')$('notify').hidden=false}
async function load(){if(!thread||!token)return;try{const r=await fetch(`/communications-os/text/threads/${encodeURIComponent(thread)}/messages?token=${encodeURIComponent(token)}&limit=150`,{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.detail||'Unable to load messages');const rows=j.messages||[];for(const m of rows){if(!lastIds.has(m.message_id))notifyMessage(m)}lastIds=new Set(rows.map(x=>x.message_id));$('messages').innerHTML=rows.length?rows.map(m=>`<article class="msg ${esc(m.sender)}"><div class="sender">${esc(senderLabel(m.sender))}${m.priority&&m.priority!=='normal'?` · ${esc(m.priority)}`:''}</div><div class="body">${esc(m.text)}</div><div class="meta">${esc(new Date(m.created_at).toLocaleString())} · ${esc(m.status||'DELIVERED')}</div></article>`).join(''):'<div class="empty">No messages yet.</div>';if(firstLoad){scrollTo(0,document.body.scrollHeight);firstLoad=false}await fetch(`/communications-os/text/threads/${encodeURIComponent(thread)}/read?token=${encodeURIComponent(token)}`,{method:'POST'}).catch(()=>{});showError('')}catch(e){state('OFFLINE',true);showError(e.message||String(e))}}
async function send(){const text=$('text').value.trim();if(!text||busy)return;busy=true;$('send').disabled=true;try{const r=await fetch(`/communications-os/text/threads/${encodeURIComponent(thread)}/messages?token=${encodeURIComponent(token)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});const j=await r.json();if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:'Message not delivered');$('text').value='';await load();scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}catch(e){showError(e.message||String(e))}finally{busy=false;$('send').disabled=false}}
$('send').onclick=send;$('text').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('notify').onclick=async()=>{const p=await Notification.requestPermission();$('notify').hidden=p!=='default'};join().then(load).catch(e=>{state('UNAVAILABLE',true);showError(e.message||String(e));$('send').disabled=true});setInterval(load,4000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});
</script></body></html>
