<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#050b13" />
<title>SAHJONY LLC · Global Trade OS</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#050b13;color:#eef6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 18% 0%,#132b45 0,#081321 34%,#050b13 72%);min-height:100vh}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{border-right:1px solid #193048;background:rgba(4,12,21,.94);padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:900;letter-spacing:.08em;font-size:15px}.sub{color:#88a1b9;font-size:12px;line-height:1.5;margin-top:6px}.nav{display:grid;gap:6px;margin-top:24px}.nav a{display:block;color:#a9bed1;text-decoration:none;padding:10px 12px;border:1px solid transparent;border-radius:10px;font-size:13px}.nav a:hover,.nav a.active{color:white;background:#10243a;border-color:#28445e}.main{padding:28px;max-width:1480px;width:100%}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.pill{border:1px solid #31506b;border-radius:999px;padding:7px 10px;color:#b7cce0;font-size:11px;letter-spacing:.08em}.hero{margin-top:24px;padding:26px;border:1px solid #213a54;border-radius:20px;background:linear-gradient(135deg,rgba(19,42,66,.95),rgba(7,20,34,.95))}.eyebrow{font-size:11px;letter-spacing:.18em;color:#8daecb;text-transform:uppercase}.hero h1{font-size:clamp(30px,5vw,54px);margin:10px 0 12px;line-height:1.02}.hero p{max-width:900px;color:#b7c9da;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}.card,.section{border:1px solid #203850;background:rgba(8,23,38,.93);border-radius:16px}.card{padding:16px}.card h3{margin:0;color:#8da8c1;font-size:11px;letter-spacing:.11em;text-transform:uppercase}.metric{font-size:24px;font-weight:800;margin-top:9px}.section{padding:18px;margin-top:16px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.section h2{margin:0;font-size:18px}.btn{appearance:none;border:1px solid #3e6787;background:#163652;color:white;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}.btn.secondary{background:transparent}.error{margin-top:14px;padding:12px;border:1px solid #7f3842;background:#32151b;border-radius:12px;color:#ffd7dc}.rows{display:grid;gap:10px;margin-top:14px}.row{border:1px solid #1d3348;border-radius:12px;padding:13px;background:#081725;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.row small{display:block;color:#7190aa;text-transform:uppercase;font-size:9px;letter-spacing:.09em}.row div div{margin-top:4px;word-break:break-word}.empty{padding:24px;color:#7892a9;text-align:center}.json{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#afc4d7}.status.ok{color:#79e0a8}.status.bad{color:#ff8b96}@media(max-width:980px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;border-right:0;border-bottom:1px solid #193048}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.main{padding:16px}.grid,.row{grid-template-columns:1fr}.nav{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand">SAHJONY LLC</div><div class="sub">Worldwide Managed Trade Operating System</div><nav class="nav" id="nav"></nav></aside><main class="main"><div class="top"><div><div class="eyebrow">OPERATING WORKSPACE</div><div class="sub" id="roleText">Owner / Employee governed access</div></div><span class="pill" id="statePill">CONNECTING</span></div><section class="hero"><div class="eyebrow" id="kicker">MODULE</div><h1 id="title">Global Trade OS</h1><p id="desc"></p></section><div class="grid"><div class="card"><h3>Runtime</h3><div class="metric" id="runtime">—</div></div><div class="card"><h3>Release</h3><div class="metric" id="release">—</div></div><div class="card"><h3>Records</h3><div class="metric" id="count">—</div></div><div class="card"><h3>Authority</h3><div class="metric" id="authority">Governed</div></div></div><div class="error" id="error" hidden></div><section class="section"><div class="section-head"><div><h2 id="sectionTitle">Live records</h2><div class="sub" id="source"></div></div><button class="btn secondary" id="reload">Refresh</button></div><div class="rows" id="rows"><div class="empty">Connecting to live module…</div></div></section><section class="section"><div class="section-head"><h2>Operating controls</h2><span class="sub">Fail-closed · evidence-driven</span></div><div class="rows" id="controls"></div></section></main></div>
<script>
const MODULES={
 'global-sourcing':{title:'Worldwide Supplier Sourcing',desc:'Source suppliers in any permitted country, compare commercial terms and landed economics, validate the actual corridor, and select only suppliers that pass required controls.',health:'/global-sourcing/health',data:'/global-sourcing/requests',controls:['Supplier screening','Origin export controls','Destination import controls','Product restrictions','Banking and payment path','Logistics and landed cost','Owner selection']},
 'managed-trade':{title:'Managed Trade Gateway',desc:'Run each customer request from qualification through sourcing, due diligence, product authorization, commercial terms, payment, documents, logistics, compliance release, delivery and reconciliation.',health:'/managed-trade/health',data:'/managed-trade/requests',controls:['Request qualified','Supplier selected','Product classified','Authorization matched','Payment path approved','Documents ready','Logistics ready','Compliance and owner release','Delivery and reconciliation']},
 'intermediary':{title:'SAHJONY LLC Intermediary Desk',desc:'Define SAHJONY LLC’s role, who it represents, compensation, legal-party assignments, title/funds boundaries and transaction economics for every engagement.',health:'/intermediary/health',data:'/intermediary/engagements',controls:['Engagement approved','Compensation disclosed','Economics approved','Buyer and seller verified','IOR/EOR assigned','Title boundary enforced','Client-funds authority verified']},
 'business-readiness':{title:'Business Operational Readiness',desc:'Control the real-world partners, agreements, due diligence, product dossiers, incidents, reconciliations and First Live Trade Certification required to operate as a real business.',health:'/business-readiness/health',data:'/business-readiness/partners',controls:['Customs broker','Freight forwarder','Cargo insurer','Payment provider','Accounting and tax','Signed agreements','Counterparty due diligence','First live trade certification']}
};
const LINKS=[['Command Center','/owner'],['AI Brain','/owner/ai-brain'],['Worldwide Sourcing','/owner/global-sourcing'],['Managed Trade','/owner/managed-trade'],['Intermediary Desk','/owner/intermediary'],['Business Readiness','/owner/business-readiness'],['U.S. Import Desk','/owner/us-import'],['Cuba Trade Desk','/cuba-desk.html'],['Cuba Private Sector','/cuba-private-sector'],['Global Countries','/owner/countries'],['Private Businesses','/owner/private-businesses'],['Compliance','/owner/compliance'],['Finance','/owner/finance'],['Shipping','/owner/shipping'],['Documents','/owner/documents'],['Communications','/owner/messages'],['Language','/owner/language'],['Governed Sharing','/owner/sharing']];
const path=location.pathname.toLowerCase();const key=Object.keys(MODULES).find(k=>path.includes('/'+k))||'global-sourcing';const mod=MODULES[key];document.getElementById('nav').innerHTML=LINKS.map(([n,u])=>`<a href="${u}" class="${path===u||path.startsWith(u+'/')?'active':''}">${n}</a>`).join('');document.getElementById('kicker').textContent=key.replaceAll('-',' ').toUpperCase();document.getElementById('title').textContent=mod.title;document.getElementById('desc').textContent=mod.desc;document.getElementById('sectionTitle').textContent='Live '+mod.title;document.getElementById('source').textContent='Health: '+mod.health+' · Data: '+mod.data;document.getElementById('controls').innerHTML=mod.controls.map(x=>`<div class="row"><div><small>Control</small><div>${x}</div></div><div><small>State</small><div>Evidence required</div></div></div>`).join('');
function token(){return sessionStorage.getItem('sahjony.token')||''}function headers(){const h={'X-Role':path.includes('/employee/')?'employee':'owner'};if(token())h.Authorization='Bearer '+token();return h}function values(obj){return Object.entries(obj||{}).filter(([,v])=>['string','number','boolean'].includes(typeof v)).slice(0,8)}function tc(s){return s.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())}
async function load(){const err=document.getElementById('error');err.hidden=true;document.getElementById('statePill').textContent='CONNECTING';try{const hr=await fetch(mod.health,{cache:'no-store'});const hj=await hr.json().catch(()=>({status:hr.status}));document.getElementById('runtime').textContent=hr.ok?'Connected':'Attention';document.getElementById('runtime').className='metric status '+(hr.ok?'ok':'bad');document.getElementById('release').textContent=hj.release_gate||hj.status||'Live';document.getElementById('statePill').textContent=hr.ok?'LIVE':'ATTENTION';let records=[];if(token()){const dr=await fetch(mod.data,{headers:headers(),cache:'no-store'});const dj=await dr.json().catch(()=>({detail:'HTTP '+dr.status}));if(!dr.ok)throw new Error(dj.detail||'Unable to load live data');records=Object.values(dj).find(Array.isArray)||[];}else{err.hidden=false;err.textContent='Enter your existing owner/employee credential in the Command Center to load protected records. Module health and controls remain visible.'}document.getElementById('count').textContent=records.length;const rows=document.getElementById('rows');rows.innerHTML=records.length?records.slice(0,100).map(r=>`<div class="row">${values(r).map(([k,v])=>`<div><small>${tc(k)}</small><div>${String(v??'—')}</div></div>`).join('')}</div>`).join(''):'<div class="empty">No protected records loaded in this session yet.</div>';}catch(e){err.hidden=false;err.textContent=e.message||'Module unavailable';document.getElementById('statePill').textContent='ATTENTION';document.getElementById('rows').innerHTML='<div class="empty">Unable to load records.</div>'}}document.getElementById('reload').onclick=load;load();
</script>
<script src="/legal-framework.js" defer></script><script src="/payment-process.js" defer></script><script src="/global-language.js" defer></script>
</body></html>
