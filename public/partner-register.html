<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b13"><title>Partner Registration | SAHJONY LLC</title><style>:root{--b:#050b13;--p:#0b1b2a;--l:rgba(255,255,255,.12);--t:#f7fbff;--m:#9eb1c0;--c:#68dcff;--g:#79efb5;--gold:#e2c378}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,rgba(104,220,255,.12),transparent 30%),var(--b);color:var(--t);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:980px;margin:auto;padding:28px 18px 70px}.ey{color:var(--c);font-size:10px;font-weight:900;letter-spacing:.16em}.hero{padding:56px 0 24px}.hero h1{font-size:clamp(42px,7vw,74px);line-height:.94;letter-spacing:-.05em;margin:12px 0}.hero p,.copy{color:var(--m);line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:1px solid var(--l);border-radius:18px;background:linear-gradient(180deg,#10263a,var(--p));padding:20px}.card h2{margin:0 0 8px}.card p,.card li{color:var(--m);font-size:12px;line-height:1.65}.btn{display:inline-flex;margin-top:12px;padding:12px 16px;border-radius:999px;background:#f5f7fa;color:#07111d;font-weight:900}.ghost{background:transparent;color:var(--t);border:1px solid var(--l)}.notice{margin-top:16px;border:1px solid rgba(226,195,120,.28);border-radius:16px;padding:16px;color:#d8ceb4;line-height:1.65;font-size:12px}form{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea{width:100%;padding:12px;border:1px solid var(--l);border-radius:10px;background:#06131f;color:var(--t);font:inherit}.wide{grid-column:1/-1}textarea{min-height:90px}button{grid-column:1/-1;padding:13px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--c),var(--g));font-weight:950}.status{margin-top:10px;color:var(--m);font-size:12px}@media(max-width:650px){.grid,form{grid-template-columns:1fr}.wide,button{grid-column:auto}}</style></head><body><main class="wrap"><section class="hero"><div class="ey">PARTNER CENTER · QUALIFICATION</div><h1>Become a SAHJONY Partner.</h1></section><div class="card"><p>Submit your real business identity and network profile. This creates a partner qualification intake; it does not create automatic commission rights or exclusivity.</p><form id="f"><input name="legal_name" required placeholder="Business / organization name"><input name="contact_name" required placeholder="Your name"><input name="email" type="email" required placeholder="Business email"><input name="phone" placeholder="Phone / WhatsApp"><input class="wide" name="network" required placeholder="Markets, industries or network you can introduce"><textarea class="wide" name="notes" placeholder="Geography, buyer/supplier relationships, experience"></textarea><button>Submit partner qualification</button></form><div id="s" class="status">SAHJONY will review attribution, compliance and commercial fit.</div></div><script>f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));s.textContent='Submitting…';const p={legal_name:d.legal_name,contact_name:d.contact_name,email:d.email,phone:d.phone||undefined,product_need:'PARTNER APPLICATION: '+d.network,destination_country:'USA',notes:'lead_type=PARTNER; '+(d.notes||'')};Object.keys(p).forEach(k=>p[k]===undefined&&delete p[k]);try{const r=await fetch('/crm/intake',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign(p,{lead_type:'PARTNER'},window.SAHJONY_ATTRIBUTION?window.SAHJONY_ATTRIBUTION.get():{}))}),j=await r.json();if(!r.ok)throw Error(j.detail||'Unable to submit');s.textContent='Partner qualification received. Reference: '+j.intake.intake_id;f.reset()}catch(x){s.textContent='Submission blocked: '+x.message}}</script></main><script src="/attribution.js" defer></script>
<script src="/global-language.js" defer></script></body></html>
