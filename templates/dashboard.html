<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Participant Dashboard</title>
    <style>
        body {font-family: Arial, sans-serif; margin: 20px;}
        .section {margin-bottom: 30px;}
        label {display:block; margin-top:10px;}
        textarea {width:100%; height:100px;}
        table {border-collapse: collapse; width:100%;}
        th, td {border:1px solid #ccc; padding:8px; text-align:left;}
        th {background:#f0f0f0;}
    </style>
</head>
<body>
    <h1>Participant Dashboard</h1>
    <div class="section">
        <h2>Submit Data</h2>
        <label>Data Type (e.g., order, invoice, inventory):
            <input type="text" id="data_type" />
        </label>
        <label>Payload (JSON):
            <textarea id="payload"></textarea>
        </label>
        <button onclick="submitData()">Submit</button>
        <p id="submit_msg"></p>
    </div>
    <div class="section">
        <h2>My Submissions</h2>
        <button onclick="loadMySubmissions()">Refresh</button>
        <table id="submissions_table">
            <thead><tr><th>ID</th><th>Business</th><th>Type</th><th>Payload</th><th>Timestamp</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        if (!token) {
            document.body.innerHTML = '<p>Error: token missing in URL. Append ?token=YOUR_PARTICIPANT_TOKEN</p>';
        }
        async function submitData(){
            const data_type = document.getElementById('data_type').value.trim();
            const payloadText = document.getElementById('payload').value.trim();
            let payload;
            try {payload = JSON.parse(payloadText);} catch(e){document.getElementById('submit_msg').innerText='Invalid JSON payload';return;}
            const resp = await fetch('/submit', {
                method:'POST',
                headers:{
                    'Content-Type':'application/json',
                    'Authorization':`Bearer ${token}`
                },
                body: JSON.stringify({data_type, payload})
            });
            const result = await resp.json();
            document.getElementById('submit_msg').innerText = JSON.stringify(result);
            loadMySubmissions();
        }
        async function loadMySubmissions(){
            const resp = await fetch('/my_submissions', {
                headers:{'Authorization':`Bearer ${token}`}
            });
            const data = await resp.json();
            const tbody = document.querySelector('#submissions_table tbody');
            tbody.innerHTML='';
            data.submissions.forEach(row=>{
                const tr=document.createElement('tr');
                tr.innerHTML = `<td>${row.id || ''}</td><td>${row.business_id}</td><td>${row.data_type}</td><td>${row.payload}</td><td>${row.timestamp}</td>`;
                tbody.appendChild(tr);
            });
        }
        // Auto‑load on page open
        if (token) loadMySubmissions();
    </script>
</body>
</html>
