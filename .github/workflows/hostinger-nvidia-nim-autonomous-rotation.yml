name: Hostinger NVIDIA NIM Native Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-nvidia-nim-autonomous-rotation.yml'
      - 'openclaw/hostinger-24x7/nvidia-nim-rotation.sh'
      - 'openclaw/hostinger-24x7/openclaw-runtime-guardian.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

jobs:
  install-native-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate runtime assets
        shell: bash
        run: |
          set -euo pipefail
          bash -n openclaw/hostinger-24x7/nvidia-nim-rotation.sh
          bash -n openclaw/hostinger-24x7/openclaw-runtime-guardian.sh

      - name: Prepare secure SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_KEY" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-nim
          chmod 600 ~/.ssh/hostinger-nim
          ssh-keygen -y -f ~/.ssh/hostinger-nim >/dev/null
          for i in $(seq 1 24); do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 -i ~/.ssh/hostinger-nim "$USER@$HOST" 'printf NVIDIA_NIM_SSH_READY' 2>/dev/null | grep -q NVIDIA_NIM_SSH_READY; then exit 0; fi
            echo "ssh_probe=$i/24"; sleep 5
          done
          echo NVIDIA_NIM_SSH_UNAVAILABLE=1 >&2
          exit 3

      - name: Install native host runtime controllers
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/hostinger-nim)
          SCP=(scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/hostinger-nim)
          "${SCP[@]}" openclaw/hostinger-24x7/nvidia-nim-rotation.sh "$USER@$HOST:/tmp/sahjony-nvidia-nim-rotation"
          "${SCP[@]}" openclaw/hostinger-24x7/openclaw-runtime-guardian.sh "$USER@$HOST:/tmp/sahjony-openclaw-runtime-guardian"
          "${SSH[@]}" "$USER@$HOST" 'set -euo pipefail; install -m 700 /tmp/sahjony-nvidia-nim-rotation /usr/local/sbin/sahjony-nvidia-nim-rotation; install -m 700 /tmp/sahjony-openclaw-runtime-guardian /usr/local/sbin/sahjony-openclaw-runtime-guardian; rm -f /tmp/sahjony-nvidia-nim-rotation /tmp/sahjony-openclaw-runtime-guardian; install -d -m 700 /var/lib/sahjony-nvidia-nim /var/lib/sahjony-openclaw-guardian'

      - name: Enforce single native runtime and repair plugin ownership
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/hostinger-nim "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cid=""
          if command -v docker >/dev/null 2>&1; then
            cid="$(docker ps -aq | while read -r id; do meta="$(docker inspect "$id" --format '{{.Name}}|{{.Config.Image}}' 2>/dev/null || true)"; grep -Eqi 'openclaw|open[-_ ]?claw|claw' <<<"$meta" && { echo "$id"; break; } || true; done)"
          fi

          native=false
          if command -v openclaw >/dev/null 2>&1 && systemctl cat openclaw-gateway.service >/dev/null 2>&1; then
            native=true
          fi

          if [[ "$native" == true ]]; then
            install -d -m 755 /etc/systemd/system/openclaw-gateway.service.d
            cat >/etc/systemd/system/openclaw-gateway.service.d/90-sahjony-24x7.conf <<'EOF2'
          [Unit]
          StartLimitIntervalSec=0

          [Service]
          Restart=always
          RestartSec=5
          EOF2
            systemctl daemon-reload
            systemctl enable openclaw-gateway.service >/dev/null

            if [[ -n "$cid" ]]; then
              docker update --restart no "$cid" >/dev/null
              if [[ "$(docker inspect "$cid" --format '{{.State.Running}}' 2>/dev/null || true)" == true ]]; then
                docker stop -t 30 "$cid" >/dev/null
              fi
              echo "OPENCLAW_DOCKER_STANDBY_RESTART=$(docker inspect "$cid" --format '{{.HostConfig.RestartPolicy.Name}}')"
            fi

            whatsapp_ext=/var/lib/sahjony-openclaw-state/extensions/whatsapp
            if [[ -d "$whatsapp_ext" ]]; then
              chown -R root:root "$whatsapp_ext"
              if find "$whatsapp_ext" -xdev \( ! -uid 0 -o ! -gid 0 \) -print -quit | grep -q .; then
                echo WHATSAPP_PLUGIN_OWNERSHIP_REPAIR_FAILED=1 >&2
                exit 31
              fi
              echo WHATSAPP_PLUGIN_OWNERSHIP=ROOT
            fi

            systemctl restart openclaw-gateway.service
            sleep 8
            systemctl is-active --quiet openclaw-gateway.service
            echo OPENCLAW_NATIVE_RESTART_POLICY=READY
          else
            systemctl enable docker.service >/dev/null 2>&1 || true
            if [[ -n "$cid" ]]; then
              docker update --restart unless-stopped "$cid" >/dev/null
              echo "OPENCLAW_DOCKER_RESTART_POLICY=$(docker inspect "$cid" --format '{{.HostConfig.RestartPolicy.Name}}')"
            fi
          fi
          REMOTE

      - name: Configure NVIDIA API key when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$NVIDIA_API_KEY" ]]; then
            echo NVIDIA_NIM_AUTH=AWAITING_NVIDIA_API_KEY_SECRET
            exit 0
          fi
          [[ "$NVIDIA_API_KEY" == nvapi-* ]] || { echo NVIDIA_API_KEY_FORMAT_UNEXPECTED=1 >&2; exit 20; }
          umask 077
          printf '%s\n' "$NVIDIA_API_KEY" > "$RUNNER_TEMP/nvidia-api-key"
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/hostinger-nim "$RUNNER_TEMP/nvidia-api-key" "$USER@$HOST:/root/.sahjony-nvidia-api-key"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/hostinger-nim "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          trap 'rm -f /root/.sahjony-nvidia-api-key' EXIT
          chmod 600 /root/.sahjony-nvidia-api-key

          mode=''
          cid=''
          if command -v openclaw >/dev/null 2>&1 && systemctl cat openclaw-gateway.service >/dev/null 2>&1; then
            mode=native
          elif command -v docker >/dev/null 2>&1; then
            cid="$(docker ps --format '{{.ID}} {{.Names}} {{.Image}}' | awk 'tolower($0) ~ /openclaw/ {print $1; exit}')"
            [[ -n "$cid" ]] && mode=docker
          fi
          [[ -n "$mode" ]] || { echo OPENCLAW_RUNTIME_NOT_FOUND=1 >&2; exit 21; }

          oc_native(){
            env HOME=/home/node OPENCLAW_HOME=/home/node OPENCLAW_STATE_DIR=/var/lib/sahjony-openclaw-state OPENCLAW_CONFIG_PATH=/var/lib/sahjony-openclaw-state/openclaw.json openclaw "$@"
          }

          if [[ "$mode" == native ]]; then
            oc_native plugins enable nvidia >/dev/null 2>&1 || true
            cat /root/.sahjony-nvidia-api-key | env HOME=/home/node OPENCLAW_HOME=/home/node OPENCLAW_STATE_DIR=/var/lib/sahjony-openclaw-state OPENCLAW_CONFIG_PATH=/var/lib/sahjony-openclaw-state/openclaw.json openclaw models auth paste-api-key --provider nvidia --profile-id nvidia:nim >/dev/null
            oc_native models auth order set --provider nvidia nvidia:nim >/dev/null
            oc_native config set models.providers.nvidia '{"baseUrl":"https://integrate.api.nvidia.com/v1","api":"openai-completions"}' --strict-json --merge >/dev/null
            oc_native config validate >/dev/null
          else
            docker exec "$cid" openclaw plugins enable nvidia >/dev/null 2>&1 || true
            cat /root/.sahjony-nvidia-api-key | docker exec -i "$cid" openclaw models auth paste-api-key --provider nvidia --profile-id nvidia:nim >/dev/null
            docker exec "$cid" openclaw models auth order set --provider nvidia nvidia:nim >/dev/null
            docker exec "$cid" openclaw config set models.providers.nvidia '{"baseUrl":"https://integrate.api.nvidia.com/v1","api":"openai-completions"}' --strict-json --merge >/dev/null
            docker exec "$cid" openclaw config validate >/dev/null
          fi

          key="$(tr -d '\r\n' < /root/.sahjony-nvidia-api-key)"
          body="$(curl -fsS --connect-timeout 10 --max-time 120 -H "Authorization: Bearer $key" -H 'Content-Type: application/json' -d '{"model":"nvidia/nemotron-3.5-lightning-30b-a3b","messages":[{"role":"user","content":"Reply exactly SAHJONY_NIM_AUTH_OK"}],"max_tokens":32,"temperature":0}' https://integrate.api.nvidia.com/v1/chat/completions)"
          grep -q 'SAHJONY_NIM_AUTH_OK' <<<"$body" || { echo NVIDIA_NIM_AUTH_TEST_FAILED=1 >&2; exit 22; }
          echo "NVIDIA_NIM_AUTH=READY runtime=$mode"
          REMOTE

      - name: Install persistent NIM reconciliation timer
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/hostinger-nim "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cat >/etc/systemd/system/sahjony-nvidia-nim-rotation.service <<'EOF2'
          [Unit]
          Description=SAHJONY autonomous NVIDIA NIM model rotation
          After=network-online.target openclaw-gateway.service
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/sahjony-nvidia-nim-rotation
          TimeoutStartSec=120
          Nice=10
          EOF2

          cat >/etc/systemd/system/sahjony-nvidia-nim-rotation.timer <<'EOF2'
          [Unit]
          Description=Refresh SAHJONY NVIDIA NIM fallback pool

          [Timer]
          OnBootSec=45s
          OnUnitActiveSec=10min
          AccuracySec=30s
          Persistent=true

          [Install]
          WantedBy=timers.target
          EOF2

          systemctl daemon-reload
          systemctl enable --now sahjony-nvidia-nim-rotation.timer >/dev/null
          systemctl start sahjony-nvidia-nim-rotation.service
          systemctl is-enabled --quiet sahjony-nvidia-nim-rotation.timer
          systemctl is-active --quiet sahjony-nvidia-nim-rotation.timer
          test -s /var/lib/sahjony-nvidia-nim/status.json
          cat /var/lib/sahjony-nvidia-nim/status.json
          echo SAHJONY_NVIDIA_NIM_ROTATION_TIMER=READY
          REMOTE

      - name: Install native 24x7 self-healing guardian
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/hostinger-nim "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cat >/etc/systemd/system/sahjony-openclaw-runtime-guardian.service <<'EOF2'
          [Unit]
          Description=SAHJONY OpenClaw native 24x7 runtime guardian
          After=network-online.target openclaw-gateway.service
          Wants=network-online.target
          StartLimitIntervalSec=0

          [Service]
          Type=simple
          User=root
          ExecStart=/usr/local/sbin/sahjony-openclaw-runtime-guardian
          Restart=always
          RestartSec=5
          KillMode=control-group
          TimeoutStopSec=15
          OOMPolicy=continue

          [Install]
          WantedBy=multi-user.target
          EOF2

          systemctl daemon-reload
          systemctl enable sahjony-openclaw-runtime-guardian.service >/dev/null
          systemctl restart sahjony-openclaw-runtime-guardian.service
          sleep 5
          systemctl is-enabled --quiet sahjony-openclaw-runtime-guardian.service
          systemctl is-active --quiet sahjony-openclaw-runtime-guardian.service
          test -s /var/lib/sahjony-openclaw-guardian/status.json
          cat /var/lib/sahjony-openclaw-guardian/status.json
          echo SAHJONY_OPENCLAW_RUNTIME_GUARDIAN=READY
          REMOTE

      - name: Verify durable native production state
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/hostinger-nim "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          systemctl is-enabled --quiet openclaw-gateway.service
          systemctl is-active --quiet openclaw-gateway.service
          systemctl is-enabled --quiet sahjony-openclaw-runtime-guardian.service
          systemctl is-active --quiet sahjony-openclaw-runtime-guardian.service
          systemctl is-enabled --quiet sahjony-nvidia-nim-rotation.timer
          systemctl is-active --quiet sahjony-nvidia-nim-rotation.timer

          guardian="$(cat /var/lib/sahjony-openclaw-guardian/status.json)"
          nim="$(cat /var/lib/sahjony-nvidia-nim/status.json)"
          python3 - "$guardian" "$nim" <<'PY'
          import json, sys
          g=json.loads(sys.argv[1]); n=json.loads(sys.argv[2])
          assert g.get('runtime') == 'native', g
          assert g.get('healthy') is True, g
          assert n.get('runtime') == 'native', n
          assert int(n.get('candidate_count',0)) >= 1, n
          print('SAHJONY_RUNTIME_MODE=native')
          print('SAHJONY_NIM_RUNTIME=native')
          print('SAHJONY_NIM_AUTH_READY='+str(bool(n.get('auth_ready'))).lower())
          PY

          cid=""
          if command -v docker >/dev/null 2>&1; then
            cid="$(docker ps -aq | while read -r id; do meta="$(docker inspect "$id" --format '{{.Name}}|{{.Config.Image}}' 2>/dev/null || true)"; grep -Eqi 'openclaw|open[-_ ]?claw|claw' <<<"$meta" && { echo "$id"; break; } || true; done)"
          fi
          if [[ -n "$cid" ]]; then
            [[ "$(docker inspect "$cid" --format '{{.State.Running}}')" == false ]]
            [[ "$(docker inspect "$cid" --format '{{.HostConfig.RestartPolicy.Name}}')" == no ]]
            echo OPENCLAW_DOCKER_STANDBY=SAFE
          fi

          whatsapp_ext=/var/lib/sahjony-openclaw-state/extensions/whatsapp
          if [[ -d "$whatsapp_ext" ]]; then
            ! find "$whatsapp_ext" -xdev \( ! -uid 0 -o ! -gid 0 \) -print -quit | grep -q .
            echo WHATSAPP_PLUGIN_OWNERSHIP=READY
          fi

          echo SAHJONY_PRODUCTION_NATIVE_24X7_RUNTIME=READY
          REMOTE

      - name: Cleanup transient credentials
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hostinger-nim "$RUNNER_TEMP/nvidia-api-key"
