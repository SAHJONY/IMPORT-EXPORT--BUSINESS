name: Hostinger OpenClaw Native Owner Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-openclaw-native-owner-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HOST: '69.62.68.67'
  USER: root

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Inspect native gateway, guardian, and health sidecar
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-key
          chmod 600 ~/.ssh/hostinger-key
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/hostinger-key "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== PORT_OWNER ==='
          ss -ltnp 2>/dev/null | grep ':18789' || true
          echo '=== PROCESS_TREE ==='
          ps -eo pid,ppid,lstart,cmd | grep -E 'openclaw|sahjony-openclaw-runtime-guardian' | grep -v grep | head -n 120 || true
          echo '=== GUARDIAN_STATUS ==='
          systemctl status sahjony-openclaw-runtime-guardian.service --no-pager -l || true
          echo '=== SIDECAR_UNIT ==='
          systemctl cat sahjony-openclaw-health-sidecar.service || true
          echo '=== SIDECAR_STATUS ==='
          systemctl status sahjony-openclaw-health-sidecar.service --no-pager -l || true
          echo '=== SIDECAR_SCRIPT ==='
          sed -n '1,320p' /usr/local/sbin/sahjony-openclaw-health-sidecar 2>/dev/null || true
          echo '=== STATE_FILES ==='
          find /var/lib/sahjony-openclaw-state /var/lib/sahjony-openclaw-guardian -maxdepth 2 -type f -printf '%p %s bytes\n' 2>/dev/null | sort || true
          echo '=== STATE_JSON_SAFE ==='
          for f in /var/lib/sahjony-openclaw-state/*.json /var/lib/sahjony-openclaw-guardian/*.json; do
            [[ -f "$f" ]] || continue
            echo "FILE=$f"
            python3 - "$f" <<'PY'
import json,sys
p=sys.argv[1]
try:
    d=json.load(open(p))
except Exception as e:
    print('PARSE_ERROR',type(e).__name__); raise SystemExit
sensitive=('key','token','secret','password','credential','auth','cookie')
def clean(v,k=''):
    if any(x in k.lower() for x in sensitive): return '<redacted>'
    if isinstance(v,dict): return {a:clean(b,a) for a,b in v.items()}
    if isinstance(v,list): return [clean(x,k) for x in v[:20]]
    if isinstance(v,str) and len(v)>300: return v[:300]+'...'
    return v
print(json.dumps(clean(d),indent=2,sort_keys=True))
PY
          done
          echo '=== ENV_PRESENCE ==='
          for f in /etc/openclaw-sahjony-bridge.env /etc/openclaw-gateway.env /etc/openclaw-openai.env; do
            if [[ -f "$f" ]]; then
              echo "FILE_PRESENT=$f"
              sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/ENV_KEY=\1/p' "$f" | sort -u
            else
              echo "FILE_MISSING=$f"
            fi
          done
          echo '=== SIDECAR_LOGS ==='
          journalctl -u sahjony-openclaw-health-sidecar.service --since '-20 minutes' --no-pager -n 260 || true
          echo '=== GATEWAY_LOGS_SAFE ==='
          journalctl -u openclaw-gateway.service --since '-20 minutes' --no-pager -n 220 | sed -E 's/(sk-[A-Za-z0-9_-]{8})[A-Za-z0-9_-]+/\1<redacted>/g' || true
          echo '=== PUBLIC_HEALTH ==='
          curl -fsS --max-time 20 https://www.sahjony.com/whatsapp/health | python3 -m json.tool || true
          REMOTE
          rm -f ~/.ssh/hostinger-key
