name: Hostinger OpenClaw Native Owner Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-openclaw-native-owner-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HOST: '69.62.68.67'
  USER: root

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Inspect native gateway and guardian ownership
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-key
          chmod 600 ~/.ssh/hostinger-key
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/hostinger-key "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== PORT_OWNER ==='
          ss -ltnp 2>/dev/null | grep ':18789' || true
          echo '=== PROCESS_TREE ==='
          ps -o pid,ppid,lstart,cmd -p 701,706,788 2>/dev/null || true
          echo '=== GUARDIAN_SCRIPT ==='
          if [[ -f /usr/local/sbin/sahjony-openclaw-runtime-guardian ]]; then
            sed -n '1,240p' /usr/local/sbin/sahjony-openclaw-runtime-guardian
          else
            echo GUARDIAN_SCRIPT_MISSING
          fi
          echo '=== SYSTEMD_RELEVANT ==='
          systemctl list-unit-files --type=service --no-pager 2>/dev/null | grep -Ei 'openclaw|sahjony|guardian|hermes' || true
          systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'openclaw|sahjony|guardian|hermes' || true
          echo '=== CRON_RELEVANT ==='
          grep -RniE 'openclaw|sahjony-openclaw-runtime-guardian|18789' /etc/cron* /var/spool/cron 2>/dev/null | head -n 200 || true
          echo '=== INIT_RELEVANT ==='
          grep -RniE 'openclaw|sahjony-openclaw-runtime-guardian|18789' /etc/systemd/system /lib/systemd/system /usr/lib/systemd/system 2>/dev/null | head -n 300 || true
          echo '=== SUPERVISORS ==='
          command -v supervisorctl >/dev/null && supervisorctl status 2>/dev/null || true
          command -v pm2 >/dev/null && pm2 ls 2>/dev/null || true
          REMOTE
          rm -f ~/.ssh/hostinger-key
