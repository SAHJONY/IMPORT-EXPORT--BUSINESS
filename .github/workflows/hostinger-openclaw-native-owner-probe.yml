name: Hostinger OpenClaw Native Owner Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-openclaw-native-owner-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HOST: '69.62.68.67'
  USER: root

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Inspect WhatsApp relink interface safely
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-key
          chmod 600 ~/.ssh/hostinger-key
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/hostinger-key "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export HOME=/home/node
          export OPENCLAW_STATE_DIR=/var/lib/sahjony-openclaw-state
          export OPENCLAW_CONFIG_PATH=/var/lib/sahjony-openclaw-state/openclaw.json
          export OPENCLAW_BIN=/usr/bin/openclaw
          echo '=== CHANNEL_STATUS ==='
          /usr/bin/openclaw channels status --probe || true
          echo '=== CHANNELS_HELP ==='
          /usr/bin/openclaw channels --help || true
          echo '=== LOGIN_HELP ==='
          /usr/bin/openclaw channels login --help || true
          echo '=== WHATSAPP_HELP ==='
          /usr/bin/openclaw channels login --channel whatsapp --help || true
          echo '=== CREDENTIAL_PATHS ==='
          find /var/lib/sahjony-openclaw-state /home/node/.openclaw -maxdepth 4 -type d -o -type f 2>/dev/null | grep -Ei 'whatsapp|credential|auth|session' | head -n 120 || true
          REMOTE
          rm -f ~/.ssh/hostinger-key
