name: Hostinger WhatsApp Bridge Wire-Up

# One-time (or repeat-safe) wiring that makes the Hostinger VPS the direct
# WhatsApp API for outbound sends, independent of Vercel:
#   1. Writes SAHJONY_APP_BRIDGE_SECRET (from repo secrets, never logged) into
#      the VPS fallback env file used by sahjony-fallback-whatsapp.service
#   2. Ensures WHATSAPP_AUTOMATION_ENABLED=true in that env file
#   3. Restarts sahjony-fallback-whatsapp.service (port 8102, behind nginx /whatsapp/)
#   4. Smoke-tests the signed outbox endpoints through http://69.62.68.67
#
# Owner-gated: Juan dispatches explicitly. Does NOT touch the live Hermes
# gateway units, /root/.hermes, or /opt/sahjony-hermes — only the fallback
# FastAPI service and its env file.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-whatsapp-wire-bridge
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: 69.62.68.67
      VPS_USER: root
    steps:
      - name: Wire bridge secret and restart WhatsApp API on VPS
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          BRIDGE_SECRET: ${{ secrets.SAHJONY_APP_BRIDGE_SECRET || secrets.OPENCLAW_APP_BRIDGE_SECRET }}
          SUPABASE_URL: ${{ secrets.VPS_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VPS_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ "${#BRIDGE_SECRET}" -lt 24 ]; then
            echo "BRIDGE_SECRET missing or too short in repo secrets"; exit 2
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps-key
          chmod 600 ~/.ssh/vps-key
          SSH="ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -i ~/.ssh/vps-key"
          # Copy the secret as a file so its value never appears in any command line or log.
          printf '%s' "$BRIDGE_SECRET" > /tmp/bridge_secret_src
          chmod 600 /tmp/bridge_secret_src
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 -i ~/.ssh/vps-key /tmp/bridge_secret_src "$VPS_USER@$VPS_HOST:/tmp/bridge_secret_incoming"
          shred -u /tmp/bridge_secret_src
          # Supabase backend for the outbox (fail-closed if absent). Values travel as files, never echoed.
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_KEY:-}" ] && [[ "$SUPABASE_URL" == https://* ]] && [ "${#SUPABASE_KEY}" -ge 20 ]; then
            printf '%s' "$SUPABASE_URL" > /tmp/supabase_url_src; chmod 600 /tmp/supabase_url_src
            printf '%s' "$SUPABASE_KEY" > /tmp/supabase_key_src; chmod 600 /tmp/supabase_key_src
            scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=15 -i ~/.ssh/vps-key /tmp/supabase_url_src "$VPS_USER@$VPS_HOST:/tmp/supabase_url_incoming"
            scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=15 -i ~/.ssh/vps-key /tmp/supabase_key_src "$VPS_USER@$VPS_HOST:/tmp/supabase_key_incoming"
            shred -u /tmp/supabase_url_src /tmp/supabase_key_src
          else
            echo "SUPABASE_WIRED=skipped (VPS_SUPABASE_* secrets not set or invalid; backend stays unconfigured)"
          fi
          unset SUPABASE_URL SUPABASE_KEY
          $SSH "$VPS_USER@$VPS_HOST" 'bash -s' <<'VPS_EOF'
          set -euo pipefail
          SECRET="$(cat /tmp/bridge_secret_incoming)"
          shred -u /tmp/bridge_secret_incoming
          if [ "${#SECRET}" -lt 24 ]; then echo "SECRET_TOO_SHORT"; exit 2; fi
          ENV_FILE=/etc/sahjony-fallback/import-export.env
          cp "$ENV_FILE" "$ENV_FILE.bak.$(date +%Y%m%d%H%M%S)"
          grep -v -e '^SAHJONY_APP_BRIDGE_SECRET=' -e '^WHATSAPP_AUTOMATION_ENABLED=' "$ENV_FILE" > "$ENV_FILE.tmp" || true
          printf 'SAHJONY_APP_BRIDGE_SECRET=%s\n' "$SECRET" >> "$ENV_FILE.tmp"
          printf 'WHATSAPP_AUTOMATION_ENABLED=true\n' >> "$ENV_FILE.tmp"
          if [ -f /tmp/supabase_url_incoming ] && [ -f /tmp/supabase_key_incoming ]; then
            SUPA_URL=$(cat /tmp/supabase_url_incoming); shred -u /tmp/supabase_url_incoming
            SUPA_KEY=$(cat /tmp/supabase_key_incoming); shred -u /tmp/supabase_key_incoming
            grep -v -e '^SUPABASE_URL=' -e '^SUPABASE_SERVICE_ROLE_KEY=' "$ENV_FILE.tmp" > "$ENV_FILE.tmp2" || true
            mv "$ENV_FILE.tmp2" "$ENV_FILE.tmp"
            printf 'SUPABASE_URL=%s\n' "$SUPA_URL" >> "$ENV_FILE.tmp"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPA_KEY" >> "$ENV_FILE.tmp"
            unset SUPA_URL SUPA_KEY
            echo "SUPABASE_WIRED=yes (values not shown)"
          fi
          chmod 600 "$ENV_FILE.tmp"
          mv "$ENV_FILE.tmp" "$ENV_FILE"
          unset SECRET
          systemctl restart sahjony-fallback-whatsapp.service
          sleep 6
          systemctl is-active sahjony-fallback-whatsapp.service
          echo WIRE_OK
          VPS_EOF
          rm -f ~/.ssh/vps-key

      - name: Smoke-test direct Hostinger outbox API
        env:
          BRIDGE_SECRET: ${{ secrets.SAHJONY_APP_BRIDGE_SECRET || secrets.OPENCLAW_APP_BRIDGE_SECRET }}
          SUPABASE_URL: ${{ secrets.VPS_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VPS_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, hmac, json, os, time, urllib.request, urllib.error
          base = 'http://69.62.68.67'
          key = os.environ['BRIDGE_SECRET']
          def signed_headers(raw: bytes):
              ts = str(int(time.time()))
              sig = 'sha256=' + hmac.new(key.encode(), ts.encode() + b'.' + raw, hashlib.sha256).hexdigest()
              return {'X-SAHJONY-Timestamp': ts, 'X-SAHJONY-Signature': sig}
          # status endpoint with a probe command_id: proves signature verification works on the VPS
          req = urllib.request.Request(base + '/whatsapp/hermes/outbox/status?command_id=probe', method='GET',
              headers={'Accept': 'application/json', 'Host': 'sahjony.com', **signed_headers(b'')})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  body = json.loads(r.read().decode() or '{}')
              print(f'STATUS_HTTP={r.status}')
              print('STATUS_BODY=' + json.dumps(body)[:300])
              if body.get('detail') == 'Hermes application bridge is not configured':
                  print('SMOKE_FAIL=bridge still not configured'); raise SystemExit(1)
              print('SMOKE_OK=direct Hostinger outbox API is live and signature verifies')
          except urllib.error.HTTPError as e:
              ebody = e.read().decode('utf-8', 'replace')[:300]
              print(f'STATUS_HTTP={e.code}')
              if e.code == 500 and 'durable backend' in ebody:
                  print('SMOKE_BACKEND_MISSING=bridge wired and signature verifies, but Supabase backend not configured (needs VPS_SUPABASE_URL + VPS_SUPABASE_SERVICE_ROLE_KEY repo secrets)')
                  raise SystemExit(3)
              print(f'SMOKE_FAIL body={ebody}'); raise SystemExit(1)
          PY
