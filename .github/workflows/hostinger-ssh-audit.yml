name: Hostinger SSH access audit

on:
  workflow_dispatch:
    inputs:
      repair_access:
        description: Register and attach the GitHub deployment key when missing
        required: false
        default: false
        type: boolean
      vm_id:
        description: Hostinger VPS ID (required only when the account has multiple VPS instances)
        required: false
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HOSTINGER_API_TOKEN}" ]] || { echo "HOSTINGER_API_TOKEN is missing" >&2; exit 1; }
          [[ -n "${HOSTINGER_SSH_PRIVATE_KEY}" ]] || { echo "HOSTINGER_SSH_PRIVATE_KEY is missing" >&2; exit 1; }

      - name: Confirm attached key and SSH authentication
        shell: bash
        env:
          REPAIR_ACCESS: ${{ inputs.repair_access }}
          REQUESTED_VM_ID: ${{ inputs.vm_id }}
        run: |
          set -euo pipefail
          umask 077
          key_file="${RUNNER_TEMP}/hostinger_ssh_key"
          printf '%s\n' "${HOSTINGER_SSH_PRIVATE_KEY}" | tr -d '\r' > "${key_file}"
          if ! ssh-keygen -y -f "${key_file}" > "${key_file}.pub" 2>/dev/null; then
            # Accommodate secrets copied with literal escaped newlines.
            printf '%b\n' "${HOSTINGER_SSH_PRIVATE_KEY}" | tr -d '\r' > "${key_file}"
          fi
          if ! ssh-keygen -y -f "${key_file}" > "${key_file}.pub" 2>/dev/null; then
            # Accommodate a base64-encoded private key without logging it.
            if ! printf '%s' "${HOSTINGER_SSH_PRIVATE_KEY}" | base64 --decode > "${key_file}" 2>/dev/null; then
              echo "HOSTINGER_SSH_PRIVATE_KEY is not a valid multiline, escaped-newline, or base64 private key." >&2
              exit 1
            fi
          fi
          if ! ssh-keygen -y -f "${key_file}" > "${key_file}.pub" 2>/dev/null; then
            echo "HOSTINGER_SSH_PRIVATE_KEY could not be parsed by OpenSSH." >&2
            exit 1
          fi
          expected_key="$(awk '{print $1 " " $2}' "${key_file}.pub")"

          api_root="https://developers.hostinger.com/api/vps/v1"
          auth_header="Authorization: Bearer ${HOSTINGER_API_TOKEN}"
          vm_response="$(curl --fail --silent --show-error \
            --header "${auth_header}" \
            "${api_root}/virtual-machines")"

          mapfile -t vm_ids < <(jq -r '(if type == "array" then . else (.data // []) end)[].id' <<<"${vm_response}")
          if [[ "${#vm_ids[@]}" -eq 0 ]]; then
            echo "The Hostinger account has no VPS instances." >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          target_vm_id="${REQUESTED_VM_ID:-}"
          if [[ -n "${target_vm_id}" ]] && ! printf '%s\n' "${vm_ids[@]}" | grep -Fxq "${target_vm_id}"; then
            echo "Requested VPS ID was not found in this Hostinger account." >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if [[ -z "${target_vm_id}" && "${#vm_ids[@]}" -eq 1 ]]; then
            target_vm_id="${vm_ids[0]}"
          fi

          if [[ "${REPAIR_ACCESS}" == "true" ]]; then
            if [[ -z "${target_vm_id}" ]]; then
              echo "Multiple VPS instances exist; rerun with an explicit vm_id." >> "${GITHUB_STEP_SUMMARY}"
              printf 'Available VPS IDs: `%s`\n' "$(IFS=,; echo "${vm_ids[*]}")" >> "${GITHUB_STEP_SUMMARY}"
              exit 1
            fi

            attached_response="$(curl --silent --show-error \
              --header "${auth_header}" \
              "${api_root}/virtual-machines/${target_vm_id}/public-keys")"
            if ! jq -e --arg expected "${expected_key}" \
              '(if type == "array" then . else (.data // []) end) | any((.key | split(" ")[0:2] | join(" ")) == $expected)' \
              <<<"${attached_response}" >/dev/null; then
              account_keys="$(curl --fail --silent --show-error \
                --header "${auth_header}" \
                "${api_root}/public-keys")"
              public_key_id="$(jq -r --arg expected "${expected_key}" \
                '(if type == "array" then . else (.data // []) end)[] | select((.key | split(" ")[0:2] | join(" ")) == $expected) | .id' \
                <<<"${account_keys}" | head -n 1)"
              if [[ -z "${public_key_id}" ]]; then
                create_body="$(jq -cn --arg name 'github-actions-openclaw-deploy' --arg key "$(cat "${key_file}.pub")" '{name:$name,key:$key}')"
                create_response="$(curl --fail --silent --show-error \
                  --request POST \
                  --header "${auth_header}" \
                  --header 'Content-Type: application/json' \
                  --data "${create_body}" \
                  "${api_root}/public-keys")"
                public_key_id="$(jq -r '.id // .data.id // empty' <<<"${create_response}")"
              fi
              [[ -n "${public_key_id}" ]] || { echo "Hostinger did not return a public-key ID." >&2; exit 1; }
              attach_body="$(jq -cn --argjson id "${public_key_id}" '{ids:[$id]}')"
              curl --fail --silent --show-error \
                --request POST \
                --header "${auth_header}" \
                --header 'Content-Type: application/json' \
                --data "${attach_body}" \
                "${api_root}/public-keys/attach/${target_vm_id}" >/dev/null
              echo "Registered and attached the GitHub deployment key to Hostinger VPS ${target_vm_id}." >> "${GITHUB_STEP_SUMMARY}"
              sleep 5
            fi
          fi

          matched=0
          authenticated=0
          while IFS=$'\t' read -r vm_id vm_ip; do
            [[ -n "${vm_id}" && -n "${vm_ip}" ]] || continue
            [[ -z "${target_vm_id}" || "${vm_id}" == "${target_vm_id}" ]] || continue
            matched=1
            known_hosts="${RUNNER_TEMP}/known_hosts"
            for attempt in {1..12}; do
              if ssh-keyscan -T 10 -H "${vm_ip}" > "${known_hosts}" 2>/dev/null && \
                ssh -i "${key_file}" \
                  -o BatchMode=yes \
                  -o ConnectTimeout=15 \
                  -o IdentitiesOnly=yes \
                  -o PasswordAuthentication=no \
                  -o StrictHostKeyChecking=yes \
                  -o UserKnownHostsFile="${known_hosts}" \
                  "root@${vm_ip}" true; then
                authenticated=1
                echo "Hostinger VPS ${vm_id}: SSH key attached and root authentication succeeded." >> "${GITHUB_STEP_SUMMARY}"
                break 2
              fi
              sleep 5
            done
          done < <(jq -r '
            (if type == "array" then . else (.data // []) end)[] |
            [(.id | tostring),
             (.ipv4[0].address // .ipv4_address // .ip // .ip_address // empty)] |
            @tsv
          ' <<<"${vm_response}")

          if [[ "${matched}" -ne 1 ]]; then
            echo "No Hostinger VPS with a usable IPv4 address was found." >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if [[ "${authenticated}" -ne 1 ]]; then
            echo "The key is attached, but port 22 or non-interactive root SSH authentication remained unavailable after retries." | tee -a "${GITHUB_STEP_SUMMARY}" >&2
            exit 1
          fi
