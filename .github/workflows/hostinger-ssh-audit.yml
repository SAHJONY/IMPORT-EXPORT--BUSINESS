name: Hostinger SSH access audit

on:
  workflow_dispatch:
    inputs:
      repair_access:
        description: Register and attach the GitHub deployment key when missing
        required: false
        default: false
        type: boolean
      vm_id:
        description: Hostinger VPS ID (required only when the account has multiple VPS instances)
        required: false
        type: string
      ensure_ssh_firewall:
        description: Add and synchronize a TCP/22 rule on the active Hostinger firewall when missing
        required: false
        default: false
        type: boolean
      exit_emergency_mode:
        description: Stop Hostinger recovery mode and wait for the normal VPS system
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HOSTINGER_API_TOKEN}" ]] || { echo "HOSTINGER_API_TOKEN is missing" >&2; exit 1; }
          [[ -n "${HOSTINGER_SSH_PRIVATE_KEY}" ]] || { echo "HOSTINGER_SSH_PRIVATE_KEY is missing" >&2; exit 1; }

      - name: Confirm attached key and SSH authentication
        shell: bash
        env:
          REPAIR_ACCESS: ${{ inputs.repair_access }}
          REQUESTED_VM_ID: ${{ inputs.vm_id }}
          ENSURE_SSH_FIREWALL: ${{ inputs.ensure_ssh_firewall }}
          EXIT_EMERGENCY_MODE: ${{ inputs.exit_emergency_mode }}
        run: |
          set -euo pipefail
          umask 077
          key_file="${RUNNER_TEMP}/hostinger_ssh_key"
          printf '%s\n' "${HOSTINGER_SSH_PRIVATE_KEY}" | tr -d '\r' > "${key_file}"
          if ! ssh-keygen -y -f "${key_file}" > "${key_file}.pub" 2>/dev/null; then
            # Accommodate secrets copied with literal escaped newlines.
            printf '%b\n' "${HOSTINGER_SSH_PRIVATE_KEY}" | tr -d '\r' > "${key_file}"
          fi
          if ! ssh-keygen -y -f "${key_file}" > "${key_file}.pub" 2>/dev/null; then
            # Accommodate a base64-encoded private key without logging it.
            if ! printf '%s' "${HOSTINGER_SSH_PRIVATE_KEY}" | base64 --decode > "${key_file}" 2>/dev/null; then
              echo "HOSTINGER_SSH_PRIVATE_KEY is not a valid multiline, escaped-newline, or base64 private key." >&2
              exit 1
            fi
          fi
          if ! ssh-keygen -y -f "${key_file}" > "${key_file}.pub" 2>/dev/null; then
            echo "HOSTINGER_SSH_PRIVATE_KEY could not be parsed by OpenSSH." >&2
            exit 1
          fi
          expected_key="$(awk '{print $1 " " $2}' "${key_file}.pub")"

          api_root="https://developers.hostinger.com/api/vps/v1"
          auth_header="Authorization: Bearer ${HOSTINGER_API_TOKEN}"
          vm_response="$(curl --fail --silent --show-error \
            --header "${auth_header}" \
            "${api_root}/virtual-machines")"

          mapfile -t vm_ids < <(jq -r '(if type == "array" then . else (.data // []) end)[].id' <<<"${vm_response}")
          if [[ "${#vm_ids[@]}" -eq 0 ]]; then
            echo "The Hostinger account has no VPS instances." >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          target_vm_id="${REQUESTED_VM_ID:-}"
          if [[ -n "${target_vm_id}" ]] && ! printf '%s\n' "${vm_ids[@]}" | grep -Fxq "${target_vm_id}"; then
            echo "Requested VPS ID was not found in this Hostinger account." >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if [[ -z "${target_vm_id}" && "${#vm_ids[@]}" -eq 1 ]]; then
            target_vm_id="${vm_ids[0]}"
          fi

          if [[ "${EXIT_EMERGENCY_MODE}" == "true" ]]; then
            if [[ -z "${target_vm_id}" ]]; then
              echo "Multiple VPS instances exist; rerun with an explicit vm_id." >> "${GITHUB_STEP_SUMMARY}"
              exit 1
            fi
            vm_state="$(jq -r --arg id "${target_vm_id}" '
              (if type == "array" then . else (.data // []) end)[] |
              select((.id | tostring) == $id) | .state
            ' <<<"${vm_response}")"
            recovery_status="$(curl --silent --show-error \
              --output "${RUNNER_TEMP}/recovery-response.json" \
              --write-out '%{http_code}' \
              --request DELETE \
              --header "${auth_header}" \
              "${api_root}/virtual-machines/${target_vm_id}/recovery")"
            if [[ "${recovery_status}" != "200" && "${recovery_status}" != "422" ]]; then
              echo "Hostinger recovery-stop request failed with HTTP ${recovery_status}." >&2
              exit 1
            fi
            echo "Requested exit from Hostinger emergency mode for VPS ${target_vm_id} (HTTP ${recovery_status})." >> "${GITHUB_STEP_SUMMARY}"
            for attempt in {1..30}; do
              vm_detail="$(curl --fail --silent --show-error \
                --header "${auth_header}" \
                "${api_root}/virtual-machines/${target_vm_id}")"
              vm_state="$(jq -r '.state // empty' <<<"${vm_detail}")"
              if [[ "${vm_state}" == "running" ]]; then
                break
              fi
              sleep 10
            done
            if [[ "${vm_state}" != "running" ]]; then
              echo "VPS did not return to normal running state after leaving emergency mode." | tee -a "${GITHUB_STEP_SUMMARY}" >&2
              exit 1
            fi
            echo "Hostinger VPS ${target_vm_id} is running in normal mode." >> "${GITHUB_STEP_SUMMARY}"
            sleep 15
          fi

          if [[ "${REPAIR_ACCESS}" == "true" ]]; then
            if [[ -z "${target_vm_id}" ]]; then
              echo "Multiple VPS instances exist; rerun with an explicit vm_id." >> "${GITHUB_STEP_SUMMARY}"
              printf 'Available VPS IDs: `%s`\n' "$(IFS=,; echo "${vm_ids[*]}")" >> "${GITHUB_STEP_SUMMARY}"
              exit 1
            fi

            attached_response="$(curl --silent --show-error \
              --header "${auth_header}" \
              "${api_root}/virtual-machines/${target_vm_id}/public-keys")"
            if ! jq -e --arg expected "${expected_key}" \
              '(if type == "array" then . else (.data // []) end) | any((.key | split(" ")[0:2] | join(" ")) == $expected)' \
              <<<"${attached_response}" >/dev/null; then
              account_keys="$(curl --fail --silent --show-error \
                --header "${auth_header}" \
                "${api_root}/public-keys")"
              public_key_id="$(jq -r --arg expected "${expected_key}" \
                '(if type == "array" then . else (.data // []) end)[] | select((.key | split(" ")[0:2] | join(" ")) == $expected) | .id' \
                <<<"${account_keys}" | head -n 1)"
              if [[ -z "${public_key_id}" ]]; then
                create_body="$(jq -cn --arg name 'github-actions-openclaw-deploy' --arg key "$(cat "${key_file}.pub")" '{name:$name,key:$key}')"
                create_response="$(curl --fail --silent --show-error \
                  --request POST \
                  --header "${auth_header}" \
                  --header 'Content-Type: application/json' \
                  --data "${create_body}" \
                  "${api_root}/public-keys")"
                public_key_id="$(jq -r '.id // .data.id // empty' <<<"${create_response}")"
              fi
              [[ -n "${public_key_id}" ]] || { echo "Hostinger did not return a public-key ID." >&2; exit 1; }
              attach_body="$(jq -cn --argjson id "${public_key_id}" '{ids:[$id]}')"
              curl --fail --silent --show-error \
                --request POST \
                --header "${auth_header}" \
                --header 'Content-Type: application/json' \
                --data "${attach_body}" \
                "${api_root}/public-keys/attach/${target_vm_id}" >/dev/null
              echo "Registered and attached the GitHub deployment key to Hostinger VPS ${target_vm_id}." >> "${GITHUB_STEP_SUMMARY}"
              sleep 5
            fi
          fi

          if [[ "${ENSURE_SSH_FIREWALL}" == "true" ]]; then
            if [[ -z "${target_vm_id}" ]]; then
              echo "Multiple VPS instances exist; rerun with an explicit vm_id." >> "${GITHUB_STEP_SUMMARY}"
              exit 1
            fi
            firewall_id="$(jq -r --arg id "${target_vm_id}" '
              (if type == "array" then . else (.data // []) end)[] |
              select((.id | tostring) == $id) |
              .firewall_group_id // empty
            ' <<<"${vm_response}")"
            if [[ -n "${firewall_id}" ]]; then
              firewall_response="$(curl --fail --silent --show-error \
                --header "${auth_header}" \
                "${api_root}/firewall/${firewall_id}")"
              if ! jq -e '
                (.rules // []) | any(
                  ((.protocol | ascii_upcase) == "TCP" or (.protocol | ascii_downcase) == "any") and
                  (.source == "any") and
                  ((.port == "22") or (.port == "any") or
                   ((.port | test("^[0-9]+:[0-9]+$")) and
                    ((.port | split(":")[0] | tonumber) <= 22) and
                    ((.port | split(":")[1] | tonumber) >= 22)))
                )
              ' <<<"${firewall_response}" >/dev/null; then
                rule_body='{"protocol":"TCP","port":"22","source":"any","source_detail":"any"}'
                curl --fail --silent --show-error \
                  --request POST \
                  --header "${auth_header}" \
                  --header 'Content-Type: application/json' \
                  --data "${rule_body}" \
                  "${api_root}/firewall/${firewall_id}/rules" >/dev/null
                echo "Added TCP/22 to Hostinger firewall ${firewall_id}." >> "${GITHUB_STEP_SUMMARY}"
              fi
              curl --fail --silent --show-error \
                --request POST \
                --header "${auth_header}" \
                "${api_root}/firewall/${firewall_id}/sync/${target_vm_id}" >/dev/null
              echo "Synchronized Hostinger firewall ${firewall_id} to VPS ${target_vm_id}." >> "${GITHUB_STEP_SUMMARY}"
              sleep 10
            else
              echo "No Hostinger network firewall is active on VPS ${target_vm_id}; TCP/22 is not blocked at the Hostinger firewall layer." >> "${GITHUB_STEP_SUMMARY}"
            fi
          fi

          matched=0
          authenticated=0
          while IFS=$'\t' read -r vm_id vm_host; do
            [[ -n "${vm_id}" && -n "${vm_host}" ]] || continue
            [[ -z "${target_vm_id}" || "${vm_id}" == "${target_vm_id}" ]] || continue
            matched=1
            known_hosts="${RUNNER_TEMP}/known_hosts"
            for attempt in {1..12}; do
              if ssh-keyscan -T 10 -H "${vm_host}" > "${known_hosts}" 2>/dev/null && \
                ssh -i "${key_file}" \
                  -o BatchMode=yes \
                  -o ConnectTimeout=15 \
                  -o IdentitiesOnly=yes \
                  -o PasswordAuthentication=no \
                  -o StrictHostKeyChecking=yes \
                  -o UserKnownHostsFile="${known_hosts}" \
                  "root@${vm_host}" true; then
                authenticated=1
                echo "Hostinger VPS ${vm_id}: SSH key attached and root authentication succeeded." >> "${GITHUB_STEP_SUMMARY}"
                break
              fi
              sleep 5
            done
          done < <(jq -r '
            (if type == "array" then . else (.data // []) end)[] |
            [(.id | tostring),
             (.ipv4[0].address // .ipv4_address // .ip // .ip_address // .hostname // empty)] |
            @tsv
          ' <<<"${vm_response}")

          echo "SSH audit result: VPS discovered=${matched}, key authentication=${authenticated}"
          if [[ "${matched}" -ne 1 ]]; then
            echo "No Hostinger VPS with a usable IP address or hostname was found." >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if [[ "${authenticated}" -ne 1 ]]; then
            echo "The key is attached, but port 22 or non-interactive root SSH authentication remained unavailable after retries." | tee -a "${GITHUB_STEP_SUMMARY}" >&2
            exit 1
          fi
