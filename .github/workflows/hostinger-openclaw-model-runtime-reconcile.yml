name: Hostinger OpenClaw Model Runtime Reconcile

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  reconcile:
    if: contains(github.event.head_commit.message, 'reconcile canonical model runtime') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HOST: 69.62.68.67
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Validate protected credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_KEY" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          [[ -n "$OPENAI_API_KEY" ]] || { echo OPENAI_API_KEY_MISSING=1 >&2; exit 3; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/openclaw-runtime-reconcile
          chmod 600 ~/.ssh/openclaw-runtime-reconcile
          ssh-keygen -y -f ~/.ssh/openclaw-runtime-reconcile >/dev/null

      - name: Reconcile canonical runtime paths and fallback auth
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OPENAI_API_KEY" | ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/openclaw-runtime-reconcile "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          read -r OPENAI_KEY
          [[ -n "$OPENAI_KEY" ]] || { echo OPENAI_KEY_EMPTY_ON_HOST=1 >&2; exit 5; }

          STATE=/var/lib/sahjony-openclaw-state
          CONFIG=$STATE/openclaw.json
          test -f "$CONFIG"
          install -d -m 755 /etc/systemd/system/openclaw-gateway.service.d

          cat >/etc/systemd/system/openclaw-gateway.service.d/05-canonical-paths.conf <<EOF
          [Service]
          Environment="OPENCLAW_STATE_DIR=$STATE"
          Environment="OPENCLAW_CONFIG_PATH=$CONFIG"
          EOF
          chmod 644 /etc/systemd/system/openclaw-gateway.service.d/05-canonical-paths.conf

          umask 077
          python3 - "$STATE/.env" "$OPENAI_KEY" <<'PY'
          import pathlib, sys
          p=pathlib.Path(sys.argv[1])
          key=sys.argv[2]
          rows=[]
          if p.exists():
              rows=p.read_text().splitlines()
          out=[]
          seen=False
          for row in rows:
              if row.startswith('OPENAI_API_KEY='):
                  out.append('OPENAI_API_KEY='+key)
                  seen=True
              elif not row.startswith('ANTHROPIC_API_KEY='):
                  out.append(row)
          if not seen:
              out.append('OPENAI_API_KEY='+key)
          p.write_text('\n'.join(out).rstrip()+'\n')
          p.chmod(0o600)
          PY

          python3 - "$CONFIG" <<'PY'
          import json, sys
          p=sys.argv[1]
          d=json.load(open(p))
          agents=d.setdefault('agents', {})
          defaults=agents.setdefault('defaults', {})
          defaults['model']={
              'primary':'nvidia/openai/gpt-oss-120b',
              'fallbacks':['openai/gpt-5.5']
          }
          entries=agents.get('entries')
          if isinstance(entries, dict) and isinstance(entries.get('main'), dict):
              entries['main']['model']={
                  'primary':'nvidia/openai/gpt-oss-120b',
                  'fallbacks':['openai/gpt-5.5']
              }
          elif isinstance(entries, list):
              for row in entries:
                  if isinstance(row, dict) and row.get('id') == 'main':
                      row['model']={
                          'primary':'nvidia/openai/gpt-oss-120b',
                          'fallbacks':['openai/gpt-5.5']
                      }
          with open(p,'w') as f:
              json.dump(d,f,indent=2)
              f.write('\n')
          PY
          chmod 600 "$CONFIG"

          export OPENCLAW_STATE_DIR="$STATE"
          export OPENCLAW_CONFIG_PATH="$CONFIG"
          export OPENAI_API_KEY="$OPENAI_KEY"

          active_file="$(openclaw config file)"
          echo "OPENCLAW_ACTIVE_CONFIG=$active_file"
          [[ "$active_file" == "$CONFIG" ]]

          openclaw config validate --json >/tmp/openclaw-runtime-config.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/openclaw-runtime-config.json'))
          if d.get('valid') is False or d.get('ok') is False:
              raise SystemExit('OPENCLAW_CONFIG_INVALID')
          print('OPENCLAW_CANONICAL_CONFIG_VALID=1')
          PY

          systemctl daemon-reload
          systemctl restart openclaw-gateway.service
          sleep 10
          systemctl is-active --quiet openclaw-gateway.service
          echo OPENCLAW_GATEWAY_ACTIVE=1

          pid="$(systemctl show openclaw-gateway.service -p MainPID --value)"
          python3 - "$pid" <<'PY'
          import pathlib,sys
          raw=pathlib.Path('/proc')/sys.argv[1]/'environ'
          vals={x.split('=',1)[0]:x.split('=',1)[1] for x in raw.read_bytes().decode(errors='ignore').split('\0') if '=' in x}
          assert vals.get('OPENCLAW_STATE_DIR') == '/var/lib/sahjony-openclaw-state'
          assert vals.get('OPENCLAW_CONFIG_PATH') == '/var/lib/sahjony-openclaw-state/openclaw.json'
          assert bool(vals.get('OPENAI_API_KEY'))
          assert not bool(vals.get('ANTHROPIC_API_KEY'))
          print('GATEWAY_CANONICAL_STATE_DIR=1')
          print('GATEWAY_CANONICAL_CONFIG_PATH=1')
          print('GATEWAY_OPENAI_AUTH_PRESENT=1')
          print('GATEWAY_ANTHROPIC_DISABLED=1')
          PY

          OPENAI_API_KEY="$OPENAI_KEY" OPENCLAW_STATE_DIR="$STATE" OPENCLAW_CONFIG_PATH="$CONFIG" \
            timeout 75 openclaw infer model run --local --model openai/gpt-5.5 --prompt 'Reply with exactly: SOFIA_FALLBACK_OK' --json >/tmp/openai-smoke.json
          python3 - <<'PY'
          import json,re
          d=json.load(open('/tmp/openai-smoke.json'))
          s=json.dumps(d)
          if 'SOFIA_FALLBACK_OK' not in s:
              raise SystemExit('OPENAI_FALLBACK_SMOKE_FAILED')
          print('OPENAI_FALLBACK_SMOKE_OK=1')
          PY

          OPENCLAW_STATE_DIR="$STATE" OPENCLAW_CONFIG_PATH="$CONFIG" OPENAI_API_KEY="$OPENAI_KEY" \
            openclaw models status --agent main 2>&1 | sed -E 's/(sk-[A-Za-z0-9_-]{8})[A-Za-z0-9_-]+/\1***/g' | tail -n 120

          echo SAHJONY_OPENCLAW_MODEL_RUNTIME_RECONCILED=1
          REMOTE

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f ~/.ssh/openclaw-runtime-reconcile
