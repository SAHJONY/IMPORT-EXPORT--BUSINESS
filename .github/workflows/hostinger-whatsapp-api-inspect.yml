name: Hostinger WhatsApp API Inspect

# One-shot diagnostic: how is whatsapp_api.py (the FastAPI app behind
# https://www.sahjony.com/whatsapp/*) deployed and run on the VPS?
# Read-only: makes no changes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HOST: 69.62.68.67
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
      - name: Inspect API deployment
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -i ~/.ssh/key "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== systemd services mentioning whatsapp/api ==="
          systemctl list-units --type=service --state=running --no-pager 2>/dev/null | grep -iE "whatsapp|api|sahjony|fastapi|uvicorn" || true
          echo "=== listening ports for the API ==="
          ss -tlnp 2>/dev/null | grep -E ":8000|:8001|:5000|:3000" || true
          echo "=== whatsapp_api.py locations ==="
          find /opt /root /srv /home -maxdepth 5 -name "whatsapp_api.py" 2>/dev/null | head -5 || true
          echo "=== process running whatsapp_api ==="
          ps aux 2>/dev/null | grep -E "whatsapp_api|uvicorn" | grep -v grep | head -5 || true
          echo "=== git repos that could be the deploy source ==="
          for d in /opt/sahjony /root; do
            if [ -d "$d/.git" ]; then echo "$d: $(git -C $d rev-parse --short HEAD 2>/dev/null) $(git -C $d remote get-url origin 2>/dev/null || true)"; fi
          done
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/key
