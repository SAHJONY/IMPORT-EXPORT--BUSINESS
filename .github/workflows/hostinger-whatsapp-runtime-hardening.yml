name: Hostinger WhatsApp Runtime Hardening

on:
  push:
    branches: [main]
    paths:
      - 'openclaw/hostinger-24x7/deploy-whatsapp-runtime-hardening.sh'
      - 'openclaw/sahjony-app-bridge/index.js'
      - 'openclaw/sahjony-whatsapp-output-guard/index.js'
      - 'openclaw/sahjony-whatsapp-reply-rescue/index.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOST: '69.62.68.67'
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      NVIDIA_API_KEY_GH: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate assets and credentials
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_KEY" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          [[ "$NVIDIA_API_KEY_GH" == nvapi-* ]] || { echo NVIDIA_API_KEY_MISSING_OR_INVALID=1 >&2; exit 3; }
          bash -n openclaw/hostinger-24x7/deploy-whatsapp-runtime-hardening.sh
          [[ -s openclaw/sahjony-whatsapp-output-guard/index.js ]]
          [[ -s openclaw/sahjony-whatsapp-reply-rescue/index.js ]]
          [[ -s openclaw/sahjony-app-bridge/index.js ]]

      - name: Prepare secure transfer
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-whatsapp-hardening
          printf '%s' "$NVIDIA_API_KEY_GH" > "$RUNNER_TEMP/nvidia-key"
          chmod 600 ~/.ssh/hostinger-whatsapp-hardening "$RUNNER_TEMP/nvidia-key"
          ssh-keygen -y -f ~/.ssh/hostinger-whatsapp-hardening >/dev/null
          tar -czf "$RUNNER_TEMP/whatsapp-hardening.tgz" \
            openclaw/sahjony-whatsapp-output-guard \
            openclaw/sahjony-whatsapp-reply-rescue \
            openclaw/sahjony-app-bridge

      - name: Deploy hardening to Hostinger OpenClaw
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -i ~/.ssh/hostinger-whatsapp-hardening)
          scp "${opts[@]}" \
            openclaw/hostinger-24x7/deploy-whatsapp-runtime-hardening.sh \
            "$RUNNER_TEMP/whatsapp-hardening.tgz" \
            "$RUNNER_TEMP/nvidia-key" \
            "$SSH_USER@$HOST:/root/"
          ssh "${opts[@]}" "$SSH_USER@$HOST" \
            'chmod 700 /root/deploy-whatsapp-runtime-hardening.sh && /root/deploy-whatsapp-runtime-hardening.sh'

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/hostinger-whatsapp-hardening "$RUNNER_TEMP/nvidia-key" "$RUNNER_TEMP/whatsapp-hardening.tgz"
