name: NVIDIA GPT-OSS 120B Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nvidia-gpt-oss-120b-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ops(nvidia): validate GPT-OSS 120B NIM'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Validate NVIDIA credential and GPT-OSS 120B inference
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$NVIDIA_API_KEY" ]] || { echo NVIDIA_API_KEY_MISSING=1 >&2; exit 2; }
          echo "::add-mask::$NVIDIA_API_KEY"
          [[ "$NVIDIA_API_KEY" == nvapi-* ]] || { echo NVIDIA_API_KEY_FORMAT_UNEXPECTED=1 >&2; exit 3; }
          payload='{"model":"openai/gpt-oss-120b","messages":[{"role":"user","content":"Reply exactly SAHJONY_GPT_OSS_120B_OK"}],"max_tokens":32,"temperature":0}'
          code="$(curl -sS --connect-timeout 10 --max-time 120 -o /tmp/nim.json -w '%{http_code}' \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            https://integrate.api.nvidia.com/v1/chat/completions || true)"
          echo "NVIDIA_GPT_OSS_120B_HTTP=$code"
          [[ "$code" == 200 ]] || { jq -r '.detail?,.error?.message?,.error?.code?' /tmp/nim.json 2>/dev/null | sed '/^null$/d' >&2 || true; exit 4; }
          jq -e '.choices[0].message.content | contains("SAHJONY_GPT_OSS_120B_OK")' /tmp/nim.json >/dev/null || { echo NVIDIA_GPT_OSS_120B_RESPONSE_MISMATCH=1 >&2; jq '{model,choices:[.choices[0].finish_reason]}' /tmp/nim.json >&2 || true; exit 5; }
          echo NVIDIA_GPT_OSS_120B=READY
