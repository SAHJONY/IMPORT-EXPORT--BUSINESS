name: NVIDIA GPT-OSS 120B Smoke Test
# production validation gate: openai/gpt-oss-120b

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/nvidia-gpt-oss-120b-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Validate NVIDIA GPT-OSS 120B
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NVIDIA_API_KEY:-}" ]]; then
            echo NVIDIA_API_KEY_MISSING=1 >&2
            exit 2
          fi
          echo "::add-mask::$NVIDIA_API_KEY"
          if [[ "$NVIDIA_API_KEY" != nvapi-* ]]; then
            echo NVIDIA_API_KEY_FORMAT_UNEXPECTED=1 >&2
            exit 3
          fi
          cat > /tmp/payload.json <<'JSON'
          {
            "model": "openai/gpt-oss-120b",
            "messages": [{"role": "user", "content": "Reply exactly SAHJONY_GPT_OSS_120B_OK"}],
            "reasoning_effort": "low",
            "max_tokens": 4096,
            "temperature": 1,
            "top_p": 1,
            "stream": false
          }
          JSON
          code="$(curl -sS --connect-timeout 10 --max-time 180 -o /tmp/nim.json -w '%{http_code}' \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/payload.json \
            https://integrate.api.nvidia.com/v1/chat/completions || true)"
          echo "NVIDIA_GPT_OSS_120B_HTTP=$code"
          if [[ "$code" != 200 ]]; then
            jq -r '.detail?,.error?.message?,.error?.code?' /tmp/nim.json 2>/dev/null | sed '/^null$/d' >&2 || true
            exit 4
          fi
          finish="$(jq -r '.choices[0].finish_reason // "unknown"' /tmp/nim.json)"
          content="$(jq -r '.choices[0].message.content // ""' /tmp/nim.json)"
          reasoning="$(jq -r '.choices[0].message.reasoning_content // ""' /tmp/nim.json)"
          echo "NVIDIA_GPT_OSS_120B_FINISH_REASON=$finish"
          [[ "$finish" != "length" ]] || { echo NVIDIA_GPT_OSS_120B_TRUNCATED=1 >&2; exit 5; }
          if [[ "$content" != *"SAHJONY_GPT_OSS_120B_OK"* ]]; then
            echo NVIDIA_GPT_OSS_120B_RESPONSE_MISMATCH=1 >&2
            printf 'content_length=%s reasoning_length=%s\n' "${#content}" "${#reasoning}" >&2
            exit 6
          fi
          echo NVIDIA_GPT_OSS_120B=READY
