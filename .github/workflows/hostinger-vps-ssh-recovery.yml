name: Hostinger VPS SSH Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-vps-ssh-recovery.yml'

permissions:
  actions: write
  contents: read

env:
  HOSTINGER_API_BASE: 'https://developers.hostinger.com'
  VM_ID: '767852'
  HOST: '69.62.68.67'
  USER: root

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Validate protected credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$API_TOKEN" ]] || { echo HOSTINGER_API_TOKEN_MISSING=1 >&2; exit 2; }
          [[ -n "$PRIVATE_KEY" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 3; }

      - name: Inspect VPS control-plane status
        shell: bash
        run: |
          set -euo pipefail
          vm="$(curl --fail --silent --show-error -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID")"
          VM_JSON="$vm" python3 - <<'PY'
          import json, os
          v=json.loads(os.environ['VM_JSON'])
          print('HOSTINGER_VM_STATUS=' + str(v.get('state') or v.get('status') or 'unknown'))
          print('HOSTINGER_VM_HOSTNAME=' + str(v.get('hostname') or 'unknown'))
          PY

      - name: Probe SSH before restart
        id: before
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-vps-recovery
          chmod 600 ~/.ssh/hostinger-vps-recovery
          ssh-keygen -y -f ~/.ssh/hostinger-vps-recovery >/dev/null
          if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/hostinger-vps-recovery "$USER@$HOST" 'printf SSH_READY' 2>/dev/null | grep -q SSH_READY; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo HOSTINGER_SSH_ALREADY_READY=1
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo HOSTINGER_SSH_UNAVAILABLE_BEFORE_RECOVERY=1
          fi

      - name: Restart VPS through Hostinger control plane
        if: steps.before.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error -X POST -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/restart")"
          RESPONSE_JSON="$response" python3 - <<'PY'
          import json, os
          r=json.loads(os.environ['RESPONSE_JSON']) if os.environ.get('RESPONSE_JSON') else {}
          print('HOSTINGER_RESTART_ACTION_ID=' + str(r.get('id') or 'unknown'))
          print('HOSTINGER_RESTART_ACTION_STATE=' + str(r.get('state') or 'accepted'))
          PY
          echo HOSTINGER_VPS_RESTART_REQUESTED=1

      - name: Wait for SSH recovery
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for i in $(seq 1 45); do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 -i ~/.ssh/hostinger-vps-recovery "$USER@$HOST" 'printf SSH_READY' 2>/dev/null | grep -q SSH_READY; then
              ready=true
              echo "HOSTINGER_SSH_RECOVERED_ON_PROBE=$i"
              break
            fi
            echo "hostinger_ssh_recovery_probe=$i/45"
            sleep 10
          done
          [[ "$ready" == true ]] || { echo HOSTINGER_SSH_RECOVERY_FAILED=1 >&2; exit 4; }

      - name: Verify critical runtime after restart
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/hostinger-vps-recovery "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo HOSTINGER_SERVER_UP=1
          systemctl is-active --quiet sahjony-crm-bridge.timer
          /usr/local/sbin/sahjony-crm-bridge doctor >/tmp/crm-doctor.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/crm-doctor.json'))
          assert d.get('status') == 'ok', d
          assert (d.get('health') or {}).get('status') == 'ok', d
          assert d.get('pending_count') == 0, d
          print('HOSTINGER_CRM_BRIDGE_POST_RESTART_HEALTHY=1')
          PY
          REMOTE

      - name: Dispatch RFQ E2E certification
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run hostinger-crm-bridge-e2e-certify.yml --repo "$REPO" --ref main
          echo SAHJONY_CRM_RFQ_E2E_REDISPATCHED=1

      - name: Cleanup local key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hostinger-vps-recovery
