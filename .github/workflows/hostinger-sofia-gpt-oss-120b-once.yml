name: Hostinger Sofia GPT-OSS-120B One Time

on:
  push:
    branches: [main]
    paths:
      - 'openclaw/hostinger-24x7/switch-sofia-gpt-oss-120b.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOST: '69.62.68.67'
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      NVIDIA_API_KEY_GH: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate credentials and cutover script
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_KEY" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          [[ "$NVIDIA_API_KEY_GH" == nvapi-* ]] || { echo NVIDIA_API_KEY_MISSING_OR_INVALID=1 >&2; exit 3; }
          bash -n openclaw/hostinger-24x7/switch-sofia-gpt-oss-120b.sh

      - name: Prepare secure SSH assets
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-sofia-gptoss
          printf '%s' "$NVIDIA_API_KEY_GH" > "$RUNNER_TEMP/nvidia-key"
          chmod 600 ~/.ssh/hostinger-sofia-gptoss "$RUNNER_TEMP/nvidia-key"
          ssh-keygen -y -f ~/.ssh/hostinger-sofia-gptoss >/dev/null

      - name: Transfer and execute safe cutover
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/hostinger-sofia-gptoss)
          scp "${opts[@]}" openclaw/hostinger-24x7/switch-sofia-gpt-oss-120b.sh "$RUNNER_TEMP/nvidia-key" "$SSH_USER@$HOST:/root/"
          ssh "${opts[@]}" "$SSH_USER@$HOST" 'chmod 700 /root/switch-sofia-gpt-oss-120b.sh && NVIDIA_KEY_FILE=/root/nvidia-key /root/switch-sofia-gpt-oss-120b.sh'

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/hostinger-sofia-gptoss "$RUNNER_TEMP/nvidia-key"
