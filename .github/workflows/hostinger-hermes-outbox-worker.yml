name: Hostinger Hermes Outbox Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/hostinger-hermes-outbox-worker.yml

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: hostinger-vm-767852-mutation
      cancel-in-progress: false
    env:
      HOST: 69.62.68.67
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      BRIDGE_SECRET: ${{ secrets.SAHJONY_APP_BRIDGE_SECRET || secrets.OPENCLAW_APP_BRIDGE_SECRET }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY"
          test ${#BRIDGE_SECRET} -ge 24
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
      - name: Install Hermes outbox transport worker
        shell: bash
        run: |
          set -euo pipefail
          tmp_secret="$(mktemp)"
          printf '%s' "$BRIDGE_SECRET" > "$tmp_secret"
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/key "$tmp_secret" "$SSH_USER@$HOST:/tmp/sahjony-outbox-secret"
          rm -f "$tmp_secret"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/key "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          install -d -m 700 /opt/sahjony/hermes-outbox
          install -m 600 /tmp/sahjony-outbox-secret /opt/sahjony/hermes-outbox/bridge.secret
          rm -f /tmp/sahjony-outbox-secret
          cat > /opt/sahjony/hermes-outbox/worker.py <<'PY'
          #!/usr/bin/env python3
          # NOTE: BASE points at the VPS-local WhatsApp API (127.0.0.1:8102), not the
          # public domain — the public domain may be down (e.g. Vercel 402) while the
          # local API is up. Do not change back to the public URL without a fallback.
          import hashlib, hmac, json, os, secrets, time, urllib.request, urllib.error
          from datetime import datetime, timezone

          BASE='http://127.0.0.1:8102'
          SECRET=open('/opt/sahjony/hermes-outbox/bridge.secret').read().strip()
          BRIDGE='http://127.0.0.1:3000'
          GATEWAY='hermes-hostinger'
          ACCOUNT='default'

          def signed_headers(raw=b''):
              ts=str(int(time.time()))
              sig='sha256='+hmac.new(SECRET.encode(), ts.encode()+b'.'+raw, hashlib.sha256).hexdigest()
              return {'X-Bridge-Timestamp':ts,'X-Bridge-Signature':sig}

          def json_request(url, method='GET', payload=None, headers=None, timeout=20):
              raw=b'' if payload is None else json.dumps(payload,separators=(',',':')).encode()
              h={'Accept':'application/json'}
              if payload is not None: h['Content-Type']='application/json'
              if headers: h.update(headers(raw) if callable(headers) else headers)
              req=urllib.request.Request(url,data=(raw if payload is not None else None),headers=h,method=method)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  body=r.read().decode()
                  return json.loads(body) if body else {}

          def bridge_health():
              try:
                  d=json_request(BRIDGE+'/health',timeout=5)
                  return bool(d)
              except Exception:
                  return False

          def heartbeat():
              payload={'gateway_id':GATEWAY,'account_id':ACCOUNT,'channel_connected':bridge_health(),'business_name':'SAHJONY LLC','model':'hermes-agent','gateway_version':'Hermes WhatsApp bridge'}
              try:
                  json_request(BASE+'/whatsapp/hermes/heartbeat','POST',payload,signed_headers)
                  print('HERMES_HEARTBEAT_POST=OK', flush=True)
              except urllib.error.HTTPError as e:
                  print(f'HERMES_HEARTBEAT_POST=HTTP_{e.code}', flush=True)
              except Exception as e:
                  print(f'HERMES_HEARTBEAT_POST={type(e).__name__}', flush=True)

          def poll():
              try:
                  d=json_request(BASE+'/whatsapp/hermes/outbox?limit=5',headers=lambda raw:signed_headers(b''))
                  return d.get('commands') or []
              except Exception:
                  return []

          def send_local(cmd):
              if str(cmd.get('release_mode') or '') != 'customer_service_window':
                  raise RuntimeError('compliance_release_missing')
              # Voice-note path (feat/whatsapp-voice-notes): base64 audio from the
              # outbox row -> temp file -> bridge /send-media with mediaType audio.
              # The bridge converts to ogg/opus via ffmpeg so WhatsApp renders a
              # native ptt voice bubble. Temp file is always cleaned up.
              if str(cmd.get('media_type') or '') == 'audio' and cmd.get('media_base64'):
                  import base64 as _b64, os as _os
                  raw = _b64.b64decode(str(cmd['media_base64']))
                  if not (1_000 <= len(raw) <= 1_500_000):
                      raise RuntimeError('invalid audio payload size')
                  tmp = '/tmp/hermes_voice_%s.mp3' % secrets.token_hex(8)
                  try:
                      with open(tmp, 'wb') as fh:
                          fh.write(raw)
                      if str(cmd.get('recipient_type') or '') == 'group':
                          group_jid = str(cmd.get('group_jid') or '').strip()
                          if not group_jid:
                              raw_r = str(cmd.get('recipient') or '')
                              group_jid = raw_r[len('group:'):] if raw_r.startswith('group:') else ''
                          local, _, domain = group_jid.rpartition('@')
                          if domain != 'g.us' or not local.isdigit() or not local:
                              raise RuntimeError('invalid group_jid')
                          candidates = [group_jid]
                      else:
                          recipient = ''.join(ch for ch in str(cmd.get('recipient') or '') if ch.isdigit())
                          if not recipient:
                              raise RuntimeError('invalid recipient')
                          candidates = [recipient + '@s.whatsapp.net', recipient]
                      last = None
                      for chat in candidates:
                          try:
                              out = json_request(BRIDGE + '/send-media', 'POST',
                                  {'chatId': chat, 'filePath': tmp, 'mediaType': 'audio'}, timeout=90)
                              return str(out.get('messageId') or out.get('id') or '') or None
                          except Exception as e:
                              last = e
                      raise last or RuntimeError('send-media failed')
                  finally:
                      try:
                          _os.unlink(tmp)
                      except Exception:
                          pass
              body=str(cmd.get('body') or '')[:4096]
              if str(cmd.get('recipient_type') or '') == 'group':
                  # Group send: address the @g.us JID verbatim. Never append
                  # @s.whatsapp.net / @c.us to a group JID.
                  group_jid=str(cmd.get('group_jid') or '').strip()
                  if not group_jid:
                      raw=str(cmd.get('recipient') or '')
                      group_jid=raw[len('group:'):] if raw.startswith('group:') else ''
                  local, _, domain=group_jid.rpartition('@')
                  if domain != 'g.us' or not local.isdigit() or not local:
                      raise RuntimeError('invalid group_jid')
                  candidates=[group_jid]
              else:
                  recipient=''.join(ch for ch in str(cmd.get('recipient') or '') if ch.isdigit())
                  if not recipient: raise RuntimeError('invalid recipient')
                  candidates=[recipient+'@s.whatsapp.net',recipient]
              last=None
              for chat in candidates:
                  try:
                      out=json_request(BRIDGE+'/send','POST',{'chatId':chat,'message':body},timeout=25)
                      return str(out.get('messageId') or out.get('id') or '') or None
                  except Exception as e:
                      last=e
              raise last or RuntimeError('send failed')

          def ack(cmd,status,message_id=None,error=None):
              payload={'command_id':cmd['command_id'],'lease_token':cmd['lease_token'],'status':status,'provider_message_id':message_id,'error':(str(error)[:500] if error else None)}
              json_request(BASE+'/whatsapp/hermes/outbox/ack','POST',payload,signed_headers)

          def main():
              if len(SECRET)<24: raise SystemExit('bridge secret missing')
              last_hb=0
              while True:
                  now=time.time()
                  if now-last_hb>30:
                      heartbeat(); last_hb=now
                  for cmd in poll():
                      try:
                          mid=send_local(cmd); ack(cmd,'sent',mid)
                      except Exception as e:
                          try: ack(cmd,'failed',None,e)
                          except Exception: pass
                      time.sleep(2)
                  time.sleep(5)

          if __name__=='__main__': main()
          PY
          chmod 700 /opt/sahjony/hermes-outbox/worker.py
          cat > /etc/systemd/system/sahjony-hermes-outbox.service <<'UNIT'
          [Unit]
          Description=SAHJONY Hermes WhatsApp CRM Outbox Worker
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/python3 /opt/sahjony/hermes-outbox/worker.py
          Restart=always
          RestartSec=5
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable sahjony-hermes-outbox.service >/dev/null
          systemctl restart sahjony-hermes-outbox.service
          sleep 8
          systemctl is-active --quiet sahjony-hermes-outbox.service
          curl -fsS --max-time 5 http://127.0.0.1:3000/health >/dev/null
          echo HERMES_OUTBOX_WORKER=ACTIVE
          echo LOCAL_WHATSAPP_BRIDGE=HEALTHY
          REMOTE
      - name: Verify production heartbeat
        shell: bash
        run: |
          set -euo pipefail
          sleep 35
          python3 - <<'PY'
          import json, urllib.request
          d=json.load(urllib.request.urlopen('https://www.sahjony.com/whatsapp/health',timeout=20))
          assert d.get('provider') == 'hermes_agent', d
          assert d.get('status') == 'ok', d
          assert d.get('hostinger_independent_runtime') is True, d
          assert d.get('send_ready') is True, d
          assert d.get('webhook_ready') is True, d
          print('PRODUCTION_WHATSAPP_HEARTBEAT=FRESH')
          print('PRODUCTION_WHATSAPP_CONNECTED=TRUE')
          PY
      - name: Show Hermes worker diagnostics on failure
        if: failure()
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/key "$SSH_USER@$HOST" 'journalctl -u sahjony-hermes-outbox.service -n 40 --no-pager | grep -E "HERMES_HEARTBEAT_POST|Started|Stopped|Main process exited" || true'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/key
