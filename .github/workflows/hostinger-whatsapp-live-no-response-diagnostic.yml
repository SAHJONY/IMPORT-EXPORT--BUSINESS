name: Hostinger WhatsApp Live No-Response Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-whatsapp-live-no-response-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-whatsapp-live-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_KEY" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-wa-live
          chmod 600 ~/.ssh/hostinger-wa-live
          ssh-keygen -y -f ~/.ssh/hostinger-wa-live >/dev/null

      - name: Trace latest inbound AI and outbound path
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -i ~/.ssh/hostinger-wa-live "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== TIME ==='
          date --iso-8601=seconds
          echo '=== GATEWAY ==='
          systemctl is-active openclaw-gateway.service || true
          systemctl status openclaw-gateway.service --no-pager -l | tail -n 80 || true
          echo '=== CRM BRIDGE ==='
          /usr/local/sbin/sahjony-crm-bridge doctor || true
          echo '=== OPENCLAW CHANNEL STATUS ==='
          openclaw channels status 2>&1 || true
          echo '=== RECENT WHATSAPP / AI / SEND EVENTS ==='
          journalctl -u openclaw-gateway.service --since '-20 minutes' --no-pager -n 1600 \
            | grep -Ei 'whatsapp|inbound|message|reply|send|dispatch|timelock|restrict|companion|nvidia|openai|gpt|model|401|403|429|500|error|failed|delivery|platform_message_not_dispatched' \
            | tail -n 700 || true
          echo '=== RECENT CRM TIMER ==='
          journalctl -u sahjony-crm-bridge.service --since '-20 minutes' --no-pager -n 300 || true
          echo '=== STATE FILES ==='
          find /var/lib/sahjony-openclaw-state /var/lib/sahjony-crm-bridge -maxdepth 2 -type f -mmin -30 -printf '%TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null | sort | tail -n 100 || true
          echo '=== RESTRICTION MATCHES ==='
          grep -RniE 'RESTRICT_ALL_COMPANIONS|timelock|platform_message_not_dispatched|send_ready|outbound' /var/lib/sahjony-openclaw-state /var/lib/sahjony-crm-bridge 2>/dev/null | tail -n 250 || true
          REMOTE

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hostinger-wa-live
