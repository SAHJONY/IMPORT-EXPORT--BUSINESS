name: Hostinger Recovery Reporter

on:
  workflow_run:
    workflows:
      - Hostinger Recovery Docker OpenClaw V3
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Build recovery report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > /tmp/jobs.json
          {
            echo "## Hostinger Docker OpenClaw recovery report"
            echo
            echo "- Run: $RUN_URL"
            echo "- Conclusion: **$CONCLUSION**"
            echo "- VPS: \`767852\` / \`69.62.68.67\`"
            echo "- Architecture: **Docker-only**"
            echo
            echo "### Gates"
            jq -r '.jobs[] | .name as $job | .steps[] | "- " + $job + " / " + .name + ": **" + (.conclusion // .status // "unknown") + "**"' /tmp/jobs.json
            echo
            echo "Reporter intentionally exposes no API tokens, passwords, SSH private keys, or secret values."
          } > /tmp/report.md
          cat /tmp/report.md
          gh issue comment 54 --repo "$REPO" --body-file /tmp/report.md
