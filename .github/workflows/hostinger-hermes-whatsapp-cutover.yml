name: Hostinger Hermes WhatsApp Cutover

on:
  workflow_dispatch:
    inputs:
      mode:
        description: audit | stage | cutover | retire-openclaw
        required: true
        default: audit
        type: choice
        options: [audit, stage, cutover, retire-openclaw]

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

jobs:
  hermes-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST: '69.62.68.67'
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_KEY:-}" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-hermes
          chmod 600 ~/.ssh/hostinger-hermes
          for i in {1..12}; do
            if ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/hostinger-hermes "$SSH_USER@$HOST" 'printf HOSTINGER_SSH_OK' 2>/dev/null | grep -q HOSTINGER_SSH_OK; then exit 0; fi
            sleep 5
          done
          echo HOSTINGER_SSH_UNAVAILABLE=1 >&2
          exit 3
      - name: Audit Hostinger runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/hostinger-hermes "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          HERMES_PY=/root/.hermes/hermes-agent/venv/bin/python
          echo '=== CORE RUNTIME ==='
          uname -a || true
          echo "HERMES_PROCESS=$(pgrep -af 'hermes_cli.main gateway run' | head -1 || true)"
          echo "OPENCLAW_PROCESS=$(pgrep -af 'openclaw gateway' | head -1 || true)"
          echo '=== HERMES GATEWAY STATUS ==='
          "$HERMES_PY" -m hermes_cli.main gateway status 2>&1 | head -120 || true
          echo '=== HERMES GATEWAY HELP ==='
          "$HERMES_PY" -m hermes_cli.main gateway --help 2>&1 | head -140 || true
          echo '=== HERMES CONFIG KEYS ==='
          "$HERMES_PY" - <<'PY'
          from pathlib import Path
          import yaml
          p=Path('/root/.hermes/config.yaml')
          if not p.exists():
              print('HERMES_CONFIG_MISSING=1'); raise SystemExit
          data=yaml.safe_load(p.read_text()) or {}
          sensitive=('token','key','secret','password','cookie','session','auth')
          def walk(obj,prefix=''):
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      path=f'{prefix}.{k}' if prefix else str(k)
                      if any(s in str(k).lower() for s in sensitive):
                          print(path+'=<redacted-present>' if v else path+'=<empty>')
                      elif isinstance(v,(dict,list)):
                          print(path+f'=<'+type(v).__name__+'>')
                          walk(v,path)
                      elif isinstance(v,(str,int,float,bool)) or v is None:
                          txt=str(v)
                          if len(txt)>120: txt=txt[:117]+'...'
                          print(path+'='+txt)
              elif isinstance(obj,list):
                  for i,v in enumerate(obj): walk(v,f'{prefix}[{i}]')
          walk(data)
          PY
          echo '=== HERMES WHATSAPP BRIDGE LOG ==='
          tail -120 /root/.hermes/platforms/whatsapp/bridge.log 2>/dev/null | sed -E 's/([A-Za-z0-9_]*(token|key|secret|password|cookie|session|auth)[A-Za-z0-9_]*[=:])[[:space:]]*[^ ]+/\1***REDACTED***/Ig' || true
          echo '=== HERMES WHATSAPP PLATFORM CODE SIGNALS ==='
          grep -nE 'class |def |bridge|pair|qr|session|connect|status|auth|whatsapp' /root/.hermes/hermes-agent/gateway/platforms/whatsapp.py 2>/dev/null | head -220 || true
          echo '=== HERMES PLATFORM PROCESSES ==='
          ps -eo pid,ppid,user,cmd | grep -E '/root/.hermes|whatsapp|bridge' | grep -v grep | head -100 || true
          echo '=== OPENCLAW / HERMES SERVICES ==='
          systemctl is-active openclaw-gateway.service 2>/dev/null || true
          systemctl is-enabled openclaw-gateway.service 2>/dev/null || true
          systemctl list-units --type=service --all 2>/dev/null | grep -Ei 'hermes|openclaw|whatsapp' || true
          echo '=== LISTENERS ==='
          ss -lntp 2>/dev/null | grep -E ':(18789|3000|8000|8080|8787|8765|8766)\b' || true
          echo HOSTINGER_HERMES_AUDIT_COMPLETE=1
          REMOTE
      - name: Stage Hermes application files
        if: ${{ inputs.mode == 'stage' || inputs.mode == 'cutover' || inputs.mode == 'retire-openclaw' }}
        shell: bash
        run: |
          set -euo pipefail
          files=(sofia_hermes_whatsapp_environment.py sofia_whatsapp_runtime.py sofia_hermes_nim_brain.py sofia_crm_growth_engine.py insforge_backend.py auth.py)
          for f in "${files[@]}"; do [[ -f "$f" ]] || { echo "MISSING_FILE=$f" >&2; exit 4; }; done
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/hostinger-hermes)
          ssh "${ssh_opts[@]}" "$SSH_USER@$HOST" 'install -d -m 750 /opt/sahjony-hermes'
          scp "${ssh_opts[@]}" "${files[@]}" "$SSH_USER@$HOST:/opt/sahjony-hermes/"
          scp "${ssh_opts[@]}" scripts/configure_sofia_hermes_web.sh "$SSH_USER@$HOST:/opt/sahjony-hermes/" 2>/dev/null || true
          echo HOSTINGER_HERMES_STAGE_COMPLETE=1
      - name: Guard cutover until independent WhatsApp transport exists
        if: ${{ inputs.mode == 'cutover' || inputs.mode == 'retire-openclaw' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/hostinger-hermes "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          independent=0
          systemctl is-active --quiet sahjony-hermes-whatsapp.service 2>/dev/null && independent=1 || true
          pgrep -f 'hermes_cli.main gateway run' >/dev/null 2>&1 && grep -Eqi 'connected|ready|logged.?in|authenticated' /root/.hermes/platforms/whatsapp/bridge.log 2>/dev/null && independent=1 || true
          if [[ "$independent" != 1 ]]; then
            echo HERMES_INDEPENDENT_WHATSAPP_TRANSPORT_NOT_READY=1 >&2
            echo OPENCLAW_PRESERVED_TO_AVOID_WHATSAPP_OUTAGE=1 >&2
            exit 20
          fi
          echo HERMES_INDEPENDENT_WHATSAPP_TRANSPORT_READY=1
          REMOTE
      - name: Retire OpenClaw only after independent transport gate
        if: ${{ inputs.mode == 'retire-openclaw' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/hostinger-hermes "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          pgrep -f 'hermes_cli.main gateway run' >/dev/null || { echo HERMES_GATEWAY_NOT_RUNNING=1 >&2; exit 21; }
          grep -Eqi 'connected|ready|logged.?in|authenticated' /root/.hermes/platforms/whatsapp/bridge.log || { echo HERMES_WHATSAPP_NOT_VERIFIED=1 >&2; exit 22; }
          mkdir -p /root/sahjony-cutover-backups
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          tar -C /var/lib -czf "/root/sahjony-cutover-backups/openclaw-state-$ts.tgz" sahjony-openclaw-state sahjony-openclaw-auth 2>/dev/null || true
          systemctl disable --now openclaw-gateway.service sahjony-openclaw-runtime-guardian.service 2>/dev/null || true
          systemctl disable --now sahjony-openclaw-health-sidecar.timer 2>/dev/null || true
          for c in $(docker ps -a --format '{{.Names}}' | grep -Ei 'openclaw' || true); do docker stop "$c" 2>/dev/null || true; done
          sleep 3
          pgrep -af 'openclaw gateway' && { echo OPENCLAW_STILL_RUNNING=1 >&2; exit 23; } || true
          pgrep -f 'hermes_cli.main gateway run' >/dev/null || { echo HERMES_DIED_DURING_CUTOVER=1 >&2; exit 24; }
          echo OPENCLAW_RUNTIME_STOPPED_AND_DISABLED=1
          echo OPENCLAW_DATA_BACKED_UP_FOR_ROLLBACK=1
          echo HERMES_REMAINS_RUNNING=1
          REMOTE
