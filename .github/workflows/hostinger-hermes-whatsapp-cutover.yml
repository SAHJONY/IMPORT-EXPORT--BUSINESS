name: Hostinger Hermes WhatsApp Cutover

on:
  workflow_dispatch:
    inputs:
      mode:
        description: audit | stage | cutover | retire-openclaw
        required: true
        default: audit
        type: choice
        options: [audit, stage, cutover, retire-openclaw]

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

jobs:
  hermes-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST: '69.62.68.67'
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_KEY:-}" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-hermes
          chmod 600 ~/.ssh/hostinger-hermes
          for i in {1..12}; do
            if ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/hostinger-hermes "$SSH_USER@$HOST" 'printf HOSTINGER_SSH_OK' 2>/dev/null | grep -q HOSTINGER_SSH_OK; then exit 0; fi
            sleep 5
          done
          echo HOSTINGER_SSH_UNAVAILABLE=1 >&2
          exit 3
      - name: Audit Hostinger runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/hostinger-hermes "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          HERMES_PY=/root/.hermes/hermes-agent/venv/bin/python
          echo '=== GATEWAY STATUS ==='
          "$HERMES_PY" -m hermes_cli.main gateway status 2>&1 | head -100 || true
          echo '=== HERMES BRIDGE PACKAGE ==='
          ls -la /root/.hermes/hermes-agent/scripts/whatsapp-bridge 2>/dev/null || true
          cat /root/.hermes/hermes-agent/scripts/whatsapp-bridge/package.json 2>/dev/null | head -120 || true
          echo '=== HERMES SESSION FILE NAMES ==='
          find /root/.hermes/platforms/whatsapp/session -maxdepth 3 -type f -printf '%P\n' 2>/dev/null | sort | head -200 || true
          echo '=== OPENCLAW WHATSAPP CREDENTIAL FILE NAMES ==='
          find /var/lib/sahjony-openclaw-state/credentials/whatsapp -maxdepth 4 -type f -printf '%P\n' 2>/dev/null | sort | head -240 || true
          echo '=== CREDS JSON SHAPES ==='
          "$HERMES_PY" - <<'PY'
          import json
          from pathlib import Path
          roots=[Path('/root/.hermes/platforms/whatsapp/session'),Path('/var/lib/sahjony-openclaw-state/credentials/whatsapp')]
          for root in roots:
              print('ROOT',root)
              for p in root.rglob('creds.json') if root.exists() else []:
                  try:
                      d=json.loads(p.read_text())
                      print('CREDS',p,'TOP_KEYS',sorted(d.keys()) if isinstance(d,dict) else type(d).__name__)
                  except Exception as e:
                      print('CREDS_PARSE_FAILED',p,type(e).__name__)
          PY
          echo '=== HERMES BRIDGE LOG TAIL ==='
          tail -80 /root/.hermes/platforms/whatsapp/bridge.log 2>/dev/null || true
          echo '=== PROCESSES ==='
          pgrep -af 'hermes_cli.main gateway run|openclaw gateway|whatsapp-bridge|bridge.js' || true
          echo HOSTINGER_HERMES_AUDIT_COMPLETE=1
          REMOTE
      - name: Stage Hermes application and WhatsApp bridge
        if: ${{ inputs.mode == 'stage' || inputs.mode == 'cutover' || inputs.mode == 'retire-openclaw' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/hostinger-hermes)
          files=(sofia_hermes_whatsapp_environment.py sofia_whatsapp_runtime.py sofia_hermes_nim_brain.py sofia_crm_growth_engine.py insforge_backend.py auth.py)
          for f in "${files[@]}"; do [[ -f "$f" ]] || { echo "MISSING_FILE=$f" >&2; exit 4; }; done
          ssh "${ssh_opts[@]}" "$SSH_USER@$HOST" 'install -d -m 750 /opt/sahjony-hermes'
          scp "${ssh_opts[@]}" "${files[@]}" "$SSH_USER@$HOST:/opt/sahjony-hermes/"
          ssh "${ssh_opts[@]}" "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BRIDGE=/root/.hermes/hermes-agent/scripts/whatsapp-bridge
          test -f "$BRIDGE/package.json"
          cd "$BRIDGE"
          if [[ ! -f node_modules/@whiskeysockets/baileys/lib/index.js && ! -f node_modules/@whiskeysockets/baileys/index.js ]]; then
            npm install --include=dev
          fi
          test -d node_modules/@whiskeysockets/baileys
          if [[ ! -f node_modules/@whiskeysockets/baileys/lib/index.js && ! -f node_modules/@whiskeysockets/baileys/index.js ]]; then
            cd node_modules/@whiskeysockets/baileys
            npm install --include=dev
            npm run build
            cd "$BRIDGE"
          fi
          test -f node_modules/@whiskeysockets/baileys/lib/index.js || test -f node_modules/@whiskeysockets/baileys/index.js
          echo HERMES_WHATSAPP_DEPENDENCIES_READY=1
          REMOTE
          echo HOSTINGER_HERMES_STAGE_COMPLETE=1
      - name: Migrate compatible linked-device credentials and restart Hermes
        if: ${{ inputs.mode == 'cutover' || inputs.mode == 'retire-openclaw' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/hostinger-hermes "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HSESSION=/root/.hermes/platforms/whatsapp/session
          OROOT=/var/lib/sahjony-openclaw-state/credentials/whatsapp
          mkdir -p "$HSESSION" /root/sahjony-cutover-backups
          src=""
          while IFS= read -r f; do
            d=$(dirname "$f")
            if [[ -f "$d/creds.json" ]]; then src="$d"; break; fi
          done < <(find "$OROOT" -type f -name creds.json 2>/dev/null)
          if [[ -z "$src" ]]; then
            echo OPENCLAW_BAILEYS_CREDS_NOT_FOUND=1 >&2
            exit 18
          fi
          python3 - "$src/creds.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          need={'noiseKey','signedIdentityKey','signedPreKey','registrationId','advSecretKey','me','account','signalIdentities','platform'}
          keys=set(d) if isinstance(d,dict) else set()
          if len(keys & need) < 5:
              print('OPENCLAW_CREDS_NOT_BAILEYS_COMPATIBLE=1')
              raise SystemExit(19)
          print('OPENCLAW_CREDS_BAILEYS_COMPATIBLE=1')
          PY
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          [[ ! -d "$HSESSION" || -z "$(find "$HSESSION" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]] || tar -C "$(dirname "$HSESSION")" -czf "/root/sahjony-cutover-backups/hermes-whatsapp-session-$ts.tgz" "$(basename "$HSESSION")"
          rm -rf "$HSESSION"/*
          cp -a "$src"/. "$HSESSION"/
          chmod -R go-rwx "$HSESSION"
          systemctl --user restart hermes-gateway.service
          sleep 12
          /root/.hermes/hermes-agent/venv/bin/python -m hermes_cli.main gateway status 2>&1 | head -120
          grep -Eqi 'connected|ready|authenticated' /root/.hermes/platforms/whatsapp/bridge.log || { echo HERMES_WHATSAPP_NOT_CONNECTED_AFTER_MIGRATION=1 >&2; tail -80 /root/.hermes/platforms/whatsapp/bridge.log >&2; exit 20; }
          echo HERMES_INDEPENDENT_WHATSAPP_TRANSPORT_READY=1
          REMOTE
      - name: Retire OpenClaw only after Hermes WhatsApp is healthy
        if: ${{ inputs.mode == 'retire-openclaw' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/hostinger-hermes "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          grep -Eqi 'connected|ready|authenticated' /root/.hermes/platforms/whatsapp/bridge.log || { echo HERMES_WHATSAPP_NOT_VERIFIED=1 >&2; exit 22; }
          pgrep -f 'hermes_cli.main gateway run' >/dev/null || { echo HERMES_GATEWAY_NOT_RUNNING=1 >&2; exit 21; }
          mkdir -p /root/sahjony-cutover-backups
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          tar -C /var/lib -czf "/root/sahjony-cutover-backups/openclaw-state-$ts.tgz" sahjony-openclaw-state sahjony-openclaw-auth 2>/dev/null || true
          systemctl disable --now sahjony-openclaw-runtime-guardian.service 2>/dev/null || true
          systemctl disable --now sahjony-openclaw-health-sidecar.timer 2>/dev/null || true
          systemctl disable --now openclaw-gateway.service
          for c in $(docker ps -a --format '{{.Names}}' | grep -Ei 'openclaw' || true); do docker stop "$c" 2>/dev/null || true; done
          sleep 5
          pgrep -f 'openclaw gateway' >/dev/null && { echo OPENCLAW_STILL_RUNNING=1 >&2; exit 23; } || true
          pgrep -f 'hermes_cli.main gateway run' >/dev/null || { echo HERMES_DIED_DURING_CUTOVER=1 >&2; exit 24; }
          grep -Eqi 'connected|ready|authenticated' /root/.hermes/platforms/whatsapp/bridge.log || { echo HERMES_WHATSAPP_DIED_DURING_CUTOVER=1 >&2; exit 25; }

          # Remove the retired OpenClaw runtime only after the independent Hermes
          # WhatsApp transport has survived the cutover. Keep only the timestamped
          # rollback archive under /root/sahjony-cutover-backups.
          systemctl disable --now sahjony-whatsapp-guardian.timer sahjony-whatsapp-guardian.service 2>/dev/null || true
          for c in $(docker ps -a --format '{{.Names}}' | grep -Ei 'openclaw' || true); do docker rm -f "$c" 2>/dev/null || true; done
          if command -v npm >/dev/null 2>&1; then npm uninstall -g openclaw >/dev/null 2>&1 || true; fi
          rm -f /usr/bin/openclaw /usr/local/bin/openclaw
          rm -rf /etc/systemd/system/openclaw-gateway.service /etc/systemd/system/openclaw-gateway.service.d
          rm -f /etc/systemd/system/sahjony-openclaw-runtime-guardian.service
          rm -f /etc/systemd/system/sahjony-openclaw-health-sidecar.service /etc/systemd/system/sahjony-openclaw-health-sidecar.timer
          rm -f /etc/systemd/system/sahjony-whatsapp-guardian.service /etc/systemd/system/sahjony-whatsapp-guardian.timer
          rm -rf /opt/sahjony/openclaw /opt/sahjony-openclaw /root/.openclaw /root/.cache/openclaw
          rm -rf /var/lib/sahjony-openclaw-state /var/lib/sahjony-openclaw-auth /var/lib/sahjony-openclaw-guardian /var/lib/sahjony-openclaw-correlator /var/lib/sahjony-openclaw-forensics /var/lib/sahjony-openclaw-recovery
          rm -f /usr/local/sbin/sahjony-openclaw-runtime-guardian /usr/local/sbin/sahjony-openclaw-health-sidecar
          systemctl daemon-reload
          systemctl reset-failed 2>/dev/null || true

          command -v openclaw >/dev/null 2>&1 && { echo OPENCLAW_BINARY_STILL_PRESENT=1 >&2; exit 26; } || true
          pgrep -af 'openclaw' >/dev/null && { echo OPENCLAW_PROCESS_STILL_PRESENT=1 >&2; exit 27; } || true
          pgrep -f 'hermes_cli.main gateway run' >/dev/null || { echo HERMES_DIED_AFTER_OPENCLAW_DELETE=1 >&2; exit 28; }
          pgrep -f '/whatsapp-bridge/bridge.js' >/dev/null || { echo HERMES_WHATSAPP_BRIDGE_DIED_AFTER_OPENCLAW_DELETE=1 >&2; exit 29; }
          grep -Eqi 'connected|ready|authenticated' /root/.hermes/platforms/whatsapp/bridge.log || { echo HERMES_WHATSAPP_DIED_AFTER_OPENCLAW_DELETE=1 >&2; exit 30; }
          echo OPENCLAW_RUNTIME_DELETED=1
          echo OPENCLAW_DATA_BACKED_UP_FOR_ROLLBACK=1
          echo HERMES_WHATSAPP_IS_PRODUCTION_AUTHORITY=1
          REMOTE
