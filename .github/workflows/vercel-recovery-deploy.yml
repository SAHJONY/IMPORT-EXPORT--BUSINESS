name: Vercel Recovery Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/vercel_deploy_recovery.sh'
      - '.github/workflows/vercel-recovery-deploy.yml'
      - 'skills/deployment-recovery/**'

concurrency:
  group: vercel-production-recovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Me3fB0D0J6He10CgJlJ44Xaq
      VERCEL_PROJECT_ID: prj_XmlR9SuaYKEE9siBC7lrsjLzYjb9
      PRODUCTION_URL: https://import-export-business.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: npm ci
      - name: Run deployment guard
        run: npm run prebuild --if-present
      - name: Verify Vercel deployment credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo '::error::Missing GitHub Actions secret VERCEL_TOKEN. Create a scoped Vercel token and save it as repository secret VERCEL_TOKEN.'
            exit 78
          fi
      - name: Build and deploy prebuilt production output
        run: bash scripts/vercel_deploy_recovery.sh
