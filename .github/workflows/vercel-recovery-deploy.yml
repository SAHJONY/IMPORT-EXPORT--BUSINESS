name: Vercel Prebuilt Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Release reason
        required: false
        default: Manual production release
  push:
    branches: [main]

concurrency:
  group: vercel-production-prebuilt
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Me3fB0D0J6He10CgJlJ44Xaq
      VERCEL_PROJECT_ID: prj_XmlR9SuaYKEE9siBC7lrsjLzYjb9
      PRODUCTION_URL: https://www.sahjony.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Vercel deployment credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo '::error::Missing GitHub Actions secret VERCEL_TOKEN. Create a scoped Vercel token and save it as repository secret VERCEL_TOKEN.'
            exit 78
          fi
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Run deployment guard
        run: npm run prebuild --if-present
      - name: Build and deploy prebuilt production output
        run: bash scripts/vercel_deploy_recovery.sh
