name: Swiss Watch Navigation Fixes

on:
  push:
    branches: [audit/swiss-watch-20260901]
    paths:
      - '.github/workflows/swiss-watch-navigation-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/swiss-watch-20260901
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Apply read-only health and navigation fixes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'EXPECTED_SOURCE_NOT_FOUND:{path}')
              p.write_text(text.replace(old,new,1))

          p=Path('activation_api.py'); text=p.read_text()
          import_marker='from fastapi import FastAPI, Header, HTTPException, Request\n\n'
          if import_marker not in text: raise SystemExit('ACTIVATION_IMPORT_MARKER_MISSING')
          text=text.replace(import_marker, import_marker+'from auth import verify_owner_token\n',1)

          old='''@app.get("/activation/health")
          async def activation_health():
              schema_evidence = await production_schema_evidence()
              crm_seeds: dict[str, dict] = {}
              # Seeding is safe only when Supabase is configured. Individual seed modules may
              # still use SQL-specific paths; failures are evidence, never fabricated success.
              if persistent_backend_status().get("supabase_configured"):
                  for name, expected, runner in (
                      ("energy_core", len(ENERGY_CRM_LEADS), ensure_energy_crm_seed),
                      ("global_energy", len(GLOBAL_ENERGY_CRM_LEADS), ensure_global_energy_crm_seed),
                      ("worldwide_trade", len(WORLDWIDE_TRADE_COUNTERPARTIES), ensure_worldwide_trade_counterparty_seed),
                      ("midmarket_oil_dependent", len(MIDMARKET_OIL_DEPENDENT_LEADS), ensure_midmarket_oil_dependent_seed),
                      ("cuba_mipyme_expansion", len(CUBA_MIPYME_EXPANSION_LEADS), ensure_cuba_mipyme_expansion_seed),
                  ):
                      try:
                          crm_seeds[name] = await runner()
                      except Exception as exc:
                          crm_seeds[name] = _seed_failure(expected, exc)

              connector_health = await trade_connectors.health()'''
          new='''def _crm_seed_jobs():
              return (
                  ("energy_core", len(ENERGY_CRM_LEADS), ensure_energy_crm_seed),
                  ("global_energy", len(GLOBAL_ENERGY_CRM_LEADS), ensure_global_energy_crm_seed),
                  ("worldwide_trade", len(WORLDWIDE_TRADE_COUNTERPARTIES), ensure_worldwide_trade_counterparty_seed),
                  ("midmarket_oil_dependent", len(MIDMARKET_OIL_DEPENDENT_LEADS), ensure_midmarket_oil_dependent_seed),
                  ("cuba_mipyme_expansion", len(CUBA_MIPYME_EXPANSION_LEADS), ensure_cuba_mipyme_expansion_seed),
              )


          async def _run_crm_seed_sync() -> dict[str, dict]:
              results: dict[str, dict] = {}
              for name, expected, runner in _crm_seed_jobs():
                  try:
                      results[name] = await runner()
                  except Exception as exc:
                      results[name] = _seed_failure(expected, exc)
              return results


          @app.post("/activation/crm-seeds/sync")
          async def sync_crm_seeds(authorization: str | None = Header(None, alias="Authorization")):
              if not authorization or not authorization.startswith("Bearer "):
                  raise HTTPException(401, "Missing Authorization")
              if not verify_owner_token(authorization.removeprefix("Bearer ").strip()):
                  raise HTTPException(403, "Invalid owner credential")
              if not persistent_backend_status().get("supabase_configured"):
                  raise HTTPException(503, "Supabase persistence is not configured")
              books = await _run_crm_seed_sync()
              return {
                  "status": "ok" if not any(int(v.get("failed") or 0) for v in books.values()) else "partial",
                  "service": "crm-seed-sync",
                  "books": books,
                  "expected": sum(int(v.get("expected") or 0) for v in books.values()),
                  "inserted_this_run": sum(int(v.get("inserted") or 0) for v in books.values()),
                  "already_present": sum(int(v.get("already_present") or 0) for v in books.values()),
                  "failed": sum(int(v.get("failed") or 0) for v in books.values()),
                  "owner_authorized": True,
                  "automatic_outreach_authority": False,
              }


          @app.get("/activation/health")
          async def activation_health():
              schema_evidence = await production_schema_evidence()
              crm_seeds = {name: {"status": "not_run_by_health", "expected": expected} for name, expected, _runner in _crm_seed_jobs()}
              connector_health = await trade_connectors.health()'''
          if old not in text: raise SystemExit('ACTIVATION_HEALTH_BLOCK_NOT_FOUND')
          text=text.replace(old,new,1)
          old_counts='''    seed_expected = sum(int(v.get("expected") or 0) for v in crm_seeds.values())
              seed_inserted = sum(int(v.get("inserted") or 0) for v in crm_seeds.values())
              seed_present = sum(int(v.get("already_present") or 0) for v in crm_seeds.values())
              seed_failed = sum(int(v.get("failed") or 0) for v in crm_seeds.values())'''
          new_counts='''    seed_expected = sum(int(v.get("expected") or 0) for v in crm_seeds.values())
              seed_inserted = 0
              seed_present = None
              seed_failed = 0'''
          if old_counts not in text: raise SystemExit('ACTIVATION_COUNTS_BLOCK_NOT_FOUND')
          text=text.replace(old_counts,new_counts,1)
          old_return='''"crm_seeds": {"books": crm_seeds, "expected": seed_expected, "inserted_this_run": seed_inserted, "already_present": seed_present, "failed": seed_failed, "buyer_seller_worldwide": True, "automatic_deal_promotion": False},'''
          new_return='''"crm_seeds": {"books": crm_seeds, "expected": seed_expected, "inserted_this_run": seed_inserted, "already_present": seed_present, "failed": seed_failed, "sync_on_health": False, "sync_endpoint": "/activation/crm-seeds/sync", "buyer_seller_worldwide": True, "automatic_deal_promotion": False},'''
          if old_return not in text: raise SystemExit('ACTIVATION_RETURN_BLOCK_NOT_FOUND')
          p.write_text(text.replace(old_return,new_return,1))

          docs=Path('public/cuba-order-documents.html'); d=docs.read_text()
          old_card='<article class="card"><h2>Formulario PDF</h2><p>Descargue el formulario oficial si prefiere completarlo fuera de la aplicación y remitirlo a ventas@sahjony.com.</p><a class="btn" href="/documents/SAHJONY-Cuba-Import-Order-Form.pdf">Abrir PDF</a></article>'
          new_card='<article class="card"><h2>Formulario imprimible</h2><p>Complete el formulario oficial en el navegador, imprímalo o guárdelo como PDF y remítalo a ventas@sahjony.com.</p><a class="btn" href="/cuba-import-order-form.html">Abrir formulario</a></article>'
          if old_card not in d: raise SystemExit('BROKEN_PDF_CARD_NOT_FOUND')
          docs.write_text(d.replace(old_card,new_card,1))

          form='''<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111d"><title>Formulario de Importación a Cuba | SAHJONY LLC</title><meta name="description" content="Formulario imprimible de solicitud de importación a Cuba de SAHJONY LLC."><link rel="canonical" href="https://www.sahjony.com/cuba-import-order-form.html"><style>:root{--bg:#07111d;--panel:#0d1d2c;--line:#2b3f52;--text:#eef6ff;--muted:#9fb1c2;--cyan:#5ad8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:940px;margin:auto;padding:24px}.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.nav a{color:var(--text);text-decoration:none}.hero{padding:40px 0 18px}.ey{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:.16em}.hero h1{font-size:clamp(38px,6vw,64px);line-height:.95;letter-spacing:-.045em;margin:12px 0}.hero p{color:var(--muted);line-height:1.6}.card{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.wide{grid-column:1/-1}label{font-size:10px;color:#b9c9d5;font-weight:800;letter-spacing:.04em}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;background:#071521;color:var(--text);padding:11px;font:inherit}textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:#12283a;color:var(--text);font-weight:800;cursor:pointer;text-decoration:none}.btn.primary{background:#eef6ff;color:#07111d}.notice{margin-top:16px;color:var(--muted);font-size:11px;line-height:1.6}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}@media print{body{background:#fff;color:#111}.wrap{max-width:none;padding:0}.nav,.actions,.notice{display:none}.hero{padding:0 0 16px}.hero p{color:#333}.card{background:#fff;border:1px solid #999;padding:14px}.grid{gap:9px}label{color:#222}input,textarea,select{background:#fff;color:#111;border:1px solid #999;padding:8px}}</style></head><body><main class="wrap"><nav class="nav"><a href="/cuba-order-documents.html">← Documentos Cuba</a><a href="/cuba-order.html">Orden digital</a></nav><section class="hero"><div class="ey">SAHJONY LLC · SOLICITUD DE IMPORTACIÓN A CUBA</div><h1>Formulario imprimible</h1><p>Complete los datos disponibles. Este documento inicia una solicitud de cotización; no constituye venta, factura, reserva ni instrucción de pago.</p></section><section class="card"><form class="grid"><div class="field"><label>Empresa / nombre legal</label><input autocomplete="organization"></div><div class="field"><label>Representante autorizado</label><input autocomplete="name"></div><div class="field"><label>Email comercial</label><input type="email" autocomplete="email"></div><div class="field"><label>Teléfono / WhatsApp</label><input autocomplete="tel"></div><div class="field"><label>Provincia / ciudad de destino</label><input></div><div class="field"><label>Fecha objetivo</label><input type="date"></div><div class="field wide"><label>Producto requerido</label><input></div><div class="field"><label>Cantidad</label><input></div><div class="field"><label>Unidad / contenedores</label><input></div><div class="field wide"><label>Especificaciones, marca, presentación, empaque o uso final</label><textarea></textarea></div><div class="field wide"><label>Preferencia o requisitos de pago / logística</label><textarea></textarea></div><div class="field wide"><label>Notas adicionales</label><textarea></textarea></div></form><div class="actions"><button class="btn primary" type="button" onclick="window.print()">Imprimir / Guardar como PDF</button><a class="btn" href="mailto:ventas@sahjony.com?subject=Solicitud%20de%20importaci%C3%B3n%20a%20Cuba">Enviar por email</a><a class="btn" href="/cuba-order.html">Usar orden digital</a></div><div class="notice">No incluya contraseñas, credenciales bancarias ni datos completos de tarjetas. Toda operación queda sujeta a disponibilidad, KYB/KYC, cumplimiento regulatorio, aprobación comercial, bancaria, documental y logística.</div></section></main><script src="/global-language.js" defer></script></body></html>'''
          fp=Path('public/cuba-import-order-form.html')
          if fp.exists(): raise SystemExit('PRINTABLE_FORM_ALREADY_EXISTS')
          fp.write_text(form)
          PY

      - name: Validate complete application after fixes
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx tsc -p tsconfig.json
          npm run build
          npm audit --omit=dev --audit-level=high
          python -m pip install -r requirements-dev.txt
          python -m pip check
          python -m compileall -q .
          python -m pytest -q
          python - <<'PY'
          from pathlib import Path
          a=Path('activation_api.py').read_text()
          assert '@app.post("/activation/crm-seeds/sync")' in a
          health=a.split('@app.get("/activation/health")',1)[1]
          assert 'await runner()' not in health
          assert 'sync_on_health' in health
          d=Path('public/cuba-order-documents.html').read_text()
          assert '/documents/SAHJONY-Cuba-Import-Order-Form.pdf' not in d
          assert '/cuba-import-order-form.html' in d
          assert Path('public/cuba-import-order-form.html').is_file()
          print('NAVIGATION_AND_HEALTH_FIXES=PASS')
          PY

      - name: Commit only after all validation passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SAHJONY CAPITAL LLC.'
          git config user.email 'sahjonyllc@outlook.com'
          git add activation_api.py public/cuba-order-documents.html public/cuba-import-order-form.html
          git diff --cached --check
          git commit -m 'fix: make activation health read-only and repair Cuba order form navigation'
          git push origin HEAD:audit/swiss-watch-20260901
