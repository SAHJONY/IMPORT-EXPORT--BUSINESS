name: Hostinger OpenClaw Provider Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-openclaw-provider-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

env:
  HOSTINGER_VM_ID: '767852'
  HOSTINGER_HOST: '69.62.68.67'
  HOSTINGER_USER: root
  HOSTINGER_API_BASE: https://developers.hostinger.com

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets and OpenAI
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HOSTINGER_API_TOKEN:-}" ]]
          [[ -n "${OPENAI_API_KEY:-}" ]]
          echo "::add-mask::$OPENAI_API_KEY"
          code="$(curl -sS -o /tmp/openai.json -w '%{http_code}' -H "Authorization: Bearer $OPENAI_API_KEY" https://api.openai.com/v1/models || true)"
          echo "OPENAI_HTTP=$code"
          [[ "$code" == 200 ]]

      - name: Prepare and attach ephemeral Hostinger management key
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq netcat-openbsd >/dev/null
          install -d -m 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/provider-repair -C "provider-repair-${GITHUB_RUN_ID}"
          echo "SSH_KEY_PATH=$HOME/.ssh/provider-repair" >> "$GITHUB_ENV"
          pub="$(cat ~/.ssh/provider-repair.pub)"
          name="sahjony-provider-repair-${GITHUB_RUN_ID}"
          create="$(curl -fsS -X POST -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' -H 'Content-Type: application/json' --data "$(jq -n --arg name "$name" --arg key "$pub" '{name:$name,key:$key}')" "$HOSTINGER_API_BASE/api/vps/v1/public-keys")"
          key_id="$(jq -r '.id // empty' <<<"$create")"
          [[ "$key_id" =~ ^[0-9]+$ ]]
          echo "HOSTINGER_EPHEMERAL_KEY_ID=$key_id" >> "$GITHUB_ENV"

          attach="$(curl -fsS -X POST -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' -H 'Content-Type: application/json' --data "$(jq -n --argjson id "$key_id" '{ids:[$id]}')" "$HOSTINGER_API_BASE/api/vps/v1/public-keys/attach/$HOSTINGER_VM_ID")"
          action_id="$(jq -r '.id // empty' <<<"$attach")"
          [[ "$action_id" =~ ^[0-9]+$ ]]

          attach_ok=false
          for i in $(seq 1 60); do
            body="$(curl -fsS -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$HOSTINGER_VM_ID/actions/$action_id")"
            state="$(jq -r '.state // empty' <<<"$body")"
            echo "SSH_KEY_ATTACH probe=$i state=${state:-unknown}"
            case "$state" in
              success) attach_ok=true; break ;;
              failed|failure|error|cancelled|canceled) exit 21 ;;
            esac
            sleep 5
          done
          [[ "$attach_ok" == true ]] || { echo 'SSH_KEY_ATTACH_TIMEOUT=1' >&2; exit 22; }

          attached="$(curl -fsS -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$HOSTINGER_VM_ID/public-keys")"
          jq -e --argjson id "$key_id" '.data[]? | select(.id == $id)' >/dev/null <<<"$attached"
          echo "HOSTINGER_KEY_ATTACHED=1" >> "$GITHUB_ENV"
          echo HOSTINGER_KEY_ATTACH=READY

      - name: Verify normal SSH from attached key
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for i in $(seq 1 36); do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i "$SSH_KEY_PATH" "$HOSTINGER_USER@$HOSTINGER_HOST" 'printf SAHJONY_NORMAL_SSH_OK' 2>/dev/null | grep -q SAHJONY_NORMAL_SSH_OK; then
              ok=true
              break
            fi
            sleep 5
          done
          [[ "$ok" == true ]]
          echo "HOSTINGER_NORMAL_SSH_READY=1" >> "$GITHUB_ENV"
          echo HOSTINGER_NORMAL_SSH=READY

      - name: Install OpenAI, disable Anthropic, and prove runtime inference
        shell: bash
        run: |
          set -euo pipefail
          OPENAI_B64="$(printf '%s' "$OPENAI_API_KEY" | base64 -w0)"
          echo "::add-mask::$OPENAI_B64"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i "$SSH_KEY_PATH" "$HOSTINGER_USER@$HOSTINGER_HOST" "OPENAI_B64='$OPENAI_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/sahjony-openclaw
          test -f docker-compose.yml
          key="$(printf '%s' "$OPENAI_B64" | base64 -d)"
          [[ -n "$key" ]]

          touch .env
          chmod 600 .env
          cp -a .env ".env.backup.$(date -u +%Y%m%dT%H%M%SZ)"
          tmp="$(mktemp)"
          grep -vE '^(OPENAI_API_KEY|ANTHROPIC_API_KEY)=' .env > "$tmp" || true
          printf 'OPENAI_API_KEY=%s\n' "$key" >> "$tmp"
          install -m 600 "$tmp" .env
          rm -f "$tmp"
          ! grep -q '^ANTHROPIC_API_KEY=' .env

          docker compose up -d --force-recreate openclaw-gateway
          cid="$(docker compose ps -q openclaw-gateway)"
          [[ -n "$cid" ]]
          docker update --restart unless-stopped "$cid" >/dev/null
          test "$(docker inspect "$cid" --format '{{.State.Running}}')" = true
          env_lines="$(docker inspect "$cid" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          env_names="$(printf '%s\n' "$env_lines" | cut -d= -f1)"
          grep -qx OPENAI_API_KEY <<<"$env_names"
          ! grep -qx ANTHROPIC_API_KEY <<<"$env_names"

          runtime_key="$(printf '%s\n' "$env_lines" | sed -n 's/^OPENAI_API_KEY=//p' | head -n1)"
          [[ -n "$runtime_key" ]]
          code="$(curl -sS -o /tmp/openai-runtime.json -w '%{http_code}' \
            -H "Authorization: Bearer $runtime_key" \
            -H 'Content-Type: application/json' \
            --data '{"model":"gpt-4.1-mini","input":"Reply with exactly SAHJONY_RUNTIME_OK","max_output_tokens":16}' \
            https://api.openai.com/v1/responses || true)"
          unset runtime_key key OPENAI_B64 env_lines
          echo "OPENAI_RUNTIME_INFERENCE_HTTP=$code"
          [[ "$code" == 200 ]]
          grep -q 'SAHJONY_RUNTIME_OK' /tmp/openai-runtime.json
          rm -f /tmp/openai-runtime.json
          echo OPENCLAW_PROVIDER_RUNTIME=READY
          REMOTE

      - name: Verify WhatsApp readiness
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for i in $(seq 1 24); do
            body="$(curl -fsS --max-time 20 https://www.sahjony.com/whatsapp/health || true)"
            printf '%s\n' "$body" | jq '{status,provider,send_ready,gateway_connected,heartbeat_fresh,recovery_issues,backlog_recovery}' 2>/dev/null || true
            if jq -e '(.provider == "hostinger_openclaw") and ((.gateway_connected // false) == true) and ((.heartbeat_fresh // false) == true) and ((.send_ready // false) == true)' >/dev/null 2>&1 <<<"$body"; then
              ok=true
              break
            fi
            sleep 5
          done
          [[ "$ok" == true ]]
          echo WHATSAPP_TRANSACTION_READY=1

      - name: Remove and verify ephemeral key cleanup
        if: always()
        shell: bash
        run: |
          set +e
          cleanup_failed=false

          if [[ "${HOSTINGER_KEY_ATTACHED:-0}" == 1 && -f ~/.ssh/provider-repair.pub ]]; then
            pub_algo="$(awk '{print $1}' ~/.ssh/provider-repair.pub)"
            pub_body="$(awk '{print $2}' ~/.ssh/provider-repair.pub)"
            algo_b64="$(printf '%s' "$pub_algo" | base64 -w0)"
            body_b64="$(printf '%s' "$pub_body" | base64 -w0)"

            if [[ "${HOSTINGER_NORMAL_SSH_READY:-0}" == 1 ]]; then
              ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/provider-repair "$HOSTINGER_USER@$HOSTINGER_HOST" "ALGO_B64='$algo_b64' BODY_B64='$body_b64' bash -s" <<'REMOTE'
              set -euo pipefail
              algo="$(printf '%s' "$ALGO_B64" | base64 -d)"
              body="$(printf '%s' "$BODY_B64" | base64 -d)"
              f=/root/.ssh/authorized_keys
              if [[ -f "$f" ]]; then
                awk -v a="$algo" -v b="$body" '
                  {
                    drop=0
                    for (i=1; i<NF; i++) if ($i==a && $(i+1)==b) { drop=1; break }
                    if (!drop) print
                  }
                ' "$f" > "$f.tmp"
                install -m 600 "$f.tmp" "$f"
                rm -f "$f.tmp"
                if awk -v a="$algo" -v b="$body" '{for(i=1;i<NF;i++) if($i==a && $(i+1)==b) found=1} END{exit found?0:1}' "$f"; then
                  echo EPHEMERAL_KEY_STILL_PRESENT=1 >&2
                  exit 31
                fi
              fi
              echo EPHEMERAL_KEY_REMOVED_FROM_VPS=1
REMOTE
              if [[ $? -ne 0 ]]; then cleanup_failed=true; fi
            else
              echo 'SECURITY_CLEANUP_UNVERIFIED: key was attached but normal SSH was never established' >&2
              cleanup_failed=true
            fi
          fi

          if [[ -n "${HOSTINGER_EPHEMERAL_KEY_ID:-}" ]]; then
            curl -sS -X DELETE -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/public-keys/$HOSTINGER_EPHEMERAL_KEY_ID" >/dev/null || cleanup_failed=true
          fi

          rm -f ~/.ssh/provider-repair ~/.ssh/provider-repair.pub
          [[ "$cleanup_failed" == false ]] || { echo SECURITY_CLEANUP_GATE=FAILED >&2; exit 32; }
          echo SECURITY_CLEANUP_GATE=PASS
