name: Hostinger OpenClaw Provider Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-openclaw-provider-repair.yml'
      - 'openclaw/hostinger-24x7/hostinger-provider-repair.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

env:
  HOSTINGER_VM_ID: '767852'
  HOSTINGER_HOST: '69.62.68.67'
  HOSTINGER_USER: root
  HOSTINGER_API_BASE: https://developers.hostinger.com

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq netcat-openbsd >/dev/null

      - name: Validate controller syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n openclaw/hostinger-24x7/hostinger-provider-repair.sh

      - name: Repair Hostinger OpenClaw provider path
        shell: bash
        run: |
          set -euo pipefail
          chmod +x openclaw/hostinger-24x7/hostinger-provider-repair.sh
          openclaw/hostinger-24x7/hostinger-provider-repair.sh
