name: VPS Fallback Host Setup

# One-time (idempotent) installer for the SAHJONY VPS fallback host.
# Installs hot-standby copies of BOTH business apps on 69.62.68.67:
#   sahjony.com     -> nginx static + FastAPI (uvicorn :8101/:8102)
#   mycubacash.com  -> nginx -> Next.js (:8103)
# Never touches the live Hermes WhatsApp gateway. Safe to re-run.
#
# Dispatch with confirm=YES. Public traffic only arrives after the DNS
# failover described in ops/vps-fallback/FAILOVER.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to install the fallback host on the VPS"
        required: true
        default: "NO"

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

env:
  VM_ID: '767852'
  HOST: '69.62.68.67'
  SSH_USER: root
  KIT_BRANCH: main

jobs:
  setup:
    if: ${{ inputs.confirm == 'YES' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Run fallback setup on VPS
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" ]] || { echo "HOSTINGER_SSH_PRIVATE_KEY secret missing" >&2; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/fallback-key
          chmod 600 ~/.ssh/fallback-key
          SSH="ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -i ~/.ssh/fallback-key $SSH_USER@$HOST"
          # NOTE: the VPS login shell is zsh — the URL is single-quoted so the
          # ?cachebust query string is not glob-expanded.
          $SSH "curl -sSL 'https://raw.githubusercontent.com/SAHJONY/IMPORT-EXPORT--BUSINESS/${KIT_BRANCH}/ops/vps-fallback/setup.sh?run=${GITHUB_RUN_ID}' | bash"
          echo "SETUP_SSH_EXIT=$?"
          # Independent verification: the setup must have actually run.
          $SSH "set -e
            systemctl is-active sahjony-fallback-unified
            systemctl is-active sahjony-fallback-whatsapp
            nginx -t
            test -f /opt/sahjony-fallback/health.json
            crontab -l | grep -q 'sahjony-fallback/sync.sh'
            echo FALLBACK_VERIFIED"
