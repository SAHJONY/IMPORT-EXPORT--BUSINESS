name: Hostinger Set Houston Timezone

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  set_timezone:
    if: contains(github.event.head_commit.message, 'set Hostinger timezone to Houston') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HOST: 69.62.68.67
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Set America Chicago timezone
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-key
          chmod 600 ~/.ssh/hostinger-key
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/hostinger-key "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          timedatectl set-timezone America/Chicago
          echo '=== TIMEDATECTL ==='
          timedatectl status
          echo '=== LOCAL DATE ==='
          date
          echo '=== TZ LINK ==='
          readlink -f /etc/localtime
          REMOTE
          rm -f ~/.ssh/hostinger-key
