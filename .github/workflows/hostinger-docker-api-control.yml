name: Hostinger Docker API Control Gate [RETIRED]

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo HOSTINGER_DOCKER_MANAGER_CONTROL_RETIRED=1
          echo HOSTINGER_KALI_DOCKER_MANAGER_UNSUPPORTED=1
          echo USE_NORMAL_SSH_AND_LOCAL_DOCKER=1
          echo USE_HOSTINGER_RECOVERY_CONTROLLER=1
