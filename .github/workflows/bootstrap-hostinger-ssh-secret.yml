name: Bootstrap Hostinger SSH Secret [RETIRED]

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain retirement
        run: |
          echo HOSTINGER_SSH_SECRET_BOOTSTRAP_RETIRED=1
          echo REASON=GitHub_Actions_token_cannot_create_repository_secrets_and_multiline_key_material_must_not_be_emitted_to_logs
          echo USE_EPHEMERAL_RECOVERY_MANAGEMENT_IDENTITY=1
