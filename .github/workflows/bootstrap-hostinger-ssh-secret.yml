name: Bootstrap Hostinger SSH Secret

on:
  push:
    branches: [main]
    paths:
      - '.github/ops/bootstrap-hostinger-ssh-secret-trigger.txt'

permissions:
  actions: write
  contents: read

concurrency:
  group: bootstrap-hostinger-ssh-secret
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Generate dedicated durable SSH keypair
        id: key
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/hostinger-key"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/hostinger-key/id_ed25519" -C "sahjony-hostinger-actions-${GITHUB_RUN_ID}"
          private="$(cat "$RUNNER_TEMP/hostinger-key/id_ed25519")"
          echo "::add-mask::$private"
          printf '%s' "$private" > "$RUNNER_TEMP/hostinger-key/private"
          chmod 600 "$RUNNER_TEMP/hostinger-key/private"
          echo HOSTINGER_DEDICATED_KEYPAIR_GENERATED=1

      - name: Store private key as HOSTINGER_SSH_PRIVATE_KEY
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          private="$(cat "$RUNNER_TEMP/hostinger-key/private")"
          printf '%s' "$private" | gh secret set HOSTINGER_SSH_PRIVATE_KEY --repo "$GITHUB_REPOSITORY"
          unset private
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/secrets/HOSTINGER_SSH_PRIVATE_KEY")"
          printf '%s\n' "$meta" | jq '{name,created_at,updated_at}'
          echo HOSTINGER_SSH_PRIVATE_KEY_STORED=1

      - name: Dispatch canonical V7 so it seeds the public key on Hostinger
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run hostinger-whatsapp-recovery-v7.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo HOSTINGER_V7_DISPATCHED_FOR_DURABLE_KEY_SEED=1

      - name: Cleanup runner key material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/hostinger-key"
