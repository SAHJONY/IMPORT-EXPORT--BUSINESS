name: Hostinger Persistent SSH Auth Test One-Time

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-persistent-ssh-auth-test-one-time.yml'

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-observe
  cancel-in-progress: false

env:
  HOST: '69.62.68.67'
  SSH_USER: root
  RETEST_REASON: 'user-updated-private-key-2026-09-01'

jobs:
  test_auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prepare persistent SSH credential
        id: key
        env:
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HOSTINGER_SSH_PRIVATE_KEY" ]]; then
            echo HOSTINGER_PERSISTENT_SSH_SECRET=MISSING
            echo 'present=false' >> "$GITHUB_OUTPUT"
            exit 20
          fi
          install -d -m 700 ~/.ssh
          python3 - <<'PY'
          import base64, os, pathlib
          raw = os.environ['HOSTINGER_SSH_PRIVATE_KEY']
          raw = raw.replace('\r\n', '\n').replace('\r', '\n').strip()
          if '\\n' in raw and raw.count('\n') < 2:
              raw = raw.replace('\\n', '\n').strip()

          def classify(value: str) -> str:
              first = value.splitlines()[0].strip() if value.splitlines() else ''
              if first == '-----BEGIN OPENSSH PRIVATE KEY-----': return 'OPENSSH_PRIVATE_KEY'
              if first.startswith('-----BEGIN ') and first.endswith(' PRIVATE KEY-----'): return 'PEM_PRIVATE_KEY'
              if first.startswith('PuTTY-User-Key-File-'): return 'PUTTY_PPK'
              if first.startswith(('ssh-ed25519 ', 'ssh-rsa ', 'ecdsa-sha2-')): return 'PUBLIC_KEY_NOT_PRIVATE'
              return 'UNKNOWN'

          kind = classify(raw)
          if kind == 'UNKNOWN':
              try:
                  compact = ''.join(raw.split())
                  decoded = base64.b64decode(compact, validate=True).decode('utf-8')
                  decoded = decoded.replace('\r\n', '\n').replace('\r', '\n').strip()
                  decoded_kind = classify(decoded)
                  if decoded_kind in {'OPENSSH_PRIVATE_KEY', 'PEM_PRIVATE_KEY'}:
                      raw, kind = decoded, 'BASE64_' + decoded_kind
              except Exception:
                  pass

          print('HOSTINGER_SSH_SECRET_FORMAT=' + kind)
          print('HOSTINGER_SSH_SECRET_LINE_COUNT=' + str(len(raw.splitlines())))
          if kind == 'PUBLIC_KEY_NOT_PRIVATE':
              raise SystemExit(21)
          if kind == 'PUTTY_PPK':
              raise SystemExit(22)
          if kind == 'UNKNOWN':
              raise SystemExit(23)
          pathlib.Path.home().joinpath('.ssh/hostinger-persistent').write_text(raw + '\n')
          PY
          chmod 600 ~/.ssh/hostinger-persistent
          ssh-keygen -y -f ~/.ssh/hostinger-persistent >/dev/null
          echo HOSTINGER_PERSISTENT_SSH_SECRET=PRESENT_VALID_PRIVATE_KEY
          echo 'present=true' >> "$GITHUB_OUTPUT"

      - name: Authenticate normal Kali read-only
        id: auth
        if: steps.key.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 -o ConnectionAttempts=2 -i ~/.ssh/hostinger-persistent \
            "$SSH_USER@$HOST" 'printf SAHJONY_PERSISTENT_SSH_AUTH=READY'
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inspect runtime read-only after authentication
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 -i ~/.ssh/hostinger-persistent "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo SAHJONY_NORMAL_KALI_SSH=READY
          printf 'HOSTNAME='; hostname
          printf 'KERNEL='; uname -sr
          if systemctl is-active --quiet docker.service 2>/dev/null; then
            echo DOCKER_ACTIVE=true
          else
            echo DOCKER_ACTIVE=false
          fi
          if command -v docker >/dev/null 2>&1; then
            echo 'OPENCLAW_CONTAINER_CANDIDATES_BEGIN'
            docker ps -a --format '{{.Names}}|{{.Image}}|{{.Status}}' 2>/dev/null | grep -Ei 'openclaw|open[-_ ]?claw|claw' || true
            echo 'OPENCLAW_CONTAINER_CANDIDATES_END'
          fi
          if systemctl is-active --quiet sahjony-whatsapp-guardian.timer 2>/dev/null; then
            echo GUARDIAN_TIMER_ACTIVE=true
          else
            echo GUARDIAN_TIMER_ACTIVE=false
          fi
          if [[ -s /var/lib/sahjony-whatsapp-guardian/last-good ]]; then
            echo GUARDIAN_LAST_GOOD_PRESENT=true
            stat -c 'GUARDIAN_LAST_GOOD_MTIME=%Y' /var/lib/sahjony-whatsapp-guardian/last-good 2>/dev/null || true
          else
            echo GUARDIAN_LAST_GOOD_PRESENT=false
          fi
          REMOTE
