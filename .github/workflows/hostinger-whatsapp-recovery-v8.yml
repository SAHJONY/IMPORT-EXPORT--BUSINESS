name: Hostinger WhatsApp Recovery V8

on:
  push:
    paths:
      - '.github/workflows/hostinger-whatsapp-recovery-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

env:
  HOSTINGER_API_BASE: https://developers.hostinger.com
  VM_ID: '767852'
  HOST: '69.62.68.67'
  USER: root
  APP_URL: https://www.sahjony.com

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare one-run recovery identity
        id: creds
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$API_TOKEN" ]] || { echo HOSTINGER_API_TOKEN_MISSING=1 >&2; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass netcat-openbsd jq >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/hostinger-recovery-v8 -C "sahjony-v8-${GITHUB_RUN_ID}"
          RECOVERY_PASSWORD="$(openssl rand -hex 18)Aa1!"
          echo "::add-mask::$RECOVERY_PASSWORD"
          echo "recovery_password=$RECOVERY_PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Confirm stable Hostinger control plane
        shell: bash
        run: |
          set -euo pipefail
          vm="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID")"
          echo "$vm" | jq -c '{id,state,hostname,ipv4}' || true
          actions="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/actions?page=1")"
          jq -c '[.data[]? | {id,name,state,created_at,updated_at}] | .[0:10]' <<<"$actions"
          busy="$(jq '[.data[]? | select(.state=="sent" or .state=="started" or .state=="pending" or .state=="running" or .state=="queued")] | length' <<<"$actions")"
          [ "$busy" = 0 ] || { echo HOSTINGER_CONTROL_PLANE_BUSY=$busy >&2; exit 3; }
          echo HOSTINGER_CONTROL_PLANE_STABLE=1

      - name: Enter one owned Recovery session
        id: recovery_start
        env:
          RECOVERY_PASSWORD: ${{ steps.creds.outputs.recovery_password }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg p "$RECOVERY_PASSWORD" '{root_password:$p}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST -H "Authorization: Bearer $API_TOKEN" -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$payload" "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/recovery")"
          body="$(cat "$tmp")"; rm -f "$tmp"
          [[ "$code" == 200 || "$code" == 201 || "$code" == 202 ]] || { echo HOSTINGER_V8_RECOVERY_HTTP=$code >&2; printf '%s\n' "$body" >&2; exit 4; }
          id="$(jq -r '.id // empty' <<<"$body")"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo HOSTINGER_V8_RECOVERY_ACTION_MISSING=1 >&2; exit 5; }
          echo "action_id=$id" >> "$GITHUB_OUTPUT"
          echo "owned=true" >> "$GITHUB_OUTPUT"
          echo HOSTINGER_V8_RECOVERY_ACTION=$id

      - name: Wait for Recovery start success
        env:
          ACTION_ID: ${{ steps.recovery_start.outputs.action_id }}
        shell: bash
        run: |
          set -euo pipefail
          success=false
          for i in $(seq 1 120); do
            a="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/actions/$ACTION_ID")"
            state="$(jq -r '.state // empty' <<<"$a")"
            echo "v8_recovery_start_probe=$i/120 state=${state:-unknown}"
            case "$state" in success) success=true; break;; failed|failure|error|cancelled|canceled) jq -c . <<<"$a" >&2; exit 6;; esac
            sleep 5
          done
          [[ "$success" == true ]] || { echo HOSTINGER_V8_RECOVERY_START_TIMEOUT=1 >&2; exit 7; }

      - name: Authenticate Recovery SSH
        env:
          RECOVERY_PASSWORD: ${{ steps.creds.outputs.recovery_password }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$RECOVERY_PASSWORD"
          ready=false
          for i in $(seq 1 60); do
            : >/tmp/v8-recovery-ssh.err
            if sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 "$USER@$HOST" 'printf V8_RECOVERY_OK' 2>/tmp/v8-recovery-ssh.err | grep -q V8_RECOVERY_OK; then ready=true; break; fi
            if (( i == 1 || i % 10 == 0 || i == 60 )); then sed -n '1,12p' /tmp/v8-recovery-ssh.err || true; fi
            sleep 10
          done
          [[ "$ready" == true ]] || { echo HOSTINGER_V8_RECOVERY_SSH_FAILED=1 >&2; exit 8; }
          echo HOSTINGER_V8_RECOVERY_SSH_READY=1

      - name: Offline harden Kali SSH boot path
        id: repair
        env:
          RECOVERY_PASSWORD: ${{ steps.creds.outputs.recovery_password }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$RECOVERY_PASSWORD"
          PUB_B64="$(base64 -w0 ~/.ssh/hostinger-recovery-v8.pub)"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -o PreferredAuthentications=password -o PubkeyAuthentication=no "$USER@$HOST" "PUB_B64='$PUB_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          root=''
          for mp in /mnt /mnt/sdb1; do
            if [ -f "$mp/etc/os-release" ] && [ -d "$mp/root" ] && [ -x "$mp/usr/sbin/sshd" ]; then root="$mp"; break; fi
          done
          if [ -z "$root" ]; then
            mkdir -p /mnt/sahjony-v8
            n=0
            while read -r dev fs mp type; do
              case "$type:$fs" in part:ext2|part:ext3|part:ext4|part:xfs|part:btrfs|lvm:ext2|lvm:ext3|lvm:ext4|lvm:xfs|lvm:btrfs) ;; *) continue ;; esac
              [ -n "${mp:-}" ] && continue
              n=$((n+1)); t="/mnt/sahjony-v8/$n"; mkdir -p "$t"
              if [ "$fs" = xfs ]; then mount -o nouuid "$dev" "$t" 2>/dev/null || true; else mount "$dev" "$t" 2>/dev/null || true; fi
            done < <(lsblk -prno NAME,FSTYPE,MOUNTPOINT,TYPE 2>/dev/null)
            while read -r mp; do
              [ "$mp" = / ] && continue
              if [ -f "$mp/etc/os-release" ] && [ -d "$mp/root" ] && [ -x "$mp/usr/sbin/sshd" ]; then root="$mp"; break; fi
            done < <(findmnt -rn -o TARGET | sort -u)
          fi
          [ -n "$root" ] || { echo ORIGINAL_KALI_ROOT_NOT_FOUND=1 >&2; exit 20; }
          echo "ORIGINAL_KALI_ROOT=$root"
          echo '=== offline boot diagnostics ==='
          cat "$root/etc/os-release" | sed -n '1,12p' || true
          ls -l "$root/etc/systemd/system/default.target" "$root/etc/systemd/system/ssh.service" "$root/etc/systemd/system/sshd.service" "$root/etc/systemd/system/ssh.socket" 2>/dev/null || true
          sed -n '1,160p' "$root/etc/fstab" 2>/dev/null || true
          if [ -d "$root/var/log/journal" ]; then
            journalctl --directory="$root/var/log/journal" --no-pager -n 120 2>/dev/null | grep -Ei 'ssh|sshd|network|failed|emergency|dependency|mount' | tail -80 || true
          fi

          # Seed only the one-run key; it will be removed after successful management access.
          install -d -m 700 "$root/root/.ssh"
          touch "$root/root/.ssh/authorized_keys"
          chmod 600 "$root/root/.ssh/authorized_keys"
          pub="$(printf '%s' "$PUB_B64" | base64 -d)"
          grep -qxF "$pub" "$root/root/.ssh/authorized_keys" || printf '%s\n' "$pub" >> "$root/root/.ssh/authorized_keys"

          # Remove known Debian/Kali SSH kill switches, but only when they are explicit SSH masks.
          rm -f "$root/etc/ssh/sshd_not_to_be_run"
          for unit in ssh.service sshd.service ssh.socket; do
            p="$root/etc/systemd/system/$unit"
            if [ -L "$p" ] && [ "$(readlink "$p" 2>/dev/null || true)" = /dev/null ]; then
              echo "REMOVING_SSH_MASK=$unit"
              rm -f "$p"
            fi
          done

          install -d "$root/etc/ssh/sshd_config.d" "$root/run/sshd"
          cat > "$root/etc/ssh/sshd_config.d/99-sahjony-v8.conf" <<'EOF'
          Port 22
          AddressFamily any
          ListenAddress 0.0.0.0
          PubkeyAuthentication yes
          PermitRootLogin prohibit-password
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          EOF
          chmod 600 "$root/etc/ssh/sshd_config.d/99-sahjony-v8.conf"
          chroot "$root" /usr/bin/ssh-keygen -A
          chroot "$root" /usr/sbin/sshd -t
          echo '=== effective sshd listeners ==='
          chroot "$root" /usr/sbin/sshd -T | grep -E '^(port|addressfamily|listenaddress|permitrootlogin|pubkeyauthentication) ' || true

          # Persist a direct independent sshd unit. It does not depend on distro ssh.service state.
          cat > "$root/etc/systemd/system/sahjony-sshd.service" <<'EOF'
          [Unit]
          Description=SAHJONY persistent SSH management daemon
          After=local-fs.target
          Before=multi-user.target

          [Service]
          Type=simple
          RuntimeDirectory=sshd
          RuntimeDirectoryMode=0755
          ExecStartPre=/usr/sbin/sshd -t
          ExecStart=/usr/sbin/sshd -D -e
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target graphical.target rescue.target
          EOF
          for target in multi-user.target graphical.target rescue.target; do
            mkdir -p "$root/etc/systemd/system/$target.wants"
            ln -sfn ../sahjony-sshd.service "$root/etc/systemd/system/$target.wants/sahjony-sshd.service"
          done

          # Preserve a sane normal default target if it is absent/broken or explicitly rescue/emergency.
          default_link="$(readlink "$root/etc/systemd/system/default.target" 2>/dev/null || true)"
          if [ -z "$default_link" ] || grep -Eq '(rescue|emergency)\.target' <<<"$default_link"; then
            ln -sfn /lib/systemd/system/multi-user.target "$root/etc/systemd/system/default.target"
            echo DEFAULT_TARGET_REPAIRED=multi-user.target
          else
            echo "DEFAULT_TARGET_PRESERVED=$default_link"
          fi

          # Persist an allow rule for TCP/22 when UFW is installed; do not disable the firewall.
          if [ -x "$root/usr/sbin/ufw" ]; then
            chroot "$root" /usr/sbin/ufw allow 22/tcp >/dev/null 2>&1 || true
            echo UFW_SSH_ALLOW_RULE_ENSURED=1
          fi

          # First-boot evidence for any later forensic recovery.
          install -d "$root/usr/local/sbin"
          cat > "$root/usr/local/sbin/sahjony-firstboot-diagnostic" <<'EOF'
          #!/usr/bin/env bash
          set +e
          exec >>/var/log/sahjony-firstboot-diagnostic.log 2>&1
          echo "=== $(date -Is) ==="
          systemctl --failed --no-pager
          systemctl status sahjony-sshd.service ssh.service sshd.service --no-pager
          ip addr
          ip route
          ss -lntp
          journalctl -b -u sahjony-sshd.service -u ssh.service -u sshd.service --no-pager -n 150
          EOF
          chmod 700 "$root/usr/local/sbin/sahjony-firstboot-diagnostic"
          cat > "$root/etc/systemd/system/sahjony-firstboot-diagnostic.service" <<'EOF'
          [Unit]
          Description=SAHJONY first boot diagnostic snapshot
          After=sahjony-sshd.service network.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/sahjony-firstboot-diagnostic

          [Install]
          WantedBy=multi-user.target rescue.target
          EOF
          for target in multi-user.target rescue.target; do
            mkdir -p "$root/etc/systemd/system/$target.wants"
            ln -sfn ../sahjony-firstboot-diagnostic.service "$root/etc/systemd/system/$target.wants/sahjony-firstboot-diagnostic.service"
          done
          sync
          echo ORIGINAL_KALI_V8_SSH_BOOT_HARDENED=1
          REMOTE

      - name: Exit owned Recovery
        id: recovery_stop
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS -X DELETE -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/recovery")"
          id="$(jq -r '.id // empty' <<<"$body")"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo HOSTINGER_V8_STOP_ACTION_MISSING=1 >&2; exit 30; }
          echo "action_id=$id" >> "$GITHUB_OUTPUT"
          echo HOSTINGER_V8_STOP_ACTION=$id

      - name: Wait for Recovery stop success
        env:
          ACTION_ID: ${{ steps.recovery_stop.outputs.action_id }}
        shell: bash
        run: |
          set -euo pipefail
          success=false
          for i in $(seq 1 120); do
            a="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/actions/$ACTION_ID")"
            state="$(jq -r '.state // empty' <<<"$a")"
            echo "v8_recovery_stop_probe=$i/120 state=${state:-unknown}"
            case "$state" in success) success=true; break;; failed|failure|error|cancelled|canceled) exit 31;; esac
            sleep 5
          done
          [[ "$success" == true ]] || { echo HOSTINGER_V8_STOP_TIMEOUT=1 >&2; exit 32; }

      - name: Establish normal SSH with one bounded restart
        id: normal
        shell: bash
        run: |
          set -euo pipefail
          probe_tcp() {
            local n="$1"
            for i in $(seq 1 "$n"); do
              if nc -z -w 4 "$HOST" 22 >/dev/null 2>&1; then echo "TCP22_READY_AT=$i/$n"; return 0; fi
              echo "v8_tcp22_probe=$i/$n"
              sleep 5
            done
            return 1
          }
          if ! probe_tcp 36; then
            echo HOSTINGER_V8_ONE_POST_REPAIR_RESTART=1
            body="$(curl -fsS -X POST -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/restart")"
            rid="$(jq -r '.id // empty' <<<"$body")"
            [[ "$rid" =~ ^[0-9]+$ ]] || exit 40
            success=false
            for j in $(seq 1 120); do
              a="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/actions/$rid")"
              s="$(jq -r '.state // empty' <<<"$a")"
              echo "v8_restart_probe=$j/120 state=${s:-unknown}"
              case "$s" in success) success=true; break;; failed|failure|error|cancelled|canceled) exit 41;; esac
              sleep 5
            done
            [[ "$success" == true ]] || exit 42
            probe_tcp 48 || { echo NORMAL_KALI_TCP22_STILL_CLOSED_AFTER_V8=1 >&2; exit 43; }
          fi
          : >/tmp/v8-normal-ssh.err
          for i in $(seq 1 18); do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/hostinger-recovery-v8 "$USER@$HOST" 'printf NORMAL_V8_OK' 2>/tmp/v8-normal-ssh.err | grep -q NORMAL_V8_OK; then
              echo NORMAL_V8_SSH_READY=1
              echo ready=true >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if (( i == 1 || i % 6 == 0 || i == 18 )); then sed -n '1,20p' /tmp/v8-normal-ssh.err || true; fi
            sleep 5
          done
          echo NORMAL_V8_SSH_AUTH_FAILED=1 >&2
          exit 44

      - name: Stabilize Docker and existing OpenClaw
        id: openclaw
        if: steps.normal.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/hostinger-recovery-v8 "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || { echo DOCKER_NOT_FOUND=1 >&2; exit 50; }
          systemctl enable --now docker >/dev/null 2>&1 || { echo DOCKER_START_FAILED=1 >&2; exit 51; }
          mapfile -t ids < <(docker ps -aq | while read -r id; do
            meta="$(docker inspect "$id" --format '{{.Name}}|{{.Config.Image}}' 2>/dev/null || true)"
            grep -Eqi 'openclaw|claw' <<<"$meta" && echo "$id" || true
          done)
          ((${#ids[@]})) || { docker ps -a --format '{{.ID}}|{{.Names}}|{{.Image}}|{{.Status}}'; echo OPENCLAW_CONTAINER_NOT_FOUND=1 >&2; exit 52; }
          cid="${ids[0]}"
          docker update --restart unless-stopped "$cid" >/dev/null
          [ "$(docker inspect "$cid" --format '{{.State.Status}}')" = running ] || docker start "$cid" >/dev/null
          if docker exec "$cid" sh -lc 'command -v openclaw >/dev/null 2>&1'; then
            docker exec "$cid" openclaw config set plugins.entries.sahjony-app-bridge.config '{"appUrl":"https://www.sahjony.com","accountId":"default","gatewayId":"hostinger-vps","businessNumber":"+12816628581","businessName":"SAHJONY LLC","pollIntervalMs":30000}' --strict-json --merge || true
            docker exec "$cid" openclaw config validate || true
          fi
          docker restart "$cid" >/dev/null
          sleep 12
          docker inspect "$cid" --format 'OPENCLAW name={{.Name}} status={{.State.Status}} restart={{.HostConfig.RestartPolicy.Name}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}'
          probe="$(docker exec "$cid" sh -lc 'command -v openclaw >/dev/null 2>&1 && openclaw channels status --probe 2>&1' || true)"
          printf '%s\n' "$probe"
          echo SAHJONY_V8_DOCKER_OPENCLAW_STABILIZED=1
          REMOTE
          echo ready=true >> "$GITHUB_OUTPUT"

      - name: Install 24x7 guardian
        if: steps.openclaw.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/hostinger-recovery-v8 openclaw/hostinger-24x7/whatsapp-guardian.sh openclaw/hostinger-24x7/install-whatsapp-guardian.sh "$USER@$HOST:/root/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/hostinger-recovery-v8 "$USER@$HOST" 'install -d /opt/sahjony/openclaw/hostinger-24x7; mv /root/whatsapp-guardian.sh /root/install-whatsapp-guardian.sh /opt/sahjony/openclaw/hostinger-24x7/; chmod +x /opt/sahjony/openclaw/hostinger-24x7/*.sh; cd /opt/sahjony/openclaw/hostinger-24x7 && ./install-whatsapp-guardian.sh; systemctl is-active sahjony-whatsapp-guardian.timer'
          echo SAHJONY_V8_GUARDIAN_INSTALLED=1

      - name: Verify Hostinger OpenClaw authority
        if: steps.openclaw.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          local_ready=false
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/hostinger-recovery-v8 "$USER@$HOST" 'systemctl is-active --quiet docker; systemctl is-active --quiet sahjony-whatsapp-guardian.timer; /usr/local/sbin/sahjony-whatsapp-guardian; test -s /var/lib/sahjony-whatsapp-guardian/last-good' && local_ready=true
          [[ "$local_ready" == true ]] || { echo SAHJONY_V8_LOCAL_WHATSAPP_NOT_READY=1 >&2; exit 60; }
          echo SAHJONY_HOSTINGER_LOCAL_WHATSAPP_AUTHORITY=READY
          for i in $(seq 1 24); do
            body="$(curl -fsS --max-time 20 "$APP_URL/whatsapp/health" 2>/dev/null || true)"
            if jq -e '(.hostinger_openclaw.connected // false) == true and (.hostinger_openclaw.heartbeat_fresh // false) == true' >/dev/null 2>&1 <<<"$body"; then
              printf '%s\n' "$body" | jq -c '{status,provider,authority,hostinger_independent_runtime,send_ready,hostinger_openclaw}'
              echo SAHJONY_HOSTINGER_OPENCLAW_PUBLIC_HEARTBEAT=READY
              exit 0
            fi
            sleep 10
          done
          echo SAHJONY_HOSTINGER_LOCAL_READY_PUBLIC_HEARTBEAT_PENDING=1

      - name: Cleanup one-run SSH identity only after normal SSH exists
        if: always()
        shell: bash
        run: |
          set +e
          if [[ "${{ steps.normal.outputs.ready }}" == true && -f ~/.ssh/hostinger-recovery-v8.pub ]]; then
            PUB_B64="$(base64 -w0 ~/.ssh/hostinger-recovery-v8.pub)"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/hostinger-recovery-v8 "$USER@$HOST" "PUB_B64='$PUB_B64' bash -s" <<'REMOTE'
          set +e
          pub="$(printf '%s' "$PUB_B64" | base64 -d)"
          if [ -f /root/.ssh/authorized_keys ]; then
            tmp="$(mktemp)"; grep -vxF "$pub" /root/.ssh/authorized_keys > "$tmp" || true; cat "$tmp" > /root/.ssh/authorized_keys; rm -f "$tmp"; chmod 600 /root/.ssh/authorized_keys
          fi
          REMOTE
          fi
          if [[ "${{ steps.recovery_start.outputs.owned }}" == true && "${{ steps.recovery_stop.outcome }}" != success ]]; then
            curl -sS -X DELETE -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/recovery" >/dev/null 2>&1 || true
          fi
          rm -f ~/.ssh/hostinger-recovery-v8 ~/.ssh/hostinger-recovery-v8.pub
          echo HOSTINGER_V8_CLEANUP_COMPLETE=1
