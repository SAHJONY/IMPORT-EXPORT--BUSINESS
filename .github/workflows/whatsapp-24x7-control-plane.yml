name: WhatsApp 24x7 Control Plane

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'audit or verify while recovery consolidation is in progress'
        required: true
        default: audit
        type: choice
        options:
          - audit
          - verify

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

jobs:
  paused-control-plane:
    runs-on: ubuntu-24.04
    steps:
      - name: Recovery consolidation guard
        run: |
          echo SAHJONY_HOSTINGER_CONTROL_PLANE=PAUSED_FOR_CONSOLIDATION
          echo AUTOMATIC_RECOVERY_DISABLED=1
          echo USE_CANONICAL_V7_ONLY=1
