name: Hostinger OpenClaw Model Failover Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-openclaw-model-failover-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      OPENAI_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Inspect safe model configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_KEY" ]] || exit 2
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          echo "GITHUB_OPENAI_SECRET_PRESENT=$([[ -n "$OPENAI_KEY_PRESENT" ]] && echo true || echo false)"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/key "$USER@$HOST" 'python3 - <<'"'"'PY'"'"'
          import json, os, pathlib, subprocess
          p=pathlib.Path('/var/lib/sahjony-openclaw-state/openclaw.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          def scrub(v):
              if isinstance(v, dict):
                  out={}
                  for k,val in v.items():
                      lk=k.lower()
                      if any(x in lk for x in ('key','secret','token','password','credential')):
                          out[k]='***' if val else ''
                      else:
                          out[k]=scrub(val)
                  return out
              if isinstance(v,list): return [scrub(x) for x in v]
              return v
          for key in ('models','model','providers','auth','agents'):
              if key in d:
                  print(key.upper()+'='+json.dumps(scrub(d[key]), separators=(',',':'))[:20000])
          print('ENV_OPENAI_PRESENT='+str(bool(os.getenv('OPENAI_API_KEY'))).lower())
          print('ENV_NVIDIA_PRESENT='+str(bool(os.getenv('NVIDIA_API_KEY'))).lower())
          PY'
          rm -f ~/.ssh/key
