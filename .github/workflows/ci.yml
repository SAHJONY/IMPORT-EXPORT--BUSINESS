name: trade-os-ci

on:
  push:
    branches: [main, feat/agentic-global-trade-os]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - name: Unified API runtime import smoke
        run: python -c "import unified_api; print('Unified API import OK')"
      - run: python -m pytest -q
