name: Hostinger Recovery Preserve Firewall

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hostinger-recovery-preserve-firewall.yml'

permissions:
  contents: read

concurrency:
  group: hostinger-recovery-preserve-firewall
  cancel-in-progress: false

env:
  HOSTINGER_API_BASE: https://developers.hostinger.com
  VM_ID: '767852'
  HOST: '69.62.68.67'
  USER: root
  MAINT_USER: sahjony-recovery

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - name: Prepare ephemeral recovery credential
        id: creds
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$API_TOKEN" ]] || { echo 'HOSTINGER_API_TOKEN_MISSING=1' >&2; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass netcat-openbsd >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/hostinger-recovery -C "sahjony-recovery-${GITHUB_RUN_ID}"
          RECOVERY_PASSWORD="$(openssl rand -hex 16)Aa1!"
          echo "::add-mask::$RECOVERY_PASSWORD"
          echo "recovery_password=$RECOVERY_PASSWORD" >> "$GITHUB_OUTPUT"
          echo 'SAHJONY_RECOVERY_CREDENTIALS_READY=1'

      - name: Validate existing Hostinger firewall without replacing it
        id: firewall
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json')
          curl --fail --silent --show-error "${auth[@]}" \
            "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID" > /tmp/vm-before.json
          firewall_id="$(jq -r '.firewall_group_id // .firewall_id // empty' /tmp/vm-before.json)"
          [[ -n "$firewall_id" && "$firewall_id" != "null" ]] || { echo 'HOSTINGER_EXISTING_FIREWALL_NOT_FOUND=1' >&2; exit 30; }
          curl --fail --silent --show-error "${auth[@]}" \
            "$HOSTINGER_API_BASE/api/vps/v1/firewall/$firewall_id" > /tmp/firewall.json
          jq -e '
            [.. | objects | select(
              ((.port // .ports // .destination_port // "") | tostring | test("(^|[^0-9])22([^0-9]|$)"))
              and ((.protocol // "") | ascii_downcase | test("tcp|all|any"))
              and ((.action // .policy // "") | ascii_downcase | test("accept|allow"))
            )] | length > 0' /tmp/firewall.json >/dev/null \
            || { echo "EXISTING_FIREWALL_TCP22_NOT_VERIFIED=1 firewall_id=$firewall_id" >&2; exit 31; }
          echo "firewall_id=$firewall_id" >> "$GITHUB_OUTPUT"
          echo "HOSTINGER_EXISTING_FIREWALL_PRESERVED=1 firewall_id=$firewall_id"

      - name: Start Hostinger recovery mode
        id: recovery_start
        shell: bash
        env:
          RECOVERY_PASSWORD: ${{ steps.creds.outputs.recovery_password }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg p "$RECOVERY_PASSWORD" '{root_password:$p}')"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $API_TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "$payload" \
            "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/recovery" >/tmp/recovery-start.json
          echo 'HOSTINGER_RECOVERY_MODE_REQUESTED=1'

      - name: Wait for authenticated recovery SSH and mounted original OS
        id: recovery_ready
        shell: bash
        env:
          RECOVERY_PASSWORD: ${{ steps.creds.outputs.recovery_password }}
        run: |
          set -euo pipefail
          export SSHPASS="$RECOVERY_PASSWORD"
          auth=(-H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json')
          ssh_opts=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6)
          recovery_host="$HOST"
          root_mount=""
          for attempt in $(seq 1 60); do
            curl --silent --show-error "${auth[@]}" \
              "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID" > /tmp/vm-recovery.json || true
            api_ip="$(jq -r '[.. | objects | .ipv4? // .ip? // .address? // empty | select(type=="string") | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first // empty' /tmp/vm-recovery.json 2>/dev/null || true)"
            [[ -n "$api_ip" ]] && recovery_host="$api_ip"
            echo "RECOVERY_SSH_GATE=$attempt host=$recovery_host"
            if nc -z -w 4 "$recovery_host" 22 >/dev/null 2>&1; then
              if sshpass -e ssh "${ssh_opts[@]}" "$USER@$recovery_host" 'printf SAHJONY_RECOVERY_AUTH_OK' 2>/dev/null | grep -q SAHJONY_RECOVERY_AUTH_OK; then
                root_mount="$(sshpass -e ssh "${ssh_opts[@]}" "$USER@$recovery_host" 'bash -s' 2>/dev/null <<'REMOTE' || true
          set -e
          for d in /mnt /mnt/sda /mnt/sda1 /mnt/vda /mnt/vda1 /mnt/nvme0n1 /mnt/nvme0n1p1 /mnt/* /mnt/*/*; do
            [ -d "$d" ] || continue
            if [ -f "$d/etc/os-release" ] && [ -d "$d/var" ] && [ -d "$d/root" ]; then
              printf '%s\n' "$d"
              exit 0
            fi
          done
          exit 1
          REMOTE
          )"
                root_mount="$(printf '%s\n' "$root_mount" | head -n1 | tr -d '\r')"
                [[ -n "$root_mount" ]] && break
              fi
            fi
            sleep 10
          done
          [[ -n "$root_mount" ]] || { echo 'HOSTINGER_RECOVERY_AUTH_OR_OS_MOUNT_NOT_READY=1' >&2; exit 34; }
          echo "recovery_host=$recovery_host" >> "$GITHUB_OUTPUT"
          echo "root_mount=$root_mount" >> "$GITHUB_OUTPUT"
          echo "HOSTINGER_RECOVERY_AUTH_READY=1 root_mount=$root_mount"

      - name: Diagnose SSH and create ephemeral maintenance user
        id: repair
        shell: bash
        env:
          RECOVERY_PASSWORD: ${{ steps.creds.outputs.recovery_password }}
          RECOVERY_HOST: ${{ steps.recovery_ready.outputs.recovery_host }}
          ROOT_MOUNT: ${{ steps.recovery_ready.outputs.root_mount }}
        run: |
          set -euo pipefail
          export SSHPASS="$RECOVERY_PASSWORD"
          PUB_B64="$(base64 -w0 ~/.ssh/hostinger-recovery.pub)"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 \
            "$USER@$RECOVERY_HOST" "ROOT_MOUNT='$ROOT_MOUNT' PUB_B64='$PUB_B64' MAINT_USER='$MAINT_USER' bash -s" <<'REMOTE'
          set -euo pipefail
          root="$ROOT_MOUNT"
          maint="$MAINT_USER"
          pub="$(printf '%s' "$PUB_B64" | base64 -d)"
          test -f "$root/etc/os-release"

          echo '--- SSH policy diagnostics before repair ---'
          grep -RniE '^[[:space:]]*(Include|PermitRootLogin|PubkeyAuthentication|AuthorizedKeysFile|AllowUsers|DenyUsers|AllowGroups|DenyGroups|AuthenticationMethods|Match)[[:space:]]' \
            "$root/etc/ssh/sshd_config" "$root/etc/ssh/sshd_config.d" 2>/dev/null || true

          if ! chroot "$root" /usr/bin/id "$maint" >/dev/null 2>&1; then
            chroot "$root" /usr/sbin/useradd -m -s /bin/bash "$maint"
          fi
          uid="$(chroot "$root" /usr/bin/id -u "$maint")"
          gid="$(chroot "$root" /usr/bin/id -g "$maint")"
          home="$root/home/$maint"
          install -d -m 700 -o "$uid" -g "$gid" "$home/.ssh"
          printf '%s\n' "$pub" > "$home/.ssh/authorized_keys"
          chown "$uid:$gid" "$home/.ssh/authorized_keys"
          chmod 600 "$home/.ssh/authorized_keys"

          install -d -m 755 "$root/etc/sudoers.d"
          printf '%s ALL=(ALL) NOPASSWD:ALL\n' "$maint" > "$root/etc/sudoers.d/99-sahjony-recovery"
          chmod 440 "$root/etc/sudoers.d/99-sahjony-recovery"

          install -d -m 755 "$root/etc/ssh/sshd_config.d"
          cat > "$root/etc/ssh/sshd_config.d/00-sahjony-ephemeral-maintenance.conf" <<EOF
          PubkeyAuthentication yes
          Match User $maint
              PubkeyAuthentication yes
              PasswordAuthentication no
              AuthorizedKeysFile .ssh/authorized_keys
          EOF
          chmod 600 "$root/etc/ssh/sshd_config.d/00-sahjony-ephemeral-maintenance.conf"

          # Preserve restrictive AllowUsers policies while explicitly adding only the temporary maintenance user.
          python3 - "$root" "$maint" <<'PY'
          import pathlib, re, shutil, sys
          root=pathlib.Path(sys.argv[1]); user=sys.argv[2]
          files=[root/'etc/ssh/sshd_config'] + sorted((root/'etc/ssh/sshd_config.d').glob('*.conf'))
          backup=root/'var/lib/sahjony-recovery/ssh-backup'
          for p in files:
              if not p.exists() or p.name == '00-sahjony-ephemeral-maintenance.conf':
                  continue
              lines=p.read_text(errors='replace').splitlines()
              changed=False; in_match=False; out=[]
              for line in lines:
                  s=line.strip()
                  if re.match(r'(?i)^Match\s+', s):
                      in_match=True
                  if not in_match and re.match(r'(?i)^AllowUsers\s+', s):
                      parts=s.split()
                      if user not in parts[1:]:
                          indent=line[:len(line)-len(line.lstrip())]
                          line=indent+'AllowUsers '+' '.join(parts[1:]+[user])
                          changed=True
                  if not in_match and re.match(r'(?i)^DenyUsers\s+', s):
                      parts=s.split()[1:]
                      if '*' in parts or user in parts:
                          raise SystemExit(f'UNSAFE_DENYUSERS_POLICY={p}:{s}')
                  out.append(line)
              if changed:
                  rel=p.relative_to(root)
                  dest=backup/rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(p,dest)
                  p.write_text('\n'.join(out)+'\n')
                  print(f'SSH_ALLOWUSERS_EXTENDED={rel}')
          PY

          sshd="$(find "$root/usr/sbin" "$root/usr/bin" -maxdepth 1 -name sshd -type f -print -quit 2>/dev/null || true)"
          if [ -n "$sshd" ]; then
            for d in dev proc sys run; do
              if [ -d "/$d" ] && [ -d "$root/$d" ] && ! mountpoint -q "$root/$d"; then
                mount --bind "/$d" "$root/$d" 2>/dev/null || true
              fi
            done
            chroot "$root" /usr/sbin/sshd -t
            chroot "$root" /usr/sbin/sshd -T -C "user=$maint,host=localhost,addr=127.0.0.1" 2>/dev/null \
              | grep -E '^(pubkeyauthentication|authorizedkeysfile|allowusers|denyusers|allowgroups|denygroups|authenticationmethods) ' || true
          fi

          if [ -d "$root/etc/systemd/system/multi-user.target.wants" ]; then
            for unit in ssh.service sshd.service; do
              target="$(find "$root/lib/systemd/system" "$root/usr/lib/systemd/system" -maxdepth 1 -name "$unit" -print -quit 2>/dev/null || true)"
              if [ -n "$target" ]; then
                rel="/${target#"$root/"}"
                ln -sfn "$rel" "$root/etc/systemd/system/multi-user.target.wants/$unit"
                break
              fi
            done
          fi
          echo 'ORIGINAL_OS_MAINTENANCE_SSH_REPAIRED=1'
          REMOTE

      - name: Exit recovery mode
        id: recovery_stop
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X DELETE \
            -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' \
            "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/recovery" >/tmp/recovery-stop.json
          echo 'HOSTINGER_RECOVERY_MODE_STOP_REQUESTED=1'

      - name: Wait for normal maintenance SSH
        id: normal_ssh
        shell: bash
        run: |
          set -euo pipefail
          connected=false
          for attempt in $(seq 1 60); do
            echo "NORMAL_SSH_GATE=$attempt user=$MAINT_USER"
            if out="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 \
              -i ~/.ssh/hostinger-recovery "$MAINT_USER@$HOST" 'sudo -n true && printf SAHJONY_NORMAL_SSH_OK' 2>&1)" \
              && grep -q SAHJONY_NORMAL_SSH_OK <<<"$out"; then
              connected=true
              break
            fi
            printf '%s\n' "$out" | tail -n1 || true
            sleep 10
          done
          [[ "$connected" == true ]] || { echo 'NORMAL_MAINTENANCE_SSH_UNREACHABLE=1' >&2; exit 11; }
          echo 'NORMAL_MAINTENANCE_SSH_AUTHORIZED=1'

      - name: Stabilize Docker and OpenClaw
        id: docker
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -i ~/.ssh/hostinger-recovery "$MAINT_USER@$HOST" 'sudo -n bash -s' <<'REMOTE'
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || { echo 'DOCKER_NOT_FOUND=1' >&2; exit 20; }
          systemctl enable docker >/dev/null 2>&1 || true
          systemctl start docker >/dev/null 2>&1 || true
          mapfile -t ids < <(docker ps -aq | while read -r id; do
            line="$(docker inspect "$id" --format '{{.Name}}|{{.Config.Image}}' 2>/dev/null || true)"
            grep -Eqi 'openclaw|claw' <<<"$line" && printf '%s\n' "$id" || true
          done)
          [ "${#ids[@]}" -gt 0 ] || { echo 'OPENCLAW_DOCKER_CONTAINER_NOT_FOUND=1' >&2; exit 21; }
          for id in "${ids[@]}"; do
            docker update --restart unless-stopped "$id" >/dev/null
            [ "$(docker inspect "$id" --format '{{.State.Status}}')" = running ] || docker start "$id" >/dev/null
            docker inspect "$id" --format 'OPENCLAW name={{.Name}} restart={{.HostConfig.RestartPolicy.Name}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}'
          done
          echo 'SAHJONY_DOCKER_OPENCLAW_STABILIZED=1'
          REMOTE

      - name: Verify public WhatsApp health
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 18); do
            body="$(curl -fsS --max-time 20 https://www.sahjony.com/whatsapp/health || true)"
            printf '%s\n' "$body"
            if grep -q '"gateway_connected"[[:space:]]*:[[:space:]]*true' <<<"$body" \
              && grep -q '"send_ready"[[:space:]]*:[[:space:]]*true' <<<"$body"; then
              ready=true
              break
            fi
            sleep 10
          done
          [[ "$ready" == true ]] || { echo 'SAHJONY_PUBLIC_WHATSAPP_HEALTH_NOT_READY=1' >&2; exit 40; }
          echo 'SAHJONY_HOSTINGER_OPENCLAW_24X7=READY'

      - name: Remove ephemeral maintenance access
        if: always() && steps.normal_ssh.outcome == 'success'
        shell: bash
        run: |
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 \
            -i ~/.ssh/hostinger-recovery "$MAINT_USER@$HOST" "sudo -n MAINT_USER='$MAINT_USER' bash -s" <<'REMOTE'
          set +e
          maint="$MAINT_USER"
          rm -f "/home/$maint/.ssh/authorized_keys"
          rm -f /etc/sudoers.d/99-sahjony-recovery
          rm -f /etc/ssh/sshd_config.d/00-sahjony-ephemeral-maintenance.conf
          if [ -d /var/lib/sahjony-recovery/ssh-backup ]; then
            (cd /var/lib/sahjony-recovery/ssh-backup && find etc/ssh -type f -print0 2>/dev/null | while IFS= read -r -d '' p; do cp -a "$p" "/$p"; done)
            rm -rf /var/lib/sahjony-recovery/ssh-backup
          fi
          passwd -l "$maint" >/dev/null 2>&1 || true
          systemctl reload ssh 2>/dev/null || systemctl reload sshd 2>/dev/null || true
          nohup sh -c "sleep 3; userdel -r '$maint' >/dev/null 2>&1 || true" >/dev/null 2>&1 &
          echo 'SAHJONY_EPHEMERAL_ACCESS_REMOVED=1'
          REMOTE

      - name: Ensure recovery mode is off
        if: always()
        shell: bash
        run: |
          set +e
          curl --silent --show-error -X DELETE \
            -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' \
            "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/recovery" >/dev/null 2>&1
          rm -f ~/.ssh/hostinger-recovery ~/.ssh/hostinger-recovery.pub
          echo 'HOSTINGER_RECOVERY_CLEANUP_COMPLETE=1'
