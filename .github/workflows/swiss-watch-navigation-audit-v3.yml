name: Swiss Watch Navigation Audit V3

on:
  push:
    branches: [audit/swiss-watch-20260901]
    paths:
      - '.github/workflows/swiss-watch-navigation-audit-v3.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build application and install browser auditor
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx tsc -p tsconfig.json
          npm run build
          npm audit --omit=dev --audit-level=high
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          mkdir -p navigation-v3

      - name: Build complete navigation graph
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import html.parser,json,pathlib,re,urllib.parse
          root=pathlib.Path('.'); out=root/'navigation-v3'; cfg=json.loads((root/'vercel.json').read_text())
          routes=[r for r in cfg.get('routes',[]) if isinstance(r,dict)]
          exact={r.get('src'):r.get('dest') for r in routes if isinstance(r.get('src'),str) and isinstance(r.get('dest'),str) and not any(c in r['src'] for c in '()*+?[]{}|')}
          source_pages=sorted({str(p) for base in (root,root/'public') for p in base.glob('*.html') if p.is_file()})
          links=[]; clickables=[]; findings=[]; ids={}

          class Parser(html.parser.HTMLParser):
              def __init__(self,path,text):
                  super().__init__(); self.path=path; self.text=text; self.page_ids=[]
                  self.dynamic=set(re.findall(r"getElementById\(['\"]([^'\"]+)['\"]\)\.href\s*=",text))
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs); line=self.getpos()[0]; ident=a.get('id') or ''
                  if ident: self.page_ids.append(ident)
                  if tag=='a':
                      href=(a.get('href') or '').strip(); dynamic=bool(ident and ident in self.dynamic)
                      links.append({'source':str(self.path),'line':line,'kind':'a','target':href,'id':ident,'dynamic':dynamic})
                      if not href and not dynamic: findings.append({'severity':'error','code':'EMPTY_HREF','source':str(self.path),'line':line,'id':ident})
                      if href=='#' and not dynamic: findings.append({'severity':'error','code':'PLACEHOLDER_HREF','source':str(self.path),'line':line,'id':ident})
                      if href.lower().startswith('javascript:'): findings.append({'severity':'error','code':'JAVASCRIPT_HREF','source':str(self.path),'line':line})
                      if a.get('target')=='_blank' and 'noopener' not in (a.get('rel') or '').lower(): findings.append({'severity':'warning','code':'TARGET_BLANK_WITHOUT_NOOPENER','source':str(self.path),'line':line,'target':href})
                  if tag in {'a','button','input','select','textarea'} or a.get('role') in {'link','button'} or a.get('onclick'):
                      clickables.append({'source':str(self.path),'line':line,'tag':tag,'id':ident,'href':a.get('href'),'role':a.get('role'),'type':a.get('type'),'onclick':bool(a.get('onclick')),'aria_label':a.get('aria-label'),'title':a.get('title')})
                  if tag=='form' and a.get('action'): links.append({'source':str(self.path),'line':line,'kind':'form','target':a.get('action'),'dynamic':False})
                  if a.get('onclick'):
                      for m in re.finditer(r"(?:location(?:\.href)?\s*=|location\.(?:assign|replace)\s*\(|window\.open\s*\()\s*['\"]([^'\"]+)",a['onclick']):
                          links.append({'source':str(self.path),'line':line,'kind':'onclick','target':m.group(1),'dynamic':False})

          for file in source_pages:
              p=pathlib.Path(file); text=p.read_text(errors='ignore'); parser=Parser(p,text)
              try: parser.feed(text)
              except Exception as e: findings.append({'severity':'error','code':'HTML_PARSE','source':file,'error':type(e).__name__})
              static=[x for x in parser.page_ids if '${' not in x and '{' not in x]
              ids[file]=set(static)
              for x in sorted({x for x in static if static.count(x)>1}): findings.append({'severity':'error','code':'DUPLICATE_STATIC_ID','source':file,'id':x})

          for p in sorted(list((root/'src').rglob('*.tsx'))+list((root/'src').rglob('*.ts'))+list((root/'public').rglob('*.js'))):
              text=p.read_text(errors='ignore'); ids[str(p)]=set(re.findall(r'\bid\s*=\s*["\']([^"\']+)["\']',text))
              pats=[('href',r'href\s*=\s*["\']([^"\']+)["\']'),('nav',r'\bnav\(\s*["\']([^"\']+)["\']'),('replace',r'location\.replace\(\s*["\']([^"\']+)["\']'),('location',r'location\.href\s*=\s*["\']([^"\']+)["\']'),('open',r'window\.open\(\s*["\']([^"\']+)["\']')]
              for kind,raw in pats:
                  for m in re.finditer(raw,text): links.append({'source':str(p),'line':text.count('\n',0,m.start())+1,'kind':kind,'target':m.group(1),'dynamic':'${' in m.group(1)})
              for m in re.finditer(r'<button\b([^>]*)>',text,re.I|re.S): clickables.append({'source':str(p),'line':text.count('\n',0,m.start())+1,'tag':'button','tsx':True,'has_onclick':'onClick' in m.group(1)})

          def resolve(item):
              t=(item.get('target') or '').strip(); src=item.get('source','')
              if item.get('dynamic') or '${' in t: return True,'dynamic'
              if not t: return False,'empty'
              if t.startswith(('mailto:','tel:','sms:','data:')): return True,'scheme'
              if t.startswith(('http://','https://')): return True,'external'
              if t.startswith('#'): return bool(t[1:] in ids.get(src,set())),'fragment'
              u=urllib.parse.urlsplit(t); path=u.path or '/'
              if not path.startswith('/'):
                  c=(pathlib.Path(src).parent/path).resolve()
                  try: c.relative_to(root.resolve())
                  except Exception: return False,'outside'
                  return c.exists(),'relative-file'
              if path in exact: return True,'canonical-route'
              clean=path.lstrip('/'); candidates=[root/clean,root/'public'/clean]
              if any(c.exists() for c in candidates): return True,'file'
              if path=='/' or path.startswith(('/owner','/employee','/customer','/sign-in')): return True,'spa'
              for r in routes:
                  pattern=r.get('src')
                  if not pattern: continue
                  try:
                      if re.fullmatch(pattern,path): return True,'route-pattern'
                  except re.error: pass
              return False,'unresolved'

          for item in links:
              ok,basis=resolve(item); item['resolved']=ok; item['basis']=basis
              if not ok: findings.append({'severity':'error','code':'UNRESOLVED_TARGET',**item})

          # Runtime pages: every canonical static route + every concrete internal link + every source HTML locally.
          canonical=set(['/'])
          for src,dest in exact.items():
              if not dest.endswith('.py'): canonical.add(src)
          for x in links:
              t=(x.get('target') or '').strip()
              if not t or x.get('dynamic') or t.startswith(('#','mailto:','tel:','sms:','data:','javascript:','http://','https://')): continue
              u=urllib.parse.urlsplit(t)
              if u.path.startswith('/'): canonical.add(t)
          local_source=[]
          for file in source_pages:
              p=pathlib.Path(file)
              local_source.append('/__source__/'+('public/' if p.parent==root/'public' else 'root/')+p.name)
          result={'source_pages':source_pages,'source_page_count':len(source_pages),'vercel_routes':len(routes),'canonical_paths':sorted(canonical),'local_source_paths':sorted(local_source),'links':links,'link_occurrences':len(links),'unique_targets':len({x.get('target') for x in links}),'clickables':clickables,'clickable_count':len(clickables),'findings':findings}
          (out/'graph.json').write_text(json.dumps(result,indent=2))
          errors=[x for x in findings if x['severity']=='error']; warnings=[x for x in findings if x['severity']=='warning']
          summary=f"SOURCE_HTML_PAGES={len(source_pages)}\nVERCEL_ROUTES={len(routes)}\nCANONICAL_OR_LINKED_PATHS={len(canonical)}\nLINK_OCCURRENCES={len(links)}\nUNIQUE_TARGETS={result['unique_targets']}\nCLICKABLES_INVENTORIED={len(clickables)}\nSTATIC_ERRORS={len(errors)}\nSTATIC_WARNINGS={len(warnings)}\n"
          (out/'summary.txt').write_text(summary); print(summary,end='')
          for x in errors[:100]: print('STATIC_ERROR',json.dumps(x,ensure_ascii=False))
          for x in warnings[:100]: print('STATIC_WARNING',json.dumps(x,ensure_ascii=False))
          PY

      - name: Start local Vercel-like navigation server
        shell: bash
        run: |
          set -euo pipefail
          cat > navigation-v3/server.mjs <<'JS'
          import http from 'node:http';import fs from 'node:fs';import path from 'node:path';import {URL} from 'node:url';
          const cfg=JSON.parse(fs.readFileSync('vercel.json','utf8'));const exact=new Map();const api=[];
          for(const r of cfg.routes||[]){if(!r.src||!r.dest)continue;if(/[()*+?\[\]{}|]/.test(r.src))api.push(r);else exact.set(r.src,r.dest)}
          const mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.json':'application/json','.svg':'image/svg+xml','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.webp':'image/webp','.pdf':'application/pdf'};
          const safeFile=(rel)=>{const clean=rel.replace(/^\/+/,''), options=[path.join('dist',clean),path.join('public',clean),path.join(clean)];return options.find(p=>fs.existsSync(p)&&fs.statSync(p).isFile())||null};
          const sendFile=(res,file)=>{res.writeHead(200,{'content-type':mime[path.extname(file).toLowerCase()]||'application/octet-stream','cache-control':'no-store'});fs.createReadStream(file).pipe(res)};
          const server=http.createServer((req,res)=>{const u=new URL(req.url,'http://127.0.0.1:4173');let pathname=decodeURIComponent(u.pathname);
            if(pathname.startsWith('/__source__/')){const bits=pathname.split('/');const scope=bits[2],name=bits.slice(3).join('/');const file=scope==='public'?path.join('public',name):name;if(fs.existsSync(file))return sendFile(res,file);res.writeHead(404);return res.end('source not found')}
            const dest=exact.get(pathname);if(dest&&!dest.endsWith('.py')){const f=safeFile(dest);if(f)return sendFile(res,f)}
            const direct=safeFile(pathname);if(direct)return sendFile(res,direct)
            for(const r of api){try{if(new RegExp('^'+r.src+'$').test(pathname)){res.writeHead(200,{'content-type':'application/json','cache-control':'no-store'});return res.end('{}')}}catch{}}
            const index=safeFile('/index.html');if(index)return sendFile(res,index);res.writeHead(404);res.end('not found')});
          server.listen(4173,'127.0.0.1',()=>console.log('NAV_SERVER_READY'));
          JS
          node navigation-v3/server.mjs > navigation-v3/server.log 2>&1 &
          echo $! > navigation-v3/server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Chromium every-page and every-safe-click audit
        shell: bash
        run: |
          set -euo pipefail
          cat > navigation-v3/browser.mjs <<'JS'
          import fs from 'node:fs';import {chromium} from 'playwright';
          const graph=JSON.parse(fs.readFileSync('navigation-v3/graph.json','utf8'));const base='http://127.0.0.1:4173';
          const all=[...new Set([...graph.canonical_paths,...graph.local_source_paths])];
          const report={pages:[],badAnchors:[],duplicateIds:[],unnamedClickables:[],pageErrors:[],consoleErrors:[],failedRequests:[],anchorClicks:[],buttonClicks:[]};
          const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({ignoreHTTPSErrors:true});const page=await ctx.newPage();let current='';
          page.on('pageerror',e=>report.pageErrors.push({page:current,error:String(e).slice(0,600)}));
          page.on('console',m=>{if(m.type()==='error')report.consoleErrors.push({page:current,text:m.text().slice(0,500)})});
          page.on('requestfailed',r=>report.failedRequests.push({page:current,url:r.url(),failure:r.failure()?.errorText||''}));
          const inspect=()=>page.evaluate(()=>{const visible=e=>!!(e.getClientRects().length&&getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden');const as=[...document.querySelectorAll('a')].filter(visible).map((a,i)=>({i,href:a.getAttribute('href')||'',resolved:a.href||'',text:(a.textContent||a.getAttribute('aria-label')||a.getAttribute('title')||'').trim().replace(/\s+/g,' ').slice(0,120)}));const cs=[...document.querySelectorAll('a,button,[role="link"],[role="button"],[onclick]')].filter(visible).map((e,i)=>({i,tag:e.tagName.toLowerCase(),href:e.getAttribute('href')||'',text:(e.textContent||e.getAttribute('aria-label')||e.getAttribute('title')||'').trim().replace(/\s+/g,' ').slice(0,120),type:e.getAttribute('type')||'',disabled:e.hasAttribute('disabled')||e.getAttribute('aria-disabled')==='true'}));const ids=[...document.querySelectorAll('[id]')].map(e=>e.id);return{title:document.title,anchors:as,clickables:cs,dups:[...new Set(ids.filter((x,i)=>x&&ids.indexOf(x)!==i))]}});
          for(const p of all){const url=new URL(p,base).href;current=url;let resp;try{resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:12000});await page.waitForTimeout(100)}catch(e){report.pages.push({path:p,status:null,error:String(e).slice(0,300)});continue}const d=await inspect();report.pages.push({path:p,status:resp?.status()??null,finalUrl:page.url(),title:d.title,anchors:d.anchors.length,clickables:d.clickables.length});for(const a of d.anchors)if(!a.href||a.href==='#'||/^javascript:/i.test(a.href))report.badAnchors.push({path:p,...a});for(const id of d.dups)report.duplicateIds.push({path:p,id});for(const c of d.clickables)if(!c.disabled&&!c.text&&!c.href)report.unnamedClickables.push({path:p,...c})}

          // Click every visible same-origin anchor on canonical/linked pages only.
          for(const p of graph.canonical_paths){const source=new URL(p,base).href;current=source;let anchors=[];try{await page.goto(source,{waitUntil:'domcontentloaded',timeout:12000});await page.waitForTimeout(80);anchors=(await inspect()).anchors}catch{continue}for(const a of anchors){if(!a.href||/^(mailto:|tel:|sms:|javascript:|data:)/i.test(a.href))continue;let u;try{u=new URL(a.resolved,source)}catch{continue};if(u.origin!==new URL(base).origin)continue;try{await page.goto(source,{waitUntil:'domcontentloaded',timeout:12000});await page.waitForTimeout(50);const loc=page.locator('a:visible').nth(a.i);if(!await loc.count())continue;const actual=await loc.getAttribute('href');if(actual!==a.href){report.anchorClicks.push({source,index:a.i,href:a.href,ok:false,error:'anchor-order-changed'});continue}const before=page.url();await loc.click({timeout:2500,noWaitAfter:true});await page.waitForTimeout(100);const after=page.url();const ok=a.href.startsWith('#')?after.includes('#'):after!==before;report.anchorClicks.push({source,index:a.i,text:a.text,href:a.href,before,after,ok})}catch(e){report.anchorClicks.push({source,index:a.i,text:a.text,href:a.href,ok:false,error:String(e).slice(0,220)})}}}

          // Safe non-submit buttons: click and record navigation; operational/destructive controls are intentionally excluded.
          const unsafe=/delete|remove|pay|submit|send|approve|post|release|reverse|create|save|ingest|execute|run|call|message|sync|connect|disconnect|upload|download|order|buy|purchase|quote/i;
          for(const p of graph.canonical_paths){const source=new URL(p,base).href;current=source;try{await page.goto(source,{waitUntil:'domcontentloaded',timeout:12000});await page.waitForTimeout(80)}catch{continue}const buttons=await page.locator('button:visible,[role="button"]:visible').evaluateAll(es=>es.map((e,i)=>({i,text:(e.textContent||e.getAttribute('aria-label')||e.getAttribute('title')||'').trim().replace(/\s+/g,' ').slice(0,100),type:e.getAttribute('type')||'',disabled:e.hasAttribute('disabled')||e.getAttribute('aria-disabled')==='true'})));for(const b of buttons){if(b.disabled||b.type==='submit'||!b.text||unsafe.test(b.text))continue;try{await page.goto(source,{waitUntil:'domcontentloaded',timeout:12000});await page.waitForTimeout(50);const loc=page.locator('button:visible,[role="button"]:visible').nth(b.i);if(!await loc.count())continue;const before=page.url();await loc.click({timeout:2000,noWaitAfter:true});await page.waitForTimeout(100);const after=page.url();report.buttonClicks.push({source,index:b.i,text:b.text,before,after,navigated:after!==before,ok:true})}catch(e){report.buttonClicks.push({source,index:b.i,text:b.text,ok:false,error:String(e).slice(0,220)})}}}
          await browser.close();fs.writeFileSync('navigation-v3/browser.json',JSON.stringify(report,null,2));const broken=report.pages.filter(x=>x.status===null||x.status>=400),failedA=report.anchorClicks.filter(x=>!x.ok),failedB=report.buttonClicks.filter(x=>!x.ok);const summary=`BROWSER_PAGE_INSTANCES=${report.pages.length}\nBROWSER_BROKEN_PAGES=${broken.length}\nRUNTIME_BAD_ANCHORS=${report.badAnchors.length}\nRUNTIME_DUPLICATE_IDS=${report.duplicateIds.length}\nUNNAMED_CLICKABLES=${report.unnamedClickables.length}\nPAGE_ERRORS=${report.pageErrors.length}\nCONSOLE_ERRORS_OBSERVED=${report.consoleErrors.length}\nFAILED_REQUESTS_OBSERVED=${report.failedRequests.length}\nSAFE_INTERNAL_ANCHOR_CLICKS=${report.anchorClicks.length}\nFAILED_ANCHOR_CLICKS=${failedA.length}\nSAFE_BUTTON_CLICKS=${report.buttonClicks.length}\nFAILED_SAFE_BUTTON_CLICKS=${failedB.length}\n`;fs.appendFileSync('navigation-v3/summary.txt',summary);console.log(summary);for(const x of broken.slice(0,100))console.log('BROKEN',JSON.stringify(x));for(const x of report.badAnchors.slice(0,100))console.log('BAD_ANCHOR',JSON.stringify(x));for(const x of failedA.slice(0,100))console.log('FAILED_CLICK',JSON.stringify(x));
          JS
          node navigation-v3/browser.mjs

      - name: Current production linked-destination baseline
        shell: bash
        run: |
          set -euo pipefail
          cat > navigation-v3/production.mjs <<'JS'
          import fs from 'node:fs';import {performance} from 'node:perf_hooks';const g=JSON.parse(fs.readFileSync('navigation-v3/graph.json','utf8')),base='https://www.sahjony.com';const targets=new Set();for(const x of g.links){let t=(x.target||'').trim();if(!t||x.dynamic||t.includes('${')||/^(#|mailto:|tel:|sms:|javascript:|data:)/i.test(t))continue;try{targets.add(new URL(t,base).href)}catch{}}for(const p of g.canonical_paths)try{targets.add(new URL(p,base).href)}catch{}const list=[...targets],results=new Array(list.length);let n=0;async function worker(){while(true){const i=n++;if(i>=list.length)return;const u=list[i],start=performance.now();try{const r=await fetch(u,{redirect:'follow',headers:{'user-agent':'SAHJONY-Navigation-Audit/3.0'},signal:AbortSignal.timeout(30000)});results[i]={url:u,status:r.status,finalUrl:r.url,ms:Math.round(performance.now()-start),ok:r.status<400||r.status===401||r.status===403}}catch(e){results[i]={url:u,status:null,ms:Math.round(performance.now()-start),ok:false,error:e?.name||String(e)}}}}await Promise.all(Array.from({length:10},worker));const bad=results.filter(x=>!x.ok),slow=results.filter(x=>x.ok&&x.ms>5000);fs.writeFileSync('navigation-v3/production.json',JSON.stringify({checked:results.length,bad,slow,results},null,2));fs.appendFileSync('navigation-v3/summary.txt',`PRODUCTION_LINKED_OR_CANONICAL_CHECKED=${results.length}\nPRODUCTION_BAD_CURRENT=${bad.length}\nPRODUCTION_SLOW_OVER_5S=${slow.length}\n`);console.log(`PRODUCTION_LINKED_OR_CANONICAL_CHECKED=${results.length}`);console.log(`PRODUCTION_BAD_CURRENT=${bad.length}`);console.log(`PRODUCTION_SLOW_OVER_5S=${slow.length}`);for(const x of bad.slice(0,100))console.log('PRODUCTION_BAD',JSON.stringify(x));for(const x of slow.slice(0,50))console.log('PRODUCTION_SLOW',JSON.stringify(x));
          JS
          node navigation-v3/production.mjs

      - name: Branch navigation verdict
        shell: bash
        run: |
          set -euo pipefail
          cat navigation-v3/summary.txt
          python <<'PY'
          import json,pathlib
          g=json.loads(pathlib.Path('navigation-v3/graph.json').read_text()); b=json.loads(pathlib.Path('navigation-v3/browser.json').read_text()); p=json.loads(pathlib.Path('navigation-v3/production.json').read_text())
          static=[x for x in g['findings'] if x['severity']=='error']; broken=[x for x in b['pages'] if x.get('status') is None or (x.get('status') or 0)>=400]; failed_a=[x for x in b['anchorClicks'] if not x.get('ok')]; failed_b=[x for x in b['buttonClicks'] if not x.get('ok')]
          blocking=len(static)+len(broken)+len(b['badAnchors'])+len(b['duplicateIds'])+len(b['unnamedClickables'])+len(b['pageErrors'])+len(failed_a)+len(failed_b)
          verdict={'branch_verdict':'PASS' if blocking==0 else 'FAIL','blocking':blocking,'static_errors':len(static),'browser_broken':len(broken),'bad_anchors':len(b['badAnchors']),'duplicate_ids':len(b['duplicateIds']),'unnamed_clickables':len(b['unnamedClickables']),'page_errors':len(b['pageErrors']),'anchor_clicks':len(b['anchorClicks']),'failed_anchor_clicks':len(failed_a),'button_clicks':len(b['buttonClicks']),'failed_button_clicks':len(failed_b),'production_bad_current':len(p['bad']),'production_slow_current':len(p['slow'])}
          pathlib.Path('navigation-v3/verdict.json').write_text(json.dumps(verdict,indent=2));print(json.dumps(verdict,indent=2));
          if blocking: raise SystemExit(1)
          PY

      - name: Stop local navigation server
        if: always()
        shell: bash
        run: |
          if [[ -f navigation-v3/server.pid ]]; then kill "$(cat navigation-v3/server.pid)" 2>/dev/null || true; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swiss-watch-navigation-v3
          path: navigation-v3/
          if-no-files-found: error
