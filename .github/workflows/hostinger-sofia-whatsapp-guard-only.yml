name: Hostinger SOFIA WhatsApp Guard Only

on:
  push:
    branches: [main]
    paths:
      - '.deploy/hostinger-sofia-whatsapp-guard-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

jobs:
  deploy-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HOST: '69.62.68.67'
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate guard assets
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_KEY" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          [[ -s openclaw/sahjony-whatsapp-output-guard/index.js ]]
          [[ -s openclaw/sahjony-whatsapp-output-guard/openclaw.plugin.json ]]
          grep -Fq 'GUARD_VERSION = "3.0.1"' openclaw/sahjony-whatsapp-output-guard/index.js
          grep -Fq 'OWNER_COMMAND' openclaw/sahjony-whatsapp-output-guard/index.js
          grep -Fq 'CUSTOMER_PARTNER' openclaw/sahjony-whatsapp-output-guard/index.js
          grep -Fq 'internal_commercial_output_external' openclaw/sahjony-whatsapp-output-guard/index.js
          node --check openclaw/sahjony-whatsapp-output-guard/index.js

      - name: Prepare secure bundle
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-sofia-guard
          chmod 600 ~/.ssh/hostinger-sofia-guard
          ssh-keygen -y -f ~/.ssh/hostinger-sofia-guard >/dev/null
          tar -czf "$RUNNER_TEMP/sofia-whatsapp-guard.tgz" openclaw/sahjony-whatsapp-output-guard

      - name: Deploy guard without model mutation
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -o ConnectionAttempts=1 -i ~/.ssh/hostinger-sofia-guard)
          connected=0
          for attempt in 1 2 3 4 5 6; do
            echo "SSH_GUARD_ATTEMPT=$attempt"
            if ssh "${opts[@]}" "$SSH_USER@$HOST" 'printf HOSTINGER_SSH_OK' 2>/dev/null | grep -q HOSTINGER_SSH_OK; then
              connected=1
              break
            fi
            sleep 10
          done
          [[ "$connected" == 1 ]] || { echo HOSTINGER_SSH_UNREACHABLE=1 >&2; exit 30; }
          scp "${opts[@]}" "$RUNNER_TEMP/sofia-whatsapp-guard.tgz" "$SSH_USER@$HOST:/root/"
          ssh "${opts[@]}" "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          STATE=/var/lib/sahjony-openclaw-state
          CONFIG="$STATE/openclaw.json"
          DST="$STATE/extensions/sahjony-whatsapp-output-guard"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="$STATE/.sofia-whatsapp-output-guard.pre-$STAMP"
          CONFIG_BACKUP="$STATE/openclaw.json.pre-sofia-guard-$STAMP"
          TMP="$(mktemp -d)"
          cleanup(){ rm -rf "$TMP" /root/sofia-whatsapp-guard.tgz; }
          rollback(){
            set +e
            rm -rf "$DST"
            [[ -d "$BACKUP" ]] && mv "$BACKUP" "$DST"
            [[ -s "$CONFIG_BACKUP" ]] && cp -f "$CONFIG_BACKUP" "$CONFIG"
            systemctl restart openclaw-gateway.service >/dev/null 2>&1 || true
            echo SOFIA_GUARD_ROLLBACK=1 >&2
          }
          trap 'rc=$?; if [[ $rc -ne 0 ]]; then rollback; fi; cleanup; exit $rc' EXIT
          [[ -s "$CONFIG" ]] || { echo OPENCLAW_CONFIG_MISSING=1 >&2; exit 31; }
          systemctl is-active --quiet openclaw-gateway.service || { echo OPENCLAW_GATEWAY_INACTIVE=1 >&2; exit 32; }
          cp -a "$CONFIG" "$CONFIG_BACKUP"
          [[ ! -d "$DST" ]] || mv "$DST" "$BACKUP"
          tar -xzf /root/sofia-whatsapp-guard.tgz -C "$TMP"
          SRC="$TMP/openclaw/sahjony-whatsapp-output-guard"
          [[ -s "$SRC/index.js" && -s "$SRC/openclaw.plugin.json" ]] || { echo GUARD_ASSET_MISSING=1 >&2; exit 33; }
          install -d -m 755 "$STATE/extensions"
          cp -a "$SRC" "$DST"
          chown -R 0:0 "$DST"
          find "$DST" -type d -exec chmod 755 {} +
          find "$DST" -type f -exec chmod 644 {} +
          grep -Fq 'GUARD_VERSION = "3.0.1"' "$DST/index.js"
          grep -Fq 'OWNER_COMMAND' "$DST/index.js"
          grep -Fq 'CUSTOMER_PARTNER' "$DST/index.js"
          grep -Fq 'internal_commercial_output_external' "$DST/index.js"
          CONFIG="$CONFIG" python3 - <<'PY'
          import json, os
          p=os.environ['CONFIG']
          with open(p, encoding='utf-8') as f: d=json.load(f)
          plugins=d.setdefault('plugins', {})
          allow=plugins.setdefault('allow', [])
          name='sahjony-whatsapp-output-guard'
          if name not in allow: allow.append(name)
          entry=plugins.setdefault('entries', {}).setdefault(name, {})
          entry['enabled']=True
          cfg=entry.setdefault('config', {})
          cfg['failClosedExternal']=True
          with open(p,'w',encoding='utf-8') as f:
              json.dump(d,f,indent=2); f.write('\n')
          PY
          oc(){ env HOME=/home/node OPENCLAW_HOME=/home/node OPENCLAW_STATE_DIR="$STATE" OPENCLAW_CONFIG_PATH="$CONFIG" openclaw "$@"; }
          oc config validate >/dev/null
          BEFORE_MODEL="$(oc config get agents.defaults.model.primary 2>/dev/null || true)"
          systemctl restart openclaw-gateway.service
          sleep 10
          systemctl is-active --quiet openclaw-gateway.service || { echo OPENCLAW_GATEWAY_RESTART_FAILED=1 >&2; exit 34; }
          AFTER_MODEL="$(oc config get agents.defaults.model.primary 2>/dev/null || true)"
          [[ "$BEFORE_MODEL" == "$AFTER_MODEL" ]] || { echo MODEL_MUTATION_DETECTED=1 >&2; exit 35; }
          journalctl -u openclaw-gateway.service --since '-2 min' --no-pager | grep -Fq 'version=3.0.1' || { echo SOFIA_GUARD_STARTUP_NOT_OBSERVED=1 >&2; exit 36; }
          journalctl -u openclaw-gateway.service --since '-2 min' --no-pager | grep -Fq 'recipient-context=active' || { echo SOFIA_RECIPIENT_CONTEXT_NOT_OBSERVED=1 >&2; exit 37; }
          journalctl -u openclaw-gateway.service --since '-2 min' --no-pager | grep -Fq 'external-commercial-leak-guard=fail-closed' || { echo SOFIA_EXTERNAL_GUARD_NOT_OBSERVED=1 >&2; exit 38; }
          rm -rf "$BACKUP" "$CONFIG_BACKUP"
          echo SOFIA_WHATSAPP_GUARD_VERSION=3.0.1
          echo SOFIA_OWNER_CUSTOMER_CONTEXT=ACTIVE
          echo SOFIA_EXTERNAL_COMMERCIAL_LEAK_GUARD=FAIL_CLOSED
          echo SOFIA_SOURCE_OWNERSHIP=ACTIVE
          echo OPENCLAW_MODEL_PRESERVED=1
          echo OPENCLAW_GATEWAY_ACTIVE=1
          echo SOFIA_WHATSAPP_GUARD_DEPLOYMENT=SUCCESS
          REMOTE

      - name: Verify public WhatsApp health
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            health="$(curl -fsS --connect-timeout 10 --max-time 25 https://www.sahjony.com/whatsapp/health 2>/dev/null || true)"
            if HEALTH="$health" python3 - <<'PY'
          import json, os
          try: h=json.loads(os.environ.get('HEALTH') or '{}')
          except Exception: raise SystemExit(1)
          n=h.get('hostinger_openclaw') or {}
          ok=(h.get('status')=='ok' and h.get('send_ready') is True and h.get('webhook_ready') is True and n.get('connected') is True and n.get('heartbeat_fresh') is True and n.get('gateway_id')=='hostinger-vps')
          raise SystemExit(0 if ok else 1)
          PY
            then
              echo WHATSAPP_PUBLIC_HEALTH=VERIFIED
              exit 0
            fi
            sleep 8
          done
          echo WHATSAPP_PUBLIC_HEALTH_FAILED=1 >&2
          exit 40

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/hostinger-sofia-guard "$RUNNER_TEMP/sofia-whatsapp-guard.tgz"
