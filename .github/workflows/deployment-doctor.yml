name: Deployment Doctor

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install --ignore-scripts=false

      - name: Deployment Doctor
        run: npm run doctor

      - name: Validate WhatsApp CRM bridge Python
        run: |
          set -euo pipefail
          python3 -m py_compile \
            whatsapp_crm_bridge.py \
            whatsapp_cloud_primary_api.py \
            sofia_whatsapp_runtime.py \
            openclaw/hostinger-24x7/sahjony-crm-bridge.py
          test -s openclaw/skills/whatsapp-crm-bridge/SKILL.md
          test -x openclaw/hostinger-24x7/install-crm-bridge.sh || chmod +x openclaw/hostinger-24x7/install-crm-bridge.sh
          bash -n openclaw/hostinger-24x7/install-crm-bridge.sh
          echo "WhatsApp CRM bridge syntax and skill artifacts verified."

      - name: Live Business Doctor
        run: npm run doctor:live-business

      - name: Production frontend build
        run: npm run build

      - name: Verify required build artifacts
        run: |
          test -f dist/index.html
          test -f dist/landing.html
          test -f dist/start.html
          test -f dist/cuba-private-sector.html
          test -f dist/private-sector-cuba.html
          test -f dist/cuba-partners.html
          test -f public/cuba-partners.html
          test -f public/owner-cuba-partners.html
          test -f public/owner-payments.html
          test -f cuba_partner_api.py
          test -f payment_api.py
          test -f physical_postgres.py
          test -f whatsapp_crm_bridge.py
          test -f openclaw/hostinger-24x7/sahjony-crm-bridge.py
          grep -Fq '"/cuba-partners"' vercel.json
          grep -Fq '"/cuba-partners-api(.*)"' vercel.json
          grep -Fq '"/owner/cuba-partners"' vercel.json
          grep -Fq '"/owner-payments(.*)"' vercel.json
          echo "Build artifacts, physical ledgers, governed routes, and CRM bridge verified."

  production-smoke:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke current production
        run: |
          node tools/live-business-doctor.mjs --url=https://www.sahjony.com || true
          node tools/deployment-guard.mjs --url=https://www.sahjony.com || true
