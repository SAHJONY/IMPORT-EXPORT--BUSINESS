name: Hostinger Recovery One-Time Handoff

on:
  workflow_run:
    workflows: ["Hostinger Recovery Docker OpenClaw V5"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-v6-after-known-v5-run:
    if: ${{ github.event.workflow_run.id == 33467385593 && github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch bounded V6 exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/hostinger-whatsapp-recovery-v6.yml/dispatches \
            -d '{"ref":"main"}'
          echo SAHJONY_V6_HANDOFF_DISPATCHED=1

  install-guardian-after-known-v5-success:
    if: ${{ github.event.workflow_run.id == 33467385593 && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    env:
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Dispatch guardian installer when persistent SSH key exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HOSTINGER_SSH_PRIVATE_KEY" ]; then
            echo HOSTINGER_PERSISTENT_SSH_KEY_NOT_CONFIGURED_GUARDIAN_INSTALL_SKIPPED=1
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/hostinger-whatsapp-guardian-install.yml/dispatches \
            -d '{"ref":"main"}'
          echo SAHJONY_GUARDIAN_INSTALL_DISPATCHED=1
