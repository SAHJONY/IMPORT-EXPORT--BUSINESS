name: Hostinger OpenClaw Direct Provider Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-openclaw-direct-provider-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

env:
  HOST: '69.62.68.67'
  USER: root

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Validate secrets and OpenAI
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_KEY:-}" ]]
          [[ -n "${OPENAI_API_KEY:-}" ]]
          code="$(curl -sS -o /tmp/openai.json -w '%{http_code}' -H "Authorization: Bearer $OPENAI_API_KEY" https://api.openai.com/v1/models || true)"
          rm -f /tmp/openai.json
          echo "OPENAI_PREFLIGHT_HTTP=$code"
          [[ "$code" == 200 ]]

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-key
          chmod 600 ~/.ssh/hostinger-key
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/hostinger-key "$USER@$HOST" 'printf HOSTINGER_DIRECT_SSH_READY'

      - name: Repair OpenClaw provider runtime
        shell: bash
        run: |
          set -euo pipefail
          OPENAI_B64="$(printf '%s' "$OPENAI_API_KEY" | base64 -w0)"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/hostinger-key "$USER@$HOST" "OPENAI_B64='$OPENAI_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/sahjony-openclaw
          test -f docker-compose.yml
          key="$(printf '%s' "$OPENAI_B64" | base64 -d)"
          test -n "$key"
          touch .env
          chmod 600 .env
          cp -a .env ".env.backup.$(date -u +%Y%m%dT%H%M%SZ)"
          tmp="$(mktemp)"
          grep -vE '^(OPENAI_API_KEY|ANTHROPIC_API_KEY)=' .env > "$tmp" || true
          printf 'OPENAI_API_KEY=%s\n' "$key" >> "$tmp"
          install -m 600 "$tmp" .env
          rm -f "$tmp"
          ! grep -q '^ANTHROPIC_API_KEY=' .env

          docker compose up -d --force-recreate openclaw-gateway
          cid="$(docker compose ps -q openclaw-gateway)"
          test -n "$cid"
          docker update --restart unless-stopped "$cid" >/dev/null
          test "$(docker inspect "$cid" --format '{{.State.Running}}')" = true

          env_lines="$(docker inspect "$cid" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          env_names="$(printf '%s\n' "$env_lines" | cut -d= -f1)"
          grep -qx OPENAI_API_KEY <<<"$env_names"
          ! grep -qx ANTHROPIC_API_KEY <<<"$env_names"
          runtime_key="$(printf '%s\n' "$env_lines" | sed -n 's/^OPENAI_API_KEY=//p' | head -n1)"
          test -n "$runtime_key"

          code="$(curl -sS -o /tmp/runtime.json -w '%{http_code}' -H "Authorization: Bearer $runtime_key" -H 'Content-Type: application/json' --data '{"model":"gpt-4.1-mini","input":"Reply with exactly SAHJONY_RUNTIME_OK","max_output_tokens":16}' https://api.openai.com/v1/responses || true)"
          echo "OPENAI_RUNTIME_INFERENCE_HTTP=$code"
          test "$code" = 200
          grep -q 'SAHJONY_RUNTIME_OK' /tmp/runtime.json
          rm -f /tmp/runtime.json
          unset key runtime_key env_lines OPENAI_B64
          echo OPENCLAW_PROVIDER_RUNTIME=READY
          REMOTE

      - name: Verify WhatsApp health
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for i in $(seq 1 36); do
            body="$(curl -fsS --max-time 20 https://www.sahjony.com/whatsapp/health || true)"
            printf '%s\n' "$body" | jq '{status,provider,send_ready,gateway_connected,heartbeat_fresh,cloud_independent_of_local_mac,recovery_issues,backlog_recovery}' 2>/dev/null || true
            if jq -e '(.provider == "hostinger_openclaw") and ((.gateway_connected // false) == true) and ((.heartbeat_fresh // false) == true) and ((.send_ready // false) == true)' >/dev/null 2>&1 <<<"$body"; then
              ready=true
              break
            fi
            sleep 5
          done
          [[ "$ready" == true ]]
          echo WHATSAPP_TRANSACTION_READY=1

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hostinger-key
