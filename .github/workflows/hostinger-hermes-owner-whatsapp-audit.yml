name: Hostinger Hermes Owner WhatsApp Audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/hostinger-hermes-owner-whatsapp-audit.yml']

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOST: 69.62.68.67
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keygen -y -f ~/.ssh/key >/dev/null
      - name: Inspect MessageEvent
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/key "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== MESSAGEEVENT REFERENCES ==='
          grep -Rni --exclude-dir='__pycache__' 'MessageEvent' /root/.hermes/hermes-agent/gateway | head -120 || true
          echo '=== BASE EVENT REGION ==='
          grep -nE 'class .*Event|channel_prompt' /root/.hermes/hermes-agent/gateway/platforms/base.py | head -120 || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/key
