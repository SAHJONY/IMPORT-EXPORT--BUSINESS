name: Hostinger Hermes Owner WhatsApp Audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/hostinger-hermes-owner-whatsapp-audit.yml']

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOST: 69.62.68.67
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keygen -y -f ~/.ssh/key >/dev/null
      - name: Inspect sender context
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/key "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== WHATSAPP MESSAGE ROUTING 440-490 ==='
          sed -n '440,490p' /root/.hermes/hermes-agent/gateway/platforms/whatsapp.py
          echo '=== WHATSAPP SOURCE CREATION 1160-1200 ==='
          sed -n '1160,1200p' /root/.hermes/hermes-agent/gateway/platforms/whatsapp.py
          echo '=== SESSION CONTEXT 260-330 ==='
          sed -n '260,330p' /root/.hermes/hermes-agent/gateway/session.py
          echo '=== BASE PROMPT SENDER LOGIC 960-1010 ==='
          sed -n '960,1010p' /root/.hermes/hermes-agent/gateway/platforms/base.py
          echo '=== ACTIVE ENV OWNER KEYS ==='
          systemctl --user show hermes-gateway.service -p Environment --value | tr ' ' '\n' | grep -E 'OWNER|WHATSAPP' | sed -E 's/(TOKEN|KEY|SECRET)=.*/\1=<redacted>/' || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/key
