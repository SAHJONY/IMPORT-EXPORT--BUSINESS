name: Hostinger Hermes Owner WhatsApp Audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/hostinger-hermes-owner-whatsapp-audit.yml']

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOST: 69.62.68.67
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keygen -y -f ~/.ssh/key >/dev/null
      - name: Inspect types and identity helpers
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/key "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== MESSAGE EVENT DEFINITIONS ==='
          grep -Rni --exclude-dir='__pycache__' -E '^class MessageEvent|@dataclass[[:space:]]*$|channel_prompt:' /root/.hermes/hermes-agent/gateway | head -180 || true
          echo '=== WHATSAPP IDENTITY HELPERS ==='
          grep -nE '^def |^class ' /root/.hermes/hermes-agent/gateway/whatsapp_identity.py | head -120 || true
          sed -n '1,180p' /root/.hermes/hermes-agent/gateway/whatsapp_identity.py | head -180
          echo '=== WHATSAPP IMPORTS ==='
          sed -n '1,90p' /root/.hermes/hermes-agent/gateway/platforms/whatsapp.py
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/key
