name: Hostinger OpenClaw Model Failover Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-openclaw-model-failover-fix.yml'

permissions:
  contents: read

env:
  HOST: 69.62.68.67
  USER: root

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Validate protected credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_KEY" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          [[ -n "$OPENAI_API_KEY" ]] || { echo OPENAI_API_KEY_MISSING=1 >&2; exit 3; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/openclaw-model-fix
          chmod 600 ~/.ssh/openclaw-model-fix
          ssh-keygen -y -f ~/.ssh/openclaw-model-fix >/dev/null

      - name: Wait for Hostinger SSH
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for i in $(seq 1 30); do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 -i ~/.ssh/openclaw-model-fix "$USER@$HOST" 'printf SSH_READY' 2>/dev/null | grep -q SSH_READY; then
              ready=true
              echo "HOSTINGER_SSH_READY_ON_PROBE=$i"
              break
            fi
            echo "hostinger_ssh_probe=$i/30"
            sleep 10
          done
          [[ "$ready" == true ]] || { echo HOSTINGER_SSH_UNAVAILABLE=1 >&2; exit 4; }

      - name: Configure OpenAI fallback without exposing secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OPENAI_API_KEY" | ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/openclaw-model-fix "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          read -r OPENAI_KEY
          [[ -n "$OPENAI_KEY" ]] || { echo OPENAI_KEY_EMPTY_ON_HOST=1 >&2; exit 5; }

          install -d -m 755 /etc/systemd/system/openclaw-gateway.service.d
          umask 077
          cat >/etc/systemd/system/openclaw-gateway.service.d/20-openai-auth.conf <<EOF
          [Service]
          Environment="OPENAI_API_KEY=$OPENAI_KEY"
          EOF
          chmod 600 /etc/systemd/system/openclaw-gateway.service.d/20-openai-auth.conf

          cfg=/var/lib/sahjony-openclaw-state/openclaw.json
          test -f "$cfg"
          cp -a "$cfg" "$cfg.before-model-failover-fix"

          python3 - "$cfg" <<'PY'
          import json, sys
          p=sys.argv[1]
          d=json.load(open(p))
          agents=d.setdefault('agents', {})
          defaults=agents.setdefault('defaults', {})
          defaults['model']={
              'primary':'nvidia/openai/gpt-oss-120b',
              'fallbacks':['openai/gpt-5.5']
          }
          entries=agents.get('entries')
          if isinstance(entries, dict) and isinstance(entries.get('main'), dict):
              entries['main']['model']={
                  'primary':'nvidia/openai/gpt-oss-120b',
                  'fallbacks':['openai/gpt-5.5']
              }
          elif isinstance(entries, list):
              for row in entries:
                  if isinstance(row, dict) and row.get('id') == 'main':
                      row['model']={
                          'primary':'nvidia/openai/gpt-oss-120b',
                          'fallbacks':['openai/gpt-5.5']
                      }
          with open(p,'w') as f:
              json.dump(d,f,indent=2)
              f.write('\n')
          PY

          chmod 600 "$cfg"
          systemctl daemon-reload
          openclaw config validate --json >/tmp/openclaw-config-validate.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/openclaw-config-validate.json'))
          if d.get('valid') is False or d.get('ok') is False:
              raise SystemExit('OPENCLAW_CONFIG_INVALID')
          print('OPENCLAW_CONFIG_VALID=1')
          PY

          systemctl restart openclaw-gateway.service
          sleep 12
          systemctl is-active --quiet openclaw-gateway.service
          echo OPENCLAW_GATEWAY_ACTIVE=1

          python3 - <<'PY'
          import json
          d=json.load(open('/var/lib/sahjony-openclaw-state/openclaw.json'))
          m=((d.get('agents') or {}).get('defaults') or {}).get('model') or {}
          assert m.get('primary') == 'nvidia/openai/gpt-oss-120b', m
          assert 'openai/gpt-5.5' in (m.get('fallbacks') or []), m
          print('MODEL_PRIMARY=nvidia/openai/gpt-oss-120b')
          print('MODEL_FALLBACK=openai/gpt-5.5')
          PY

          envpresent="$(systemctl show openclaw-gateway.service -p Environment --value | grep -q 'OPENAI_API_KEY=' && echo true || echo false)"
          echo "OPENAI_RUNTIME_ENV_PRESENT=$envpresent"
          [[ "$envpresent" == true ]]

          timeout 90 openclaw models status --probe 2>&1 | sed -E 's/(sk-[A-Za-z0-9_-]{8})[A-Za-z0-9_-]+/\1***/g' | tail -n 160 || true
          echo SAHJONY_OPENCLAW_MODEL_FAILOVER_CONFIGURED=1
          REMOTE

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f ~/.ssh/openclaw-model-fix
