# Hostinger one-shot: write the OpenAI key into the WhatsApp service env
# Manual dispatch only. Writes OPENAI_API_KEY (GitHub secret) into
# /etc/sahjony-fallback/import-export.env alongside the Anthropic key.
# Backs up the env file first. Does NOT restart the service.
# Model pin OPENAI_PRIMARY_MODEL=gpt-5.6-sol is already set by the
# anthropic setup workflow; this only adds the missing key.
name: hostinger-openai-key-setup-once

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  configure-openai-key:
    runs-on: ubuntu-latest
    steps:
      - name: Write OpenAI key into WhatsApp service env
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            ENV_FILE=/etc/sahjony-fallback/import-export.env
            [ -f "$ENV_FILE" ] || { echo "MISSING_ENV_FILE=1"; exit 1; }
            BACKUP_DIR=/root/env-backups
            mkdir -p "$BACKUP_DIR"
            cp "$ENV_FILE" "$BACKUP_DIR/import-export.env.openai-key.$(date +%Y%m%d-%H%M%S)"
            echo BACKUP_WRITTEN=1
            KEY='${{ secrets.OPENAI_API_KEY }}'
            if [ -z "$KEY" ]; then echo "EMPTY_SECRET=1"; exit 1; fi
            case "$KEY" in
              sk-*) echo OPENAI_KEY_FORMAT_OK=1 ;;
              *)   echo "OPENAI_KEY_FORMAT_BAD=1"; exit 1 ;;
            esac
            python3 - "$ENV_FILE" "$KEY" <<'EOF'
            import sys
            env_file, key = sys.argv[1], sys.argv[2]
            name = 'OPENAI_API_KEY'
            lines = open(env_file).read().splitlines()
            found = False
            for i, ln in enumerate(lines):
                if ln.startswith(name + '='):
                    lines[i] = f'{name}={key}'
                    found = True
            if not found:
                lines.append(f'{name}={key}')
            open(env_file, 'w').write('\n'.join(lines) + '\n')
            print(('REPLACED_' if found else 'ADDED_') + name + '=<redacted>')
            EOF
            grep -q '^OPENAI_API_KEY=sk-' "$ENV_FILE" && echo OPENAI_KEY_PIN_OK=1
            echo DONE_NO_RESTART=1
