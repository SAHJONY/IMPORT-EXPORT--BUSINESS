name: Hostinger Hermes Pair Inspect
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      HOST: 69.62.68.67
      USER: root
      KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Inspect Hermes pair-only interface
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/key "$USER@$HOST" "sed -n '1088,1112p' /root/.hermes/hermes-agent/scripts/whatsapp-bridge/bridge.js; echo '---package---'; cat /root/.hermes/hermes-agent/scripts/whatsapp-bridge/package.json"
