name: VPS Run Command

# General-purpose root command runner for the Hostinger VPS (69.62.68.67).
# Dispatch with confirm=YES and the command to run. Output streams to the
# workflow log. The VPS login shell is zsh — quote URLs with query strings.
#
# NEVER use this to touch the live WhatsApp gateway:
#   /root/.hermes, /opt/sahjony-hermes, hermes systemd units.
# The fallback host lives under /opt/sahjony-fallback and
# /etc/sahjony-fallback (systemd units sahjony-fallback-*).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to run the command on the VPS as root"
        required: true
        default: "NO"
      command:
        description: "Shell command to run as root on the VPS"
        required: true

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

env:
  VM_ID: '767852'
  HOST: '69.62.68.67'
  SSH_USER: root

jobs:
  run:
    if: ${{ inputs.confirm == 'YES' && inputs.command != 'INSTALL_ODDS_KEY' && inputs.command != 'INSTALL_OWNER_AUTH' && inputs.command != 'INSTALL_AIS_KEY' && inputs.command != 'INSTALL_NVIDIA_KEY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      VPS_COMMAND: ${{ inputs.command }}
    steps:
      - name: Run command on VPS
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" ]] || { echo "HOSTINGER_SSH_PRIVATE_KEY secret missing" >&2; exit 1; }
          [[ -n "$VPS_COMMAND" ]] || { echo "empty command" >&2; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps-key
          chmod 600 ~/.ssh/vps-key
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 -i ~/.ssh/vps-key "$SSH_USER@$HOST" "$VPS_COMMAND"
          echo "VPS_RUN_EXIT=$?"

  # Instalación segura de ODDS_API_KEY (SAHJONY SPORT) en el VPS.
  # La llave viaja del GitHub secret al VPS por stdin: nunca aparece en
  # comandos, logs ni chat. Se despacha con command=INSTALL_ODDS_KEY.
  install-odds-key:
    if: ${{ inputs.confirm == 'YES' && inputs.command == 'INSTALL_ODDS_KEY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Install ODDS_API_KEY on VPS
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" ]] || { echo "HOSTINGER_SSH_PRIVATE_KEY secret missing" >&2; exit 1; }
          [[ -n "$ODDS_API_KEY" ]] || { echo "ODDS_API_KEY secret missing: agrégalo en Settings → Secrets → Actions del repo" >&2; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps-key
          chmod 600 ~/.ssh/vps-key
          printf '%s' "$ODDS_API_KEY" | ssh -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -i ~/.ssh/vps-key \
            "$SSH_USER@$HOST" 'umask 077 && mkdir -p /etc/sahjony-sport && cat > /etc/sahjony-sport/odds.env.tmp && { printf "ODDS_API_KEY="; cat /etc/sahjony-sport/odds.env.tmp; echo; } > /etc/sahjony-sport/odds.env && rm -f /etc/sahjony-sport/odds.env.tmp && chmod 600 /etc/sahjony-sport/odds.env && systemctl enable --now sahjony-odds-sync.timer && systemctl restart sahjony-sport && echo INSTALL_OK'

  # Instalación segura de credenciales locales del dueño (SAHJONY SPORT).
  # Juan agrega los secrets SPORT_OWNER_USER y SPORT_OWNER_PASSWORD en
  # Settings → Secrets → Actions de este repo. Ambos viajan al VPS por
  # stdin (nunca en comandos ni logs); en el VPS la clave se convierte a
  # hash pbkdf2 con scripts/make_owner_hash.py del repo sahjony-sport y
  # solo el hash queda en /etc/sahjony-sport/owner.env (600).
  # Se despacha con command=INSTALL_OWNER_AUTH.
  install-owner-auth:
    if: ${{ inputs.confirm == 'YES' && inputs.command == 'INSTALL_OWNER_AUTH' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Install owner auth on VPS
        shell: bash
        env:
          SPORT_OWNER_USER: ${{ secrets.SPORT_OWNER_USER }}
          SPORT_OWNER_PASSWORD: ${{ secrets.SPORT_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" ]] || { echo "HOSTINGER_SSH_PRIVATE_KEY secret missing" >&2; exit 1; }
          [[ -n "$SPORT_OWNER_USER" ]] || { echo "SPORT_OWNER_USER secret missing: agrégalo en Settings → Secrets → Actions del repo" >&2; exit 1; }
          [[ -n "$SPORT_OWNER_PASSWORD" ]] || { echo "SPORT_OWNER_PASSWORD secret missing: agrégalo en Settings → Secrets → Actions del repo" >&2; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps-key
          chmod 600 ~/.ssh/vps-key
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -i ~/.ssh/vps-key"
          # Paso 1: la clave viaja por stdin y en el VPS se convierte a hash pbkdf2.
          printf '%s' "$SPORT_OWNER_PASSWORD" | ssh $SSH_OPTS "$SSH_USER@$HOST" \
            'umask 077 && mkdir -p /etc/sahjony-sport && python3 /opt/sahjony-sport/apps/api/scripts/make_owner_hash.py > /etc/sahjony-sport/.owner_hash.tmp && chmod 600 /etc/sahjony-sport/.owner_hash.tmp && echo HASH_OK'
          # Paso 2: el usuario viaja por stdin y se arma owner.env (solo hash, sin clave en plano).
          printf '%s\n' "$SPORT_OWNER_USER" | ssh $SSH_OPTS "$SSH_USER@$HOST" \
            'umask 077 && read -r OUSER && { printf "OWNER_USERNAME=%s\n" "$OUSER"; printf "OWNER_PASSWORD_HASH="; cat /etc/sahjony-sport/.owner_hash.tmp; printf "\n"; } > /etc/sahjony-sport/owner.env && rm -f /etc/sahjony-sport/.owner_hash.tmp && chmod 600 /etc/sahjony-sport/owner.env && mkdir -p /etc/systemd/system/sahjony-sport.service.d && printf "[Service]\nEnvironmentFile=/etc/sahjony-sport/owner.env\n" > /etc/systemd/system/sahjony-sport.service.d/owner-auth.conf && systemctl daemon-reload && systemctl restart sahjony-sport && sleep 4 && curl -sf http://127.0.0.1:8108/api/v1/health >/dev/null && echo INSTALL_OK'

  # Instalación segura de AISSTREAM_API_KEY (God's Eye View) en el VPS.
  # Juan agrega el secret AISSTREAM_API_KEY en Settings → Secrets → Actions
  # de este repo. La llave viaja del GitHub secret al VPS por stdin (nunca
  # aparece en comandos, logs ni chat) y queda en /etc/gods-eye-view/ais.env
  # (600), cargado por gods-eye-view.service vía drop-in EnvironmentFile.
  # Se despacha con command=INSTALL_AIS_KEY.
  install-ais-key:
    if: ${{ inputs.confirm == 'YES' && inputs.command == 'INSTALL_AIS_KEY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Install AISSTREAM_API_KEY on VPS
        shell: bash
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" ]] || { echo "HOSTINGER_SSH_PRIVATE_KEY secret missing" >&2; exit 1; }
          [[ -n "$AISSTREAM_API_KEY" ]] || { echo "AISSTREAM_API_KEY secret missing: agrégalo en Settings → Secrets → Actions del repo" >&2; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps-key
          chmod 600 ~/.ssh/vps-key
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -i ~/.ssh/vps-key"
          printf '%s' "$AISSTREAM_API_KEY" | ssh $SSH_OPTS "$SSH_USER@$HOST" \
            'umask 077 && mkdir -p /etc/gods-eye-view && cat > /etc/gods-eye-view/ais.env.tmp && { printf "AISSTREAM_API_KEY="; cat /etc/gods-eye-view/ais.env.tmp; printf "\n"; } > /etc/gods-eye-view/ais.env && rm -f /etc/gods-eye-view/ais.env.tmp && chmod 600 /etc/gods-eye-view/ais.env && mkdir -p /etc/systemd/system/gods-eye-view.service.d && printf "[Service]\nEnvironmentFile=/etc/gods-eye-view/ais.env\n" > /etc/systemd/system/gods-eye-view.service.d/ais-key.conf && systemctl daemon-reload && systemctl restart gods-eye-view.service && sleep 10 && curl -sf http://127.0.0.1:8200/api/ais-live >/dev/null && echo INSTALL_OK'

  # Instalación segura de NVIDIA_API_KEY (Sofia WhatsApp, fallback NIM) en el VPS.
  # Juan agrega el secret NVIDIA_API_KEY en Settings → Secrets → Actions de
  # este repo. La llave viaja del GitHub secret al VPS por stdin (nunca aparece
  # en comandos, logs ni chat) y queda como NVIDIA_API_KEY dentro de
  # /etc/sahjony-fallback/import-export.env (600), que ya carga
  # sahjony-fallback-whatsapp.service vía EnvironmentFile. Update-or-append:
  # re-ejecutable sin duplicar la línea. No reinicia el servicio; el deploy
  # posterior lo hace. Se despacha con command=INSTALL_NVIDIA_KEY.
  install-nvidia-key:
    if: ${{ inputs.confirm == 'YES' && inputs.command == 'INSTALL_NVIDIA_KEY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Install NVIDIA_API_KEY on VPS
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" ]] || { echo "HOSTINGER_SSH_PRIVATE_KEY secret missing" >&2; exit 1; }
          [[ -n "$NVIDIA_API_KEY" ]] || { echo "NVIDIA_API_KEY secret missing: agrégalo en Settings → Secrets → Actions del repo" >&2; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps-key
          chmod 600 ~/.ssh/vps-key
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -i ~/.ssh/vps-key"
          printf '%s' "$NVIDIA_API_KEY" | ssh $SSH_OPTS "$SSH_USER@$HOST" \
            'umask 077 && F=/etc/sahjony-fallback/import-export.env && cp $F $F.bak.$(date +%Y%m%d%H%M%S) && KEY=$(cat) && grep -v "^NVIDIA_API_KEY=" $F > $F.tmp && printf "NVIDIA_API_KEY=%s\n" "$KEY" >> $F.tmp && mv $F.tmp $F && chmod 600 $F && grep -c "^NVIDIA_API_KEY=." $F && echo INSTALL_OK'
