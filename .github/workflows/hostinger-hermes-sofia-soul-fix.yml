name: Hostinger Hermes Sofia Soul Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hostinger-hermes-sofia-soul-fix.yml

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOST: 69.62.68.67
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keygen -y -f ~/.ssh/key >/dev/null
      - name: Diagnose and enforce Sofia identity
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/key "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HPY=/root/.hermes/hermes-agent/venv/bin/python
          echo '=== SOUL REFERENCES ==='
          grep -Rni --exclude-dir='__pycache__' -E 'SOUL\.md|SYSTEM_PROMPT|system_prompt|system prompt|persona|profile' /root/.hermes/hermes-agent/hermes_cli /root/.hermes/hermes-agent/run_agent.py 2>/dev/null | head -240 || true
          echo '=== GATEWAY ENV ==='
          systemctl --user show hermes-gateway.service -p Environment --value | sed -E 's/(KEY|TOKEN|SECRET|PASSWORD)=[^ ]+/\1=<redacted>/g'
          echo '=== SOUL PRESENT ==='
          test -s /root/.hermes/SOUL.md && echo SOUL_PRESENT=1 || echo SOUL_PRESENT=0
          head -8 /root/.hermes/SOUL.md 2>/dev/null || true
          echo '=== HERMES CHAT SMOKE ==='
          timeout 90 "$HPY" -m hermes_cli.main -z 'Who are you? Reply in one sentence with your name, role, and company only.' 2>&1 | tail -80 || true
          echo '=== RECENT WHATSAPP/GATEWAY LOGS ==='
          journalctl --user -u hermes-gateway.service --since '20 minutes ago' --no-pager 2>/dev/null | tail -120 | sed -E 's/(nvapi-|sk-)[A-Za-z0-9_\-]+/<redacted>/g' || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/key
