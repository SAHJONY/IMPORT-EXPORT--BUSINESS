name: Hostinger Hermes Tool Trace Audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hostinger-hermes-tool-trace-audit.yml

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HOST: 69.62.68.67
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
      - name: Audit trace emitters
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/key "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT=/root/.hermes/hermes-agent
          echo '=== gateway progress refs ==='
          grep -Rni --exclude='*.pyc' -E 'tool_call|tool call|tool_progress|progress_callback|on_tool|display_tool|format_tool|send.*tool' "$ROOT/gateway" | head -180 || true
          echo '=== display relevant ==='
          sed -n '150,240p' "$ROOT/agent/display.py" || true
          sed -n '900,990p' "$ROOT/agent/display.py" || true
          echo '=== whatsapp send refs ==='
          grep -nE 'send_message|send_text|progress|tool|typing' "$ROOT/gateway/platforms/whatsapp.py" | head -180 || true
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/key
