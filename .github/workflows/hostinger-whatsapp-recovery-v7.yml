name: Hostinger WhatsApp Recovery V7

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

env:
  HOSTINGER_API_BASE: https://developers.hostinger.com
  VM_ID: '767852'
  HOST: '69.62.68.67'
  USER: root

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      DURABLE_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare bounded recovery credentials
        id: creds
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$API_TOKEN" ]] || { echo HOSTINGER_API_TOKEN_MISSING=1 >&2; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass netcat-openbsd jq >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/hostinger-recovery-v7 -C "sahjony-v7-${GITHUB_RUN_ID}"
          RECOVERY_PASSWORD="$(openssl rand -hex 18)Aa1!"
          echo "::add-mask::$RECOVERY_PASSWORD"
          echo "recovery_password=$RECOVERY_PASSWORD" >> "$GITHUB_OUTPUT"
          if [[ -n "$DURABLE_PRIVATE_KEY" ]]; then
            printf '%s\n' "$DURABLE_PRIVATE_KEY" > ~/.ssh/hostinger-durable
            chmod 600 ~/.ssh/hostinger-durable
            ssh-keygen -y -f ~/.ssh/hostinger-durable > ~/.ssh/hostinger-durable.pub
            echo durable_key_present=true >> "$GITHUB_OUTPUT"
          else
            echo durable_key_present=false >> "$GITHUB_OUTPUT"
          fi

      - name: Read VM state and reject overlapping recovery
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          vm="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID")"
          state="$(jq -r '.state // empty' <<<"$vm")"
          ip="$(jq -r '[.. | objects | .address? // empty | select(type=="string") | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first // empty' <<<"$vm")"
          [[ -z "$ip" || "$ip" == "$HOST" ]] || { echo HOSTINGER_VM_IDENTITY_MISMATCH=$ip >&2; exit 3; }
          echo "HOSTINGER_VM_STATE=${state:-unknown}"
          actions="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/actions?page=1")"
          if jq -e '[.data[]? | select((.name == "ct_recovery" or .name == "ct_recovery_stop") and (.state == "sent" or .state == "started" or .state == "pending" or .state == "running" or .state == "queued"))] | length > 0' >/dev/null <<<"$actions"; then
            echo HOSTINGER_RECOVERY_ALREADY_ACTIVE=1 >&2
            jq -c '[.data[]? | select((.name == "ct_recovery" or .name == "ct_recovery_stop") and (.state != "success")) | {id,name,state,created_at,updated_at}]' <<<"$actions" >&2 || true
            exit 4
          fi
          tcp=false
          nc -z -w 5 "$HOST" 22 >/dev/null 2>&1 && tcp=true || true
          echo "tcp22=$tcp" >> "$GITHUB_OUTPUT"
          durable=false
          if [[ "$tcp" == true && -s ~/.ssh/hostinger-durable ]]; then
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 -i ~/.ssh/hostinger-durable "$USER@$HOST" 'printf DURABLE_SSH_OK' 2>/dev/null | grep -q DURABLE_SSH_OK && durable=true || true
          fi
          echo "durable_ssh_ready=$durable" >> "$GITHUB_OUTPUT"
          echo "HOSTINGER_TCP22=$tcp DURABLE_SSH_READY=$durable"

      - name: Try one normal VPS restart before disk recovery
        id: normal_restart
        if: steps.preflight.outputs.durable_ssh_ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo HOSTINGER_NORMAL_RESTART_BEFORE_RECOVERY=1
          body="$(curl -fsS -X POST -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/restart")"
          rid="$(jq -r '.id // empty' <<<"$body")"
          [[ "$rid" =~ ^[0-9]+$ ]] || { echo HOSTINGER_RESTART_ACTION_ID_MISSING=1 >&2; jq -c . <<<"$body" >&2 || true; exit 5; }
          success=false
          for i in $(seq 1 120); do
            a="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/actions/$rid")"
            state="$(jq -r '.state // empty' <<<"$a")"
            echo "pre_recovery_restart_probe=$i/120 state=${state:-unknown}"
            case "$state" in
              success) success=true; break ;;
              failed|failure|error|cancelled|canceled) jq -c . <<<"$a" >&2 || true; exit 6 ;;
            esac
            sleep 5
          done
          [[ "$success" == true ]] || { echo HOSTINGER_PRE_RECOVERY_RESTART_TIMEOUT=1 >&2; exit 7; }
          tcp=false
          for i in $(seq 1 36); do
            if nc -z -w 4 "$HOST" 22 >/dev/null 2>&1; then tcp=true; break; fi
            echo "tcp22_after_restart_probe=$i/36"
            sleep 5
          done
          durable=false
          if [[ "$tcp" == true && -s ~/.ssh/hostinger-durable ]]; then
            for i in $(seq 1 12); do
              if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 -i ~/.ssh/hostinger-durable "$USER@$HOST" 'printf DURABLE_SSH_OK' 2>/dev/null | grep -q DURABLE_SSH_OK; then durable=true; break; fi
              sleep 5
            done
          fi
          echo "tcp22=$tcp" >> "$GITHUB_OUTPUT"
          echo "durable_ssh_ready=$durable" >> "$GITHUB_OUTPUT"
          echo "HOSTINGER_TCP22_AFTER_NORMAL_RESTART=$tcp DURABLE_SSH_READY_AFTER_RESTART=$durable"

      - name: Start owned Hostinger Recovery only if still required
        id: start
        if: steps.preflight.outputs.durable_ssh_ready != 'true' && steps.normal_restart.outputs.durable_ssh_ready != 'true'
        env:
          RECOVERY_PASSWORD: ${{ steps.creds.outputs.recovery_password }}
        shell: bash
        run: |
          set -euo pipefail
          actions="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/actions?page=1")"
          if jq -e '[.data[]? | select((.name == "ct_recovery" or .name == "ct_recovery_stop") and (.state == "sent" or .state == "started" or .state == "pending" or .state == "running" or .state == "queued"))] | length > 0' >/dev/null <<<"$actions"; then
            echo HOSTINGER_RECOVERY_COLLISION_BLOCKED=1 >&2
            exit 8
          fi
          payload="$(jq -n --arg p "$RECOVERY_PASSWORD" '{root_password:$p}')"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST -H "Authorization: Bearer $API_TOKEN" -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$payload" "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/recovery")"
          body="$(cat "$tmp")"; rm -f "$tmp"
          [[ "$code" == 200 || "$code" == 201 || "$code" == 202 ]] || { echo "HOSTINGER_RECOVERY_START_HTTP=$code" >&2; jq -c . <<<"$body" >&2 2>/dev/null || printf '%s\n' "$body" >&2; exit 9; }
          id="$(jq -r '.id // empty' <<<"$body")"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo HOSTINGER_RECOVERY_ACTION_ID_MISSING=1 >&2; exit 10; }
          echo "action_id=$id" >> "$GITHUB_OUTPUT"
          echo "recovery_owned=true" >> "$GITHUB_OUTPUT"
          echo "HOSTINGER_RECOVERY_V7_OWNED_ACTION=$id"

      - name: Wait for owned Recovery start success
        if: steps.start.outputs.recovery_owned == 'true'
        env:
          ACTION_ID: ${{ steps.start.outputs.action_id }}
        shell: bash
        run: |
          set -euo pipefail
          success=false
          for i in $(seq 1 120); do
            a="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/actions/$ACTION_ID")"
            state="$(jq -r '.state // empty' <<<"$a")"
            echo "recovery_start_probe=$i/120 state=${state:-unknown}"
            case "$state" in
              success) success=true; break ;;
              failed|failure|error|cancelled|canceled) jq -c . <<<"$a" >&2 || true; exit 11 ;;
            esac
            sleep 5
          done
          [[ "$success" == true ]] || { echo HOSTINGER_RECOVERY_START_TIMEOUT=1 >&2; exit 12; }

      - name: Authenticate owned Recovery SSH
        if: steps.start.outputs.recovery_owned == 'true'
        env:
          RECOVERY_PASSWORD: ${{ steps.creds.outputs.recovery_password }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$RECOVERY_PASSWORD"
          ready=false
          for i in $(seq 1 60); do
            : >/tmp/recovery-v7.err
            if sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 "$USER@$HOST" 'printf RECOVERY_V7_OK' 2>/tmp/recovery-v7.err | grep -q RECOVERY_V7_OK; then ready=true; break; fi
            if (( i == 1 || i % 10 == 0 || i == 60 )); then sed -n '1,12p' /tmp/recovery-v7.err || true; fi
            sleep 10
          done
          [[ "$ready" == true ]] || { echo HOSTINGER_RECOVERY_V7_SSH_FAILED=1 >&2; exit 13; }

      - name: Repair original Kali and seed durable SSH identity
        if: steps.start.outputs.recovery_owned == 'true'
        env:
          RECOVERY_PASSWORD: ${{ steps.creds.outputs.recovery_password }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$RECOVERY_PASSWORD"
          EPHEMERAL_B64="$(base64 -w0 ~/.ssh/hostinger-recovery-v7.pub)"
          DURABLE_B64=''
          [[ -s ~/.ssh/hostinger-durable.pub ]] && DURABLE_B64="$(base64 -w0 ~/.ssh/hostinger-durable.pub)"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -o PreferredAuthentications=password -o PubkeyAuthentication=no "$USER@$HOST" "EPHEMERAL_B64='$EPHEMERAL_B64' DURABLE_B64='$DURABLE_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          root=''
          for mp in /mnt /mnt/sdb1; do
            if [ -f "$mp/etc/os-release" ] && [ -d "$mp/root" ] && [ -d "$mp/etc/ssh" ]; then root="$mp"; break; fi
          done
          if [ -z "$root" ]; then
            mkdir -p /mnt/sahjony-discovery
            n=0
            while read -r dev fs mp type; do
              case "$type:$fs" in part:ext2|part:ext3|part:ext4|part:xfs|part:btrfs|lvm:ext2|lvm:ext3|lvm:ext4|lvm:xfs|lvm:btrfs) ;; *) continue ;; esac
              if [ -z "${mp:-}" ]; then
                n=$((n+1)); t="/mnt/sahjony-discovery/$n"; mkdir -p "$t"
                if [ "$fs" = xfs ]; then mount -o nouuid "$dev" "$t" 2>/dev/null || true; else mount "$dev" "$t" 2>/dev/null || true; fi
              fi
            done < <(lsblk -prno NAME,FSTYPE,MOUNTPOINT,TYPE 2>/dev/null)
            while read -r mp; do
              [ "$mp" = / ] && continue
              if [ -f "$mp/etc/os-release" ] && [ -d "$mp/root" ] && [ -d "$mp/etc/ssh" ]; then root="$mp"; break; fi
            done < <(findmnt -rn -o TARGET | sort -u)
          fi
          [ -n "$root" ] || { echo ORIGINAL_KALI_ROOT_NOT_FOUND=1 >&2; exit 20; }
          echo "ORIGINAL_KALI_ROOT=$root"
          install -d -m 700 "$root/root/.ssh"
          touch "$root/root/.ssh/authorized_keys"
          chmod 600 "$root/root/.ssh/authorized_keys"
          ephemeral="$(printf '%s' "$EPHEMERAL_B64" | base64 -d)"
          grep -qxF "$ephemeral" "$root/root/.ssh/authorized_keys" || printf '%s\n' "$ephemeral" >> "$root/root/.ssh/authorized_keys"
          if [ -n "$DURABLE_B64" ]; then
            durable="$(printf '%s' "$DURABLE_B64" | base64 -d)"
            grep -qxF "$durable" "$root/root/.ssh/authorized_keys" || printf '%s\n' "$durable" >> "$root/root/.ssh/authorized_keys"
            echo HOSTINGER_DURABLE_SSH_IDENTITY_SEEDED=1
          fi
          install -d "$root/etc/ssh/sshd_config.d" "$root/run/sshd" "$root/etc/systemd/system/multi-user.target.wants"
          cat > "$root/etc/ssh/sshd_config.d/99-sahjony-recovery-v7.conf" <<'EOF'
          PubkeyAuthentication yes
          PermitRootLogin prohibit-password
          PasswordAuthentication no
          EOF
          chmod 600 "$root/etc/ssh/sshd_config.d/99-sahjony-recovery-v7.conf"
          enabled=false
          for unit in ssh.service sshd.service; do
            target="$(find "$root/lib/systemd/system" "$root/usr/lib/systemd/system" -maxdepth 1 -name "$unit" -print -quit 2>/dev/null || true)"
            if [ -n "$target" ]; then
              ln -sfn "/${target#"$root/"}" "$root/etc/systemd/system/multi-user.target.wants/$unit"
              echo "SSH_UNIT_ENABLED=$unit"
              enabled=true
              break
            fi
          done
          [[ "$enabled" == true ]] || { echo SSH_SYSTEMD_UNIT_NOT_FOUND=1 >&2; exit 21; }
          chroot "$root" /usr/bin/ssh-keygen -A 2>/dev/null || true
          chroot "$root" /usr/sbin/sshd -t
          sync
          echo ORIGINAL_KALI_SSH_V7_REPAIRED=1
          REMOTE

      - name: Stop only the Recovery owned by this run
        id: stop
        if: steps.start.outputs.recovery_owned == 'true'
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS -X DELETE -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/recovery")"
          id="$(jq -r '.id // empty' <<<"$body")"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo HOSTINGER_RECOVERY_STOP_ACTION_ID_MISSING=1 >&2; jq -c . <<<"$body" >&2 || true; exit 30; }
          echo "action_id=$id" >> "$GITHUB_OUTPUT"
          echo "stop_requested=true" >> "$GITHUB_OUTPUT"
          echo "HOSTINGER_RECOVERY_V7_STOP_ACTION=$id"

      - name: Wait for owned Recovery stop success
        id: stop_wait
        if: steps.stop.outputs.stop_requested == 'true'
        env:
          ACTION_ID: ${{ steps.stop.outputs.action_id }}
        shell: bash
        run: |
          set -euo pipefail
          success=false
          for i in $(seq 1 120); do
            a="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/actions/$ACTION_ID")"
            state="$(jq -r '.state // empty' <<<"$a")"
            echo "recovery_stop_probe=$i/120 state=${state:-unknown}"
            case "$state" in
              success) success=true; break ;;
              failed|failure|error|cancelled|canceled) jq -c . <<<"$a" >&2 || true; exit 31 ;;
            esac
            sleep 5
          done
          [[ "$success" == true ]] || { echo HOSTINGER_RECOVERY_STOP_TIMEOUT=1 >&2; exit 32; }
          echo stop_complete=true >> "$GITHUB_OUTPUT"

      - name: Establish authenticated normal SSH after repair
        id: normal_ssh
        if: steps.preflight.outputs.durable_ssh_ready != 'true' && steps.normal_restart.outputs.durable_ssh_ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local count="$1"
            for i in $(seq 1 "$count"); do
              if nc -z -w 4 "$HOST" 22 >/dev/null 2>&1 && ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 -i ~/.ssh/hostinger-recovery-v7 "$USER@$HOST" 'printf NORMAL_V7_OK' 2>/tmp/normal-v7.err | grep -q NORMAL_V7_OK; then return 0; fi
              if (( i == 1 || i % 10 == 0 || i == count )); then echo "normal_ssh_probe=$i/$count"; sed -n '1,12p' /tmp/normal-v7.err 2>/dev/null || true; fi
              sleep 5
            done
            return 1
          }
          if ! probe 36; then
            echo HOSTINGER_ONE_POST_RECOVERY_RESTART=1
            body="$(curl -fsS -X POST -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/restart")"
            rid="$(jq -r '.id // empty' <<<"$body")"
            [[ "$rid" =~ ^[0-9]+$ ]] || { echo HOSTINGER_POST_RECOVERY_RESTART_ID_MISSING=1 >&2; exit 40; }
            success=false
            for j in $(seq 1 120); do
              a="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/actions/$rid")"
              state="$(jq -r '.state // empty' <<<"$a")"
              echo "post_recovery_restart_probe=$j/120 state=${state:-unknown}"
              case "$state" in success) success=true; break;; failed|failure|error|cancelled|canceled) exit 41;; esac
              sleep 5
            done
            [[ "$success" == true ]] || { echo HOSTINGER_POST_RECOVERY_RESTART_TIMEOUT=1 >&2; exit 42; }
            probe 48 || { echo NORMAL_KALI_SSH_UNREACHABLE_AFTER_V7_REPAIR=1 >&2; exit 43; }
          fi
          echo NORMAL_V7_SSH_READY=1

      - name: Select authenticated management key
        id: management
        shell: bash
        run: |
          set -euo pipefail
          key=''
          if [[ "${{ steps.preflight.outputs.durable_ssh_ready }}" == true || "${{ steps.normal_restart.outputs.durable_ssh_ready }}" == true ]]; then
            key="$HOME/.ssh/hostinger-durable"
          elif [[ "${{ steps.normal_ssh.outcome }}" == success ]]; then
            key="$HOME/.ssh/hostinger-recovery-v7"
          fi
          [[ -n "$key" && -s "$key" ]] || { echo HOSTINGER_MANAGEMENT_KEY_UNAVAILABLE=1 >&2; exit 44; }
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo HOSTINGER_AUTHENTICATED_MANAGEMENT_PATH=1

      - name: Stabilize Docker and existing OpenClaw
        id: stabilize
        env:
          KEY: ${{ steps.management.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i "$KEY" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || { echo DOCKER_NOT_FOUND=1 >&2; exit 50; }
          systemctl enable --now docker >/dev/null 2>&1 || true
          mapfile -t ids < <(docker ps -aq | while read -r id; do meta="$(docker inspect "$id" --format '{{.Name}}|{{.Config.Image}}' 2>/dev/null || true)"; grep -Eqi 'openclaw|claw' <<<"$meta" && printf '%s\n' "$id"; done)
          ((${#ids[@]})) || { echo OPENCLAW_EXISTING_CONTAINER_NOT_FOUND=1 >&2; docker ps -a; exit 51; }
          for id in "${ids[@]}"; do
            docker update --restart unless-stopped "$id" >/dev/null
            [ "$(docker inspect "$id" --format '{{.State.Running}}')" = true ] || docker start "$id" >/dev/null
            docker inspect "$id" --format 'OPENCLAW name={{.Name}} status={{.State.Status}} restart={{.HostConfig.RestartPolicy.Name}}'
          done
          echo SAHJONY_DOCKER_OPENCLAW_V7_STABILIZED=1
          REMOTE

      - name: Install and run 24x7 guardian
        env:
          KEY: ${{ steps.management.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$KEY" openclaw/hostinger-24x7/whatsapp-guardian.sh openclaw/hostinger-24x7/install-whatsapp-guardian.sh "$USER@$HOST:/root/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$KEY" "$USER@$HOST" 'install -d /opt/sahjony/openclaw/hostinger-24x7; mv /root/whatsapp-guardian.sh /root/install-whatsapp-guardian.sh /opt/sahjony/openclaw/hostinger-24x7/; chmod +x /opt/sahjony/openclaw/hostinger-24x7/*.sh; cd /opt/sahjony/openclaw/hostinger-24x7 && ./install-whatsapp-guardian.sh; systemctl is-active --quiet sahjony-whatsapp-guardian.timer; /usr/local/sbin/sahjony-whatsapp-guardian; test -s /var/lib/sahjony-whatsapp-guardian/last-good; echo SAHJONY_HOSTINGER_WHATSAPP_LOCAL_24X7=READY'

      - name: Secondary public health snapshot
        if: always()
        shell: bash
        run: |
          set +e
          body="$(curl -fsS --max-time 20 https://www.sahjony.com/whatsapp/health 2>/dev/null || true)"
          printf '%s\n' "$body" | jq '{status,provider,gateway_connected,hostinger_independent_runtime,hostinger_openclaw}' 2>/dev/null || true
          echo PUBLIC_HEALTH_IS_SECONDARY_EVIDENCE=1

      - name: Cleanup only resources owned by this run
        if: always()
        shell: bash
        run: |
          set +e
          if [[ "${{ steps.normal_ssh.outcome }}" == success && -f ~/.ssh/hostinger-recovery-v7.pub ]]; then
            PUB_B64="$(base64 -w0 ~/.ssh/hostinger-recovery-v7.pub)"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/hostinger-recovery-v7 "$USER@$HOST" "PUB_B64='$PUB_B64' bash -s" <<'REMOTE'
          set +e
          pub="$(printf '%s' "$PUB_B64" | base64 -d)"
          if [ -f /root/.ssh/authorized_keys ]; then
            tmp="$(mktemp)"; grep -vxF "$pub" /root/.ssh/authorized_keys > "$tmp" || true; cat "$tmp" > /root/.ssh/authorized_keys; rm -f "$tmp"; chmod 600 /root/.ssh/authorized_keys
          fi
          REMOTE
          fi
          if [[ "${{ steps.start.outputs.recovery_owned }}" == true && "${{ steps.stop_wait.outputs.stop_complete }}" != true ]]; then
            echo CLEANUP_STOPPING_ONLY_THIS_RUN_OWNED_RECOVERY=1
            curl -sS -X DELETE -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/recovery" >/dev/null 2>&1 || true
          else
            echo CLEANUP_RECOVERY_DELETE_SKIPPED_NO_OWNERSHIP_OR_ALREADY_STOPPED=1
          fi
          rm -f ~/.ssh/hostinger-recovery-v7 ~/.ssh/hostinger-recovery-v7.pub ~/.ssh/hostinger-durable ~/.ssh/hostinger-durable.pub
          echo HOSTINGER_WHATSAPP_RECOVERY_V7_CLEANUP_COMPLETE=1
