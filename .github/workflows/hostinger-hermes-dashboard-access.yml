name: Hostinger Hermes Dashboard Access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-dashboard
          chmod 600 ~/.ssh/hostinger-dashboard
      - name: Configure loopback dashboard
        env:
          HOST: 69.62.68.67
          USER: root
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/hostinger-dashboard "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=/root/.hermes/hermes-agent/venv/bin/hermes
          test -x "$HERMES"
          install -d -m 700 /root/.config/systemd/user
          PUB='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK+NIRSlZfAXg8MJlnXW+hzAcaennhNJ2uC0dZOMSiFw sahjony-hermes-dashboard'
          install -d -m 700 /root/.ssh
          touch /root/.ssh/authorized_keys
          chmod 600 /root/.ssh/authorized_keys
          grep -Fqx "$PUB" /root/.ssh/authorized_keys || printf '%s\n' "$PUB" >> /root/.ssh/authorized_keys
          cat > /root/.config/systemd/user/hermes-dashboard.service <<EOF
          [Unit]
          Description=Hermes Dashboard loopback service
          After=network-online.target

          [Service]
          Type=simple
          ExecStart=$HERMES dashboard --host 127.0.0.1 --port 9119 --no-open --skip-build
          Restart=on-failure
          RestartSec=5
          Environment=HOME=/root

          [Install]
          WantedBy=default.target
          EOF
          systemctl --user daemon-reload
          systemctl --user enable --now hermes-dashboard.service
          for i in $(seq 1 30); do
            curl -fsS --max-time 2 http://127.0.0.1:9119/ >/dev/null 2>&1 && break
            sleep 1
          done
          systemctl --user is-active --quiet hermes-dashboard.service
          curl -fsS --max-time 3 http://127.0.0.1:9119/ >/dev/null
          echo HOSTINGER_HERMES_DASHBOARD_READY=1
          echo HOSTINGER_HERMES_DASHBOARD_BIND=127.0.0.1:9119
          REMOTE
      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/hostinger-dashboard
