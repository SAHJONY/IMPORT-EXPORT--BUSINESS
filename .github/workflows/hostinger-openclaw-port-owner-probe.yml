name: Hostinger OpenClaw Port Owner Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-openclaw-port-owner-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HOST: '69.62.68.67'
  USER: root

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Inspect port 18789 ownership
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-key
          chmod 600 ~/.ssh/hostinger-key
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/hostinger-key "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== SS_18789 ==='
          ss -ltnp 2>/dev/null | grep ':18789' || true
          echo '=== DOCKER_PS ==='
          docker ps --format '{{.ID}} {{.Names}} {{.Status}} {{.Ports}}' | grep -E '18789|openclaw' || true
          echo '=== DOCKER_ALL ==='
          docker ps -a --format '{{.ID}} {{.Names}} {{.Status}} {{.Ports}}' | grep -E '18789|openclaw' || true
          echo '=== HOST_PROCESSES ==='
          ps -eo pid,ppid,etimes,cmd | grep -E '[o]penclaw|[n]ode.*18789|[g]ateway' || true
          echo '=== COMPOSE_PS ==='
          cd /opt/sahjony-openclaw 2>/dev/null && docker compose ps -a || true
          REMOTE
          rm -f ~/.ssh/hostinger-key
