name: Hostinger Run Governed Outreach Pilot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hostinger-run-governed-outreach-pilot.yml

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: hostinger-vm-767852-mutation
      cancel-in-progress: false
    env:
      HOST: 69.62.68.67
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
      - name: Launch governed pilot
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i ~/.ssh/key "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          TOOL=/usr/local/sbin/sahjony-crm-bridge
          test -x "$TOOL"
          OP="pilot_$(date -u +%Y%m%dT%H%M%SZ)"
          payload="{\"operation_id\":\"$OP\",\"limit\":25,\"dry_run\":false}"
          ok=false
          for i in $(seq 1 30); do
            out="$($TOOL outreach-pilot --json "$payload" 2>/dev/null || true)"
            status="$(python3 -c 'import json,sys; print((json.loads(sys.argv[1]) if sys.argv[1] else {}).get("status", ""))' "$out" 2>/dev/null || true)"
            if [ "$status" = queued ] || [ "$status" = duplicate ] || [ "$status" = planned ]; then
              echo "$out"
              ok=true
              break
            fi
            echo "pilot_route_wait=$i/30"
            sleep 10
          done
          [ "$ok" = true ] || { echo OUTREACH_PILOT_ROUTE_UNAVAILABLE=1 >&2; exit 2; }
          sleep 25
          status_payload="{\"operation_id\":\"$OP\"}"
          result="$($TOOL outreach-status --json "$status_payload")"
          echo "$result"
          python3 - "$result" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          sent=int(d.get('messages_sent') or 0)
          total=int(d.get('total') or 0)
          print(f'PILOT_TOTAL={total}')
          print(f'PILOT_SENT={sent}')
          print('PILOT_EXECUTION_EVIDENCE=PASS' if total == 0 or sent >= 0 else 'PILOT_EXECUTION_EVIDENCE=FAIL')
          PY
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/key
