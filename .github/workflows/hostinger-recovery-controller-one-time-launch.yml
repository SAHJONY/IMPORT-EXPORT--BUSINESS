name: Hostinger Recovery Controller One-Time Launch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hostinger-recovery-controller-one-time-launch.yml

permissions:
  contents: read
  actions: write

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prevent duplicate active controllers and dispatch full mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          active="$(
            gh run list \
              --repo "$REPO" \
              --workflow hostinger-recovery-controller.yml \
              --limit 20 \
              --json status \
              --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length' \
              2>/dev/null || echo 0
          )"

          if [ "${active:-0}" -gt 0 ]; then
            echo "SAHJONY_RECOVERY_CONTROLLER_ALREADY_ACTIVE=1"
            exit 0
          fi

          gh workflow run hostinger-recovery-controller.yml \
            --repo "$REPO" \
            --ref main \
            -f mode=full \
            -f confirm_mutation=RECOVER

          echo "SAHJONY_RECOVERY_CONTROLLER_DISPATCHED=1"
