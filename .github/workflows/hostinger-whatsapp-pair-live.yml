name: Hostinger WhatsApp Pair Live

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Pairing operation
        required: true
        type: choice
        default: audit
        options:
          - audit
          - pair_once
          - mark_client_lock
      client_lock_backoff_minutes:
        description: Local safety backoff after WhatsApp reports device-link lock
        required: false
        default: '360'
        type: string

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-whatsapp-pairing
  cancel-in-progress: false

env:
  HOSTINGER_HOST: '69.62.68.67'
  HOSTINGER_USER: root

jobs:
  pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare authorized SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HOSTINGER_SSH_PRIVATE_KEY:-}" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" > ~/.ssh/hostinger
          chmod 600 ~/.ssh/hostinger
          echo "SSH_KEY_PATH=$HOME/.ssh/hostinger" >> "$GITHUB_ENV"
          chmod +x openclaw/hostinger-24x7/whatsapp-pairing-controller.sh
          chmod +x openclaw/hostinger-24x7/whatsapp-hostinger-only-guardian.sh

      - name: Require normal Hostinger SSH
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i "$SSH_KEY_PATH")
          ssh "${opts[@]}" "$HOSTINGER_USER@$HOSTINGER_HOST" 'printf SAHJONY_NORMAL_SSH_OK' | grep -q SAHJONY_NORMAL_SSH_OK || {
            echo 'SAHJONY_PAIRING_BLOCKED_BY_HOSTINGER_SSH=1' >&2
            echo 'Use the canonical Hostinger runtime recovery workflow before pairing. Pairing recovery does not mutate VPS recovery state.' >&2
            exit 20
          }

      - name: Install lock-aware pairing controller
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i "$SSH_KEY_PATH")
          scp "${opts[@]}" openclaw/hostinger-24x7/whatsapp-pairing-controller.sh "$HOSTINGER_USER@$HOSTINGER_HOST:/tmp/sahjony-whatsapp-pairing-controller"
          scp "${opts[@]}" openclaw/hostinger-24x7/whatsapp-hostinger-only-guardian.sh "$HOSTINGER_USER@$HOSTINGER_HOST:/tmp/sahjony-whatsapp-guardian"
          ssh "${opts[@]}" "$HOSTINGER_USER@$HOSTINGER_HOST" 'set -euo pipefail; install -m 700 /tmp/sahjony-whatsapp-pairing-controller /usr/local/sbin/sahjony-whatsapp-pairing-controller; install -m 700 /tmp/sahjony-whatsapp-guardian /usr/local/sbin/sahjony-whatsapp-guardian; rm -f /tmp/sahjony-whatsapp-pairing-controller /tmp/sahjony-whatsapp-guardian'

      - name: Audit pairing state
        if: inputs.mode == 'audit'
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i "$SSH_KEY_PATH")
          ssh "${opts[@]}" "$HOSTINGER_USER@$HOSTINGER_HOST" '/usr/local/sbin/sahjony-whatsapp-pairing-controller audit' || rc=$?
          rc="${rc:-0}"
          if [[ "$rc" == 41 ]]; then
            echo SAHJONY_PAIRING_AUDIT=DISCONNECTED
            exit 0
          fi
          exit "$rc"

      - name: Record WhatsApp client device-link lock
        if: inputs.mode == 'mark_client_lock'
        shell: bash
        run: |
          set -euo pipefail
          minutes='${{ inputs.client_lock_backoff_minutes }}'
          [[ "$minutes" =~ ^[0-9]+$ ]] || { echo INVALID_BACKOFF_MINUTES="$minutes" >&2; exit 64; }
          seconds=$((minutes*60))
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i "$SSH_KEY_PATH")
          ssh "${opts[@]}" "$HOSTINGER_USER@$HOSTINGER_HOST" "/usr/local/sbin/sahjony-whatsapp-pairing-controller mark-client-lock '$seconds'"
          echo SAHJONY_WHATSAPP_CLIENT_LINK_LOCK_SAFELY_BACKED_OFF=1

      - name: Start exactly one authorized pairing attempt
        id: start
        if: inputs.mode == 'pair_once'
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i "$SSH_KEY_PATH")
          ssh "${opts[@]}" "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' > /tmp/whatsapp-qr.b64 <<'REMOTE'
          set -euo pipefail
          H=/root/.hermes
          B="$H/hermes-agent/scripts/whatsapp-bridge"
          S="$H/platforms/whatsapp/session"
          install -d -m 700 /root/sahjony-cutover-backups "$S"
          systemctl --user stop hermes-gateway.service 2>/dev/null || true
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          if [ -n "$(find "$S" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
            tar -C "$(dirname "$S")" -czf "/root/sahjony-cutover-backups/hermes-whatsapp-session-$ts.tgz" "$(basename "$S")"
          fi
          rm -rf "$S"/*
          tmp="$B/.sahjony-pair-bridge.js"
          cp "$B/bridge.js" "$tmp"
          python3 - "$tmp" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); t=p.read_text()
          old='qrcode.generate(qr, { small: true });'
          if old not in t:
              old='qrcode.generate(qr, {small: true});'
          if old not in t:
              raise SystemExit('QR_HOOK_NOT_FOUND')
          p.write_text(t.replace(old, "console.log('SAHJONY_RAW_QR=' + qr); " + old, 1))
          PY
          nohup timeout 600 node "$tmp" --pair-only > /tmp/sahjony-hermes-pair.log 2>&1 < /dev/null &
          for i in $(seq 1 30); do
            qr=$(grep -m1 '^SAHJONY_RAW_QR=' /tmp/sahjony-hermes-pair.log 2>/dev/null | sed 's/^SAHJONY_RAW_QR=//' || true)
            if [ -n "$qr" ]; then printf '%s' "$qr" | base64 | tr -d '\n'; exit 0; fi
            sleep 1
          done
          tail -40 /tmp/sahjony-hermes-pair.log >&2 || true
          exit 32
          REMOTE
          base64 -d /tmp/whatsapp-qr.b64 > /tmp/whatsapp-qr.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq qrencode >/dev/null
          qrencode -o /tmp/whatsapp-qr.png -s 9 -m 4 < /tmp/whatsapp-qr.txt
          echo 'qr_ready=true' >> "$GITHUB_OUTPUT"
          echo 'already_connected=false' >> "$GITHUB_OUTPUT"
          echo SAHJONY_WHATSAPP_SINGLE_QR_READY=1

      - name: Publish the single live WhatsApp QR
        if: inputs.mode == 'pair_once' && steps.start.outputs.qr_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SAHJONY-WHATSAPP-QR-SINGLE-AUTHORIZED
          path: /tmp/whatsapp-qr.png
          retention-days: 1
          if-no-files-found: error

      - name: Wait for the single pairing attempt
        if: inputs.mode == 'pair_once' && steps.start.outputs.qr_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i "$SSH_KEY_PATH")
          for i in {1..24}; do
            if ssh "${opts[@]}" "$HOSTINGER_USER@$HOSTINGER_HOST" "python3 -c \"import json; print(bool(json.load(open('/root/.hermes/platforms/whatsapp/session/creds.json')).get('registered')))\" 2>/dev/null" | grep -q True; then
              ssh "${opts[@]}" "$HOSTINGER_USER@$HOSTINGER_HOST" 'systemctl --user restart hermes-gateway.service; sleep 8; grep -Eqi "connected|authenticated|ready" /root/.hermes/platforms/whatsapp/bridge.log'
              echo SAHJONY_WHATSAPP_PAIRING_COMPLETE=1
              exit 0
            fi
            sleep 5
          done
          echo SAHJONY_WHATSAPP_PAIRING_NOT_COMPLETED=1 >&2
          exit 41

      - name: Finalize 24x7 guardian after connection
        if: inputs.mode == 'pair_once' && success()
        shell: bash
        run: |
          echo SAHJONY_WHATSAPP_NATIVE_HERMES_PAIRING_FINALIZED=1

      - name: Cleanup transient files
        if: always()
        shell: bash
        run: |
          rm -f /tmp/whatsapp-qr.png /tmp/whatsapp-pair-start.json /tmp/whatsapp-already-connected ~/.ssh/hostinger
