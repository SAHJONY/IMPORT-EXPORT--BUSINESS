name: Hostinger WhatsApp Gateway Restore Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-whatsapp-native-activate-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-whatsapp-gateway-restore
  cancel-in-progress: false

jobs:
  restore-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_KEY:-}" ]] || exit 2
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-wa-restore
          chmod 600 ~/.ssh/hostinger-wa-restore

      - name: Restore existing Gateway only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -i ~/.ssh/hostinger-wa-restore "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          STATE=/var/lib/sahjony-openclaw-state
          CONFIG="$STATE/openclaw.json"
          HOME_DIR=/home/node
          oc() { env HOME="$HOME_DIR" OPENCLAW_HOME="$HOME_DIR" OPENCLAW_STATE_DIR="$STATE" OPENCLAW_CONFIG_PATH="$CONFIG" openclaw "$@"; }
          redact() { sed -E 's/(token|secret|key|password|authorization)[=:][^[:space:]]+/\1=[REDACTED]/Ig'; }

          echo WHATSAPP_GATEWAY_RESTORE_SCOPE_ONLY=1
          systemctl daemon-reload
          systemctl enable openclaw-gateway.service >/dev/null
          systemctl reset-failed openclaw-gateway.service >/dev/null 2>&1 || true
          systemctl start openclaw-gateway.service || true
          sleep 12

          if ! systemctl is-active --quiet openclaw-gateway.service; then
            echo GATEWAY_START_FAILED=1
            journalctl -u openclaw-gateway.service -n 120 --no-pager | redact | tail -n 120
            exit 24
          fi

          echo OPENCLAW_GATEWAY_ACTIVE=1
          echo OPENCLAW_GATEWAY_ENABLED="$(systemctl is-enabled openclaw-gateway.service)"
          oc plugins list 2>&1 | grep -Ei 'codex|whatsapp' | tail -n 40 || true
          wa="$(oc channels status --channel whatsapp --probe 2>&1 || true)"
          printf '%s\n' "$wa" | redact | tail -n 80
          echo WHATSAPP_GATEWAY_RESTORE_COMPLETE=1
          REMOTE

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hostinger-wa-restore
