name: Hostinger WhatsApp Live Verify Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-whatsapp-native-activate-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-whatsapp-live-verify
  cancel-in-progress: false

jobs:
  verify-whatsapp:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_KEY:-}" ]] || exit 2
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-wa-verify
          chmod 600 ~/.ssh/hostinger-wa-verify

      - name: Verify live WhatsApp listener
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -i ~/.ssh/hostinger-wa-verify "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          STATE=/var/lib/sahjony-openclaw-state
          CONFIG="$STATE/openclaw.json"
          HOME_DIR=/home/node
          redact() { sed -E 's/(token|secret|key|password|authorization)[=:][^[:space:]]+/\1=[REDACTED]/Ig'; }

          [[ -s /etc/openclaw-gateway.env ]] || { echo GATEWAY_AUTH_ENV_MISSING=1 >&2; exit 21; }
          set -a
          . /etc/openclaw-gateway.env
          set +a
          oc() { env HOME="$HOME_DIR" OPENCLAW_HOME="$HOME_DIR" OPENCLAW_STATE_DIR="$STATE" OPENCLAW_CONFIG_PATH="$CONFIG" openclaw "$@"; }

          systemctl is-active --quiet openclaw-gateway.service || { echo GATEWAY_NOT_ACTIVE=1 >&2; exit 22; }
          systemctl is-enabled --quiet openclaw-gateway.service || { echo GATEWAY_NOT_ENABLED=1 >&2; exit 23; }
          echo OPENCLAW_GATEWAY_ACTIVE=1
          echo OPENCLAW_GATEWAY_24X7=1

          wa="$(oc channels status --channel whatsapp --probe 2>&1 || true)"
          printf '%s\n' "$wa" | redact | tail -n 100

          echo RECENT_WHATSAPP_GATEWAY_LOGS_BEGIN
          journalctl -u openclaw-gateway.service --since '-5 minutes' --no-pager 2>/dev/null \
            | grep -Ei 'whatsapp|connected|listener|inbound|codex|error' \
            | redact | tail -n 100 || true
          echo RECENT_WHATSAPP_GATEWAY_LOGS_END

          if printf '%s\n' "$wa" | grep -Eiq 'connected|ready|healthy|linked.*running'; then
            echo WHATSAPP_LIVE_CONNECTED=1
          else
            echo WHATSAPP_LIVE_CONNECTED=0
            exit 32
          fi
          REMOTE

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hostinger-wa-verify
