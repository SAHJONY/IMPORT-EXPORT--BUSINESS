name: Hostinger WhatsApp Listener Restart Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-whatsapp-native-activate-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-whatsapp-listener-restart
  cancel-in-progress: false

jobs:
  restart-listener:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_KEY:-}" ]] || exit 2
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-wa-restart
          chmod 600 ~/.ssh/hostinger-wa-restart

      - name: Restart Gateway and verify WhatsApp listener
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -i ~/.ssh/hostinger-wa-restart "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo WHATSAPP_LINKED_SESSION_RESTART_ONLY=1
          systemctl restart openclaw-gateway.service
          sleep 12
          systemctl is-active --quiet openclaw-gateway.service
          systemctl is-enabled --quiet openclaw-gateway.service
          echo OPENCLAW_GATEWAY_ACTIVE=1
          echo OPENCLAW_GATEWAY_24X7=1
          echo RECENT_WHATSAPP_GATEWAY_LOGS_BEGIN
          journalctl -u openclaw-gateway.service --since '-2 minutes' --no-pager 2>/dev/null \
            | grep -Ei 'whatsapp|connected|listener|linked|login|baileys|error|ready' \
            | sed -E 's/(token|secret|key|password|authorization)[=:][^[:space:]]+/\1=[REDACTED]/Ig' \
            | tail -n 120 || true
          echo RECENT_WHATSAPP_GATEWAY_LOGS_END
          echo LISTEN_18789_BEGIN
          ss -ltnp 2>/dev/null | grep ':18789' || true
          echo LISTEN_18789_END
          REMOTE

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hostinger-wa-restart
