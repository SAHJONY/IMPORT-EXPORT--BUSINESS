# One-time WhatsApp-only activation. No Docker/model/core-runtime mutation.
name: Hostinger WhatsApp Native Activate Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-whatsapp-native-activate-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-whatsapp-only
  cancel-in-progress: false

jobs:
  activate-whatsapp-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_KEY:-}" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-whatsapp-only
          chmod 600 ~/.ssh/hostinger-whatsapp-only

      - name: Activate only the existing native WhatsApp channel
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
            -i ~/.ssh/hostinger-whatsapp-only "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          STATE=/var/lib/sahjony-openclaw-state
          CONFIG="$STATE/openclaw.json"
          HOME_DIR=/home/node

          oc() {
            env HOME="$HOME_DIR" \
              OPENCLAW_HOME="$HOME_DIR" \
              OPENCLAW_STATE_DIR="$STATE" \
              OPENCLAW_CONFIG_PATH="$CONFIG" \
              openclaw "$@"
          }

          redact() {
            sed -E 's/(token|secret|key|password|authorization)[=:][^[:space:]]+/\1=[REDACTED]/Ig'
          }

          file_value() {
            local key="$1" file="$2"
            [[ -r "$file" ]] || return 1
            awk -F= -v k="$key" '$1==k{sub(/^[^=]*=/,""); gsub(/^[[:space:]"'"']+|[[:space:]"'"']+$/,""); print; exit}' "$file"
          }

          recover_existing_env_value() {
            local key="$1" value="" f cid
            for f in "$STATE/.env" /opt/sahjony-openclaw/.env /root/.openclaw/.env /home/node/.openclaw/.env; do
              value="$(file_value "$key" "$f" 2>/dev/null || true)"
              [[ -n "$value" ]] && { printf '%s' "$value"; return 0; }
            done
            # Read-only fallback: recover the same credential from the stopped legacy container environment.
            if command -v docker >/dev/null 2>&1; then
              cid="$(docker ps -aq 2>/dev/null | while read -r id; do
                meta="$(docker inspect "$id" --format '{{.Name}}|{{.Config.Image}}' 2>/dev/null || true)"
                grep -Eqi 'openclaw|open[-_]?claw|claw' <<<"$meta" && { echo "$id"; break; } || true
              done)"
              if [[ -n "$cid" ]]; then
                value="$(docker inspect "$cid" --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
                  | awk -F= -v k="$key" '$1==k{sub(/^[^=]*=/,""); print; exit}')"
                [[ -n "$value" ]] && { printf '%s' "$value"; return 0; }
              fi
            fi
            return 1
          }

          echo WHATSAPP_ONLY_SCOPE=1
          [[ -f "$CONFIG" ]] || { echo OPENCLAW_CONFIG_MISSING=1 >&2; exit 21; }
          systemctl cat openclaw-gateway.service >/dev/null 2>&1 || { echo OPENCLAW_GATEWAY_SERVICE_MISSING=1 >&2; exit 20; }

          # Fix only the WhatsApp plugin directory ownership inherited from the old container.
          ext="$STATE/extensions/whatsapp"
          if [[ -d "$ext" ]] && find "$ext" -xdev \( ! -uid 0 -o ! -gid 0 \) -print -quit | grep -q .; then
            chown -R root:root "$ext"
            echo WHATSAPP_PLUGIN_OWNERSHIP_REPAIRED=1
          fi

          # Restore the SAME existing Gateway credential only when LAN auth is currently absent.
          bind="$(oc config get gateway.bind 2>/dev/null || true)"
          cfg_token="$(oc config get gateway.auth.token 2>/dev/null || true)"
          cfg_password="$(oc config get gateway.auth.password 2>/dev/null || true)"
          if [[ "$bind" == "lan" && -z "$cfg_token" && -z "$cfg_password" ]]; then
            token="$(recover_existing_env_value OPENCLAW_GATEWAY_TOKEN || true)"
            if [[ -n "$token" ]]; then
              oc config set gateway.auth.token "$token" >/dev/null
              unset token
              echo OPENCLAW_EXISTING_GATEWAY_AUTH_RESTORED=token
            else
              password="$(recover_existing_env_value OPENCLAW_GATEWAY_PASSWORD || true)"
              if [[ -n "$password" ]]; then
                oc config set gateway.auth.password "$password" >/dev/null
                unset password
                echo OPENCLAW_EXISTING_GATEWAY_AUTH_RESTORED=password
              else
                echo OPENCLAW_EXISTING_GATEWAY_AUTH_NOT_FOUND=1 >&2
                exit 23
              fi
            fi
          else
            echo OPENCLAW_GATEWAY_AUTH_ALREADY_CONFIGURED=1
          fi
          unset cfg_token cfg_password

          # The host is OpenClaw 2026.8.1. Pin only WhatsApp to the matching official 2026.8.1 plugin.
          # This avoids the current ClawHub release that requires plugin API >=2026.8.2.
          oc plugins install npm:@openclaw/whatsapp@2026.8.1 --force --pin >/dev/null
          echo WHATSAPP_PLUGIN_PINNED=2026.8.1
          oc plugins enable whatsapp >/dev/null
          echo WHATSAPP_PLUGIN_ENABLED=1
          oc config validate >/dev/null

          systemctl reset-failed openclaw-gateway.service >/dev/null 2>&1 || true
          systemctl restart openclaw-gateway.service
          sleep 12
          if ! systemctl is-active --quiet openclaw-gateway.service; then
            journalctl -u openclaw-gateway.service -n 100 --no-pager | redact >&2 || true
            exit 24
          fi
          echo OPENCLAW_EXISTING_GATEWAY_ACTIVE=1

          after="$(oc channels status --channel whatsapp --probe 2>&1 || true)"
          printf '%s\n' "$after" | redact | tail -n 120

          if printf '%s\n' "$after" | grep -Eiq 'whatsapp.*(linked.*running.*connected|connected|ready|healthy)|(linked.*running.*connected).*whatsapp'; then
            echo SAHJONY_WHATSAPP_NATIVE_CONNECTED=1
          elif printf '%s\n' "$after" | grep -Eiq 'not linked|qr required|login required'; then
            echo SAHJONY_WHATSAPP_NATIVE_NEEDS_RELINK=1 >&2
            exit 41
          else
            echo SAHJONY_WHATSAPP_NATIVE_NOT_CONNECTED=1 >&2
            exit 42
          fi

          echo '=== PUBLIC HEALTH ==='
          curl -fsS --retry 3 --retry-delay 2 https://www.sahjony.com/whatsapp/health \
            | python3 -c 'import json,sys; h=json.load(sys.stdin); n=h.get("hostinger_openclaw") or {}; print(json.dumps({"status":h.get("status"),"send_ready":h.get("send_ready"),"webhook_ready":h.get("webhook_ready"),"gateway_connected":n.get("connected"),"gateway_id":n.get("gateway_id"),"business_number":n.get("business_number"),"last_seen_at":n.get("last_seen_at")},separators=(",",":")))'
          echo SAHJONY_WHATSAPP_ACTIVATION_CHECK=COMPLETE
          REMOTE

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hostinger-whatsapp-only
