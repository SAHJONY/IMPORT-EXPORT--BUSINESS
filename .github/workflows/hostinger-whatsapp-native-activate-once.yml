# One-time Codex repair using the existing registered Hostinger SSH workflow path.
name: Hostinger Codex Runtime Repair Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-whatsapp-native-activate-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-codex-repair
  cancel-in-progress: false

jobs:
  repair-codex-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_KEY:-}" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-codex-repair
          chmod 600 ~/.ssh/hostinger-codex-repair

      - name: Repair Codex registration only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -i ~/.ssh/hostinger-codex-repair "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          STATE=/var/lib/sahjony-openclaw-state
          CONFIG="$STATE/openclaw.json"
          HOME_DIR=/home/node

          oc() {
            env HOME="$HOME_DIR" OPENCLAW_HOME="$HOME_DIR" OPENCLAW_STATE_DIR="$STATE" OPENCLAW_CONFIG_PATH="$CONFIG" openclaw "$@"
          }

          redact() {
            sed -E 's/(token|secret|key|password|authorization)[=:][^[:space:]]+/\1=[REDACTED]/Ig'
          }

          echo CODEX_REPAIR_SCOPE_ONLY=1
          [[ -f "$CONFIG" ]] || { echo OPENCLAW_CONFIG_MISSING=1 >&2; exit 21; }
          systemctl cat openclaw-gateway.service >/dev/null 2>&1 || { echo OPENCLAW_GATEWAY_SERVICE_MISSING=1 >&2; exit 20; }

          ready=0
          for n in $(seq 1 36); do
            probe="$(oc --version 2>&1 || true)"
            if printf '%s\n' "$probe" | grep -q 'OpenClaw 2026.8.1'; then
              ready=1
              break
            fi
            if printf '%s\n' "$probe" | grep -qi 'startup migrations are already running'; then
              echo WAITING_FOR_OPENCLAW_MIGRATION_LOCK=1
              sleep 10
              continue
            fi
            printf '%s\n' "$probe" | redact >&2
            sleep 5
          done
          [[ "$ready" == "1" ]] || { echo OPENCLAW_MIGRATION_LOCK_TIMEOUT=1 >&2; exit 22; }
          echo OPENCLAW_VERSION="$(oc --version 2>/dev/null | tail -n1)"

          oc plugins install @openclaw/codex@2026.8.1 --force --pin --accept-capabilities
          oc plugins enable codex --accept-capabilities

          node -e 'const fs=require("fs"); const p=process.argv[1]; const d=JSON.parse(fs.readFileSync(p,"utf8")); const a=d.plugins&&d.plugins.allow; if(Array.isArray(a)&&!a.includes("codex")){a.push("codex"); fs.writeFileSync(p,JSON.stringify(d,null,2)+"\n"); console.log("CODEX_ADDED_TO_PLUGIN_ALLOW=1")}else{console.log("CODEX_PLUGIN_ALLOW_OK=1")}' "$CONFIG"

          oc config validate
          systemctl reset-failed openclaw-gateway.service >/dev/null 2>&1 || true
          systemctl restart openclaw-gateway.service
          sleep 15

          if ! systemctl is-active --quiet openclaw-gateway.service; then
            journalctl -u openclaw-gateway.service -n 140 --no-pager | redact >&2 || true
            exit 24
          fi
          echo OPENCLAW_GATEWAY_ACTIVE=1

          plugin_status="$(oc plugins list 2>&1 || true)"
          printf '%s\n' "$plugin_status" | redact | tail -n 140
          printf '%s\n' "$plugin_status" | grep -Eiq 'codex.*(loaded|enabled|ready)|codex' || { echo CODEX_PLUGIN_NOT_REGISTERED=1 >&2; exit 31; }
          echo CODEX_PLUGIN_REGISTERED=1

          wa="$(oc channels status --channel whatsapp --probe 2>&1 || true)"
          printf '%s\n' "$wa" | redact | tail -n 100
          if printf '%s\n' "$wa" | grep -Eiq 'whatsapp.*(connected|ready|healthy|linked.*running)|linked.*running.*connected'; then
            echo WHATSAPP_STILL_CONNECTED=1
          else
            echo WHATSAPP_STATUS_RECHECK_NEEDED=1
          fi

          echo CODEX_RUNTIME_REPAIR_COMPLETE=1
          REMOTE

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hostinger-codex-repair
