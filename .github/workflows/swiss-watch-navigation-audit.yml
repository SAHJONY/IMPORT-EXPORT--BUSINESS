name: Swiss Watch Navigation Integrity Audit

on:
  push:
    branches: [audit/swiss-watch-20260901]
    paths:
      - '.github/workflows/swiss-watch-navigation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/swiss-watch-20260901
          submodules: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --ignore-scripts; else npm install --no-audit --no-fund; fi
          npm run build
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          mkdir -p nav-audit

      - name: Static route, page, link and clickable inventory
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json, pathlib, re, html.parser, urllib.parse
          root=pathlib.Path('.')
          out=root/'nav-audit'; out.mkdir(exist_ok=True)
          cfg=json.loads((root/'vercel.json').read_text())
          route_rows=[r for r in cfg.get('routes',[]) if isinstance(r,dict)]
          exact={r.get('src'):r.get('dest') for r in route_rows if r.get('src') and r.get('dest') and not any(c in r.get('src','') for c in '()*+?[]{}|')}
          html_files=sorted({p for base in (root,root/'public') for p in base.glob('*.html') if p.is_file()})
          ids_by_file={}
          findings=[]; links=[]; clickables=[]

          class Scan(html.parser.HTMLParser):
              def __init__(self,path): super().__init__(); self.path=path; self.ids=set()
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs); line=self.getpos()[0]
                  if a.get('id'): self.ids.add(a['id'])
                  if tag=='a':
                      href=(a.get('href') or '').strip(); text=''
                      links.append({'file':str(self.path),'line':line,'kind':'anchor','target':href,'target_blank':a.get('target')=='_blank','rel':a.get('rel','')})
                      if not href: findings.append({'severity':'error','code':'EMPTY_HREF','file':str(self.path),'line':line})
                      elif href=='#': findings.append({'severity':'warning','code':'PLACEHOLDER_HREF','file':str(self.path),'line':line,'target':href})
                      elif href.lower().startswith('javascript:'): findings.append({'severity':'error','code':'JAVASCRIPT_HREF','file':str(self.path),'line':line,'target':href})
                      if a.get('target')=='_blank' and 'noopener' not in (a.get('rel') or '').lower(): findings.append({'severity':'warning','code':'TARGET_BLANK_WITHOUT_NOOPENER','file':str(self.path),'line':line,'target':href})
                  if tag in {'button','a','input','select','textarea'} or a.get('role') in {'button','link'} or 'onclick' in a:
                      clickables.append({'file':str(self.path),'line':line,'tag':tag,'role':a.get('role'),'href':a.get('href'),'onclick':a.get('onclick'),'type':a.get('type'),'aria_label':a.get('aria-label'),'title':a.get('title')})
                  if tag=='form' and a.get('action'):
                      links.append({'file':str(self.path),'line':line,'kind':'form-action','target':a.get('action')})
                  if 'onclick' in a:
                      for m in re.finditer(r"(?:location(?:\.href)?\s*=|location\.(?:assign|replace)\s*\(|window\.open\s*\()\s*['\"]([^'\"]+)",a.get('onclick') or ''):
                          links.append({'file':str(self.path),'line':line,'kind':'onclick-nav','target':m.group(1)})

          for p in html_files:
              try: text=p.read_text(errors='ignore'); s=Scan(p); s.feed(text); ids_by_file[str(p)]=s.ids
              except Exception as e: findings.append({'severity':'error','code':'HTML_PARSE_FAILURE','file':str(p),'error':type(e).__name__})

          source_files=sorted(list((root/'src').rglob('*.tsx'))+list((root/'src').rglob('*.ts'))+list((root/'public').rglob('*.js')))
          patterns=[
              ('tsx-href',re.compile(r'href\s*=\s*["\']([^"\']+)["\']')),
              ('nav-call',re.compile(r'\bnav\(\s*["\']([^"\']+)["\']\s*\)')),
              ('location-replace',re.compile(r'location\.replace\(\s*["\']([^"\']+)["\']')),
              ('location-href',re.compile(r'location\.href\s*=\s*["\']([^"\']+)["\']')),
              ('window-open',re.compile(r'window\.open\(\s*["\']([^"\']+)["\']')),
          ]
          for p in source_files:
              text=p.read_text(errors='ignore')
              for kind,pat in patterns:
                  for m in pat.finditer(text):
                      line=text.count('\n',0,m.start())+1
                      links.append({'file':str(p),'line':line,'kind':kind,'target':m.group(1)})
              for m in re.finditer(r'<button\b([^>]*)>',text,re.I|re.S):
                  attrs=m.group(1); line=text.count('\n',0,m.start())+1
                  clickables.append({'file':str(p),'line':line,'tag':'button','source':'tsx','has_onclick':'onClick' in attrs,'raw':attrs[:240]})

          def local_target_exists(target,source_file):
              if not target or target.startswith(('mailto:','tel:','sms:','data:')): return True,'scheme'
              if target.startswith(('http://','https://')): return True,'external'
              if target.startswith('#'):
                  frag=urllib.parse.unquote(target[1:]); return frag in ids_by_file.get(source_file,set()),'fragment'
              parsed=urllib.parse.urlsplit(target); path=parsed.path or '/'
              if not path.startswith('/'):
                  base=pathlib.Path(source_file).parent
                  candidate=(base/path).resolve()
                  try: candidate.relative_to(root.resolve())
                  except Exception: return False,'relative-outside'
                  return candidate.exists(),'relative-file'
              if path in exact: return True,'vercel-exact'
              clean=path.lstrip('/')
              candidates=[root/clean,root/'public'/clean]
              if pathlib.Path(clean).suffix=='': candidates += [root/f'{clean}.html',root/'public'/f'{clean}.html']
              if any(c.exists() for c in candidates): return True,'file'
              if path=='/' or path.startswith(('/owner','/employee','/customer','/sign-in')): return True,'spa'
              # regex route coverage
              for r in route_rows:
                  src=r.get('src');
                  if not src: continue
                  try:
                      if re.fullmatch(src,path): return True,'vercel-pattern'
                  except re.error: pass
              return False,'unresolved'

          for item in links:
              ok,basis=local_target_exists(item.get('target',''),item.get('file',''))
              item['static_resolved']=ok; item['resolution_basis']=basis
              if not ok:
                  findings.append({'severity':'error','code':'UNRESOLVED_INTERNAL_NAV_TARGET',**item})
              target=item.get('target','')
              if target.startswith('#') and not ok:
                  findings.append({'severity':'error','code':'MISSING_FRAGMENT_TARGET',**item})

          # duplicate IDs can make fragment navigation ambiguous
          for file,ids in ids_by_file.items():
              text=pathlib.Path(file).read_text(errors='ignore')
              vals=re.findall(r'\bid=["\']([^"\']+)["\']',text,re.I)
              dup=sorted({v for v in vals if vals.count(v)>1})
              for v in dup: findings.append({'severity':'warning','code':'DUPLICATE_ID','file':file,'id':v})

          report={'html_pages':len(html_files),'vercel_routes':len(route_rows),'links_total':len(links),'unique_targets':len({x.get('target') for x in links}),'clickables_total':len(clickables),'findings':findings,'links':links,'clickables':clickables}
          (out/'static-navigation.json').write_text(json.dumps(report,indent=2))
          errors=[x for x in findings if x['severity']=='error']; warnings=[x for x in findings if x['severity']=='warning']
          summary=f"HTML_PAGES={len(html_files)}\nVERCEL_ROUTES={len(route_rows)}\nLINK_OCCURRENCES={len(links)}\nUNIQUE_TARGETS={report['unique_targets']}\nCLICKABLES={len(clickables)}\nSTATIC_ERRORS={len(errors)}\nSTATIC_WARNINGS={len(warnings)}\n"
          (out/'summary.txt').write_text(summary)
          print(summary,end='')
          for x in errors[:80]: print('STATIC_ERROR',json.dumps(x,ensure_ascii=False))
          for x in warnings[:80]: print('STATIC_WARNING',json.dumps(x,ensure_ascii=False))
          PY

      - name: Production HTTP destination audit
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import asyncio,json,urllib.parse,httpx,pathlib
          root='https://www.sahjony.com'
          data=json.loads(pathlib.Path('nav-audit/static-navigation.json').read_text())
          targets=sorted({x.get('target','') for x in data['links'] if x.get('target')})
          urls=[]
          for t in targets:
              if t.startswith(('mailto:','tel:','sms:','data:','#','javascript:')): continue
              if t.startswith(('http://','https://')): u=t
              else: u=urllib.parse.urljoin(root+'/',t)
              urls.append(u)
          results=[]; sem=asyncio.Semaphore(12)
          async def one(client,u):
              async with sem:
                  try:
                      r=await client.get(u,follow_redirects=True,timeout=18,headers={'User-Agent':'SAHJONY-Navigation-Audit/1.0'})
                      results.append({'url':u,'status':r.status_code,'final_url':str(r.url),'ok':r.status_code<400 or r.status_code in {401,403}})
                  except Exception as e: results.append({'url':u,'status':None,'ok':False,'error':type(e).__name__})
          async def main():
              async with httpx.AsyncClient() as c: await asyncio.gather(*(one(c,u) for u in urls))
          asyncio.run(main())
          bad=[x for x in results if not x['ok']]
          pathlib.Path('nav-audit/production-http.json').write_text(json.dumps({'checked':len(results),'bad':bad,'results':results},indent=2))
          with pathlib.Path('nav-audit/summary.txt').open('a') as f: f.write(f'PRODUCTION_URLS_CHECKED={len(results)}\nPRODUCTION_BAD_DESTINATIONS={len(bad)}\n')
          print('PRODUCTION_URLS_CHECKED='+str(len(results)))
          print('PRODUCTION_BAD_DESTINATIONS='+str(len(bad)))
          for x in bad[:100]: print('PRODUCTION_BAD',json.dumps(x))
          PY

      - name: Chromium navigation crawl and clickable audit
        shell: bash
        run: |
          set -euo pipefail
          cat > nav-audit/browser-audit.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const report={pages:[],consoleErrors:[],pageErrors:[],failedRequests:[],badAnchors:[],clickables:[],navigationClicks:[]};
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({ignoreHTTPSErrors:true});
          const page=await ctx.newPage();
          page.on('console',m=>{if(m.type()==='error') report.consoleErrors.push({url:page.url(),text:m.text().slice(0,500)})});
          page.on('pageerror',e=>report.pageErrors.push({url:page.url(),error:String(e).slice(0,700)}));
          page.on('requestfailed',r=>report.failedRequests.push({url:r.url(),failure:r.failure()?.errorText||''}));
          const seeds=['https://www.sahjony.com/','https://www.sahjony.com/start','https://www.sahjony.com/cuba-private-sector','https://www.sahjony.com/cuba-consumers','https://www.sahjony.com/owner-login','https://www.sahjony.com/sign-in?role=customer','https://www.sahjony.com/sign-in?role=employee'];
          const seen=new Set(),queue=[...seeds];
          while(queue.length && seen.size<180){
            const url=queue.shift(); if(seen.has(url)) continue; seen.add(url);
            let response=null;
            try{response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:20000}); await page.waitForTimeout(350);}catch(e){report.pages.push({url,status:null,error:String(e).slice(0,400)});continue}
            const status=response?.status()??null, finalUrl=page.url();
            const info=await page.evaluate(()=>{
              const els=[...document.querySelectorAll('a,button,[role="link"],[role="button"],[onclick]')];
              return {title:document.title,anchors:[...document.querySelectorAll('a')].map(a=>({href:a.getAttribute('href')||'',text:(a.textContent||'').trim().replace(/\s+/g,' ').slice(0,120),target:a.getAttribute('target')||'',rel:a.getAttribute('rel')||''})),clickables:els.map((e,i)=>({i,tag:e.tagName.toLowerCase(),role:e.getAttribute('role')||'',text:(e.textContent||e.getAttribute('aria-label')||e.getAttribute('title')||'').trim().replace(/\s+/g,' ').slice(0,120),href:e.getAttribute('href')||'',type:e.getAttribute('type')||'',disabled:e.hasAttribute('disabled'),ariaDisabled:e.getAttribute('aria-disabled')||''}))};
            });
            report.pages.push({url,status,finalUrl,title:info.title,anchorCount:info.anchors.length,clickableCount:info.clickables.length});
            for(const a of info.anchors){
              if(!a.href || a.href==='#' || a.href.toLowerCase().startsWith('javascript:')) report.badAnchors.push({page:finalUrl,...a});
              try{const u=new URL(a.href,finalUrl); if(u.origin==='https://www.sahjony.com' && !u.hash && !seen.has(u.href) && queue.length<500) queue.push(u.href);}catch{}
            }
            for(const c of info.clickables){
              report.clickables.push({page:finalUrl,...c});
              if(!c.text && !c.href) report.badAnchors.push({page:finalUrl,code:'CLICKABLE_WITHOUT_ACCESSIBLE_NAME',...c});
            }
          }

          // SPA navigation buttons are tested locally with inert/fake auth; only navigation-like controls are clicked.
          const local=await ctx.newPage();
          await local.addInitScript(()=>{sessionStorage.setItem('sahjony.owner.token','audit-only');sessionStorage.setItem('sahjony.employee.token','audit-only');sessionStorage.setItem('sahjony.customer.token','audit-only')});
          const spaSeeds=['http://127.0.0.1:4173/','http://127.0.0.1:4173/owner/deals','http://127.0.0.1:4173/owner/finance','http://127.0.0.1:4173/employee','http://127.0.0.1:4173/customer'];
          const destructive=/delete|remove|pay|submit|send|approve|post|release|reverse|create|save|ingest|execute|run|call|message/i;
          for(const seed of spaSeeds){
            try{await local.goto(seed,{waitUntil:'domcontentloaded',timeout:15000});await local.waitForTimeout(400);}catch{continue}
            const candidates=await local.locator('a,button,[role="link"]').all();
            const max=Math.min(candidates.length,120);
            for(let i=0;i<max;i++){
              try{
                await local.goto(seed,{waitUntil:'domcontentloaded',timeout:15000});await local.waitForTimeout(120);
                const loc=local.locator('a,button,[role="link"]').nth(i); if(!await loc.count()) continue;
                const meta=await loc.evaluate(e=>({tag:e.tagName.toLowerCase(),text:(e.textContent||e.getAttribute('aria-label')||'').trim().replace(/\s+/g,' ').slice(0,100),href:e.getAttribute('href')||'',type:e.getAttribute('type')||'',disabled:e.hasAttribute('disabled')}));
                if(meta.disabled || destructive.test(meta.text) || meta.type==='submit') continue;
                const before=local.url();
                await loc.click({timeout:2500,noWaitAfter:true}); await local.waitForTimeout(180);
                const after=local.url();
                if(after!==before || meta.href) report.navigationClicks.push({seed,index:i,...meta,before,after,changed:after!==before});
              }catch{}
            }
          }
          await browser.close();
          fs.writeFileSync('nav-audit/browser-navigation.json',JSON.stringify(report,null,2));
          const brokenPages=report.pages.filter(p=>p.status===null || p.status>=400);
          const summary=`BROWSER_PAGES=${report.pages.length}\nBROWSER_BROKEN_PAGES=${brokenPages.length}\nBROWSER_BAD_ANCHORS=${report.badAnchors.length}\nBROWSER_CONSOLE_ERRORS=${report.consoleErrors.length}\nBROWSER_PAGE_ERRORS=${report.pageErrors.length}\nBROWSER_FAILED_REQUESTS=${report.failedRequests.length}\nNAVIGATION_CLICKS_TESTED=${report.navigationClicks.length}\n`;
          fs.appendFileSync('nav-audit/summary.txt',summary); console.log(summary);
          for(const x of brokenPages.slice(0,60)) console.log('BROWSER_BROKEN',JSON.stringify(x));
          for(const x of report.badAnchors.slice(0,60)) console.log('BROWSER_BAD_ANCHOR',JSON.stringify(x));
          JS
          npm run preview -- --host 127.0.0.1 --port 4173 > nav-audit/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node nav-audit/browser-audit.mjs

      - name: Final navigation verdict
        shell: bash
        run: |
          set -euo pipefail
          cat nav-audit/summary.txt
          python <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('nav-audit/static-navigation.json').read_text())
          p=json.loads(pathlib.Path('nav-audit/production-http.json').read_text())
          b=json.loads(pathlib.Path('nav-audit/browser-navigation.json').read_text())
          static_errors=[x for x in s['findings'] if x['severity']=='error']
          broken_pages=[x for x in b['pages'] if x.get('status') is None or (x.get('status') or 0)>=400]
          verdict='PASS' if not static_errors and not p['bad'] and not broken_pages and not b['badAnchors'] else 'FAIL'
          details={'verdict':verdict,'static_errors':len(static_errors),'static_warnings':len([x for x in s['findings'] if x['severity']=='warning']),'production_bad':len(p['bad']),'browser_broken_pages':len(broken_pages),'browser_bad_anchors':len(b['badAnchors']),'console_errors':len(b['consoleErrors']),'page_errors':len(b['pageErrors']),'failed_requests':len(b['failedRequests']),'navigation_clicks_tested':len(b['navigationClicks'])}
          pathlib.Path('nav-audit/verdict.json').write_text(json.dumps(details,indent=2))
          print('NAVIGATION_VERDICT='+verdict)
          print(json.dumps(details,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swiss-watch-navigation-audit
          path: nav-audit/
          if-no-files-found: error
