name: Hostinger Runtime Guardian Script Inspect Once

on:
  push:
    branches: [ops/model-setup-once]
    paths:
      - '.github/workflows/hostinger-sofia-inspect-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-runtime-script
          chmod 600 ~/.ssh/hostinger-runtime-script
          ssh-keygen -y -f ~/.ssh/hostinger-runtime-script >/dev/null
      - name: Read runtime guardian script
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -i ~/.ssh/hostinger-runtime-script "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          redact(){ sed -E -e 's/(Bearer[[:space:]]+)[A-Za-z0-9._~+\/-]+/\1[REDACTED]/Ig' -e 's/(OPENCLAW_GATEWAY_TOKEN=)[^[:space:]]+/\1[REDACTED]/g'; }
          echo HOSTINGER_VPS_SCOPE_ONLY=1
          echo RUNTIME_GUARDIAN_SCRIPT_BEGIN
          nl -ba /usr/local/sbin/sahjony-openclaw-runtime-guardian | sed -n '1,260p' | redact
          echo RUNTIME_GUARDIAN_SCRIPT_END
          echo RUNTIME_GUARDIAN_UNIT_BEGIN
          cat /etc/systemd/system/sahjony-openclaw-runtime-guardian.service | redact
          echo RUNTIME_GUARDIAN_UNIT_END
          echo RUNTIME_GUARDIAN_LOG_BEGIN
          journalctl -u sahjony-openclaw-runtime-guardian.service -n 80 --no-pager 2>/dev/null | redact || true
          echo RUNTIME_GUARDIAN_LOG_END
          echo INSPECTION_COMPLETE=1
          REMOTE
      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/hostinger-runtime-script
