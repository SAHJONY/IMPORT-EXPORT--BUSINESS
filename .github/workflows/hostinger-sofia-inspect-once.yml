name: Hostinger SOFIA Workspace Inspect Once

on:
  push:
    branches: [ops/model-setup-once]
    paths:
      - '.github/workflows/hostinger-sofia-inspect-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare secure SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_KEY:-}" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-sofia
          chmod 600 ~/.ssh/hostinger-sofia
          ssh-keygen -y -f ~/.ssh/hostinger-sofia >/dev/null

      - name: Inspect SOFIA workspace and backups on Hostinger
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -i ~/.ssh/hostinger-sofia "$USER@$HOST" 'python3 -' <<'PY'
          import os, glob, re, time
          roots=['/home/node/.openclaw/workspace','/home/node/.openclaw','/var/lib/sahjony-openclaw-state']
          names={'IDENTITY.md','SOUL.md','AGENTS.md','USER.md','TOOLS.md','MEMORY.md','HEARTBEAT.md','BOOTSTRAP.md'}
          secret_line=re.compile(r'(api[_-]?key|token|secret|password|authorization|credential)\s*[:=]',re.I)
          print('HOSTINGER_VPS_SCOPE_ONLY=1')

          def safe_lines(path,limit=240):
              try:
                  text=open(path,encoding='utf-8',errors='replace').read()
              except Exception:
                  return ''
              out=[]
              for line in text.splitlines():
                  if secret_line.search(line):
                      k=line.split(':',1)[0].split('=',1)[0]
                      out.append(k+'=[REDACTED]')
                  else:
                      out.append(line)
                  if len(out)>=limit: break
              return '\n'.join(out)

          current='/home/node/.openclaw/workspace'
          print('WORKSPACE_EXISTS='+('1' if os.path.isdir(current) else '0'))
          if os.path.isdir(current):
              for n in sorted(names):
                  p=os.path.join(current,n)
                  if os.path.isfile(p):
                      text=safe_lines(p)
                      print(f'CURRENT_FILE={p}')
                      print(f'CURRENT_{n.replace(".","_")}_HAS_SOFIA='+('1' if 'sofia' in text.lower() else '0'))
                      print('CURRENT_CONTENT_BEGIN')
                      print(text[:12000])
                      print('CURRENT_CONTENT_END')

          candidates=[]
          for root in roots:
              if not os.path.exists(root): continue
              for pat in ['**/*.bak','**/*.bak.*','**/*backup*','**/*~','**/*.old','**/*.md']:
                  for p in glob.glob(os.path.join(root,pat),recursive=True):
                      if not os.path.isfile(p): continue
                      base=os.path.basename(p)
                      if base in names or any(base.startswith(n+'.') for n in names) or 'backup' in base.lower() or base.endswith(('.bak','.old','~')):
                          candidates.append(p)
          uniq=[]
          for p in candidates:
              if p not in uniq: uniq.append(p)
          uniq.sort(key=lambda p: os.path.getmtime(p),reverse=True)
          matches=[]
          for p in uniq[:500]:
              text=safe_lines(p)
              if 'sofia' not in text.lower(): continue
              matches.append(p)
              print('SOFIA_SOURCE_FILE='+p)
              print('SOFIA_SOURCE_MTIME='+time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime(os.path.getmtime(p))))
              print('SOFIA_SOURCE_CONTENT_BEGIN')
              print(text[:16000])
              print('SOFIA_SOURCE_CONTENT_END')
              if len(matches)>=10: break
          print('SOFIA_WORKSPACE_SOURCE_COUNT='+str(len(matches)))
          PY

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hostinger-sofia
