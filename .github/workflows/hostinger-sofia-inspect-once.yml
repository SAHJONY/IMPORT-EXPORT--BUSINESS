name: Hostinger WhatsApp Guardian Failure Inspect Once

on:
  push:
    branches: [ops/model-setup-once]
    paths:
      - '.github/workflows/hostinger-sofia-inspect-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-guardian-inspect
          chmod 600 ~/.ssh/hostinger-guardian-inspect
          ssh-keygen -y -f ~/.ssh/hostinger-guardian-inspect >/dev/null

      - name: Inspect guardian error only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -i ~/.ssh/hostinger-guardian-inspect "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          redact(){ sed -E \
            -e 's/(Bearer[[:space:]]+)[A-Za-z0-9._~+\/-]+/\1[REDACTED]/Ig' \
            -e 's/((api[_-]?key|token|secret|password|authorization)["[:space:]]*[:=]["[:space:]]*)[^,"[:space:]]+/\1[REDACTED]/Ig' \
            -e 's/(OPENCLAW_GATEWAY_TOKEN=)[^[:space:]]+/\1[REDACTED]/g'; }
          echo HOSTINGER_VPS_SCOPE_ONLY=1
          systemctl is-active --quiet openclaw-gateway.service && echo OPENCLAW_GATEWAY_ACTIVE=1
          systemctl show sahjony-whatsapp-guardian.service -p EnvironmentFiles --value | grep -q '/etc/openclaw-gateway.env' && echo GUARDIAN_GATEWAY_ENV_BOUND=1 || echo GUARDIAN_GATEWAY_ENV_BOUND=0

          echo GUARDIAN_SCRIPT_RELEVANT_BEGIN
          nl -ba /usr/local/sbin/sahjony-whatsapp-guardian | sed -n '1,110p' | redact
          echo GUARDIAN_SCRIPT_RELEVANT_END

          echo GUARDIAN_LAST_FAILURE_BEGIN
          journalctl -u sahjony-whatsapp-guardian.service -n 80 --no-pager 2>/dev/null | redact
          echo GUARDIAN_LAST_FAILURE_END

          echo GUARDIAN_STATUS_BEGIN
          systemctl status sahjony-whatsapp-guardian.service --no-pager -l 2>&1 | redact || true
          echo GUARDIAN_STATUS_END
          echo INSPECTION_COMPLETE=1
          REMOTE

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/hostinger-guardian-inspect
