name: Hostinger Stale Docker OpenClaw Inspect Once

on:
  push:
    branches: [ops/model-setup-once]
    paths:
      - '.github/workflows/hostinger-sofia-inspect-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-docker-inspect
          chmod 600 ~/.ssh/hostinger-docker-inspect
          ssh-keygen -y -f ~/.ssh/hostinger-docker-inspect >/dev/null

      - name: Inspect stale Docker OpenClaw only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -i ~/.ssh/hostinger-docker-inspect "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo HOSTINGER_VPS_SCOPE_ONLY=1
          systemctl is-active --quiet openclaw-gateway.service && echo NATIVE_GATEWAY_ACTIVE=1
          echo DOCKER_OPENCLAW_CONTAINERS_BEGIN
          if command -v docker >/dev/null 2>&1 && systemctl is-active --quiet docker; then
            docker ps -a --format '{{.ID}}|{{.Names}}|{{.Image}}|{{.Status}}' \
              | grep -Ei 'openclaw|claw' || true
          else
            echo DOCKER_UNAVAILABLE_OR_INACTIVE=1
          fi
          echo DOCKER_OPENCLAW_CONTAINERS_END

          count="$(docker ps -a --format '{{.Names}}|{{.Image}}' 2>/dev/null | grep -Eic 'openclaw|claw' || true)"
          running="$(docker ps --format '{{.Names}}|{{.Image}}' 2>/dev/null | grep -Eic 'openclaw|claw' || true)"
          echo STALE_OPENCLAW_CONTAINER_COUNT="$count"
          echo STALE_OPENCLAW_RUNNING_COUNT="$running"

          echo PORT_18789_LISTENERS_BEGIN
          ss -ltnp 2>/dev/null | grep ':18789' || true
          echo PORT_18789_LISTENERS_END

          echo LOCAL_18789_CONNECTIONS_BEGIN
          ss -tnp 2>/dev/null | grep '127.0.0.1:18789' | head -n 30 || true
          echo LOCAL_18789_CONNECTIONS_END

          systemctl is-enabled sahjony-whatsapp-guardian.timer 2>/dev/null || true
          systemctl is-active sahjony-whatsapp-guardian.timer 2>/dev/null || true
          echo INSPECTION_COMPLETE=1
          REMOTE

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/hostinger-docker-inspect
