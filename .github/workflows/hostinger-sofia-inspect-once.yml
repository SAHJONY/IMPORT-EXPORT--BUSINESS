name: Hostinger SOFIA Verify Once

on:
  push:
    branches: [ops/model-setup-once]
    paths:
      - '.github/workflows/hostinger-sofia-inspect-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare secure SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_KEY:-}" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-sofia-verify
          chmod 600 ~/.ssh/hostinger-sofia-verify
          ssh-keygen -y -f ~/.ssh/hostinger-sofia-verify >/dev/null

      - name: Verify SOFIA runtime and WhatsApp on Hostinger
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -i ~/.ssh/hostinger-sofia-verify "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          STATE=/var/lib/sahjony-openclaw-state
          CONFIG="$STATE/openclaw.json"
          WORKSPACE=/home/node/.openclaw/workspace
          token="$(sed -n 's/^OPENCLAW_GATEWAY_TOKEN=//p' /etc/openclaw-gateway.env 2>/dev/null | head -n1 || true)"
          oc(){ env HOME=/home/node OPENCLAW_HOME=/home/node OPENCLAW_STATE_DIR="$STATE" OPENCLAW_CONFIG_PATH="$CONFIG" "$@"; }

          echo HOSTINGER_VPS_SCOPE_ONLY=1
          systemctl is-active --quiet openclaw-gateway.service
          systemctl is-enabled --quiet openclaw-gateway.service
          echo OPENCLAW_GATEWAY_ACTIVE=1
          echo OPENCLAW_GATEWAY_24X7=1

          grep -qi 'SOFIA' "$WORKSPACE/IDENTITY.md"
          grep -qi 'SOFIA' "$WORKSPACE/SOUL.md"
          echo SOFIA_IDENTITY=PASS

          primary="$(oc openclaw config get agents.defaults.model.primary --json 2>/dev/null || true)"
          fallbacks="$(oc openclaw config get agents.defaults.model.fallbacks --json 2>/dev/null || true)"
          PRIMARY="$primary" FALLBACKS="$fallbacks" python3 - <<'PY'
          import json,os
          p=json.loads(os.environ['PRIMARY'])
          f=json.loads(os.environ['FALLBACKS'])
          assert p=='openai/gpt-5.6-sol', p
          assert isinstance(f,list) and any(isinstance(x,str) and x.startswith('nvidia/') for x in f), f
          print('OPENAI_PRIMARY=PASS')
          print('NVIDIA_FALLBACK=PASS')
          PY

          if [[ -n "$token" ]]; then
            wa="$(env OPENCLAW_GATEWAY_TOKEN="$token" HOME=/home/node OPENCLAW_HOME=/home/node OPENCLAW_STATE_DIR="$STATE" OPENCLAW_CONFIG_PATH="$CONFIG" openclaw channels status --channel whatsapp --probe 2>&1 || true)"
          else
            wa="$(oc openclaw channels status --channel whatsapp 2>&1 || true)"
          fi
          printf '%s\n' "$wa" | sed -E 's/(token|secret|key|password|authorization)[=:][^[:space:]]+/\1=[REDACTED]/Ig' | tail -n 30
          if grep -Eiq 'whatsapp.*(connected|ready|healthy|linked.*running)|linked.*running.*connected' <<<"$wa"; then
            echo WHATSAPP_CONNECTED=1
          elif grep -Eiq 'whatsapp.*linked|linked' <<<"$wa"; then
            echo WHATSAPP_LINKED=1
          else
            echo WHATSAPP_STATUS_RECHECK_NEEDED=1
          fi
          REMOTE

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hostinger-sofia-verify
