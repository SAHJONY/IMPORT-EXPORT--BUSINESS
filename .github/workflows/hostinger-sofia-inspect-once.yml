name: Hostinger SOFIA Retained State Inspect Once

on:
  push:
    branches: [ops/model-setup-once]
    paths:
      - '.github/workflows/hostinger-sofia-inspect-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare secure SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_KEY:-}" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-sofia
          chmod 600 ~/.ssh/hostinger-sofia
          ssh-keygen -y -f ~/.ssh/hostinger-sofia >/dev/null

      - name: Search retained SOFIA state on Hostinger
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -i ~/.ssh/hostinger-sofia "$USER@$HOST" 'python3 -' <<'PY'
          import os,re,time
          roots=['/home/node','/root','/opt','/srv','/var/lib/sahjony-openclaw-state','/var/lib/docker/volumes']
          skip={'node_modules','.git','overlay2','containers','image','buildkit','tmp','cache'}
          exts={'.md','.txt','.json','.jsonl','.yaml','.yml','.toml','.env','.bak','.old'}
          secret_line=re.compile(r'(api[_-]?key|token|secret|password|authorization|credential)\s*[:=]',re.I)
          print('HOSTINGER_VPS_SCOPE_ONLY=1')
          matches=[]

          def safe_text(path):
              try:
                  if os.path.getsize(path)>2_000_000: return ''
                  raw=open(path,'rb').read()
                  if b'\x00' in raw[:4096]: return ''
                  text=raw.decode('utf-8','replace')
              except Exception:
                  return ''
              out=[]
              for line in text.splitlines():
                  if secret_line.search(line):
                      key=line.split(':',1)[0].split('=',1)[0]
                      out.append(key+'=[REDACTED]')
                  else:
                      out.append(line)
                  if len(out)>=300: break
              return '\n'.join(out)

          for root in roots:
              if not os.path.exists(root): continue
              for dirpath,dirnames,filenames in os.walk(root):
                  dirnames[:] = [d for d in dirnames if d not in skip]
                  rel_depth=os.path.relpath(dirpath,root).count(os.sep)
                  if rel_depth>7:
                      dirnames[:] = []
                      continue
                  for fn in filenames:
                      p=os.path.join(dirpath,fn)
                      low=fn.lower()
                      if not (os.path.splitext(low)[1] in exts or 'identity' in low or 'soul' in low or 'agent' in low or 'memory' in low or 'bootstrap' in low):
                          continue
                      text=safe_text(p)
                      if 'sofia' not in text.lower(): continue
                      matches.append(p)
                      print('SOFIA_RETAINED_FILE='+p)
                      print('SOFIA_RETAINED_MTIME='+time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime(os.path.getmtime(p))))
                      print('SOFIA_RETAINED_CONTENT_BEGIN')
                      print(text[:18000])
                      print('SOFIA_RETAINED_CONTENT_END')
                      if len(matches)>=20: break
                  if len(matches)>=20: break
              if len(matches)>=20: break
          print('SOFIA_RETAINED_COUNT='+str(len(matches)))
          PY

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hostinger-sofia
