name: Hostinger SOFIA Auth Warning Diagnose Once

on:
  push:
    branches: [ops/model-setup-once]
    paths:
      - '.github/workflows/hostinger-sofia-inspect-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare secure SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_KEY:-}" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-sofia-verify
          chmod 600 ~/.ssh/hostinger-sofia-verify
          ssh-keygen -y -f ~/.ssh/hostinger-sofia-verify >/dev/null

      - name: Diagnose stale auth warning on Hostinger
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -i ~/.ssh/hostinger-sofia-verify "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          STATE=/var/lib/sahjony-openclaw-state
          CONFIG="$STATE/openclaw.json"
          WORKSPACE=/home/node/.openclaw/workspace
          EXT=/home/node/.openclaw/extensions
          oc(){ env HOME=/home/node OPENCLAW_HOME=/home/node OPENCLAW_STATE_DIR="$STATE" OPENCLAW_CONFIG_PATH="$CONFIG" "$@"; }
          count_files(){ local pat="$1"; shift; local out; out="$(grep -RIlEi --exclude='*.log' --exclude='*.jsonl' --exclude-dir=node_modules "$pat" "$@" 2>/dev/null || true)"; if [[ -z "$out" ]]; then printf '0'; else printf '%s\n' "$out" | wc -l | tr -d ' '; fi; }

          echo HOSTINGER_VPS_SCOPE_ONLY=1
          systemctl is-active --quiet openclaw-gateway.service
          systemctl is-enabled --quiet openclaw-gateway.service
          echo OPENCLAW_GATEWAY_ACTIVE=1
          echo OPENCLAW_GATEWAY_24X7=1

          primary="$(oc openclaw config get agents.defaults.model.primary --json 2>/dev/null || printf 'null')"
          fallbacks="$(oc openclaw config get agents.defaults.model.fallbacks --json 2>/dev/null || printf '[]')"
          PRIMARY="$primary" FALLBACKS="$fallbacks" python3 - <<'PY'
          import json, os
          p=json.loads(os.environ['PRIMARY']); f=json.loads(os.environ['FALLBACKS'])
          print('PRIMARY_MODEL='+str(p))
          print('FALLBACK_MODELS='+(','.join(f) if isinstance(f,list) else str(f)))
          print('NVIDIA_PRIMARY='+('PASS' if isinstance(p,str) and p.startswith('nvidia/') else 'FAIL'))
          print('OPENAI_56_CONFIGURED='+('PASS' if ((p=='openai/gpt-5.6-sol') or (isinstance(f,list) and 'openai/gpt-5.6-sol' in f)) else 'NOT_IN_ROUTE'))
          PY

          envfiles="$(systemctl show openclaw-gateway.service -p EnvironmentFiles --value 2>/dev/null || true)"
          [[ "$envfiles" == *'/etc/openclaw-openai.env'* ]] && echo OPENAI_ENV_FILE_BOUND=1 || echo OPENAI_ENV_FILE_BOUND=0
          [[ -s /etc/openclaw-openai.env ]] && grep -q '^OPENAI_API_KEY=' /etc/openclaw-openai.env && echo OPENAI_ENV_FILE_HAS_KEY=1 || echo OPENAI_ENV_FILE_HAS_KEY=0
          pid="$(systemctl show -p MainPID --value openclaw-gateway.service)"
          if [[ "$pid" =~ ^[0-9]+$ ]] && [[ "$pid" -gt 1 ]]; then
            if tr '\0' '\n' < "/proc/$pid/environ" | grep -q '^OPENAI_API_KEY='; then echo OPENAI_KEY_IN_GATEWAY_PROCESS=1; else echo OPENAI_KEY_IN_GATEWAY_PROCESS=0; fi
          else
            echo OPENAI_KEY_IN_GATEWAY_PROCESS=0
          fi

          code=NO_KEY
          if [[ -s /etc/openclaw-openai.env ]]; then
            set +u; . /etc/openclaw-openai.env; set -u
            if [[ -n "${OPENAI_API_KEY:-}" ]]; then
              code="$(curl -sS --connect-timeout 10 --max-time 60 -o /tmp/openai-auth-probe.json -w '%{http_code}' \
                https://api.openai.com/v1/responses \
                -H "Authorization: Bearer $OPENAI_API_KEY" \
                -H 'Content-Type: application/json' \
                -d '{"model":"gpt-5.6-sol","input":"Reply exactly SAHJONY_OPENAI_OK","max_output_tokens":24}' || true)"
              rm -f /tmp/openai-auth-probe.json
            fi
          fi
          echo OPENAI_GPT56_HTTP="$code"

          roots=(); [[ -d "$WORKSPACE" ]] && roots+=("$WORKSPACE"); [[ -d "$EXT" ]] && roots+=("$EXT")
          if ((${#roots[@]})); then
            echo STALE_LOGIN_CODEX_ACTIVE_FILE_COUNT="$(count_files '/login[[:space:]]+codex' "${roots[@]}")"
            echo STALE_GPT54_ACTIVE_FILE_COUNT="$(count_files 'gpt-5\.4' "${roots[@]}")"
            echo STALE_OAUTH_ACTIVE_FILE_COUNT="$(count_files '(oauth.*openai|openai.*oauth|auth.*not configured)' "${roots[@]}")"
            matches="$(grep -RIlEi --exclude='*.log' --exclude='*.jsonl' --exclude-dir=node_modules '(/login[[:space:]]+codex|gpt-5\.4|oauth.*openai|openai.*oauth|auth.*not configured)' "${roots[@]}" 2>/dev/null || true)"
            if [[ -n "$matches" ]]; then
              echo STALE_ACTIVE_PATHS_BEGIN
              printf '%s\n' "$matches" | head -n 20
              echo STALE_ACTIVE_PATHS_END
            fi
          else
            echo STALE_LOGIN_CODEX_ACTIVE_FILE_COUNT=0
            echo STALE_GPT54_ACTIVE_FILE_COUNT=0
            echo STALE_OAUTH_ACTIVE_FILE_COUNT=0
          fi

          warnings="$(journalctl -u openclaw-gateway.service -n 1000 --no-pager 2>/dev/null | grep -Eic '(openai|codex|oauth|credential|auth.*(missing|fail|not configured)|gpt-5\.4)' || true)"
          echo RECENT_AUTH_WARNING_COUNT="$warnings"
          echo DIAGNOSIS_COMPLETE=1
          REMOTE

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hostinger-sofia-verify
