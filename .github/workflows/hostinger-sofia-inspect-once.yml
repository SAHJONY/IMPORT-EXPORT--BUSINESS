name: Hostinger Runtime Guardian Inspect Once

on:
  push:
    branches: [ops/model-setup-once]
    paths:
      - '.github/workflows/hostinger-sofia-inspect-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-runtime-inspect
          chmod 600 ~/.ssh/hostinger-runtime-inspect
          ssh-keygen -y -f ~/.ssh/hostinger-runtime-inspect >/dev/null
      - name: Inspect runtime guardian
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -i ~/.ssh/hostinger-runtime-inspect "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          redact(){ sed -E -e 's/(Bearer[[:space:]]+)[A-Za-z0-9._~+\/-]+/\1[REDACTED]/Ig' -e 's/(OPENCLAW_GATEWAY_TOKEN=)[^[:space:]]+/\1[REDACTED]/g'; }
          echo HOSTINGER_VPS_SCOPE_ONLY=1
          echo RUNTIME_GUARDIAN_UNITS_BEGIN
          grep -RIl '/usr/local/sbin/sahjony-openclaw-runtime-guardian' /etc/systemd/system /lib/systemd/system 2>/dev/null | while read -r f; do echo UNIT_FILE="$f"; cat "$f" | redact; done
          echo RUNTIME_GUARDIAN_UNITS_END
          echo RUNTIME_GUARDIAN_SCRIPT_BEGIN
          nl -ba /usr/local/sbin/sahjony-openclaw-runtime-guardian | sed -n '1,220p' | redact
          echo RUNTIME_GUARDIAN_SCRIPT_END
          echo RUNTIME_GUARDIAN_PROCESS_BEGIN
          ps -eo pid,ppid,user,lstart,cmd --no-headers | grep '[s]ahjony-openclaw-runtime-guardian' | redact || true
          echo RUNTIME_GUARDIAN_PROCESS_END
          echo INSPECTION_COMPLETE=1
          REMOTE
      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/hostinger-runtime-inspect
