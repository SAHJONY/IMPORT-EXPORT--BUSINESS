name: Hostinger Gateway Background Auth Trace Once

on:
  push:
    branches: [ops/model-setup-once]
    paths:
      - '.github/workflows/hostinger-sofia-inspect-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-bgtrace
          chmod 600 ~/.ssh/hostinger-bgtrace
          ssh-keygen -y -f ~/.ssh/hostinger-bgtrace >/dev/null

      - name: Trace background clients
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -i ~/.ssh/hostinger-bgtrace "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          redact(){ sed -E \
            -e 's/(Bearer[[:space:]]+)[A-Za-z0-9._~+\/-]+/\1[REDACTED]/Ig' \
            -e 's/((api[_-]?key|token|secret|password|authorization)["[:space:]]*[:=]["[:space:]]*)[^,"[:space:]]+/\1[REDACTED]/Ig' \
            -e 's/(OPENCLAW_GATEWAY_TOKEN=)[^[:space:]]+/\1[REDACTED]/g' \
            -e 's/(sk-[A-Za-z0-9_-]{8})[A-Za-z0-9_-]+/\1[REDACTED]/g'; }

          echo HOSTINGER_VPS_SCOPE_ONLY=1
          echo GATEWAY_WS_AUTH_ERRORS_BEGIN
          journalctl -u openclaw-gateway.service --since '2026-09-01 23:40:00' --no-pager 2>/dev/null \
            | grep -Ei '\[ws\].*(FORBIDDEN|device identity required|missing scope|connect failed)' \
            | tail -n 120 | redact || true
          echo GATEWAY_WS_AUTH_ERRORS_END

          for svc in sahjony-openclaw-health-sidecar.service sahjony-whatsapp-guardian.service sahjony-ssh-runtime-guard.service sahjony-nvidia-nim-rotation.service; do
            echo "SERVICE=$svc"
            if systemctl cat "$svc" >/tmp/unit 2>/dev/null; then
              echo UNIT_BEGIN
              cat /tmp/unit | grep -E '^(\[|Description=|ExecStart=|Environment(File)?=|User=|WorkingDirectory=)' | redact
              echo UNIT_END
              echo LOG_BEGIN
              journalctl -u "$svc" --since '2026-09-01 23:40:00' --no-pager 2>/dev/null | tail -n 80 | redact || true
              echo LOG_END
            else
              echo UNIT_ABSENT=1
            fi
          done
          rm -f /tmp/unit

          echo BACKGROUND_SCRIPT_AUTH_SCAN_BEGIN
          for f in /usr/local/sbin/sahjony-openclaw-health-sidecar /usr/local/sbin/sahjony-whatsapp-guardian /usr/local/sbin/sahjony-ssh-runtime-guard /usr/local/sbin/sahjony-nvidia-nim-rotation; do
            [[ -f "$f" ]] || continue
            echo "SCRIPT=$f"
            if grep -q 'OPENCLAW_GATEWAY_TOKEN' "$f"; then echo HAS_GATEWAY_TOKEN_REFERENCE=1; else echo HAS_GATEWAY_TOKEN_REFERENCE=0; fi
            if grep -Eq 'openclaw[[:space:]].*(status|health|cron|channels|gateway|models)|curl.*18789|ws://' "$f"; then echo CALLS_GATEWAY=1; else echo CALLS_GATEWAY=0; fi
            grep -En 'openclaw[[:space:]].*(status|health|cron|channels|gateway|models)|curl.*18789|OPENCLAW_GATEWAY_TOKEN|ws://' "$f" 2>/dev/null | head -n 25 | redact || true
          done
          echo BACKGROUND_SCRIPT_AUTH_SCAN_END

          echo TRACE_COMPLETE=1
          REMOTE

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/hostinger-bgtrace
