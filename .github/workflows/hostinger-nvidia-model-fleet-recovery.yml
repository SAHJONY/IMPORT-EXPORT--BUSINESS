name: Hostinger NVIDIA Model Fleet Recovery

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-openclaw-model-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: contains(github.event.head_commit.message, 'recover NVIDIA model fleet') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: 69.62.68.67
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_KEY" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/nvidia-recovery
          chmod 600 ~/.ssh/nvidia-recovery
          ssh-keygen -y -f ~/.ssh/nvidia-recovery >/dev/null

      - name: Probe current NVIDIA fleet and promote first healthy model
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/nvidia-recovery "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CANON=/var/lib/sahjony-openclaw-state/openclaw.json
          ROOTCFG=/root/.openclaw/openclaw.json
          test -f "$CANON"

          CANDIDATES=(
            'nvidia/nemotron-3-super-120b-a12b'
            'nvidia/nemotron-3.5-lightning-30b-a3b'
            'nvidia/moonshotai/kimi-k2.6'
            'nvidia/minimaxai/minimax-m3'
            'nvidia/nemotron-3-ultra-550b-a55b'
          )

          cp -a "$CANON" "$CANON.before-nvidia-fleet-recovery"
          selected=''
          healthy=()

          for model in "${CANDIDATES[@]}"; do
            tmp="/tmp/openclaw-model-probe-${RANDOM}.json"
            python3 - "$CANON" "$tmp" "$model" <<'PY'
          import json,sys
          src,tmp,model=sys.argv[1:]
          d=json.load(open(src))
          d.setdefault('agents',{}).setdefault('defaults',{})['model']={'primary':model,'fallbacks':[]}
          with open(tmp,'w') as f:
              json.dump(d,f)
          PY
            set +e
            out="$(OPENCLAW_CONFIG="$tmp" timeout 35 openclaw models status --probe 2>&1)"
            rc=$?
            set -e
            rm -f "$tmp"
            safe="$(printf '%s\n' "$out" | sed -E 's/(nvapi-[A-Za-z0-9_-]{6})[A-Za-z0-9_-]+/\1***/g; s/(sk-[A-Za-z0-9_-]{8})[A-Za-z0-9_-]+/\1***/g')"
            echo "=== PROBE $model rc=$rc ==="
            printf '%s\n' "$safe" | tail -n 60

            if MODEL="$model" PROBE="$out" python3 - <<'PY'
          import os,re,sys
          model=os.environ['MODEL']
          text=os.environ['PROBE']
          bad=re.compile(r'\b(401|403|404|410|429|timeout|timed out|auth\b|unavailable|error\b|failed\b|gone\b)\b',re.I)
          lines=[ln for ln in text.splitlines() if model in ln]
          # A healthy probe line normally contains the candidate plus an affirmative latency/status,
          # while failures surface one of the hard-failure markers above.
          ok=bool(lines) and not bad.search('\n'.join(lines[-6:])) and not bad.search(text[-2500:])
          sys.exit(0 if ok else 1)
          PY
            then
              healthy+=("$model")
              [[ -n "$selected" ]] || selected="$model"
              echo "NVIDIA_MODEL_HEALTHY=$model"
            else
              echo "NVIDIA_MODEL_REJECTED=$model"
            fi
          done

          [[ -n "$selected" ]] || { echo NVIDIA_NO_HEALTHY_MODEL_FOUND=1 >&2; exit 20; }

          fallbacks=()
          for model in "${healthy[@]}"; do
            [[ "$model" == "$selected" ]] || fallbacks+=("$model")
          done

          SELECTED="$selected" FALLBACKS="$(IFS=,; echo "${fallbacks[*]}")" python3 - "$CANON" <<'PY'
          import json,os,sys
          p=sys.argv[1]
          selected=os.environ['SELECTED']
          fallbacks=[x for x in os.environ.get('FALLBACKS','').split(',') if x]
          d=json.load(open(p))
          old={'nvidia/openai/gpt-oss-120b','openai/gpt-oss-120b'}
          def replace(v):
              if isinstance(v,dict): return {k:replace(x) for k,x in v.items()}
              if isinstance(v,list): return [replace(x) for x in v]
              if isinstance(v,str) and v in old: return selected
              return v
          d=replace(d)
          d.setdefault('agents',{}).setdefault('defaults',{})['model']={'primary':selected,'fallbacks':fallbacks}
          with open(p,'w') as f:
              json.dump(d,f,indent=2); f.write('\n')
          PY
          chmod 600 "$CANON"
          install -d -m 700 /root/.openclaw
          cp "$CANON" "$ROOTCFG"
          chmod 600 "$ROOTCFG"

          # Invalid OpenAI credential is deliberately removed from the live gateway until revalidated.
          rm -f /etc/systemd/system/openclaw-gateway.service.d/20-openai-auth.conf
          install -d -m 755 /etc/systemd/system/openclaw-gateway.service.d
          cat >/etc/systemd/system/openclaw-gateway.service.d/21-canonical-state.conf <<EOF
          [Service]
          Environment="OPENCLAW_CONFIG=$CANON"
          Environment="OPENCLAW_CONFIG_PATH=$CANON"
          Environment="OPENCLAW_STATE_DIR=/var/lib/sahjony-openclaw-state"
          EOF
          chmod 600 /etc/systemd/system/openclaw-gateway.service.d/21-canonical-state.conf

          OPENCLAW_CONFIG="$CANON" openclaw config validate --json >/tmp/nvidia-recovery-validate.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/nvidia-recovery-validate.json'))
          if d.get('valid') is False or d.get('ok') is False:
              raise SystemExit('OPENCLAW_CONFIG_INVALID')
          print('OPENCLAW_CONFIG_VALID=1')
          PY

          systemctl daemon-reload
          systemctl restart openclaw-gateway.service
          sleep 12
          systemctl is-active --quiet openclaw-gateway.service

          echo "NVIDIA_PRIMARY_SELECTED=$selected"
          printf 'NVIDIA_FALLBACKS_SELECTED=%s\n' "$(IFS=,; echo "${fallbacks[*]}")"
          echo OPENAI_BAD_CREDENTIAL_REMOVED_FROM_GATEWAY=1
          echo ANTHROPIC_DISABLED=1

          journalctl -u openclaw-gateway.service --since '-2 minutes' --no-pager -n 240 \
            | grep -Ei 'agent model|whatsapp|listening|connected|error|invalid|plugin' \
            | tail -n 120 || true

          journalctl -u openclaw-gateway.service --since '-2 minutes' --no-pager \
            | grep -q 'Listening for WhatsApp inbound messages'
          echo WHATSAPP_LISTENING=1
          echo SAHJONY_NVIDIA_MODEL_FLEET_RECOVERED=1
          REMOTE

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f ~/.ssh/nvidia-recovery
