name: Hostinger OpenClaw Safe Clean

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-openclaw-safe-clean.yml'
  workflow_dispatch:

concurrency:
  group: hostinger-openclaw-safe-clean
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HOST: 69.62.68.67
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_KEY:-}" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keygen -y -f ~/.ssh/key >/dev/null
      - name: Clean OpenClaw safely
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/key)
          ssh "${opts[@]}" "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          roots=(/root/.openclaw /root/.config/openclaw /root/.local/share/openclaw)
          found=0
          cleaned=0
          for root in "${roots[@]}"; do
            [[ -e "$root" ]] || continue
            found=1
            # Preserve credentials, channel/platform auth, canonical config and secrets.
            # Reset only transient sessions/caches/history that can re-inject stale persona context.
            for d in sessions session cache caches tmp temp history conversations; do
              p="$root/$d"
              [[ -e "$p" ]] || continue
              mv "$p" "$p.pre-identity-clean.$stamp"
              mkdir -m 700 "$p" 2>/dev/null || true
              cleaned=$((cleaned+1))
            done
            find "$root" -type d \( -name '__pycache__' -o -name '.cache' \) -prune -exec rm -rf {} + 2>/dev/null || true
          done
          echo OPENCLAW_ROOT_FOUND=$found
          echo OPENCLAW_TRANSIENT_STORES_RESET=$cleaned
          # Restart OpenClaw services only when installed; never alter credentials or linked devices.
          mapfile -t services < <(systemctl --user list-unit-files --type=service --no-legend 2>/dev/null | awk '{print $1}' | grep -Ei 'openclaw' || true)
          for svc in "${services[@]}"; do
            systemctl --user restart "$svc"
          done
          sleep 8
          for svc in "${services[@]}"; do
            systemctl --user is-active --quiet "$svc" || { echo OPENCLAW_SERVICE_FAILED="$svc" >&2; exit 20; }
          done
          # Hermes/WhatsApp must remain healthy because customer communications depend on them.
          systemctl --user is-active --quiet hermes-gateway.service
          pgrep -f '/whatsapp-bridge/bridge.js.*--mode bot' >/dev/null
          echo OPENCLAW_SAFE_CLEAN=PASS
          echo HERMES_GATEWAY_ACTIVE=1
          echo WHATSAPP_BOT_ACTIVE=1
          echo AUTH_AND_LINKED_DEVICES_PRESERVED=1
          REMOTE
      - name: Cleanup local key
        if: always()
        run: rm -f ~/.ssh/key
