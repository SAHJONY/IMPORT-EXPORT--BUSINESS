name: Hostinger Hermes WhatsApp Direct Send

# Owner-governed direct WhatsApp send. Juan dispatches this explicitly per message:
# exactly one recipient (one phone OR one group) and one text per dispatch,
# dry-run by default.
# Cold-recipient ban risk is printed before every live dispatch — never sent silently.
# Group sends are visible to every group member: higher report risk than 1:1.
# The message is enqueued to the Hermes outbox; the VPS outbox worker delivers it
# through the native transport and ACKs the delivery status back.

on:
  workflow_dispatch:
    inputs:
      to:
        description: "Recipient — either phone in international digits only (e.g. 5358477839) or a group: group:<jid> (e.g. group:120363041234567@g.us) or group:alias:<alias> (e.g. group:alias:rosmel-ventas-cuba, resolved via whatsapp_groups.json)"
        required: true
        type: string
      message:
        description: Message text (1-1000 chars, plain text). Optional when audio_base64 is provided (then used as the transcript label).
        required: false
        type: string
      audio_base64:
        description: "Optional base64-encoded audio (MP3/OGG, 1KB-1.5MB decoded) — sent as a native WhatsApp voice note (ptt). Either message or audio_base64 is required."
        required: false
        type: string
      dry_run:
        description: Validate only — do not send
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      app_url:
        description: Base URL for the Hermes outbox API (direct Hostinger, bypasses Vercel)
        required: false
        default: 'https://www.sahjony.com'
        type: string

permissions:
  contents: read

concurrency:
  group: hermes-whatsapp-direct-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_URL: ${{ inputs.app_url }}
      BRIDGE_SECRET: ${{ secrets.SAHJONY_APP_BRIDGE_SECRET || secrets.OPENCLAW_APP_BRIDGE_SECRET }}
      INPUT_TO: ${{ inputs.to }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_MESSAGE: ${{ inputs.message }}
      INPUT_AUDIO_BASE64: ${{ inputs.audio_base64 }}
    steps:
      - name: Validate inputs and show ban-risk notice
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          to_raw = os.environ['INPUT_TO'].strip()
          recipient = None
          recipient_type = None
          if to_raw.startswith('group:'):
              rest = to_raw[len('group:'):]
              if rest.startswith('alias:'):
                  alias = rest[len('alias:'):].strip().lower()
                  if not alias or len(alias) > 64 or not all(c.isalnum() or c in '-_' for c in alias):
                      print(f'INVALID_GROUP_ALIAS={alias}', flush=True); sys.exit(2)
                  recipient = f'group:alias:{alias}'
              else:
                  local, sep, domain = rest.rpartition('@')
                  if not sep or domain != 'g.us' or not local.isdigit() or not 5 <= len(local) <= 30:
                      print('INVALID_GROUP_JID=expected <digits>@g.us', flush=True); sys.exit(2)
                  recipient = f'group:{rest}'
              recipient_type = 'group'
          else:
              digits = ''.join(ch for ch in to_raw if ch.isdigit())
              if not 8 <= len(digits) <= 15:
                  print(f'INVALID_RECIPIENT len={len(digits)}', flush=True); sys.exit(2)
              recipient = digits
              recipient_type = 'individual'
          print(f'RECIPIENT={recipient}', flush=True)
          print(f'RECIPIENT_TYPE={recipient_type}', flush=True)
          print(f'DRY_RUN={os.environ["INPUT_DRY_RUN"]}', flush=True)
          # Voice-note mode: audio_base64 present means a native ptt send.
          import base64 as _b64
          audio_b64 = (os.environ.get('INPUT_AUDIO_BASE64') or '').strip()
          audio_bytes = 0
          if audio_b64:
              try:
                  audio_bytes = len(_b64.b64decode(audio_b64, validate=True))
              except Exception:
                  print('INVALID_AUDIO_BASE64=not valid base64', flush=True); sys.exit(2)
              if not (1_000 <= audio_bytes <= 1_500_000):
                  print(f'INVALID_AUDIO_SIZE={audio_bytes}', flush=True); sys.exit(2)
              print(f'AUDIO_BYTES={audio_bytes}', flush=True)
          body_text = (os.environ.get('INPUT_MESSAGE') or '').strip()
          if not body_text and not audio_b64:
              print('INVALID_INPUT=message or audio_base64 required', flush=True); sys.exit(2)
          if body_text and not (1 <= len(body_text) <= 1000):
              print(f'INVALID_MESSAGE_LEN={len(body_text)}', flush=True); sys.exit(3)
          # Persist for the next step (message text stays in INPUT_MESSAGE env).
          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              fh.write(f'RECIPIENT_VALUE={recipient}\n')
              fh.write(f'RECIPIENT_TYPE={recipient_type}\n')
              fh.write(f'HAS_AUDIO={"1" if audio_b64 else "0"}\n')
          # audio_b64 is large; pass via file to avoid env limits.
          if audio_b64:
              with open('/tmp/voice_audio.b64', 'w') as fh:
                  fh.write(audio_b64)
          PY

      - name: Enqueue and track delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, hmac, json, os, sys, time, urllib.request, urllib.error

          base = os.environ['APP_URL'].rstrip('/')
          # Direct-IP hits need the vhost header: nginx only routes /whatsapp/ for sahjony.com/www.sahjony.com
          vhost = {'Host': 'sahjony.com'} if '69.62.68.67' in base else {}
          bridge_key = os.environ.get('BRIDGE_SECRET', '')
          if len(bridge_key) < 24:
              print('BRIDGE_SECRET_MISSING', flush=True); sys.exit(2)

          recipient = os.environ['RECIPIENT_VALUE']
          recipient_type = os.environ.get('RECIPIENT_TYPE', 'individual')
          body = (os.environ.get('INPUT_MESSAGE') or '').strip()
          has_audio = os.environ.get('HAS_AUDIO') == '1'
          audio_b64 = ''
          if has_audio:
              with open('/tmp/voice_audio.b64') as fh:
                  audio_b64 = fh.read().strip()
          if not body and not has_audio:
              print('INVALID_INPUT=message or audio_base64 required', flush=True); sys.exit(3)
          if body and not (1 <= len(body) <= 1000):
              print(f'INVALID_MESSAGE_LEN={len(body)}', flush=True); sys.exit(3)
          dry = os.environ['INPUT_DRY_RUN'] == 'true'

          print('NOTICE: sending a first-contact message to a new number can trigger WhatsApp spam detection and risk the business number. Dispatching this workflow is the owner accepting that risk.', flush=True)
          if recipient_type == 'group':
              print('NOTICE: group messages are visible to EVERY group member. A message that reads as spam or off-topic can be reported by any member and risks the business number. Send only owner-approved content.', flush=True)
          if has_audio:
              print('NOTICE: voice notes render as native ptt bubbles from the business number. Same ban risk as text.', flush=True)
          print(f'DIRECT_SEND to={recipient} type={recipient_type} chars={len(body)} audio={has_audio} dry_run={dry}', flush=True)
          if dry:
              print('DRY_RUN_OK=no message enqueued', flush=True)
              sys.exit(0)

          def signed_headers(raw: bytes):
              ts = str(int(time.time()))
              sig = 'sha256=' + hmac.new(bridge_key.encode(), ts.encode() + b'.' + raw, hashlib.sha256).hexdigest()
              return {'X-Bridge-Timestamp': ts, 'X-Bridge-Signature': sig}

          def post(path, payload):
              raw = json.dumps(payload, separators=(',', ':')).encode()
              req = urllib.request.Request(base + path, data=raw, method='POST',
                  headers={'Accept': 'application/json', 'Content-Type': 'application/json', **signed_headers(raw), **vhost})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read().decode() or '{}')
              except urllib.error.HTTPError as e:
                  return e.code, {'error': e.read().decode()[:300]}

          def get_status(command_id):
              path = f'/whatsapp/hermes/outbox/status?command_id={command_id}'
              req = urllib.request.Request(base + path, method='GET',
                  headers={'Accept': 'application/json', **signed_headers(b''), **vhost})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return json.loads(r.read().decode() or '{}')
              except Exception as e:
                  return {'status': 'poll_error', 'error': str(e)[:200]}

          payload = {'recipient': recipient, 'body': body or None}
          if has_audio:
              payload['audio_base64'] = audio_b64
          code, resp = post('/whatsapp/hermes/outbox/enqueue', payload)
          print(f'ENQUEUE_HTTP={code}', flush=True)
          if code != 200 or resp.get('status') != 'queued':
              print('ENQUEUE_FAILED ' + json.dumps(resp)[:500], flush=True); sys.exit(4)
          command_id = resp['command_id']
          print(f'COMMAND_ID={command_id}', flush=True)

          final = {}
          for i in range(12):
              time.sleep(10)
              final = get_status(command_id)
              ds = final.get('delivery_status')
              print(f'POLL_{i} delivery_status={ds}', flush=True)
              if ds in ('sent', 'failed', 'needs_review'):
                  break
          print('DELIVERY=' + json.dumps({k: final.get(k) for k in ('delivery_status', 'provider_message_id', 'last_error', 'attempts')}), flush=True)
          if final.get('delivery_status') != 'sent':
              print('DIRECT_SEND_NOT_CONFIRMED', flush=True); sys.exit(5)
          print('DIRECT_SEND_CONFIRMED', flush=True)
          PY
