name: Hostinger Action Snapshot

on:
  push:
    paths:
      - '.github/workflows/hostinger-action-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

# Read-only provider snapshot while the serialized recovery controller owns mutations.
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    env:
      API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      HOSTINGER_API_BASE: https://developers.hostinger.com
      VM_ID: '767852'
      STATUS_PATH: .ops/hostinger-action-snapshot.json
      APP_URL: https://www.sahjony.com
    steps:
      - name: Read VM, actions, and secondary public health
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$API_TOKEN" ]] || exit 2
          auth_hostinger=(-H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json')
          vm="$(curl -fsS "${auth_hostinger[@]}" "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID")"
          body="$(curl -fsS "${auth_hostinger[@]}" "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/actions?page=1")"
          actions="$(jq '[.data[]? | {id,name,state,created_at,updated_at}] | .[0:12]' <<<"$body")"
          busy="$(jq '[.data[]? | select(.state != "success" and .state != "failed" and .state != "failure" and .state != "error" and .state != "cancelled" and .state != "canceled")] | length' <<<"$body")"
          vm_summary="$(jq '{id,state,hostname,plan,template,created_at,actions_lock,is_running,is_recovery_mode,ipv4,ipv6}' <<<"$vm")"

          health_raw="$(curl -sS --max-time 20 "$APP_URL/whatsapp/health" || true)"
          if jq -e . >/dev/null 2>&1 <<<"$health_raw"; then
            health="$(jq '{status,version,provider,primary_provider,send_ready,webhook_ready,gateway_connected,hostinger_independent_runtime,hostinger_openclaw,meta_cloud_required,meta_cloud_controlled}' <<<"$health_raw")"
          else
            health="$(jq -n --arg raw "${health_raw:0:500}" '{parseable:false,raw:$raw}')"
          fi

          snapshot="$(jq -n --arg checked_at "$(date -u +%FT%TZ)" --argjson busy "$busy" --argjson vm "$vm_summary" --argjson actions "$actions" --argjson health "$health" '{checked_at:$checked_at,busy:$busy,vm:$vm,public_health:$health,actions:$actions}')"
          printf '%s\n' "$snapshot" | jq .
          echo HOSTINGER_ACTIONS_BUSY="$busy"

          encoded="$(printf '%s' "$snapshot" | base64 -w0)"
          api="https://api.github.com/repos/${{ github.repository }}/contents/$STATUS_PATH"
          auth_github=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          code="$(curl -sS -o /tmp/existing.json -w '%{http_code}' "${auth_github[@]}" "$api?ref=main")"
          if [[ "$code" == 200 ]]; then
            sha="$(jq -r '.sha' /tmp/existing.json)"
            payload="$(jq -n --arg message 'ops: record Hostinger VM/action/health snapshot' --arg content "$encoded" --arg sha "$sha" '{message:$message,content:$content,sha:$sha,branch:"main"}')"
          else
            payload="$(jq -n --arg message 'ops: record Hostinger VM/action/health snapshot' --arg content "$encoded" '{message:$message,content:$content,branch:"main"}')"
          fi
          curl -fsS -X PUT "${auth_github[@]}" -H 'Content-Type: application/json' --data "$payload" "$api" >/dev/null
