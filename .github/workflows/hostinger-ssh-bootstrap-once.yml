name: Hostinger SSH Bootstrap Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-ssh-bootstrap-once.yml'

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

env:
  HOSTINGER_API_BASE: https://developers.hostinger.com
  HOSTINGER_VM_ID: '767852'
  HOSTINGER_HOST: '69.62.68.67'
  HOSTINGER_USER: root

jobs:
  bootstrap:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'bootstrap Hostinger SSH once') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare ephemeral provider key and validate resolver tools
        id: key
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq netcat-openbsd openssh-client >/dev/null
          [[ -n "${HOSTINGER_API_TOKEN:-}" ]] || { echo HOSTINGER_API_TOKEN_MISSING=1 >&2; exit 2; }
          bash -n openclaw/hostinger-24x7/openclaw-runtime-recovery.sh
          bash -n openclaw/hostinger-24x7/openclaw-runtime-resolver.sh
          bash -n openclaw/hostinger-24x7/provider-bootstrap-stabilize.sh
          install -d -m 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/sahjony-provider-bootstrap -C "sahjony-provider-bootstrap-${GITHUB_RUN_ID}"
          echo "key_name=SAHJONY Provider Bootstrap ${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Register and attach key through Hostinger
        id: attach
        shell: bash
        run: |
          set -euo pipefail
          api(){
            local method="$1" path="$2" data="${3:-}"
            local args=(-fsS -X "$method" -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json')
            [[ -z "$data" ]] || args+=(-H 'Content-Type: application/json' --data "$data")
            curl "${args[@]}" "$HOSTINGER_API_BASE$path"
          }

          busy="$(api GET "/api/vps/v1/virtual-machines/$HOSTINGER_VM_ID/actions?page=1" | jq '[.data[]? | select(.state=="sent" or .state=="started" or .state=="pending" or .state=="running" or .state=="queued")] | length')"
          [[ "$busy" == 0 ]] || { echo HOSTINGER_ACTION_PLANE_BUSY=$busy >&2; exit 3; }
          echo HOSTINGER_ACTION_PLANE=IDLE

          pub="$(cat ~/.ssh/sahjony-provider-bootstrap.pub)"
          payload="$(jq -n --arg name '${{ steps.key.outputs.key_name }}' --arg key "$pub" '{name:$name,key:$key}')"
          created="$(api POST '/api/vps/v1/public-keys' "$payload")"
          key_id="$(jq -r '.id // empty' <<<"$created")"
          [[ "$key_id" =~ ^[0-9]+$ ]] || { echo HOSTINGER_PUBLIC_KEY_CREATE_FAILED=1 >&2; exit 4; }
          echo "key_id=$key_id" >> "$GITHUB_OUTPUT"
          echo HOSTINGER_PUBLIC_KEY_REGISTERED=1

          attach_payload="$(jq -n --argjson id "$key_id" '{ids:[$id]}')"
          attached="$(api POST "/api/vps/v1/public-keys/attach/$HOSTINGER_VM_ID" "$attach_payload")"
          action_id="$(jq -r '.id // empty' <<<"$attached")"
          attach_state="$(jq -r '.state // empty' <<<"$attached")"
          jq -c '{id:(.id // null),name:(.name // null),state:(.state // null)}' <<<"$attached" || true
          echo "HOSTINGER_PUBLIC_KEY_ATTACH_ID=${action_id:-missing} STATE=${attach_state:-unknown}"

          case "$attach_state" in
            success)
              echo HOSTINGER_PUBLIC_KEY_ATTACHED=SUCCESS_RESPONSE
              ;;
            failed|failure|error|cancelled|canceled)
              echo HOSTINGER_PUBLIC_KEY_ATTACH_FAILED_STATE="$attach_state" >&2
              exit 5
              ;;
            *)
              if [[ "$action_id" =~ ^[1-9][0-9]*$ ]]; then
                success=false
                for i in $(seq 1 90); do
                  a="$(api GET "/api/vps/v1/virtual-machines/$HOSTINGER_VM_ID/actions/$action_id")"
                  state="$(jq -r '.state // empty' <<<"$a")"
                  echo "key_attach_probe=$i/90 state=${state:-unknown}"
                  case "$state" in
                    success) success=true; break ;;
                    failed|failure|error|cancelled|canceled) exit 6 ;;
                  esac
                  sleep 4
                done
                [[ "$success" == true ]] || { echo HOSTINGER_KEY_ATTACH_TIMEOUT=1 >&2; exit 7; }
                echo HOSTINGER_PUBLIC_KEY_ATTACHED=ACTION_SUCCESS
              elif [[ "$action_id" == 0 ]]; then
                echo HOSTINGER_PUBLIC_KEY_ATTACHED=NONPOLLABLE_ACCEPTED
                sleep 15
              else
                echo HOSTINGER_PUBLIC_KEY_ATTACH_RESPONSE_UNUSABLE=1 >&2
                exit 8
              fi
              ;;
          esac

      - name: Authenticate repaired Kali without Recovery
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          : >/tmp/bootstrap-ssh.err
          for i in $(seq 1 60); do
            if nc -z -w 4 "$HOSTINGER_HOST" 22 >/dev/null 2>&1; then
              if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/sahjony-provider-bootstrap "$HOSTINGER_USER@$HOSTINGER_HOST" 'printf SAHJONY_PROVIDER_BOOTSTRAP_SSH_OK' 2>/tmp/bootstrap-ssh.err | grep -q SAHJONY_PROVIDER_BOOTSTRAP_SSH_OK; then
                ready=true
                echo "HOSTINGER_PROVIDER_BOOTSTRAP_SSH=READY probe=$i"
                break
              fi
              echo "tcp22=open auth=pending probe=$i/60"
            else
              echo "tcp22=closed_or_filtered probe=$i/60"
            fi
            sleep 5
          done
          [[ "$ready" == true ]] || { echo HOSTINGER_PROVIDER_BOOTSTRAP_SSH=NOT_READY >&2; sed -n '1,20p' /tmp/bootstrap-ssh.err 2>/dev/null || true; exit 9; }

      - name: Resolve OpenClaw runtime and install 24x7 guardian
        shell: bash
        run: |
          set -euo pipefail
          key="$HOME/.ssh/sahjony-provider-bootstrap"
          common=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i "$key")
          scp "${common[@]}" \
            openclaw/hostinger-24x7/whatsapp-guardian.sh \
            openclaw/hostinger-24x7/install-whatsapp-guardian.sh \
            openclaw/hostinger-24x7/openclaw-runtime-recovery.sh \
            openclaw/hostinger-24x7/openclaw-runtime-resolver.sh \
            openclaw/hostinger-24x7/provider-bootstrap-stabilize.sh \
            "$HOSTINGER_USER@$HOSTINGER_HOST:/tmp/"
          ssh "${common[@]}" "$HOSTINGER_USER@$HOSTINGER_HOST" 'chmod +x /tmp/provider-bootstrap-stabilize.sh /tmp/openclaw-runtime-recovery.sh /tmp/openclaw-runtime-resolver.sh && /tmp/provider-bootstrap-stabilize.sh'

      - name: Remove ephemeral bootstrap keys
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f ~/.ssh/sahjony-provider-bootstrap ]]; then
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 -i ~/.ssh/sahjony-provider-bootstrap "$HOSTINGER_USER@$HOSTINGER_HOST" \
              "sed -i '/sahjony-provider-bootstrap-/d' /root/.ssh/authorized_keys 2>/dev/null || true" >/dev/null 2>&1 || true
          fi

          account_keys="$(curl -fsS -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/public-keys?page=1" 2>/dev/null || true)"
          if [[ -n "$account_keys" ]]; then
            jq -r '.data[]? | select((.name // "") | test("^SAHJONY (Provider Bootstrap|bootstrap)")) | .id' <<<"$account_keys" | while read -r id; do
              [[ "$id" =~ ^[0-9]+$ ]] || continue
              curl -fsS -X DELETE -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/public-keys/$id" >/dev/null 2>&1 || true
              echo "HOSTINGER_BOOTSTRAP_ACCOUNT_KEY_DELETED=$id"
            done
          fi
          rm -f ~/.ssh/sahjony-provider-bootstrap ~/.ssh/sahjony-provider-bootstrap.pub
          echo HOSTINGER_EPHEMERAL_KEY_CLEANUP_COMPLETE=1
