name: Hostinger SSH Bootstrap Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-ssh-bootstrap-once.yml'

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

env:
  HOSTINGER_API_BASE: https://developers.hostinger.com
  HOSTINGER_VM_ID: '767852'
  HOSTINGER_HOST: '69.62.68.67'
  HOSTINGER_USER: root

jobs:
  bootstrap:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'bootstrap Hostinger SSH once') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare ephemeral provider key
        id: key
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq netcat-openbsd openssh-client >/dev/null
          [[ -n "${HOSTINGER_API_TOKEN:-}" ]] || { echo HOSTINGER_API_TOKEN_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/sahjony-provider-bootstrap -C "sahjony-provider-bootstrap-${GITHUB_RUN_ID}"
          echo "key_name=SAHJONY Provider Bootstrap ${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Register and attach key through Hostinger
        id: attach
        shell: bash
        run: |
          set -euo pipefail
          api(){
            local method="$1" path="$2" data="${3:-}"
            local args=(-fsS -X "$method" -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json')
            [[ -z "$data" ]] || args+=(-H 'Content-Type: application/json' --data "$data")
            curl "${args[@]}" "$HOSTINGER_API_BASE$path"
          }
          busy="$(api GET "/api/vps/v1/virtual-machines/$HOSTINGER_VM_ID/actions?page=1" | jq '[.data[]? | select(.state=="sent" or .state=="started" or .state=="pending" or .state=="running" or .state=="queued")] | length')"
          [[ "$busy" == 0 ]] || { echo HOSTINGER_ACTION_PLANE_BUSY=$busy >&2; exit 3; }
          echo HOSTINGER_ACTION_PLANE=IDLE

          pub="$(cat ~/.ssh/sahjony-provider-bootstrap.pub)"
          payload="$(jq -n --arg name '${{ steps.key.outputs.key_name }}' --arg key "$pub" '{name:$name,key:$key}')"
          created="$(api POST '/api/vps/v1/public-keys' "$payload")"
          key_id="$(jq -r '.id // empty' <<<"$created")"
          [[ "$key_id" =~ ^[0-9]+$ ]] || { echo HOSTINGER_PUBLIC_KEY_CREATE_FAILED=1 >&2; jq -c . <<<"$created" >&2 || true; exit 4; }
          echo "key_id=$key_id" >> "$GITHUB_OUTPUT"
          echo HOSTINGER_PUBLIC_KEY_REGISTERED=1

          attach_payload="$(jq -n --argjson id "$key_id" '{ids:[$id]}')"
          attached="$(api POST "/api/vps/v1/public-keys/attach/$HOSTINGER_VM_ID" "$attach_payload")"
          action_id="$(jq -r '.id // empty' <<<"$attached")"
          [[ "$action_id" =~ ^[0-9]+$ ]] || { echo HOSTINGER_PUBLIC_KEY_ATTACH_FAILED=1 >&2; jq -c . <<<"$attached" >&2 || true; exit 5; }
          echo HOSTINGER_PUBLIC_KEY_ATTACH_ACTION=$action_id

          success=false
          for i in $(seq 1 90); do
            a="$(api GET "/api/vps/v1/virtual-machines/$HOSTINGER_VM_ID/actions/$action_id")"
            state="$(jq -r '.state // empty' <<<"$a")"
            echo "key_attach_probe=$i/90 state=${state:-unknown}"
            case "$state" in
              success) success=true; break ;;
              failed|failure|error|cancelled|canceled) jq -c '{id,name,state,created_at,updated_at}' <<<"$a" >&2 || true; exit 6 ;;
            esac
            sleep 4
          done
          [[ "$success" == true ]] || { echo HOSTINGER_KEY_ATTACH_TIMEOUT=1 >&2; exit 7; }
          echo HOSTINGER_PUBLIC_KEY_ATTACHED=SUCCESS

      - name: Authenticate normal Kali without Recovery
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for i in $(seq 1 60); do
            if nc -z -w 4 "$HOSTINGER_HOST" 22 >/dev/null 2>&1; then
              if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/sahjony-provider-bootstrap "$HOSTINGER_USER@$HOSTINGER_HOST" 'printf SAHJONY_PROVIDER_BOOTSTRAP_SSH_OK' 2>/tmp/bootstrap-ssh.err | grep -q SAHJONY_PROVIDER_BOOTSTRAP_SSH_OK; then
                ready=true
                echo "HOSTINGER_PROVIDER_BOOTSTRAP_SSH=READY probe=$i"
                break
              fi
              echo "tcp22=open auth=pending probe=$i/60"
            else
              echo "tcp22=closed_or_filtered probe=$i/60"
            fi
            sleep 5
          done
          [[ "$ready" == true ]] || { echo HOSTINGER_PROVIDER_BOOTSTRAP_SSH=NOT_READY >&2; sed -n '1,20p' /tmp/bootstrap-ssh.err 2>/dev/null || true; exit 8; }

      - name: Stabilize existing Docker OpenClaw and install guardian
        shell: bash
        run: |
          set -euo pipefail
          key="$HOME/.ssh/sahjony-provider-bootstrap"
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i "$key" \
            openclaw/hostinger-24x7/whatsapp-guardian.sh \
            openclaw/hostinger-24x7/install-whatsapp-guardian.sh \
            "$HOSTINGER_USER@$HOSTINGER_HOST:/tmp/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i "$key" "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "HOST=$(hostname)"
          systemctl is-active --quiet ssh || systemctl enable --now ssh
          command -v docker >/dev/null 2>&1 || { echo DOCKER_MISSING=1 >&2; exit 20; }
          systemctl is-active --quiet docker || systemctl enable --now docker
          echo '=== EXISTING OPENCLAW CANDIDATES ==='
          docker ps -a --format '{{.ID}} {{.Names}} {{.Image}} {{.Status}}' | grep -Ei 'openclaw|claw' || { echo OPENCLAW_CONTAINER_MISSING=1 >&2; exit 21; }
          install -d -m 0755 /opt/sahjony-whatsapp-guardian
          install -m 0755 /tmp/whatsapp-guardian.sh /opt/sahjony-whatsapp-guardian/whatsapp-guardian.sh
          install -m 0755 /tmp/install-whatsapp-guardian.sh /opt/sahjony-whatsapp-guardian/install-whatsapp-guardian.sh
          /opt/sahjony-whatsapp-guardian/install-whatsapp-guardian.sh
          echo '=== GUARDIAN TIMER ==='
          systemctl is-enabled sahjony-whatsapp-guardian.timer
          systemctl is-active sahjony-whatsapp-guardian.timer
          echo '=== LAST GUARDIAN OUTPUT ==='
          tail -n 80 /var/log/sahjony-whatsapp-guardian.log 2>/dev/null || true
          echo '=== LAST GOOD ==='
          cat /var/lib/sahjony-whatsapp-guardian/last-good 2>/dev/null || true
          echo '=== OPENCLAW RESTART POLICY ==='
          docker ps -aq | while read -r id; do
            meta="$(docker inspect "$id" --format '{{.Name}}|{{.Config.Image}}' 2>/dev/null || true)"
            if grep -Eqi 'openclaw|claw' <<<"$meta"; then
              docker inspect "$id" --format 'name={{.Name}} status={{.State.Status}} restart={{.HostConfig.RestartPolicy.Name}}'
            fi
          done
          echo SAHJONY_HOSTINGER_BOOTSTRAP_STABILIZATION_COMPLETE=1
REMOTE

      - name: Remove ephemeral key from VPS and Hostinger account
        if: always()
        shell: bash
        env:
          KEY_ID: ${{ steps.attach.outputs.key_id }}
        run: |
          set +e
          if [[ -f ~/.ssh/sahjony-provider-bootstrap.pub && -f ~/.ssh/sahjony-provider-bootstrap ]]; then
            PUB_B64="$(base64 -w0 ~/.ssh/sahjony-provider-bootstrap.pub)"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 -i ~/.ssh/sahjony-provider-bootstrap "$HOSTINGER_USER@$HOSTINGER_HOST" "PUB_B64='$PUB_B64' bash -s" <<'REMOTE'
            set +e
            pub="$(printf '%s' "$PUB_B64" | base64 -d)"
            if [[ -f /root/.ssh/authorized_keys ]]; then
              tmp="$(mktemp)"
              grep -vxF "$pub" /root/.ssh/authorized_keys > "$tmp" || true
              cat "$tmp" > /root/.ssh/authorized_keys
              rm -f "$tmp"
              chmod 600 /root/.ssh/authorized_keys
            fi
REMOTE
          fi
          if [[ "$KEY_ID" =~ ^[0-9]+$ ]]; then
            curl -fsS -X DELETE -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/public-keys/$KEY_ID" >/dev/null 2>&1 || true
          fi
          rm -f ~/.ssh/sahjony-provider-bootstrap ~/.ssh/sahjony-provider-bootstrap.pub
          echo HOSTINGER_EPHEMERAL_KEY_CLEANUP_COMPLETE=1
