name: Hostinger OpenClaw 24x7

on:
  workflow_dispatch:
    inputs:
      configure_https:
        description: "Configure HTTPS after bootstrap"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostinger-openclaw-24x7.yml"
      - "openclaw/hostinger-24x7/**"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: hostinger-openclaw-production
  cancel-in-progress: false

env:
  HOSTINGER_CONFIRMED_HOST: "69.62.68.67"
  HOSTINGER_CONFIRMED_USER: "root"
  HOSTINGER_CONFIRMED_HOSTNAME: "srv767852.hstgr.cloud"

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      https_ready: ${{ steps.check.outputs.https_ready }}
      recovery_required: ${{ steps.check.outputs.recovery_required }}
    steps:
      - id: check
        name: Detect Hostinger connection and recovery readiness
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          DOMAIN: ${{ secrets.OPENCLAW_HOSTINGER_DOMAIN }}
          EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          set -euo pipefail
          ready=false
          https_ready=false
          recovery_required=true

          if [[ -n "$HOSTINGER_CONFIRMED_HOST" && -n "$HOSTINGER_CONFIRMED_USER" && -n "$KEY" ]]; then
            ready=true
          fi
          if [[ "$ready" == true && -n "$DOMAIN" && -n "$EMAIL" ]]; then
            https_ready=true
          fi

          health="$(curl -fsS --max-time 15 https://www.sahjony.com/whatsapp/health 2>/dev/null || true)"
          if [[ -n "$health" ]] && grep -q '"openclaw_fallback":{"configured":true,"connected":true' <<<"$health"; then
            recovery_required=false
          fi

          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "https_ready=$https_ready" >> "$GITHUB_OUTPUT"
          echo "recovery_required=$recovery_required" >> "$GITHUB_OUTPUT"

          echo "HOSTINGER_TARGET=$HOSTINGER_CONFIRMED_USER@$HOSTINGER_CONFIRMED_HOST ($HOSTINGER_CONFIRMED_HOSTNAME)"
          if [[ "$ready" == true ]]; then
            echo "HOSTINGER_OPENCLAW_PREFLIGHT=READY"
          else
            echo "HOSTINGER_OPENCLAW_PREFLIGHT=WAITING_FOR_SSH_PRIVATE_KEY_ONLY"
          fi
          if [[ "$https_ready" == true ]]; then
            echo "HOSTINGER_OPENCLAW_HTTPS_PREFLIGHT=READY"
          else
            echo "HOSTINGER_OPENCLAW_HTTPS_PREFLIGHT=OPTIONAL_NOT_READY"
          fi
          if [[ "$recovery_required" == true ]]; then
            echo "HOSTINGER_OPENCLAW_RECOVERY=REQUIRED"
          else
            echo "HOSTINGER_OPENCLAW_RECOVERY=HEALTHY_NO_ACTION"
          fi

  deploy:
    needs: preflight
    if: ${{ needs.preflight.outputs.ready == 'true' && (github.event_name != 'schedule' || needs.preflight.outputs.recovery_required == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/hostinger
          chmod 600 ~/.ssh/hostinger
          ssh-keyscan -H "$HOSTINGER_CONFIRMED_HOST" >> ~/.ssh/known_hosts

      - name: Run Hostinger authorization recovery agent
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/hostinger "$HOSTINGER_CONFIRMED_USER@$HOSTINGER_CONFIRMED_HOST" \
            "sudo env VERCEL_TOKEN='$VERCEL_TOKEN' VERCEL_SCOPE='${VERCEL_SCOPE:-juan-gonzalezs-projects-94b6dfe9}' bash -s" <<'REMOTE'
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git clone --depth 1 --branch main https://github.com/SAHJONY/IMPORT-EXPORT--BUSINESS.git "$tmp/repo"
          chmod +x "$tmp/repo/openclaw/hostinger-24x7/authorization-recovery-agent.sh" "$tmp/repo/openclaw/hostinger-24x7/bootstrap-existing-openclaw.sh"
          REPO_DIR="$tmp/repo" "$tmp/repo/openclaw/hostinger-24x7/authorization-recovery-agent.sh"
          REMOTE

      - name: Configure HTTPS when credentials are available
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.configure_https) || needs.preflight.outputs.https_ready == 'true' }}
        env:
          DOMAIN: ${{ secrets.OPENCLAW_HOSTINGER_DOMAIN }}
          EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/hostinger "$HOSTINGER_CONFIRMED_USER@$HOSTINGER_CONFIRMED_HOST" \
            "sudo env OPENCLAW_DOMAIN='$DOMAIN' LETSENCRYPT_EMAIL='$EMAIL' bash /opt/sahjony-openclaw/repo/openclaw/hostinger-24x7/configure-https.sh"

      - name: Verify SAHJONY cloud health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://www.sahjony.com/whatsapp/health | python3 -m json.tool
