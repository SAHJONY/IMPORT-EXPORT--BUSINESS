name: Hostinger V7 Dispatch Once

on:
  push:
    paths:
      - '.github/workflows/hostinger-v7-dispatch-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch canonical V7 exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/hostinger-whatsapp-recovery-v7.yml/dispatches"
          echo HOSTINGER_CANONICAL_V7_DISPATCHED_ONCE=1
