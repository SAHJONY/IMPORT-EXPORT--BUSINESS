name: Hostinger V7 Dispatch Once

on:
  push:
    paths:
      - '.github/workflows/hostinger-v7-dispatch-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch canonical V7 only when none is active
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: hostinger-whatsapp-recovery-v7.yml
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW/runs?per_page=50"
          runs="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")"

          active="$(jq '[.workflow_runs[]? | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | length' <<<"$runs")"
          echo "HOSTINGER_V7_ACTIVE_RUNS=$active"

          if [[ "$active" -gt 0 ]]; then
            jq -r '.workflow_runs[]? | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested") | "ACTIVE_V7_RUN id=\(.id) status=\(.status) conclusion=\(.conclusion // \"\") url=\(.html_url)"' <<<"$runs"
            echo HOSTINGER_CANONICAL_V7_ALREADY_ACTIVE=1
            exit 0
          fi

          code="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW/dispatches")"

          echo "HOSTINGER_V7_DISPATCH_HTTP=$code"
          if [[ "$code" != 204 ]]; then
            cat /tmp/dispatch.json || true
            exit 40
          fi

          echo HOSTINGER_CANONICAL_V7_DISPATCHED=1
