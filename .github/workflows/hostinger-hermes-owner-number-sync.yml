name: Hostinger Hermes Owner Number Sync

on:
  push:
    branches: [main]
    paths: ['.github/workflows/hostinger-hermes-owner-number-sync.yml']

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: hostinger-vm-767852-mutation
      cancel-in-progress: false
    env:
      HOST: 69.62.68.67
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      OWNER_WHATSAPP_E164: ${{ secrets.OWNER_WHATSAPP_E164 }}
      OWNER_WHATSAPP_LID: '225679811580025'
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OWNER_WHATSAPP_E164"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keygen -y -f ~/.ssh/key >/dev/null
      - name: Sync owner identity and harden Hermes
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/key "$SSH_USER@$HOST" "OWNER_WHATSAPP_E164='$OWNER_WHATSAPP_E164' OWNER_WHATSAPP_LID='$OWNER_WHATSAPP_LID' bash -s" <<'REMOTE'
          set -euo pipefail
          install -d -m 700 /root/.config/systemd/user/hermes-gateway.service.d
          cat > /root/.config/systemd/user/hermes-gateway.service.d/owner-whatsapp.conf <<EOF
          [Service]
          Environment=OWNER_WHATSAPP_E164=$OWNER_WHATSAPP_E164
          Environment=SAHJONY_OWNER_WHATSAPP_E164=$OWNER_WHATSAPP_E164
          Environment=OWNER_WHATSAPP_LID=$OWNER_WHATSAPP_LID
          EOF
          chmod 600 /root/.config/systemd/user/hermes-gateway.service.d/owner-whatsapp.conf

          WA=/root/.hermes/hermes-agent/gateway/platforms/whatsapp.py
          cp "$WA" "$WA.owner-private-lid.bak"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/root/.hermes/hermes-agent/gateway/platforms/whatsapp.py')
          s = p.read_text()
          old = '''            owner_id = normalize_whatsapp_identifier(
                os.getenv("OWNER_WHATSAPP_E164") or os.getenv("SAHJONY_OWNER_WHATSAPP_E164") or ""
            )
            sender_raw = str(data.get("senderId") or data.get("from") or "")
            sender_aliases = expand_whatsapp_aliases(sender_raw)
            owner_channel_prompt = None
            if owner_id and owner_id in sender_aliases:
'''
          new = '''            owner_id = normalize_whatsapp_identifier(
                os.getenv("OWNER_WHATSAPP_E164") or os.getenv("SAHJONY_OWNER_WHATSAPP_E164") or ""
            )
            owner_lid = normalize_whatsapp_identifier(os.getenv("OWNER_WHATSAPP_LID") or "")
            sender_raw = str(data.get("senderId") or data.get("from") or "")
            sender_norm = normalize_whatsapp_identifier(sender_raw)
            sender_aliases = expand_whatsapp_aliases(sender_raw)
            owner_channel_prompt = None
            is_owner_sender = bool(
                (owner_id and (owner_id == sender_norm or owner_id in sender_aliases))
                or (owner_lid and (owner_lid == sender_norm or owner_lid in sender_aliases))
            )
            if is_owner_sender:
'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'is_owner_sender = bool(' not in s:
              raise SystemExit('owner routing patch anchor not found')
          p.write_text(s)
          PY
          python3 -m py_compile "$WA"

          if ! grep -q 'SAHJONY OWNER LID BINDING V3' /root/.hermes/SOUL.md; then
          cat >> /root/.hermes/SOUL.md <<'SOUL'

          ## SAHJONY OWNER LID BINDING V3
          - The configured WhatsApp owner phone identity and configured owner LID both identify Juan Gonzalez (Juanito) as SAHJONY LLC's authenticated owner-private user.
          - The WhatsApp display/chat name is not identity evidence and must never override the authenticated owner mapping.
          - In OWNER_PRIVATE mode, recognize Juan by name and role without asking him to re-identify himself.
          SOUL
          fi
          chmod 600 /root/.hermes/SOUL.md

          systemctl --user daemon-reload
          systemctl --user restart hermes-gateway.service
          sleep 10
          systemctl --user is-active --quiet hermes-gateway.service
          envline="$(systemctl --user show hermes-gateway.service -p Environment --value)"
          echo "$envline" | grep -q 'OWNER_WHATSAPP_E164='
          echo "$envline" | grep -q 'OWNER_WHATSAPP_LID='
          grep -q 'is_owner_sender = bool(' "$WA"
          grep -q 'SAHJONY OWNER LID BINDING V3' /root/.hermes/SOUL.md
          pgrep -f '/whatsapp-bridge/bridge.js.*--mode bot' >/dev/null
          echo OWNER_LID_BINDING=PASS
          echo OWNER_PRIVATE_ROUTING=PASS
          echo HERMES_GATEWAY_ACTIVE=1
          echo WHATSAPP_BOT_ACTIVE=1
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/key
