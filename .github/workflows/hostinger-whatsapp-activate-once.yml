name: Hostinger WhatsApp Activate Once

# Re-armed after aligning Hostinger with the canonical OPENCLAW_APP_BRIDGE_SECRET.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-whatsapp-activate-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

env:
  HOSTINGER_VM_ID: '767852'
  HOSTINGER_HOST: '69.62.68.67'
  HOSTINGER_USER: root
  HOSTINGER_API_BASE: https://developers.hostinger.com

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      DURABLE_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare safe management identity and validate tooling
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$HOSTINGER_API_TOKEN" ]] || { echo HOSTINGER_API_TOKEN_MISSING=1 >&2; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq sshpass netcat-openbsd >/dev/null
          install -d -m 700 ~/.ssh
          key="$HOME/.ssh/sahjony-whatsapp-activate"
          if [[ -n "${DURABLE_SSH_PRIVATE_KEY:-}" ]]; then
            printf '%s\n' "$DURABLE_SSH_PRIVATE_KEY" > "$key"
            chmod 600 "$key"
            ssh-keygen -y -f "$key" > "$key.pub"
            echo KEY_IS_EPHEMERAL=false >> "$GITHUB_ENV"
            echo SAHJONY_EXISTING_SSH_IDENTITY_AVAILABLE=1
          else
            ssh-keygen -q -t ed25519 -N '' -f "$key" -C "sahjony-whatsapp-activate-${GITHUB_RUN_ID}"
            echo KEY_IS_EPHEMERAL=true >> "$GITHUB_ENV"
            echo SAHJONY_EPHEMERAL_SSH_IDENTITY_CREATED=1
          fi
          unset DURABLE_SSH_PRIVATE_KEY
          echo "SSH_KEY_PATH=$key" >> "$GITHUB_ENV"
          chmod +x \
            openclaw/hostinger-24x7/hostinger-recovery-controller.sh \
            openclaw/hostinger-24x7/ssh-self-heal.sh \
            openclaw/hostinger-24x7/hostinger-runtime-bootstrap.sh \
            openclaw/hostinger-24x7/openclaw-runtime-recovery.sh \
            openclaw/hostinger-24x7/whatsapp-hostinger-only-guardian.sh \
            openclaw/hostinger-24x7/whatsapp-number-activate.sh
          bash -n openclaw/hostinger-24x7/hostinger-recovery-controller.sh
          bash -n openclaw/hostinger-24x7/whatsapp-hostinger-only-guardian.sh
          bash -n openclaw/hostinger-24x7/whatsapp-number-activate.sh
          echo SAHJONY_ACTIVATION_TOOLING_VALIDATED=1

      - name: Establish authenticated native Kali SSH without competing mutation
        shell: bash
        run: |
          set -euo pipefail
          export SSH_KEY_PATH
          openclaw/hostinger-24x7/hostinger-recovery-controller.sh repair-ssh
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i "$SSH_KEY_PATH")
          ssh "${opts[@]}" "$HOSTINGER_USER@$HOSTINGER_HOST" \
            'set -euo pipefail; systemctl is-active --quiet ssh.service; systemctl is-active --quiet docker.service; printf "SAHJONY_NORMAL_KALI_SSH=READY\n"'

      - name: Activate the existing linked WhatsApp session and install 24x7 heartbeat guardian
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i "$SSH_KEY_PATH")
          scp "${opts[@]}" \
            openclaw/hostinger-24x7/whatsapp-number-activate.sh \
            "$HOSTINGER_USER@$HOSTINGER_HOST:/tmp/sahjony-whatsapp-number-activate"
          scp "${opts[@]}" \
            openclaw/hostinger-24x7/whatsapp-hostinger-only-guardian.sh \
            "$HOSTINGER_USER@$HOSTINGER_HOST:/tmp/sahjony-whatsapp-guardian"

          ssh "${opts[@]}" "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          install -m 700 /tmp/sahjony-whatsapp-number-activate /usr/local/sbin/sahjony-whatsapp-number-activate
          install -m 700 /tmp/sahjony-whatsapp-guardian /usr/local/sbin/sahjony-whatsapp-hostinger-guardian
          rm -f /tmp/sahjony-whatsapp-number-activate /tmp/sahjony-whatsapp-guardian

          echo '=== EXISTING LINKED SESSION ACTIVATION ==='
          /usr/local/sbin/sahjony-whatsapp-number-activate

          echo '=== 24X7 GUARDIAN INSTALL ==='
          /usr/local/sbin/sahjony-whatsapp-hostinger-guardian install
          systemctl is-enabled --quiet sahjony-whatsapp-hostinger.timer
          systemctl is-active --quiet sahjony-whatsapp-hostinger.timer

          echo '=== LOCAL ACCEPTANCE ==='
          systemctl is-active --quiet docker.service
          cid="$(docker ps -a --format '{{.ID}}|{{.Names}}|{{.Image}}' | awk -F'|' 'tolower($0) ~ /openclaw|claw/ {print $1; exit}')"
          test -n "$cid"
          test "$(docker inspect "$cid" --format '{{.State.Running}}')" = true
          policy="$(docker inspect "$cid" --format '{{.HostConfig.RestartPolicy.Name}}')"
          case "$policy" in unless-stopped|always) ;; *) echo "BAD_RESTART_POLICY=$policy" >&2; exit 31 ;; esac
          test -s /var/lib/sahjony-whatsapp-guardian/number-activation-last-good.json
          echo SAHJONY_HOSTINGER_WHATSAPP_LOCAL=READY
          REMOTE

      - name: Verify production number is active
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --retry 5 --retry-delay 2 https://www.sahjony.com/whatsapp/health)"
          HEALTH_JSON="$health" python3 - <<'PY'
          import json, os, sys
          h=json.loads(os.environ['HEALTH_JSON'])
          node=h.get('hostinger_openclaw') or {}
          checks={
              'status_ok': h.get('status') == 'ok',
              'hostinger_independent_runtime': h.get('hostinger_independent_runtime') is True,
              'send_ready': h.get('send_ready') is True,
              'webhook_ready': h.get('webhook_ready') is True,
              'hostinger_connected': node.get('connected') is True,
              'gateway_matches': node.get('gateway_id') == 'hostinger-vps',
              'business_number_present': bool(node.get('business_number')),
          }
          safe={
              'ok': all(checks.values()),
              'checks': checks,
              'gateway_id': node.get('gateway_id'),
              'business_number': node.get('business_number'),
              'last_seen_at': node.get('last_seen_at'),
              'provider': h.get('primary_provider'),
          }
          print(json.dumps(safe, separators=(',',':')))
          if not safe['ok']:
              sys.exit(1)
          print('SAHJONY_WHATSAPP_NUMBER=ACTIVE')
          PY

      - name: Remove ephemeral management identity
        if: always()
        shell: bash
        run: |
          set +e
          key="${SSH_KEY_PATH:-$HOME/.ssh/sahjony-whatsapp-activate}"
          if [[ "${KEY_IS_EPHEMERAL:-false}" == true && -s "$key.pub" && -s "$key" ]]; then
            pub_b64="$(base64 -w0 "$key.pub")"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i "$key" \
              "$HOSTINGER_USER@$HOSTINGER_HOST" "PUB_B64='$pub_b64' bash -s" <<'REMOTE'
          set -euo pipefail
          auth=/root/.ssh/authorized_keys
          if [[ -f "$auth" ]]; then
            pub="$(printf '%s' "$PUB_B64" | base64 -d)"
            tmp="$(mktemp)"
            grep -vxF "$pub" "$auth" > "$tmp" || true
            cat "$tmp" > "$auth"
            chmod 600 "$auth"
            rm -f "$tmp"
          fi
          echo SAHJONY_EPHEMERAL_MANAGEMENT_IDENTITY_REMOVED=1
          REMOTE
          fi
          rm -f "$key" "$key.pub"
