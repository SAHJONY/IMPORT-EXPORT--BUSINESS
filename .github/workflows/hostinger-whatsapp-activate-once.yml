name: Hostinger WhatsApp Activate Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-whatsapp-activate-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

env:
  HOSTINGER_VM_ID: '767852'
  HOSTINGER_HOST: '69.62.68.67'
  HOSTINGER_USER: root
  HOSTINGER_API_BASE: https://developers.hostinger.com

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare ephemeral authorized management path
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$HOSTINGER_API_TOKEN" ]] || { echo HOSTINGER_API_TOKEN_MISSING=1 >&2; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq sshpass netcat-openbsd >/dev/null
          install -d -m 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/whatsapp-activate -C "sahjony-whatsapp-activate-${GITHUB_RUN_ID}"
          echo "SSH_KEY_PATH=$HOME/.ssh/whatsapp-activate" >> "$GITHUB_ENV"
          chmod +x openclaw/hostinger-24x7/hostinger-recovery-controller.sh
          chmod +x openclaw/hostinger-24x7/ssh-self-heal.sh
          chmod +x openclaw/hostinger-24x7/hostinger-runtime-bootstrap.sh
          chmod +x openclaw/hostinger-24x7/openclaw-runtime-recovery.sh
          chmod +x openclaw/hostinger-24x7/whatsapp-hostinger-only-guardian.sh

      - name: Ensure normal Kali SSH without competing recovery
        shell: bash
        run: |
          set -euo pipefail
          openclaw/hostinger-24x7/hostinger-recovery-controller.sh repair-ssh

      - name: Install and enable official WhatsApp plugin
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i "$SSH_KEY_PATH")
          ssh "${opts[@]}" "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/sahjony-openclaw
          test -s docker-compose.yml
          systemctl is-active --quiet docker.service
          test "$(docker inspect sahjony-openclaw-gateway --format '{{.State.Running}}')" = true

          run_cli(){
            docker compose run -T --rm --no-deps openclaw-cli "$@"
          }

          echo '=== INSTALL OFFICIAL WHATSAPP PLUGIN ==='
          set +e
          out="$(run_cli plugins install clawhub:@openclaw/whatsapp --accept-capabilities 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out" | sed -E 's/(token|secret|key|password)[=:][^[:space:]]+/\1=[REDACTED]/Ig'
          if (( rc != 0 )); then
            if grep -qi 'acknowledge-clawhub-risk' <<<"$out"; then
              run_cli plugins install clawhub:@openclaw/whatsapp --accept-capabilities --acknowledge-clawhub-risk
            elif grep -Eqi 'already (installed|exists)' <<<"$out"; then
              echo WHATSAPP_PLUGIN_ALREADY_PRESENT=1
            else
              exit "$rc"
            fi
          fi

          echo '=== ENABLE WHATSAPP PLUGIN ==='
          run_cli plugins enable whatsapp --accept-capabilities

          echo '=== HOST-LEVEL GATEWAY RELOAD ==='
          docker restart sahjony-openclaw-gateway >/dev/null
          for i in $(seq 1 24); do
            status="$(docker inspect sahjony-openclaw-gateway --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' 2>/dev/null || true)"
            echo "gateway_health_probe=$i status=${status:-unknown}"
            [[ "$status" == healthy ]] && break
            [[ "$status" == exited || "$status" == dead ]] && exit 20
            sleep 5
          done
          test "$(docker inspect sahjony-openclaw-gateway --format '{{.State.Health.Status}}')" = healthy

          echo '=== PLUGIN INVENTORY ==='
          run_cli plugins list 2>&1 | sed -E 's/(token|secret|key|password)[=:][^[:space:]]+/\1=[REDACTED]/Ig' | grep -Ei 'whatsapp|plugin|enabled|loaded' || true

          echo '=== WHATSAPP CHANNEL PROBE ==='
          set +e
          probe="$(run_cli channels status --channel whatsapp --probe 2>&1)"
          probe_rc=$?
          set -e
          printf '%s\n' "$probe" | sed -E 's/(token|secret|key|password)[=:][^[:space:]]+/\1=[REDACTED]/Ig'
          echo "WHATSAPP_CHANNEL_PROBE_RC=$probe_rc"
          if printf '%s' "$probe" | grep -Eiq 'whatsapp.*(connected|ready|active|healthy)|(connected|ready|active|healthy).*whatsapp'; then
            echo SAHJONY_HOSTINGER_WHATSAPP_CHANNEL=READY
          else
            echo SAHJONY_HOSTINGER_WHATSAPP_CHANNEL=PAIRING_OR_AUTH_REQUIRED
          fi

          echo '=== AUTH/SESSION CANDIDATE METADATA ONLY ==='
          for base in /var/lib/sahjony-openclaw-state /var/lib/sahjony-openclaw-auth /root/.openclaw /var/backups/sahjony-openclaw; do
            [[ -d "$base" ]] || continue
            find "$base" -xdev -maxdepth 10 -type f \
              \( -iname '*whatsapp*' -o -iname '*baileys*' -o -iname 'creds.json' -o -iname '*session*.json' -o -iname '*auth*.json' -o -iname '*device*.json' \) \
              -printf '%p|size=%s|mtime=%TY-%Tm-%TdT%TH:%TM:%TSZ\n' 2>/dev/null | head -n 240 || true
          done
          REMOTE

      - name: Install guardian only when WhatsApp is already connected
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i "$SSH_KEY_PATH")
          scp "${opts[@]}" openclaw/hostinger-24x7/whatsapp-hostinger-only-guardian.sh "$HOSTINGER_USER@$HOSTINGER_HOST:/tmp/sahjony-whatsapp-guardian"
          ssh "${opts[@]}" "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          install -m 700 /tmp/sahjony-whatsapp-guardian /usr/local/sbin/sahjony-whatsapp-guardian
          rm -f /tmp/sahjony-whatsapp-guardian
          set +e
          /usr/local/sbin/sahjony-whatsapp-guardian audit
          rc=$?
          set -e
          if (( rc == 0 )); then
            /usr/local/sbin/sahjony-whatsapp-guardian install
            systemctl is-enabled --quiet sahjony-whatsapp-hostinger.timer
            systemctl is-active --quiet sahjony-whatsapp-hostinger.timer
            echo SAHJONY_WHATSAPP_GUARDIAN=READY
          else
            echo SAHJONY_WHATSAPP_GUARDIAN=DEFERRED_UNTIL_CHANNEL_AUTH
          fi
          REMOTE

      - name: Remove ephemeral management identity
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -s ~/.ssh/whatsapp-activate.pub && -s ~/.ssh/whatsapp-activate ]]; then
            pub_b64="$(base64 -w0 ~/.ssh/whatsapp-activate.pub)"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/whatsapp-activate "$HOSTINGER_USER@$HOSTINGER_HOST" "PUB_B64='$pub_b64' bash -s" <<'REMOTE'
          set -euo pipefail
          auth=/root/.ssh/authorized_keys
          if [[ -f "$auth" ]]; then
            pub="$(printf '%s' "$PUB_B64" | base64 -d)"
            tmp="$(mktemp)"
            grep -vxF "$pub" "$auth" > "$tmp" || true
            cat "$tmp" > "$auth"
            chmod 600 "$auth"
            rm -f "$tmp"
          fi
          rm -f /tmp/sahjony-whatsapp-guardian
          echo SAHJONY_WHATSAPP_ACTIVATION_EPHEMERAL_KEY_REMOVED=1
          REMOTE
          fi
          rm -f ~/.ssh/whatsapp-activate ~/.ssh/whatsapp-activate.pub
