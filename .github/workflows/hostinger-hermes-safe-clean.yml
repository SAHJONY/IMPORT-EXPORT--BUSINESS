name: Hostinger Hermes Safe Clean

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-hermes-safe-clean.yml'
  workflow_dispatch:

concurrency:
  group: hostinger-vm-767852-hermes-clean
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HOST: 69.62.68.67
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_KEY:-}" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keygen -y -f ~/.ssh/key >/dev/null

      - name: Clean Hermes safely
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/key)
          ssh "${opts[@]}" "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          H=/root/.hermes
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          test -d "$H"

          # Preserve canonical config and WhatsApp linked-device/auth state.
          mkdir -p "$H/maintenance-backups/$stamp"
          for f in "$H/SOUL.md" "$H/config.yaml"; do
            [[ -f "$f" ]] && cp -p "$f" "$H/maintenance-backups/$stamp/"
          done

          # Reset only conversational/session cache so stale identity context cannot survive.
          if [[ -d "$H/sessions" ]]; then
            mv "$H/sessions" "$H/sessions.pre-clean.$stamp"
          fi
          mkdir -m 700 "$H/sessions"

          # Remove ephemeral interpreter/cache debris only.
          find "$H" /opt/sahjony-hermes -type d -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true
          find "$H" /opt/sahjony-hermes -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '.DS_Store' \) -delete 2>/dev/null || true
          find /tmp -maxdepth 1 -type f -name 'hermes-*' -mtime +1 -delete 2>/dev/null || true

          # Purge known stale identity contamination from prompt-bearing text, without touching CRM or platform auth.
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path('/root/.hermes/SOUL.md'), Path('/root/.hermes/profiles'), Path('/root/.hermes/skills'), Path('/opt/sahjony-hermes')]
          pats = [
              re.compile(r'founder\s*(?:and|&)\s*CEO\s+of\s+PRIMO', re.I),
              re.compile(r'fundador\s+y\s+CEO\s+de\s+PRIMO', re.I),
              re.compile(r'Juan\s+(?:Gonz[aá]lez|G[oó]mez).*PRIMO', re.I),
          ]
          changed = 0
          for root in roots:
              paths = [root] if root.is_file() else ([p for p in root.rglob('*') if p.is_file()] if root.exists() else [])
              for p in paths:
                  try:
                      raw = p.read_text(errors='ignore')
                  except Exception:
                      continue
                  lines = raw.splitlines()
                  kept = [ln for ln in lines if not any(rx.search(ln) for rx in pats)]
                  if len(kept) != len(lines):
                      p.write_text('\n'.join(kept) + ('\n' if raw.endswith('\n') else ''))
                      changed += 1
          print(f'IDENTITY_CONTAMINATION_FILES_CLEANED={changed}')
          PY

          # Keep cleanup reversible for a short period, then remove old session backups.
          find "$H" -maxdepth 1 -type d -name 'sessions.pre-*' -mtime +7 -exec rm -rf {} + 2>/dev/null || true
          find "$H/maintenance-backups" -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf {} + 2>/dev/null || true

          systemctl --user daemon-reload
          systemctl --user restart hermes-gateway.service
          sleep 12
          systemctl --user is-active --quiet hermes-gateway.service
          pgrep -f '/whatsapp-bridge/bridge.js.*--mode bot' >/dev/null
          grep -Eqi 'connected|ready|authenticated' "$H/platforms/whatsapp/bridge.log"

          echo HERMES_SAFE_CLEAN=PASS
          echo HERMES_SESSION_CACHE_RESET=PASS
          echo HERMES_GATEWAY_ACTIVE=1
          echo WHATSAPP_BOT_ACTIVE=1
          echo PLATFORM_AUTH_PRESERVED=1
          REMOTE

      - name: Verify no stale identity phrase remains
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/key)
          ssh "${opts[@]}" "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          roots=(/root/.hermes/SOUL.md /root/.hermes/profiles /root/.hermes/skills /opt/sahjony-hermes)
          if grep -Rni --exclude='*.pyc' -E 'founder (and|&) CEO of PRIMO|fundador y CEO de PRIMO|Juan (González|Gonzalez|Gómez|Gomez).*PRIMO' "${roots[@]}" 2>/dev/null | head -1 | grep -q .; then
            echo STALE_IDENTITY_REFERENCE_REMAINS=1
            exit 42
          fi
          systemctl --user is-active --quiet hermes-gateway.service
          pgrep -f '/whatsapp-bridge/bridge.js.*--mode bot' >/dev/null
          echo IDENTITY_CLEAN_VERIFY=PASS
          echo HERMES_RUNTIME_VERIFY=PASS
          REMOTE

      - name: Cleanup local key
        if: always()
        run: rm -f ~/.ssh/key
