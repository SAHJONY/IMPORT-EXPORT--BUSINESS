name: Hostinger Model Verify Once

on:
  push:
    branches: [ops/model-setup-once]
    paths:
      - '.github/workflows/hostinger-openai-model-setup-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare secure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-verify
          chmod 600 ~/.ssh/hostinger-verify
          ssh-keygen -y -f ~/.ssh/hostinger-verify >/dev/null

      - name: Verify Hostinger Gateway, model, and WhatsApp
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
            -i ~/.ssh/hostinger-verify "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          STATE=/var/lib/sahjony-openclaw-state
          CONFIG="$STATE/openclaw.json"
          oc(){ env HOME=/home/node OPENCLAW_HOME=/home/node OPENCLAW_STATE_DIR="$STATE" OPENCLAW_CONFIG_PATH="$CONFIG" openclaw "$@"; }

          echo HOSTINGER_VPS_SCOPE_ONLY=1
          systemctl is-active --quiet openclaw-gateway.service
          systemctl is-enabled --quiet openclaw-gateway.service
          echo OPENCLAW_GATEWAY_ACTIVE=1
          echo OPENCLAW_GATEWAY_24X7=1

          raw="$(oc config get agents.defaults.model.primary --json 2>/dev/null || true)"
          configured="$(RAW="$raw" python3 - <<'PY'
          import json, os
          raw=os.environ.get('RAW','').strip()
          try:
              v=json.loads(raw)
              print(v if isinstance(v,str) else '')
          except Exception:
              print(raw.strip('"'))
          PY
          )"
          [[ "$configured" == nvidia/* ]] || { echo MODEL_PRIMARY_NOT_NVIDIA=1 >&2; exit 31; }
          echo MODEL_PRIMARY_PROVIDER=NVIDIA_NIM
          echo MODEL_PRIMARY="$configured"

          python3 - /var/lib/sahjony-nvidia-nim/status.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('auth_ready') is True, d
          print('NVIDIA_NIM_AUTH_READY=1')
          PY

          wa="$(oc channels status --channel whatsapp --probe 2>&1 || true)"
          printf '%s\n' "$wa" | tail -n 25
          if grep -Eiq 'whatsapp.*(connected|ready|healthy|linked.*running)|linked.*running.*connected' <<<"$wa"; then
            echo WHATSAPP_CONNECTED=1
          else
            echo WHATSAPP_CONNECTED=0
            exit 32
          fi
          REMOTE

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hostinger-verify
