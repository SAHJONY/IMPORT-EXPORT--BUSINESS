name: Hostinger OpenAI API Setup Once

on:
  push:
    branches: [ops/model-setup-once]
    paths:
      - '.github/workflows/hostinger-openai-model-setup-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-openai-api-setup-once
  cancel-in-progress: false

jobs:
  configure-openai:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      OPENAI_API_KEY_GH: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_KEY:-}" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          [[ -n "${OPENAI_API_KEY_GH:-}" ]] || { echo OPENAI_API_KEY_GITHUB_SECRET_MISSING=1 >&2; exit 3; }
          echo OPENAI_API_KEY_GITHUB_SECRET_PRESENT=1

      - name: Prepare secure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-openai
          chmod 600 ~/.ssh/hostinger-openai
          ssh-keygen -y -f ~/.ssh/hostinger-openai >/dev/null

      - name: Transfer OpenAI key securely to Hostinger VPS
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$OPENAI_API_KEY_GH" > "$RUNNER_TEMP/openai-api-key"
          chmod 600 "$RUNNER_TEMP/openai-api-key"
          ok=0
          for attempt in 1 2 3 4; do
            if scp -q -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
              -i ~/.ssh/hostinger-openai "$RUNNER_TEMP/openai-api-key" "$USER@$HOST:/root/.openai-api-key.once"; then
              ok=1
              break
            fi
            echo "SSH_TRANSFER_ATTEMPT_${attempt}_FAILED=1"
            sleep $((attempt * 4))
          done
          rm -f "$RUNNER_TEMP/openai-api-key"
          [[ "$ok" == "1" ]] || { echo HOSTINGER_SSH_TRANSFER_FAILED=1 >&2; exit 4; }

      - name: Bind OpenAI API key to native Gateway and verify
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4; do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
              -i ~/.ssh/hostinger-openai "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          STATE=/var/lib/sahjony-openclaw-state
          CONFIG="$STATE/openclaw.json"
          HOME_DIR=/home/node
          KEY_TMP=/root/.openai-api-key.once
          ENV_FILE=/etc/openclaw-openai.env
          DROPIN=/etc/systemd/system/openclaw-gateway.service.d/20-openai-auth.conf
          oc(){ env HOME="$HOME_DIR" OPENCLAW_HOME="$HOME_DIR" OPENCLAW_STATE_DIR="$STATE" OPENCLAW_CONFIG_PATH="$CONFIG" openclaw "$@"; }
          trap 'rm -f "$KEY_TMP" /tmp/openai-smoke.json' EXIT

          echo HOSTINGER_VPS_SCOPE_ONLY=1
          [[ -s "$KEY_TMP" ]] || { echo OPENAI_KEY_TRANSFER_MISSING=1 >&2; exit 20; }
          [[ -f "$CONFIG" ]] || { echo OPENCLAW_CONFIG_MISSING=1 >&2; exit 21; }
          systemctl cat openclaw-gateway.service >/dev/null 2>&1 || { echo OPENCLAW_GATEWAY_SERVICE_MISSING=1 >&2; exit 22; }

          chmod 600 "$KEY_TMP"
          umask 077
          {
            printf 'OPENAI_API_KEY='
            cat "$KEY_TMP"
            printf '\n'
          } > "$ENV_FILE"
          chmod 600 "$ENV_FILE"

          install -d -m 755 "$(dirname "$DROPIN")"
          cat > "$DROPIN" <<'EOF2'
          [Service]
          EnvironmentFile=/etc/openclaw-openai.env
          EOF2

          oc config set agents.defaults.model.primary openai/gpt-5.6-sol >/dev/null
          oc config validate >/dev/null

          systemctl daemon-reload
          systemctl restart openclaw-gateway.service
          sleep 12
          systemctl is-active --quiet openclaw-gateway.service
          systemctl is-enabled --quiet openclaw-gateway.service

          pid="$(systemctl show openclaw-gateway.service -p MainPID --value)"
          [[ "$pid" =~ ^[0-9]+$ ]] && [[ "$pid" -gt 1 ]]
          tr '\0' '\n' < "/proc/$pid/environ" | grep -q '^OPENAI_API_KEY='

          raw="$(oc config get agents.defaults.model.primary --json 2>/dev/null || true)"
          configured="$(RAW="$raw" python3 - <<'PY'
          import json, os
          raw=os.environ.get('RAW','').strip()
          try:
              v=json.loads(raw)
              print(v if isinstance(v,str) else '')
          except Exception:
              print(raw.strip('"'))
          PY
          )"
          [[ "$configured" == 'openai/gpt-5.6-sol' ]] || { echo OPENAI_PRIMARY_MODEL_MISMATCH=1 >&2; exit 23; }

          set -a
          . "$ENV_FILE"
          set +a
          http="$(curl -sS -o /tmp/openai-smoke.json -w '%{http_code}' --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"model":"gpt-5.6-sol","input":"Reply exactly SAHJONY_OPENAI_OK","max_output_tokens":24}' \
            https://api.openai.com/v1/responses || true)"
          if [[ "$http" != "200" ]]; then
            echo "OPENAI_API_SMOKE_HTTP=$http" >&2
            python3 - /tmp/openai-smoke.json <<'PY' >&2 || true
          import json,sys
          try:
              d=json.load(open(sys.argv[1]))
              e=d.get('error') or {}
              print('OPENAI_API_ERROR_TYPE='+str(e.get('type','unknown')))
              print('OPENAI_API_ERROR_CODE='+str(e.get('code','unknown')))
              print('OPENAI_API_ERROR_MESSAGE='+str(e.get('message',''))[:300])
          except Exception:
              print('OPENAI_API_ERROR_UNPARSEABLE=1')
          PY
            exit 24
          fi

          echo OPENCLAW_GATEWAY_ACTIVE=1
          echo OPENCLAW_GATEWAY_24X7=1
          echo OPENAI_API_KEY_BOUND_TO_GATEWAY=1
          echo OPENAI_PRIMARY_MODEL=openai/gpt-5.6-sol
          echo OPENAI_API_SMOKE=PASS

          wa="$(oc channels status --channel whatsapp --probe 2>&1 || true)"
          if grep -Eiq 'whatsapp.*(connected|ready|healthy|linked.*running)|linked.*running.*connected' <<<"$wa"; then
            echo WHATSAPP_CONNECTED=1
          else
            echo WHATSAPP_RECHECK_NEEDED=1
            printf '%s\n' "$wa" | tail -n 25
          fi
          REMOTE
            then
              ok=1
              break
            fi
            echo "SSH_CONFIG_ATTEMPT_${attempt}_FAILED=1"
            sleep $((attempt * 4))
          done
          [[ "$ok" == "1" ]] || { echo HOSTINGER_OPENAI_SETUP_FAILED=1 >&2; exit 5; }

      - name: Cleanup transient credentials
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hostinger-openai "$RUNNER_TEMP/openai-api-key"
