name: Hostinger OpenAI Model Setup Once

on:
  push:
    branches: [ops/model-setup-once]
    paths:
      - '.github/workflows/hostinger-openai-model-setup-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-openai-model-setup-once
  cancel-in-progress: false

jobs:
  configure-openai:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare secure SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_KEY:-}" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-openai
          chmod 600 ~/.ssh/hostinger-openai
          ssh-keygen -y -f ~/.ssh/hostinger-openai >/dev/null

      - name: Recover OpenAI key on Hostinger and bind it to Gateway
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
            -i ~/.ssh/hostinger-openai "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          STATE=/var/lib/sahjony-openclaw-state
          CONFIG="$STATE/openclaw.json"
          HOME_DIR=/home/node
          KEY_TMP=/root/.openai-api-key.once
          ENV_FILE=/etc/openclaw-openai.env
          DROPIN=/etc/systemd/system/openclaw-gateway.service.d/20-openai-auth.conf
          trap 'rm -f "$KEY_TMP"' EXIT

          oc(){ env HOME="$HOME_DIR" OPENCLAW_HOME="$HOME_DIR" OPENCLAW_STATE_DIR="$STATE" OPENCLAW_CONFIG_PATH="$CONFIG" openclaw "$@"; }
          save_key(){
            local candidate="${1:-}"
            candidate="${candidate//$'\r'/}"
            candidate="${candidate//$'\n'/}"
            [[ ${#candidate} -ge 20 ]] || return 1
            umask 077
            printf '%s' "$candidate" > "$KEY_TMP"
            chmod 600 "$KEY_TMP"
            return 0
          }

          echo HOSTINGER_VPS_SCOPE_ONLY=1
          [[ -f "$CONFIG" ]] || { echo OPENCLAW_CONFIG_MISSING=1 >&2; exit 20; }
          systemctl cat openclaw-gateway.service >/dev/null 2>&1 || { echo OPENCLAW_GATEWAY_SERVICE_MISSING=1 >&2; exit 21; }

          # 1) Existing dedicated OpenAI env file.
          if [[ -s "$ENV_FILE" ]]; then
            k="$(sed -n 's/^OPENAI_API_KEY=//p' "$ENV_FILE" | head -n1 || true)"
            if save_key "$k"; then echo OPENAI_KEY_SOURCE=EXISTING_GATEWAY_ENV; fi
          fi

          # 2) Known environment files on the VPS.
          if [[ ! -s "$KEY_TMP" ]]; then
            for f in /etc/openclaw-gateway.env /etc/default/openclaw-gateway /etc/environment \
                     /root/.env /home/node/.env "$STATE/.env" "$STATE/openclaw.env"; do
              [[ -f "$f" ]] || continue
              k="$(sed -n 's/^OPENAI_API_KEY=//p' "$f" | tail -n1 || true)"
              if save_key "$k"; then echo OPENAI_KEY_SOURCE=HOST_ENV_FILE; break; fi
            done
          fi

          # 3) Environment of the currently running native Gateway process.
          if [[ ! -s "$KEY_TMP" ]]; then
            pid="$(systemctl show openclaw-gateway.service -p MainPID --value 2>/dev/null || true)"
            if [[ "$pid" =~ ^[0-9]+$ ]] && [[ "$pid" -gt 1 ]] && [[ -r "/proc/$pid/environ" ]]; then
              k="$(tr '\0' '\n' < "/proc/$pid/environ" | sed -n 's/^OPENAI_API_KEY=//p' | head -n1 || true)"
              if save_key "$k"; then echo OPENAI_KEY_SOURCE=RUNNING_GATEWAY_ENV; fi
            fi
          fi

          # 4) Retained OpenClaw Docker container environment.
          if [[ ! -s "$KEY_TMP" ]] && command -v docker >/dev/null 2>&1; then
            while read -r id; do
              [[ -n "$id" ]] || continue
              meta="$(docker inspect "$id" --format '{{.Name}}|{{.Config.Image}}|{{json .Config.Labels}}' 2>/dev/null || true)"
              grep -Eqi 'openclaw|open[-_ ]?claw|claw' <<<"$meta" || continue
              k="$(docker inspect "$id" --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | sed -n 's/^OPENAI_API_KEY=//p' | head -n1 || true)"
              if save_key "$k"; then echo OPENAI_KEY_SOURCE=RETAINED_OPENCLAW_CONTAINER; break; fi
            done < <(docker ps -aq 2>/dev/null || true)
          fi

          # 5) Limited .env discovery on this VPS; capture only OPENAI_API_KEY and never print it.
          if [[ ! -s "$KEY_TMP" ]]; then
            while IFS= read -r f; do
              [[ -f "$f" ]] || continue
              k="$(sed -n 's/^OPENAI_API_KEY=//p' "$f" 2>/dev/null | tail -n1 || true)"
              if save_key "$k"; then echo OPENAI_KEY_SOURCE=DISCOVERED_VPS_ENV; break; fi
            done < <(find /root /home/node /opt /srv /var/lib/sahjony-openclaw-state -maxdepth 4 -type f \( -name '.env' -o -name '.env.*' -o -name '*.env' \) 2>/dev/null | head -n 500)
          fi

          if [[ ! -s "$KEY_TMP" ]]; then
            echo OPENAI_API_KEY_NOT_PRESENT_ON_HOSTINGER_VPS=1
            echo NO_GATEWAY_CHANGES_MADE=1
            exit 78
          fi

          # Bind the recovered key to the native 24x7 Gateway without exposing it.
          umask 077
          {
            printf 'OPENAI_API_KEY='
            cat "$KEY_TMP"
            printf '\n'
          } > "$ENV_FILE"
          chmod 600 "$ENV_FILE"
          install -d -m 755 "$(dirname "$DROPIN")"
          cat > "$DROPIN" <<'EOF2'
          [Service]
          EnvironmentFile=/etc/openclaw-openai.env
          EOF2

          oc plugins enable codex >/dev/null 2>&1 || true
          oc config set agents.defaults.model.primary openai/gpt-5.6-sol >/dev/null
          oc config validate >/dev/null

          systemctl daemon-reload
          systemctl restart openclaw-gateway.service
          sleep 10
          systemctl is-active --quiet openclaw-gateway.service
          pid="$(systemctl show openclaw-gateway.service -p MainPID --value)"
          [[ "$pid" =~ ^[0-9]+$ ]] && [[ "$pid" -gt 1 ]]
          tr '\0' '\n' < "/proc/$pid/environ" | grep -q '^OPENAI_API_KEY='
          echo OPENCLAW_GATEWAY_ACTIVE=1
          echo OPENAI_API_KEY_BOUND_TO_GATEWAY=1
          echo OPENAI_PRIMARY_MODEL="$(oc config get agents.defaults.model.primary 2>/dev/null || true)"

          wa="$(oc channels status --channel whatsapp --probe 2>&1 || true)"
          if grep -Eiq 'whatsapp.*(connected|ready|healthy|linked.*running)|linked.*running.*connected' <<<"$wa"; then
            echo WHATSAPP_CONNECTED=1
          else
            echo WHATSAPP_RECHECK_NEEDED=1
          fi
          REMOTE

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hostinger-openai
