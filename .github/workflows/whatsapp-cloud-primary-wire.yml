name: Wire WhatsApp Cloud Primary [RETIRED]

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo WHATSAPP_META_CLOUD_PRIMARY_WIRING_RETIRED=1
          echo AUTHORITATIVE_TRANSPORT=HOSTINGER_OPENCLAW
          echo USE_HOSTINGER_WHATSAPP_DIRECT_RESCUE_THEN_RECOVERY_V7=1
