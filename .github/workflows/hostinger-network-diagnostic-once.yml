name: Hostinger Network Diagnostic Once

on:
  push:
    paths:
      - '.github/workflows/hostinger-network-diagnostic-once.yml'

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-diagnostic
  cancel-in-progress: false

env:
  HOSTINGER_API_BASE: https://developers.hostinger.com
  HOSTINGER_VM_ID: '767852'
  HOSTINGER_HOST: '69.62.68.67'

jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, 'hostinger network diagnostic once') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - name: Install diagnostic tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq netcat-openbsd >/dev/null
          [[ -n "${HOSTINGER_API_TOKEN:-}" ]] || { echo HOSTINGER_API_TOKEN_MISSING=1 >&2; exit 2; }

      - name: Read Hostinger control plane
        shell: bash
        run: |
          set -euo pipefail
          api(){ curl -fsS -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE$1"; }

          echo '=== VM ==='
          api "/api/vps/v1/virtual-machines/$HOSTINGER_VM_ID" | jq '{id,state,status,hostname,ipv4:(..|objects|.address? // empty | select(type=="string") | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$"))),firewall_id:(.firewall_id // .firewall.id // null),firewall_name:(.firewall.name // null)}' || true

          echo '=== ACTIONS ==='
          api "/api/vps/v1/virtual-machines/$HOSTINGER_VM_ID/actions?page=1" | jq '[.data[]? | {id,name,state,created_at,updated_at}] | .[:20]'

          echo '=== FIREWALLS ==='
          fw="$(api '/api/vps/v1/firewall?page=1')"
          jq '[.data[]? | {id,name,is_synced,rules}]' <<<"$fw"

          echo '=== ATTACHED PUBLIC KEYS ==='
          api "/api/vps/v1/virtual-machines/$HOSTINGER_VM_ID/public-keys?page=1" | jq '[.data[]? | {id,name,key_type:(.key|split(" ")[0])}]'

          echo '=== NETWORK PROBES ==='
          for port in 22 80 443 3000 8080 8443; do
            if nc -z -w 4 "$HOSTINGER_HOST" "$port" >/dev/null 2>&1; then
              echo "TCP_${port}=OPEN"
            else
              echo "TCP_${port}=CLOSED_OR_FILTERED"
            fi
          done

          echo HOSTINGER_NETWORK_DIAGNOSTIC_COMPLETE=1
