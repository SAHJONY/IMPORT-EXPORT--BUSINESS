name: Hostinger OpenClaw V2 Escalation (Diagnostic Only)

on:
  workflow_run:
    workflows:
      - Hostinger OpenClaw 24x7 V2
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  classify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Classify legacy V2 failure without dispatching recovery
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$REPO" --log > /tmp/v2.log || true
          tcp22=false
          auth_failed=false
          connection_failed=false
          grep -q 'HOSTINGER_TCP22_UNREACHABLE=1' /tmp/v2.log && tcp22=true || true
          grep -q 'HOSTINGER_SSH_AUTH_FAILED=1' /tmp/v2.log && auth_failed=true || true
          grep -q 'HOSTINGER_SSH_CONNECTION_FAILED=1' /tmp/v2.log && connection_failed=true || true
          {
            echo '## Hostinger V2 legacy diagnostic'
            echo
            echo "- Source run: \`$RUN_ID\`"
            echo "- TCP/22 unreachable: **$tcp22**"
            echo "- SSH auth failed: **$auth_failed**"
            echo "- Other SSH connection failure: **$connection_failed**"
            echo
            echo 'Legacy V2 no longer dispatches Recovery V3. Bounded V6 is the canonical recovery path.'
          } >/tmp/classification.md
          gh issue comment 54 --repo "$REPO" --body-file /tmp/classification.md || true
          echo HOSTINGER_LEGACY_AUTO_RECOVERY_DISABLED=1
