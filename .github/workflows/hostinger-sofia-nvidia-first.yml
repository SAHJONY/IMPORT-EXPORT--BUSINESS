name: Hostinger Sofia NVIDIA First

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOST: '69.62.68.67'
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      NVIDIA_API_KEY_GH: ${{ secrets.NVIDIA_API_KEY }}
      OPENAI_API_KEY_GH: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate secrets and assets
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_KEY" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          [[ "$NVIDIA_API_KEY_GH" == nvapi-* ]] || { echo NVIDIA_API_KEY_MISSING_OR_INVALID=1 >&2; exit 3; }
          [[ -n "$OPENAI_API_KEY_GH" ]] || { echo OPENAI_API_KEY_MISSING=1 >&2; exit 4; }
          bash -n openclaw/hostinger-24x7/nvidia-nim-rotation.sh
      - name: Prepare secure SSH and credentials
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-nvidia-first
          printf '%s' "$NVIDIA_API_KEY_GH" > "$RUNNER_TEMP/nvidia-key"
          printf '%s' "$OPENAI_API_KEY_GH" > "$RUNNER_TEMP/openai-key"
          chmod 600 ~/.ssh/hostinger-nvidia-first "$RUNNER_TEMP/nvidia-key" "$RUNNER_TEMP/openai-key"
          ssh-keygen -y -f ~/.ssh/hostinger-nvidia-first >/dev/null
      - name: Transfer configuration securely
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/hostinger-nvidia-first)
          scp "${opts[@]}" openclaw/hostinger-24x7/nvidia-nim-rotation.sh "$RUNNER_TEMP/nvidia-key" "$RUNNER_TEMP/openai-key" "$SSH_USER@$HOST:/root/"
      - name: Configure and verify NVIDIA-first Sofia
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/hostinger-nvidia-first "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          trap 'rm -f /root/nvidia-key /root/openai-key /tmp/nvidia-smoke.json /tmp/openai-smoke.json' EXIT
          STATE=/var/lib/sahjony-openclaw-state
          CONFIG="$STATE/openclaw.json"
          oc(){ env HOME=/home/node OPENCLAW_HOME=/home/node OPENCLAW_STATE_DIR="$STATE" OPENCLAW_CONFIG_PATH="$CONFIG" openclaw "$@"; }
          [[ -s /root/nvidia-key && -s /root/openai-key ]] || { echo PROVIDER_KEY_TRANSFER_MISSING=1 >&2; exit 20; }

          install -m 700 /root/nvidia-nim-rotation.sh /usr/local/sbin/sahjony-nvidia-nim-rotation
          rm -f /root/nvidia-nim-rotation.sh
          oc plugins enable nvidia >/dev/null 2>&1 || true
          cat /root/nvidia-key | oc models auth paste-api-key --provider nvidia --profile-id nvidia:nim >/dev/null
          oc models auth order set --provider nvidia nvidia:nim >/dev/null
          oc config set models.providers.nvidia '{"baseUrl":"https://integrate.api.nvidia.com/v1","api":"openai-completions"}' --strict-json --merge >/dev/null

          # Bind OpenAI in OpenClaw's credential store as well as systemd. The
          # gateway does not reliably inherit an API key from an env file alone.
          cat /root/openai-key | oc models auth paste-api-key --provider openai --profile-id openai:api >/dev/null
          oc models auth order set --provider openai openai:api >/dev/null

          umask 077
          { printf 'OPENAI_API_KEY='; cat /root/openai-key; printf '\n'; } >/etc/openclaw-openai.env
          chmod 600 /etc/openclaw-openai.env
          install -d -m 755 /etc/systemd/system/openclaw-gateway.service.d
          printf '[Service]\nEnvironmentFile=/etc/openclaw-openai.env\n' >/etc/systemd/system/openclaw-gateway.service.d/20-openai-auth.conf

          /usr/local/sbin/sahjony-nvidia-nim-rotation
          nkey="$(tr -d '\r\n' </root/nvidia-key)"
          primary=''
          while IFS= read -r candidate; do
            candidate="$(printf '%s' "$candidate" | tr -d '\r\n')"
            [[ "$candidate" == nvidia/* ]] || continue
            model="${candidate#nvidia/}"
            code="$(curl -sS -o /tmp/nvidia-smoke.json -w '%{http_code}' --connect-timeout 10 --max-time 120 -H "Authorization: Bearer $nkey" -H 'Content-Type: application/json' -d "{\"model\":\"$model\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply exactly SOFIA_NVIDIA_OK\"}],\"max_tokens\":64,\"temperature\":0}" https://integrate.api.nvidia.com/v1/chat/completions || true)"
            if [[ "$code" == 200 ]]; then
              primary="$candidate"
              break
            fi
            echo "NVIDIA_CANDIDATE_UNAVAILABLE=$candidate HTTP=$code"
          done </var/lib/sahjony-nvidia-nim/nvidia-order.txt

          okey="$(tr -d '\r\n' </root/openai-key)"
          openai_code="$(curl -sS -o /tmp/openai-smoke.json -w '%{http_code}' --connect-timeout 10 --max-time 45 -H "Authorization: Bearer $okey" https://api.openai.com/v1/models || true)"
          [[ "$openai_code" == 200 ]] || { echo OPENAI_AUTH_SMOKE_HTTP="$openai_code" >&2; exit 21; }

          if [[ -n "$primary" ]]; then
            fallbacks='["openai/gpt-5.6-sol"]'
            provider=NVIDIA
          else
            # Keep Sofia operational when NVIDIA NIM is temporarily saturated.
            primary='openai/gpt-5.6-sol'
            fallbacks='[]'
            provider=OPENAI_TEMPORARY
          fi
          oc config set agents.defaults.model.primary "$primary" >/dev/null
          oc config set agents.defaults.model.fallbacks "$fallbacks" --strict-json >/dev/null
          oc config validate >/dev/null

          systemctl daemon-reload
          systemctl restart openclaw-gateway.service
          sleep 12
          systemctl is-active --quiet openclaw-gateway.service

          raw="$(oc config get agents.defaults.model.primary --json 2>/dev/null || true)"
          configured="$(RAW="$raw" python3 - <<'PY'
          import json, os
          raw=os.environ.get('RAW','').strip()
          try:
              value=json.loads(raw)
          except Exception:
              value=raw.strip('"')
          print(value if isinstance(value,str) else '')
          PY
          )"
          [[ "$configured" == "$primary" ]] || { echo SOFIA_PRIMARY_CONFIG_MISMATCH=1 >&2; exit 23; }
          pid="$(systemctl show openclaw-gateway.service -p MainPID --value)"
          tr '\0' '\n' <"/proc/$pid/environ" | grep -q '^OPENAI_API_KEY='
          wa="$(oc channels status --channel whatsapp --probe 2>&1 || true)"
          grep -Eiq 'connected|ready|healthy|linked.*running' <<<"$wa" || { echo WHATSAPP_NOT_CONNECTED_AFTER_RESTART=1 >&2; exit 24; }
          echo "SOFIA_PRIMARY_PROVIDER=$provider"
          echo "SOFIA_PRIMARY_MODEL=$configured"
          echo SOFIA_FALLBACK_MODEL=openai/gpt-5.6-sol
          echo OPENAI_FALLBACK_KEY_BOUND=1
          echo WHATSAPP_CONNECTED=1
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/hostinger-nvidia-first "$RUNNER_TEMP/nvidia-key" "$RUNNER_TEMP/openai-key"
