name: Hostinger Sofia NVIDIA First

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOST: '69.62.68.67'
      SSH_USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      NVIDIA_API_KEY_GH: ${{ secrets.NVIDIA_API_KEY }}
      OPENAI_API_KEY_GH: ${{ secrets.OPENAI_API_KEY }}
      OWNER_WHATSAPP_E164: ${{ secrets.OWNER_WHATSAPP_E164 }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate secrets and assets
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_KEY" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          [[ "$NVIDIA_API_KEY_GH" == nvapi-* ]] || { echo NVIDIA_API_KEY_MISSING_OR_INVALID=1 >&2; exit 3; }
          [[ -n "$OPENAI_API_KEY_GH" ]] || { echo OPENAI_API_KEY_MISSING=1 >&2; exit 4; }
          [[ "$OWNER_WHATSAPP_E164" =~ ^\+[1-9][0-9]{7,14}$ ]] || { echo OWNER_WHATSAPP_E164_MISSING_OR_INVALID=1 >&2; exit 5; }
          [[ -s openclaw/hostinger-24x7/SOFIA_SOUL.md ]] || { echo SOFIA_SOUL_MISSING=1 >&2; exit 6; }
          bash -n openclaw/hostinger-24x7/nvidia-nim-rotation.sh
          [[ -s openclaw/sahjony-whatsapp-reply-rescue/index.js ]] || { echo OUTPUT_GUARD_MISSING=1 >&2; exit 7; }
      - name: Prepare secure SSH and credentials
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-nvidia-first
          printf '%s' "$NVIDIA_API_KEY_GH" > "$RUNNER_TEMP/nvidia-key"
          printf '%s' "$OPENAI_API_KEY_GH" > "$RUNNER_TEMP/openai-key"
          printf '%s' "$OWNER_WHATSAPP_E164" > "$RUNNER_TEMP/owner-number"
          chmod 600 ~/.ssh/hostinger-nvidia-first "$RUNNER_TEMP/nvidia-key" "$RUNNER_TEMP/openai-key" "$RUNNER_TEMP/owner-number"
          ssh-keygen -y -f ~/.ssh/hostinger-nvidia-first >/dev/null
          tar -czf "$RUNNER_TEMP/sahjony-whatsapp-reply-rescue.tgz" -C openclaw sahjony-whatsapp-reply-rescue
      - name: Transfer configuration securely
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/hostinger-nvidia-first)
          scp "${opts[@]}" openclaw/hostinger-24x7/nvidia-nim-rotation.sh openclaw/hostinger-24x7/SOFIA_SOUL.md "$RUNNER_TEMP/sahjony-whatsapp-reply-rescue.tgz" "$RUNNER_TEMP/nvidia-key" "$RUNNER_TEMP/openai-key" "$RUNNER_TEMP/owner-number" "$SSH_USER@$HOST:/root/"
      - name: Configure and verify NVIDIA-first Sofia
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/hostinger-nvidia-first "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          trap 'rm -rf /root/nvidia-key /root/openai-key /root/owner-number /root/SOFIA_SOUL.md /root/sahjony-whatsapp-reply-rescue.tgz /tmp/sahjony-whatsapp-reply-rescue /tmp/nvidia-smoke.json /tmp/openai-smoke.json' EXIT
          STATE=/var/lib/sahjony-openclaw-state
          CONFIG="$STATE/openclaw.json"
          oc(){ env HOME=/home/node OPENCLAW_HOME=/home/node OPENCLAW_STATE_DIR="$STATE" OPENCLAW_CONFIG_PATH="$CONFIG" openclaw "$@"; }
          [[ -s /root/nvidia-key && -s /root/openai-key ]] || { echo PROVIDER_KEY_TRANSFER_MISSING=1 >&2; exit 20; }

          # Install the same behavioral policy in the configured canonical
          # workspace and its legacy alias so identity restores cannot revive
          # robotic introductions or leak runtime diagnostics.
          workspace="$(CONFIG="$CONFIG" python3 - <<'PY'
          import json, os
          with open(os.environ['CONFIG'], encoding='utf-8') as handle:
              value=json.load(handle)
          print(value.get('agents',{}).get('defaults',{}).get('workspace') or '/var/lib/sahjony-openclaw-state/workspace')
          PY
          )"
          install -d -m 700 "$workspace"
          install -m 600 /root/SOFIA_SOUL.md "$workspace/SOUL.md"
          if [[ "$workspace" != /home/node/.openclaw/workspace ]]; then
            install -d -m 700 /home/node/.openclaw/workspace
            install -m 600 /root/SOFIA_SOUL.md /home/node/.openclaw/workspace/SOUL.md
          fi
          owner="$(tr -d '\r\n' </root/owner-number)"
          [[ "$owner" =~ ^\+[1-9][0-9]{7,14}$ ]] || { echo OWNER_NUMBER_TRANSFER_INVALID=1 >&2; exit 21; }
          cat >"$workspace/USER.md" <<EOF
          # Juan Gonzalez — owner directives

          The configured private owner WhatsApp number is $owner. Messages from this sender and WhatsApp self-chat are owner-private conversations. Never route their content to public lead/customer views. Juan receives all requests for binding approval.
          EOF
          chmod 600 "$workspace/USER.md"

          # Self-chat normally adds the agent name automatically. An explicit
          # empty prefix keeps replies human and clean. The output guard blocks
          # OpenClaw operational notices before they reach WhatsApp.
          oc config set channels.whatsapp.responsePrefix '' >/dev/null
          rm -rf /tmp/sahjony-whatsapp-reply-rescue
          tar -xzf /root/sahjony-whatsapp-reply-rescue.tgz -C /tmp
          rm -rf "$STATE/extensions/sahjony-whatsapp-reply-rescue"
          install -d -m 700 "$STATE/extensions"
          cp -a /tmp/sahjony-whatsapp-reply-rescue "$STATE/extensions/sahjony-whatsapp-reply-rescue"
          chown -R 0:0 "$STATE/extensions/sahjony-whatsapp-reply-rescue"
          find "$STATE/extensions/sahjony-whatsapp-reply-rescue" -type d -exec chmod 755 {} +
          find "$STATE/extensions/sahjony-whatsapp-reply-rescue" -type f -exec chmod 644 {} +
          CONFIG="$CONFIG" python3 - <<'PY'
          import json, os
          path=os.environ['CONFIG']
          with open(path, encoding='utf-8') as handle:
              data=json.load(handle)
          plugins=data.setdefault('plugins', {})
          allow=plugins.setdefault('allow', [])
          if 'sahjony-whatsapp-reply-rescue' not in allow:
              allow.append('sahjony-whatsapp-reply-rescue')
          entry=plugins.setdefault('entries', {}).setdefault('sahjony-whatsapp-reply-rescue', {})
          entry['enabled']=True
          entry['config']={'accountId':'default','businessNumber':'+12816628581','rescueDelayMs':15000}
          entry.setdefault('hooks', {})['allowConversationAccess']=True
          with open(path, 'w', encoding='utf-8') as handle:
              json.dump(data, handle, indent=2)
              handle.write('\n')
          PY
          oc config validate >/dev/null

          install -m 700 /root/nvidia-nim-rotation.sh /usr/local/sbin/sahjony-nvidia-nim-rotation
          rm -f /root/nvidia-nim-rotation.sh
          oc plugins enable nvidia >/dev/null 2>&1 || true
          cat /root/nvidia-key | oc models auth paste-api-key --provider nvidia --profile-id nvidia:nim >/dev/null
          oc models auth order set --provider nvidia nvidia:nim >/dev/null
          oc config set models.providers.nvidia '{"baseUrl":"https://integrate.api.nvidia.com/v1","api":"openai-completions"}' --strict-json --merge >/dev/null

          # Bind OpenAI in OpenClaw's credential store as well as systemd. The
          # gateway does not reliably inherit an API key from an env file alone.
          cat /root/openai-key | oc models auth paste-api-key --provider openai --profile-id openai:api >/dev/null
          oc models auth order set --provider openai openai:api >/dev/null

          umask 077
          { printf 'OPENAI_API_KEY='; cat /root/openai-key; printf '\n'; } >/etc/openclaw-openai.env
          chmod 600 /etc/openclaw-openai.env
          install -d -m 755 /etc/systemd/system/openclaw-gateway.service.d
          printf '[Service]\nEnvironmentFile=/etc/openclaw-openai.env\n' >/etc/systemd/system/openclaw-gateway.service.d/20-openai-auth.conf

          /usr/local/sbin/sahjony-nvidia-nim-rotation
          nkey="$(tr -d '\r\n' </root/nvidia-key)"
          primary=''
          while IFS= read -r candidate; do
            candidate="$(printf '%s' "$candidate" | tr -d '\r\n')"
            [[ "$candidate" == nvidia/* ]] || continue
            model="${candidate#nvidia/}"
            code="$(curl -sS -o /tmp/nvidia-smoke.json -w '%{http_code}' --connect-timeout 10 --max-time 120 -H "Authorization: Bearer $nkey" -H 'Content-Type: application/json' -d "{\"model\":\"$model\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply exactly SOFIA_NVIDIA_OK\"}],\"max_tokens\":64,\"temperature\":0}" https://integrate.api.nvidia.com/v1/chat/completions || true)"
            if [[ "$code" == 200 ]]; then
              primary="$candidate"
              break
            fi
            echo "NVIDIA_CANDIDATE_UNAVAILABLE=$candidate HTTP=$code"
          done </var/lib/sahjony-nvidia-nim/nvidia-order.txt

          okey="$(tr -d '\r\n' </root/openai-key)"
          openai_code="$(curl -sS -o /tmp/openai-smoke.json -w '%{http_code}' --connect-timeout 10 --max-time 45 -H "Authorization: Bearer $okey" https://api.openai.com/v1/models || true)"
          [[ "$openai_code" == 200 ]] || { echo OPENAI_AUTH_SMOKE_HTTP="$openai_code" >&2; exit 21; }

          [[ -n "$primary" ]] || { echo NVIDIA_HEALTHY_PRIMARY_UNAVAILABLE=1 >&2; exit 22; }
          # OpenAI remains authenticated for later controlled validation, but is
          # intentionally excluded from live WhatsApp failover until OpenClaw's
          # agent-level credential path passes an end-to-end test. This prevents
          # provider diagnostics from leaking into owner/customer conversations.
          fallbacks='[]'
          provider=NVIDIA
          oc config set agents.defaults.model.primary "$primary" >/dev/null
          oc config set agents.defaults.model.fallbacks "$fallbacks" --strict-json >/dev/null
          oc config validate >/dev/null

          systemctl daemon-reload
          systemctl restart openclaw-gateway.service
          sleep 12
          systemctl is-active --quiet openclaw-gateway.service

          configured="$(CONFIG="$CONFIG" python3 - <<'PY'
          import json, os
          with open(os.environ['CONFIG'], encoding='utf-8') as handle:
              value=json.load(handle)
          print(value.get('agents',{}).get('defaults',{}).get('model',{}).get('primary',''))
          PY
          )"
          if [[ "$provider" == NVIDIA ]]; then
            [[ "$configured" == nvidia/* ]] || { echo SOFIA_PRIMARY_PROVIDER_MISMATCH=1 >&2; exit 23; }
          fi
          pid="$(systemctl show openclaw-gateway.service -p MainPID --value)"
          tr '\0' '\n' <"/proc/$pid/environ" | grep -q '^OPENAI_API_KEY='
          gateway_token="$(CONFIG="$CONFIG" python3 - <<'PY'
          import json, os
          with open(os.environ['CONFIG'], encoding='utf-8') as handle:
              value=json.load(handle)
          print(value.get('gateway',{}).get('auth',{}).get('token',''))
          PY
          )"
          [[ -n "$gateway_token" ]] || { echo GATEWAY_AUTH_TOKEN_MISSING=1 >&2; exit 24; }
          wa=''
          for attempt in 1 2 3 4 5 6; do
            wa="$(oc channels status --channel whatsapp --probe --token "$gateway_token" 2>&1 || true)"
            if grep -Eiq 'connected|ready|healthy|enabled, configured, linked|linked.*running' <<<"$wa"; then
              break
            fi
            sleep 10
          done
          if ! grep -Eiq 'connected|ready|healthy|enabled, configured, linked|linked.*running' <<<"$wa"; then
            printf 'WHATSAPP_STATUS=%s\n' "$(printf '%s' "$wa" | tr '\n' ' ' | cut -c1-600)" >&2
            echo WHATSAPP_NOT_CONNECTED_AFTER_RESTART=1 >&2
            exit 24
          fi
          echo "SOFIA_PRIMARY_PROVIDER=$provider"
          echo "SOFIA_PRIMARY_MODEL=$configured"
          echo SOFIA_FALLBACK_MODEL=NONE_PENDING_AGENT_LEVEL_VALIDATION
          echo OPENAI_KEY_BOUND_BUT_LIVE_FAILOVER_DISABLED=1
          echo WHATSAPP_CONNECTED=1
          echo SOFIA_NATURAL_CONVERSATION_POLICY=ACTIVE
          echo SOFIA_TECHNICAL_OUTPUT_BOUNDARY=ACTIVE
          echo SOFIA_OWNER_PRIVATE_MODE=ACTIVE
          echo SOFIA_WHATSAPP_OUTPUT_GUARD=ACTIVE
          echo SOFIA_WHATSAPP_RESPONSE_PREFIX=EMPTY
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/hostinger-nvidia-first "$RUNNER_TEMP/nvidia-key" "$RUNNER_TEMP/openai-key" "$RUNNER_TEMP/owner-number" "$RUNNER_TEMP/sahjony-whatsapp-reply-rescue.tgz"
