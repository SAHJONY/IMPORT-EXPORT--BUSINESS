name: Hostinger WhatsApp Final Repair

on:
  push:
    branches: [main]
    paths:
      - '.deploy/hostinger-whatsapp-final-repair-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

jobs:
  final-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HOSTINGER_API_BASE: https://developers.hostinger.com
      HOSTINGER_VM_ID: '767852'
      HOSTINGER_HOST: '69.62.68.67'
      HOSTINGER_USER: root
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      DURABLE_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate SOFIA guard and recovery assets
        run: |
          set -euo pipefail
          [[ -n "$HOSTINGER_API_TOKEN" ]] || { echo HOSTINGER_API_TOKEN_MISSING=1 >&2; exit 2; }
          [[ -s openclaw/sahjony-whatsapp-output-guard/index.js ]]
          [[ -s openclaw/sahjony-whatsapp-output-guard/openclaw.plugin.json ]]
          [[ -s openclaw/hostinger-24x7/hostinger-resilient-access-broker.sh ]]
          [[ -s openclaw/hostinger-24x7/hostinger-recovery-controller.sh ]]
          grep -Fq 'GUARD_VERSION = "3.0.1"' openclaw/sahjony-whatsapp-output-guard/index.js
          grep -Fq 'OWNER_COMMAND' openclaw/sahjony-whatsapp-output-guard/index.js
          grep -Fq 'CUSTOMER_PARTNER' openclaw/sahjony-whatsapp-output-guard/index.js
          grep -Fq 'internal_commercial_output_external' openclaw/sahjony-whatsapp-output-guard/index.js
          node --check openclaw/sahjony-whatsapp-output-guard/index.js
          bash -n openclaw/hostinger-24x7/hostinger-resilient-access-broker.sh
          bash -n openclaw/hostinger-24x7/hostinger-recovery-controller.sh

      - name: Prepare management identity and guard bundle
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq netcat-openbsd sshpass >/dev/null
          umask 077
          install -d -m 700 ~/.ssh "$RUNNER_TEMP/sofia-guard"
          key="$HOME/.ssh/hostinger-sofia-guard"
          if [[ -n "$DURABLE_PRIVATE_KEY" ]]; then
            if [[ "$DURABLE_PRIVATE_KEY" == *'\n'* ]]; then
              printf '%b' "$DURABLE_PRIVATE_KEY" | sed 's/\r$//' > "$key"
            else
              printf '%s\n' "$DURABLE_PRIVATE_KEY" | sed 's/\r$//' > "$key"
            fi
            chmod 600 "$key"
            if ssh-keygen -y -f "$key" > "$key.pub" 2>/dev/null; then
              echo HOSTINGER_GUARD_IDENTITY=DURABLE_VALIDATED
            else
              rm -f "$key" "$key.pub"
            fi
          fi
          if [[ ! -s "$key" ]]; then
            ssh-keygen -q -t ed25519 -N '' -f "$key" -C "sahjony-sofia-guard-${GITHUB_RUN_ID}"
            echo HOSTINGER_GUARD_IDENTITY=EPHEMERAL_RECOVERY
            echo EPHEMERAL_MANAGEMENT_KEY=true >> "$GITHUB_ENV"
          else
            echo EPHEMERAL_MANAGEMENT_KEY=false >> "$GITHUB_ENV"
          fi
          echo "SSH_KEY_PATH=$key" >> "$GITHUB_ENV"
          tar -czf "$RUNNER_TEMP/sofia-whatsapp-guard.tgz" openclaw/sahjony-whatsapp-output-guard

      - name: Restore authenticated management access if needed
        run: |
          set -euo pipefail
          chmod +x openclaw/hostinger-24x7/hostinger-resilient-access-broker.sh openclaw/hostinger-24x7/hostinger-recovery-controller.sh
          openclaw/hostinger-24x7/hostinger-resilient-access-broker.sh solve | tee "$RUNNER_TEMP/sofia-guard/access-broker.log"
          grep -q 'SAHJONY_HOSTINGER_ACCESS_BROKER=READY' "$RUNNER_TEMP/sofia-guard/access-broker.log"
          echo HOSTINGER_MANAGEMENT_ACCESS=READY

      - name: Deploy SOFIA guard without model mutation
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$SSH_KEY_PATH")
          ssh "${opts[@]}" "$HOSTINGER_USER@$HOSTINGER_HOST" 'printf HOSTINGER_SSH_OK' | grep -q HOSTINGER_SSH_OK
          scp "${opts[@]}" "$RUNNER_TEMP/sofia-whatsapp-guard.tgz" "$HOSTINGER_USER@$HOSTINGER_HOST:/root/"
          ssh "${opts[@]}" "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          STATE=/var/lib/sahjony-openclaw-state
          CONFIG="$STATE/openclaw.json"
          DST="$STATE/extensions/sahjony-whatsapp-output-guard"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="$STATE/.sofia-whatsapp-output-guard.pre-$STAMP"
          CONFIG_BACKUP="$STATE/openclaw.json.pre-sofia-guard-$STAMP"
          TMP="$(mktemp -d)"
          cleanup(){ rm -rf "$TMP" /root/sofia-whatsapp-guard.tgz; }
          rollback(){
            set +e
            rm -rf "$DST"
            [[ -d "$BACKUP" ]] && mv "$BACKUP" "$DST"
            [[ -s "$CONFIG_BACKUP" ]] && cp -f "$CONFIG_BACKUP" "$CONFIG"
            systemctl restart openclaw-gateway.service >/dev/null 2>&1 || true
            echo SOFIA_GUARD_ROLLBACK=1 >&2
          }
          trap 'rc=$?; if [[ $rc -ne 0 ]]; then rollback; fi; cleanup; exit $rc' EXIT
          [[ -s "$CONFIG" ]] || { echo OPENCLAW_CONFIG_MISSING=1 >&2; exit 31; }
          systemctl is-active --quiet openclaw-gateway.service || { echo OPENCLAW_GATEWAY_INACTIVE=1 >&2; exit 32; }
          cp -a "$CONFIG" "$CONFIG_BACKUP"
          BEFORE_MODEL="$(env HOME=/home/node OPENCLAW_HOME=/home/node OPENCLAW_STATE_DIR="$STATE" OPENCLAW_CONFIG_PATH="$CONFIG" openclaw config get agents.defaults.model.primary 2>/dev/null || true)"
          [[ ! -d "$DST" ]] || mv "$DST" "$BACKUP"
          tar -xzf /root/sofia-whatsapp-guard.tgz -C "$TMP"
          SRC="$TMP/openclaw/sahjony-whatsapp-output-guard"
          [[ -s "$SRC/index.js" && -s "$SRC/openclaw.plugin.json" ]] || { echo GUARD_ASSET_MISSING=1 >&2; exit 33; }
          install -d -m 755 "$STATE/extensions"
          cp -a "$SRC" "$DST"
          chown -R 0:0 "$DST"
          find "$DST" -type d -exec chmod 755 {} +
          find "$DST" -type f -exec chmod 644 {} +
          CONFIG="$CONFIG" python3 - <<'PY'
          import json, os
          p=os.environ['CONFIG']
          with open(p, encoding='utf-8') as f: d=json.load(f)
          plugins=d.setdefault('plugins', {})
          allow=plugins.setdefault('allow', [])
          name='sahjony-whatsapp-output-guard'
          if name not in allow: allow.append(name)
          entry=plugins.setdefault('entries', {}).setdefault(name, {})
          entry['enabled']=True
          cfg=entry.setdefault('config', {})
          cfg['failClosedExternal']=True
          with open(p,'w',encoding='utf-8') as f:
              json.dump(d,f,indent=2); f.write('\n')
          PY
          oc(){ env HOME=/home/node OPENCLAW_HOME=/home/node OPENCLAW_STATE_DIR="$STATE" OPENCLAW_CONFIG_PATH="$CONFIG" openclaw "$@"; }
          oc config validate >/dev/null
          systemctl restart openclaw-gateway.service
          sleep 10
          systemctl is-active --quiet openclaw-gateway.service || { echo OPENCLAW_GATEWAY_RESTART_FAILED=1 >&2; exit 34; }
          AFTER_MODEL="$(oc config get agents.defaults.model.primary 2>/dev/null || true)"
          [[ "$BEFORE_MODEL" == "$AFTER_MODEL" ]] || { echo MODEL_MUTATION_DETECTED=1 >&2; exit 35; }
          logs="$(journalctl -u openclaw-gateway.service --since '-3 min' --no-pager)"
          grep -Fq 'version=3.0.1' <<<"$logs" || { echo SOFIA_GUARD_STARTUP_NOT_OBSERVED=1 >&2; exit 36; }
          grep -Fq 'recipient-context=active' <<<"$logs" || { echo SOFIA_RECIPIENT_CONTEXT_NOT_OBSERVED=1 >&2; exit 37; }
          grep -Fq 'external-commercial-leak-guard=fail-closed' <<<"$logs" || { echo SOFIA_EXTERNAL_GUARD_NOT_OBSERVED=1 >&2; exit 38; }
          rm -rf "$BACKUP" "$CONFIG_BACKUP"
          echo SOFIA_WHATSAPP_GUARD_VERSION=3.0.1
          echo SOFIA_OWNER_CUSTOMER_CONTEXT=ACTIVE
          echo SOFIA_EXTERNAL_COMMERCIAL_LEAK_GUARD=FAIL_CLOSED
          echo SOFIA_SOURCE_OWNERSHIP=ACTIVE
          echo OPENCLAW_MODEL_PRESERVED=1
          echo OPENCLAW_GATEWAY_ACTIVE=1
          echo SOFIA_WHATSAPP_GUARD_DEPLOYMENT=SUCCESS
          REMOTE

      - name: Verify public WhatsApp health
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            health="$(curl -fsS --connect-timeout 10 --max-time 25 https://www.sahjony.com/whatsapp/health 2>/dev/null || true)"
            if HEALTH="$health" python3 - <<'PY'
          import json, os
          try: h=json.loads(os.environ.get('HEALTH') or '{}')
          except Exception: raise SystemExit(1)
          n=h.get('hostinger_openclaw') or {}
          ok=(h.get('status')=='ok' and h.get('send_ready') is True and h.get('webhook_ready') is True and n.get('connected') is True and n.get('heartbeat_fresh') is True and n.get('gateway_id')=='hostinger-vps')
          raise SystemExit(0 if ok else 1)
          PY
            then
              echo WHATSAPP_PUBLIC_HEALTH=VERIFIED
              exit 0
            fi
            sleep 8
          done
          echo WHATSAPP_PUBLIC_HEALTH_FAILED=1 >&2
          exit 40

      - name: Remove per-run ephemeral guest key
        if: always()
        run: |
          set +e
          if [[ "${EPHEMERAL_MANAGEMENT_KEY:-false}" == true && -s "${SSH_KEY_PATH:-}" && -s "${SSH_KEY_PATH:-}.pub" ]]; then
            pub_b64="$(base64 -w0 "$SSH_KEY_PATH.pub")"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i "$SSH_KEY_PATH" "$HOSTINGER_USER@$HOSTINGER_HOST" "PUB_B64='$pub_b64' bash -s" <<'REMOTE'
          set +e
          auth=/root/.ssh/authorized_keys
          pub="$(printf '%s' "$PUB_B64" | base64 -d)"
          if [[ -f "$auth" ]]; then
            core="$(awk '{print $1" "$2}' <<<"$pub")"
            tmp="$(mktemp)"
            awk -v core="$core" '{line=$1" "$2; if(line!=core) print}' "$auth" > "$tmp"
            cat "$tmp" > "$auth"
            chmod 600 "$auth"
            rm -f "$tmp"
          fi
          REMOTE
          fi
          rm -f "${SSH_KEY_PATH:-}" "${SSH_KEY_PATH:-}.pub" "$RUNNER_TEMP/sofia-whatsapp-guard.tgz"
          exit 0

      - name: Upload access evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofia-whatsapp-guard-${{ github.run_id }}
          path: ${{ runner.temp }}/sofia-guard/
          if-no-files-found: warn
          retention-days: 7
