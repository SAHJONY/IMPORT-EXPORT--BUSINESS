name: WhatsApp Self-Healing Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: whatsapp-self-healing-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production recovery health
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl -fsS --retry 3 --retry-delay 5 --max-time 30 https://www.sahjony.com/whatsapp/recovery/health || true)"
          echo "$BODY"
          if echo "$BODY" | grep -q '"status":"ok"'; then
            echo 'healthy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'healthy=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Open durable incident when degraded
        if: steps.probe.outputs.healthy != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'WhatsApp cloud runtime degraded';
            const existing = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'whatsapp-recovery'});
            if (!existing.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['whatsapp-recovery'],
                body: 'Automated watchdog detected that `/whatsapp/recovery/health` is not healthy. Meta Business Suite remains the intended primary transport. Review provider credentials, webhook delivery, deployment health, and fallback availability. No secrets were exposed.'
              });
            }
