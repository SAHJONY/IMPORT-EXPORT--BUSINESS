name: WhatsApp Hostinger Self-Healing Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/whatsapp-self-healing-watchdog.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: whatsapp-hostinger-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Hostinger-specific WhatsApp health
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl -fsS --retry 3 --retry-delay 5 --max-time 30 https://www.sahjony.com/whatsapp/health || true)"
          printf '%s\n' "$BODY" | jq '{status,provider,send_ready,webhook_ready,ai_auto_reply_enabled,hostinger_independent_runtime,recovery_status,backlog_recovery,secrets_exposed}' 2>/dev/null || true

          # Hermes is the current transport. A deliberately disabled messaging
          # runtime is healthy only as a fail-closed containment state; it is not
          # transaction-ready. This prevents the watchdog from attempting to revive it.
          if jq -e '
            (.provider == "hermes_agent") and
            (.send_ready == true) and
            (.webhook_ready == true)
          ' >/dev/null 2>&1 <<<"$BODY"; then
            echo 'healthy=true' >> "$GITHUB_OUTPUT"
            echo 'mode=transaction_ready' >> "$GITHUB_OUTPUT"
          elif jq -e '
            (.provider == "hermes_agent") and
            (.send_ready == false) and
            (.ai_auto_reply_enabled == false) and
            ((.secrets_exposed // false) == false)
          ' >/dev/null 2>&1 <<<"$BODY"; then
            echo 'healthy=true' >> "$GITHUB_OUTPUT"
            echo 'mode=fail_closed' >> "$GITHUB_OUTPUT"
          else
            echo 'healthy=false' >> "$GITHUB_OUTPUT"
            echo 'mode=degraded_uncontained' >> "$GITHUB_OUTPUT"
          fi

      - name: Open durable incident when Hostinger WhatsApp is degraded
        if: steps.probe.outputs.healthy != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Hostinger Hermes WhatsApp runtime degraded';
            const existing = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'whatsapp-recovery'});
            if (!existing.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['whatsapp-recovery'],
                body: 'Automated watchdog detected an uncontained Hermes WhatsApp degradation. Fail-closed is accepted only when provider=hermes_agent, send_ready=false, ai_auto_reply_enabled=false, and secrets_exposed is false. The watchdog does not restart or re-enable deliberately disabled messaging. Inspect Hermes transport, queue state, and security controls before any release.'
              });
            }
