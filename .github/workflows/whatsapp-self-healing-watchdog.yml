name: WhatsApp Hostinger Self-Healing Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/whatsapp-self-healing-watchdog.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: whatsapp-hostinger-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Hostinger-specific WhatsApp health
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl -fsS --retry 3 --retry-delay 5 --max-time 30 https://www.sahjony.com/whatsapp/health || true)"
          printf '%s\n' "$BODY" | jq '{status,provider,send_ready,gateway_connected,heartbeat_fresh,hostinger_independent_runtime,hostinger_openclaw,recovery_issues,backlog_recovery}' 2>/dev/null || true

          # Fortune-500 readiness gate: transport presence alone is NOT healthy.
          # Require the authoritative Hostinger/OpenClaw provider, a live gateway,
          # fresh heartbeat, and actual outbound send readiness.
          if jq -e '
            (.status == "ok") and
            (.provider == "hostinger_openclaw") and
            ((.gateway_connected // .hostinger_openclaw.connected // false) == true) and
            ((.heartbeat_fresh // .hostinger_openclaw.heartbeat_fresh // false) == true) and
            ((.send_ready // false) == true)
          ' >/dev/null 2>&1 <<<"$BODY"; then
            echo 'healthy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'healthy=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Open durable incident when Hostinger WhatsApp is degraded
        if: steps.probe.outputs.healthy != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Hostinger OpenClaw WhatsApp runtime degraded';
            const existing = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'whatsapp-recovery'});
            if (!existing.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['whatsapp-recovery'],
                body: 'Automated watchdog detected that Hostinger WhatsApp is not transaction-ready. Health now requires provider=hostinger_openclaw, gateway connected, fresh heartbeat, and send_ready=true. Transport connectivity alone is not considered healthy. Check OpenClaw model authentication (OpenAI), outbound send path, and runtime state. Anthropic remains disabled. No secrets were exposed.'
              });
            }
