name: WhatsApp Hostinger Self-Healing Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: whatsapp-hostinger-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Hostinger-specific WhatsApp health
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl -fsS --retry 3 --retry-delay 5 --max-time 30 https://www.sahjony.com/whatsapp/health || true)"
          printf '%s\n' "$BODY" | jq '{status,provider,hostinger_independent_runtime,hostinger_openclaw}' 2>/dev/null || true
          if jq -e '(.hostinger_independent_runtime // false) == true or ((.hostinger_openclaw.connected // false) == true)' >/dev/null 2>&1 <<<"$BODY"; then
            echo 'healthy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'healthy=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Open durable incident when Hostinger WhatsApp is degraded
        if: steps.probe.outputs.healthy != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Hostinger OpenClaw WhatsApp runtime degraded';
            const existing = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'whatsapp-recovery'});
            if (!existing.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['whatsapp-recovery'],
                body: 'Automated watchdog detected that Hostinger-specific WhatsApp readiness is false. Authoritative transport is Hostinger + Docker + OpenClaw. Use Hostinger WhatsApp Direct Rescue first, then Recovery V7 if non-destructive recovery is exhausted. Meta Cloud is not part of the readiness gate. No secrets were exposed.'
              });
            }
