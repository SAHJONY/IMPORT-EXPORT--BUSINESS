name: Hostinger OpenClaw Runtime Authority Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'fix OpenClaw runtime authority') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: 69.62.68.67
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_KEY" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          [[ -n "$OPENAI_API_KEY" ]] || { echo OPENAI_API_KEY_MISSING=1 >&2; exit 3; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/runtime-authority
          chmod 600 ~/.ssh/runtime-authority
          ssh-keygen -y -f ~/.ssh/runtime-authority >/dev/null

      - name: Make canonical state authoritative and validate model failover
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OPENAI_API_KEY" | ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -i ~/.ssh/runtime-authority "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          read -r OPENAI_KEY
          [[ -n "$OPENAI_KEY" ]] || exit 4

          CANON=/var/lib/sahjony-openclaw-state/openclaw.json
          ROOTCFG=/root/.openclaw/openclaw.json
          AGENTDIR=/root/.openclaw/agents/main/agent
          test -f "$CANON"
          install -d -m 700 /root/.openclaw "$AGENTDIR"

          cp -a "$CANON" "$CANON.before-runtime-authority-fix"
          if [[ -f "$ROOTCFG" ]]; then cp -a "$ROOTCFG" "$ROOTCFG.before-runtime-authority-fix"; fi

          python3 - "$CANON" <<'PY'
          import json, sys
          p=sys.argv[1]
          d=json.load(open(p))
          agents=d.setdefault('agents',{})
          defaults=agents.setdefault('defaults',{})
          defaults['model']={
            'primary':'nvidia/openai/gpt-oss-120b',
            'fallbacks':['openai/gpt-5.5']
          }
          with open(p,'w') as f:
            json.dump(d,f,indent=2); f.write('\n')
          PY
          chmod 600 "$CANON"

          cp "$CANON" "$ROOTCFG"
          chmod 600 "$ROOTCFG"

          install -d -m 755 /etc/systemd/system/openclaw-gateway.service.d
          umask 077
          cat >/etc/systemd/system/openclaw-gateway.service.d/20-openai-auth.conf <<EOF
          [Service]
          Environment="OPENAI_API_KEY=$OPENAI_KEY"
          Environment="OPENCLAW_CONFIG=$CANON"
          Environment="OPENCLAW_STATE_DIR=/var/lib/sahjony-openclaw-state"
          EOF
          chmod 600 /etc/systemd/system/openclaw-gateway.service.d/20-openai-auth.conf

          systemctl daemon-reload
          OPENCLAW_CONFIG="$CANON" OPENAI_API_KEY="$OPENAI_KEY" openclaw config validate --json >/tmp/runtime-authority-validate.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/runtime-authority-validate.json'))
          if d.get('valid') is False or d.get('ok') is False:
              raise SystemExit('OPENCLAW_CONFIG_INVALID')
          print('OPENCLAW_CANONICAL_CONFIG_VALID=1')
          PY

          systemctl restart openclaw-gateway.service
          sleep 12
          systemctl is-active --quiet openclaw-gateway.service

          echo '=== SERVICE ENV ==='
          systemctl show openclaw-gateway.service -p Environment --value \
            | sed -E 's/(OPENAI_API_KEY=)[^ ]+/\1***/g'

          echo '=== CANONICAL MODEL ==='
          python3 - <<'PY'
          import json
          d=json.load(open('/var/lib/sahjony-openclaw-state/openclaw.json'))
          m=((d.get('agents') or {}).get('defaults') or {}).get('model') or {}
          print('PRIMARY='+str(m.get('primary')))
          print('FALLBACKS='+','.join(m.get('fallbacks') or []))
          assert m.get('primary')=='nvidia/openai/gpt-oss-120b'
          assert m.get('fallbacks')==['openai/gpt-5.5']
          PY

          echo '=== ROOT VIEW MODEL ==='
          python3 - <<'PY'
          import json
          d=json.load(open('/root/.openclaw/openclaw.json'))
          m=((d.get('agents') or {}).get('defaults') or {}).get('model') or {}
          print('ROOT_PRIMARY='+str(m.get('primary')))
          print('ROOT_FALLBACKS='+','.join(m.get('fallbacks') or []))
          assert m.get('primary')=='nvidia/openai/gpt-oss-120b'
          assert m.get('fallbacks')==['openai/gpt-5.5']
          PY

          echo '=== MODEL STATUS CANONICAL ==='
          OPENCLAW_CONFIG="$CANON" OPENAI_API_KEY="$OPENAI_KEY" timeout 90 openclaw models status --probe 2>&1 \
            | sed -E 's/(sk-[A-Za-z0-9_-]{8})[A-Za-z0-9_-]+/\1***/g' \
            | tail -n 200 || true

          echo '=== RECENT GATEWAY ==='
          journalctl -u openclaw-gateway.service --since '-3 minutes' --no-pager -n 300 \
            | grep -Ei 'whatsapp|model|fallback|openai|nvidia|error|timeout|listening|connected' || true

          echo SAHJONY_OPENCLAW_RUNTIME_AUTHORITY_FIXED=1
          REMOTE

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f ~/.ssh/runtime-authority
