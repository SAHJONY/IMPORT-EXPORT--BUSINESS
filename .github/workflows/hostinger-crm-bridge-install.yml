name: Hostinger CRM Bridge Install

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'openclaw/hostinger-24x7/sahjony-crm-bridge.py'
      - 'openclaw/hostinger-24x7/install-crm-bridge.sh'
      - 'openclaw/skills/whatsapp-crm-bridge/SKILL.md'
      - '.github/workflows/hostinger-crm-bridge-install.yml'
  workflow_run:
    workflows:
      - Hostinger WhatsApp Recovery V7
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      CRM_BRIDGE_SECRET: ${{ secrets.OPENCLAW_APP_BRIDGE_SECRET || secrets.SAHJONY_APP_BRIDGE_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare authenticated SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_KEY" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-crm-bridge
          chmod 600 ~/.ssh/hostinger-crm-bridge
          ssh-keygen -y -f ~/.ssh/hostinger-crm-bridge >/dev/null

          ready=false
          for i in $(seq 1 30); do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 -i ~/.ssh/hostinger-crm-bridge "$USER@$HOST" 'printf CRM_BRIDGE_SSH_READY' 2>/dev/null | grep -q CRM_BRIDGE_SSH_READY; then
              ready=true
              break
            fi
            echo "crm_bridge_ssh_probe=$i/30"
            sleep 10
          done
          [[ "$ready" == true ]] || { echo HOSTINGER_CRM_BRIDGE_SSH_UNAVAILABLE=1 >&2; exit 3; }

      - name: Provision CRM bridge authorization secret
        shell: bash
        run: |
          set -euo pipefail
          [[ ${#CRM_BRIDGE_SECRET} -ge 24 ]] || { echo CRM_BRIDGE_AUTHORIZATION_SECRET_MISSING=1 >&2; exit 4; }
          umask 077
          secret_file="$(mktemp)"
          printf '%s' "$CRM_BRIDGE_SECRET" > "$secret_file"
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/hostinger-crm-bridge "$secret_file" "$USER@$HOST:/tmp/sahjony-crm-bridge-secret"
          rm -f "$secret_file"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/hostinger-crm-bridge "$USER@$HOST" 'python3 - <<'"'"'PY'"'"'
          from pathlib import Path

          incoming = Path("/tmp/sahjony-crm-bridge-secret")
          target = Path("/opt/sahjony/openclaw/.env")
          secret = incoming.read_text()
          if len(secret.strip()) < 24:
              raise SystemExit("invalid CRM bridge secret")
          target.parent.mkdir(parents=True, exist_ok=True)
          rows = []
          if target.exists():
              rows = target.read_text(errors="ignore").splitlines()
          kept = [row for row in rows if not row.startswith("OPENCLAW_APP_BRIDGE_SECRET=") and not row.startswith("SAHJONY_APP_BRIDGE_SECRET=")]
          kept.append("OPENCLAW_APP_BRIDGE_SECRET=" + secret.strip())
          target.write_text("\n".join(kept) + "\n")
          target.chmod(0o600)
          incoming.unlink(missing_ok=True)
          PY'
          echo CRM_BRIDGE_AUTHORIZATION_SECRET_PROVISIONED=1

      - name: Install tool and native OpenClaw RFQ skill
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/hostinger-crm-bridge)
          SCP=(scp -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/hostinger-crm-bridge)

          "${SSH[@]}" "$USER@$HOST" 'install -d -m 700 /opt/sahjony/openclaw/hostinger-24x7 /opt/sahjony/openclaw/skills/whatsapp-crm-bridge'
          "${SCP[@]}" openclaw/hostinger-24x7/sahjony-crm-bridge.py openclaw/hostinger-24x7/install-crm-bridge.sh "$USER@$HOST:/opt/sahjony/openclaw/hostinger-24x7/"
          "${SCP[@]}" openclaw/skills/whatsapp-crm-bridge/SKILL.md "$USER@$HOST:/opt/sahjony/openclaw/skills/whatsapp-crm-bridge/SKILL.md"

          "${SSH[@]}" "$USER@$HOST" 'chmod 700 /opt/sahjony/openclaw/hostinger-24x7/sahjony-crm-bridge.py /opt/sahjony/openclaw/hostinger-24x7/install-crm-bridge.sh; SAHJONY_CRM_BRIDGE_SOURCE_ROOT=/opt/sahjony/openclaw/hostinger-24x7 SAHJONY_CRM_BRIDGE_SKILL_SOURCE=/opt/sahjony/openclaw/skills/whatsapp-crm-bridge/SKILL.md /opt/sahjony/openclaw/hostinger-24x7/install-crm-bridge.sh'

      - name: Verify CRM + governed RFQ runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/hostinger-crm-bridge "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test -x /usr/local/sbin/sahjony-crm-bridge
          systemctl is-enabled --quiet sahjony-crm-bridge.timer
          systemctl is-active --quiet sahjony-crm-bridge.timer
          python3 -m py_compile /usr/local/sbin/sahjony-crm-bridge
          test -s /root/.hermes/skills/whatsapp-crm-bridge/SKILL.md
          grep -q 'Owner update reports' /root/.hermes/skills/whatsapp-crm-bridge/SKILL.md
          health_json="$(/usr/local/sbin/sahjony-crm-bridge health)"
          report_json="$(/usr/local/sbin/sahjony-crm-bridge owner-report)"
          python3 - "$health_json" "$report_json" <<'PY'
          import json, sys
          health = json.loads(sys.argv[1])
          report = json.loads(sys.argv[2])
          if health.get("status") != "ok":
              raise SystemExit("CRM bridge health is not ok")
          if report.get("status") != "ok":
              raise SystemExit("Owner report endpoint is not ready")
          print("OWNER_REPORT_CUSTOMERS=" + str((report.get("customers") or {}).get("total")))
          print("OWNER_REPORT_TRADE_INTAKES=" + str((report.get("trade_intakes") or {}).get("total")))
          print("OWNER_REPORT_WHATSAPP_INBOUND=" + str((report.get("whatsapp") or {}).get("inbound_total")))
          PY
          test -s /var/lib/sahjony-crm-bridge/status.json
          echo SAHJONY_HOSTINGER_CRM_OWNER_REPORT_READY=1
          REMOTE

      - name: Quarantine stale outreach backlog without delivery
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i ~/.ssh/hostinger-crm-bridge "$USER@$HOST" 'python3 - <<'"'"'PY'"'"'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import hashlib, json
          src=Path('/var/lib/sahjony-crm-bridge/pending.jsonl')
          if not src.exists() or not src.read_text(errors='ignore').strip():
              print('SOFIA_OUTREACH_QUARANTINE=EMPTY')
              raise SystemExit(0)
          rows=[]
          for line in src.read_text(errors='ignore').splitlines():
              if not line.strip(): continue
              item=json.loads(line)
              if not isinstance(item,dict): raise SystemExit('non_object_queue_row')
              rows.append(item)
          if not rows: raise SystemExit(0)
          if any(str(r.get('action') or '')!='outreach-pilot' for r in rows):
              raise SystemExit('refusing_to_quarantine_mixed_queue')
          times=[]
          for r in rows:
              ts=str(r.get('queued_at') or '')
              times.append(datetime.fromisoformat(ts.replace('Z','+00:00')))
          now=datetime.now(timezone.utc)
          if max(times) > now-timedelta(hours=24):
              raise SystemExit('refusing_to_quarantine_recent_outreach')
          qdir=src.parent/'quarantine'
          qdir.mkdir(mode=0o700,exist_ok=True)
          stamp=now.strftime('%Y%m%dT%H%M%SZ')
          dst=qdir/f'pending-outreach-{stamp}.jsonl'
          digest=hashlib.sha256(src.read_bytes()).hexdigest()
          src.replace(dst)
          dst.chmod(0o600)
          manifest=qdir/f'pending-outreach-{stamp}.manifest.json'
          manifest.write_text(json.dumps({'count':len(rows),'sha256':digest,'oldest':min(times).isoformat(),'newest':max(times).isoformat(),'reason':'stale_outreach_fail_closed_quarantine'},separators=(',',':'))+'\n')
          manifest.chmod(0o600)
          print('SOFIA_OUTREACH_QUARANTINED='+str(len(rows)))
          print('SOFIA_OUTREACH_QUARANTINE_SHA256='+digest)
          PY'

      - name: Cleanup local key
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/hostinger-crm-bridge
          find /tmp -maxdepth 1 -name 'tmp.*' -user "$(id -u)" -delete 2>/dev/null || true
