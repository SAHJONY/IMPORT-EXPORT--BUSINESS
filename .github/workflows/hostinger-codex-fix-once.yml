name: Hostinger Codex Runtime Fix Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-codex-fix-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-codex-fix
  cancel-in-progress: false

jobs:
  fix-codex-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOST: '69.62.68.67'
      USER: root
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_KEY:-}" ]] || { echo HOSTINGER_SSH_PRIVATE_KEY_MISSING=1 >&2; exit 2; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/hostinger-codex-fix
          chmod 600 ~/.ssh/hostinger-codex-fix

      - name: Repair Codex plugin registration only
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4; do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
              -i ~/.ssh/hostinger-codex-fix "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          STATE=/var/lib/sahjony-openclaw-state
          CONFIG="$STATE/openclaw.json"
          HOME_DIR=/home/node

          oc() {
            env HOME="$HOME_DIR" OPENCLAW_HOME="$HOME_DIR" OPENCLAW_STATE_DIR="$STATE" OPENCLAW_CONFIG_PATH="$CONFIG" openclaw "$@"
          }

          redact() {
            sed -E 's/(token|secret|key|password|authorization)[=:][^[:space:]]+/\1=[REDACTED]/Ig'
          }

          echo CODEX_FIX_SCOPE_ONLY=1
          [[ -f "$CONFIG" ]] || { echo OPENCLAW_CONFIG_MISSING=1 >&2; exit 21; }
          systemctl cat openclaw-gateway.service >/dev/null 2>&1 || { echo OPENCLAW_GATEWAY_SERVICE_MISSING=1 >&2; exit 20; }
          echo OPENCLAW_VERSION="$(oc --version 2>/dev/null | tail -n1)"

          oc plugins install @openclaw/codex@2026.8.1 --force --pin
          oc plugins enable codex
          oc config validate

          systemctl reset-failed openclaw-gateway.service >/dev/null 2>&1 || true
          systemctl restart openclaw-gateway.service
          sleep 12

          if ! systemctl is-active --quiet openclaw-gateway.service; then
            journalctl -u openclaw-gateway.service -n 120 --no-pager | redact >&2 || true
            exit 24
          fi
          echo OPENCLAW_GATEWAY_ACTIVE=1

          plugin_status="$(oc plugins list 2>&1 || true)"
          printf '%s\n' "$plugin_status" | redact | tail -n 120
          printf '%s\n' "$plugin_status" | grep -Eiq 'codex' || { echo CODEX_PLUGIN_NOT_REGISTERED=1 >&2; exit 31; }
          echo CODEX_PLUGIN_REGISTERED=1

          wa="$(oc channels status --channel whatsapp --probe 2>&1 || true)"
          printf '%s\n' "$wa" | redact | tail -n 80
          if printf '%s\n' "$wa" | grep -Eiq 'whatsapp.*(connected|ready|healthy|linked.*running)|linked.*running.*connected'; then
            echo WHATSAPP_STILL_CONNECTED=1
          else
            echo WHATSAPP_STATUS_RECHECK_NEEDED=1
          fi

          echo CODEX_RUNTIME_REPAIR_COMPLETE=1
          REMOTE
            then
              ok=1
              break
            fi
            echo "SSH_ATTEMPT_${attempt}_FAILED=1" >&2
            sleep $((attempt * 5))
          done
          [[ "$ok" == "1" ]] || { echo HOSTINGER_CODEX_FIX_FAILED=1 >&2; exit 255; }

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f ~/.ssh/hostinger-codex-fix
