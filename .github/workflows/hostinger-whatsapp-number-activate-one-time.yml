name: Hostinger WhatsApp Number Activate One-Time

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hostinger-whatsapp-number-activate-one-time.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

env:
  HOSTINGER_VM_ID: '767852'
  HOSTINGER_HOST: '69.62.68.67'
  HOSTINGER_USER: root
  HOSTINGER_API_BASE: https://developers.hostinger.com

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare ephemeral management identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_API_TOKEN"
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq sshpass netcat-openbsd >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/whatsapp-number-activate" -C "sahjony-whatsapp-number-activate-${GITHUB_RUN_ID}"
          chmod 600 "$HOME/.ssh/whatsapp-number-activate"
          echo "SSH_KEY_PATH=$HOME/.ssh/whatsapp-number-activate" >> "$GITHUB_ENV"
          chmod +x openclaw/hostinger-24x7/*.sh
          bash -n openclaw/hostinger-24x7/hostinger-recovery-controller.sh
          bash -n openclaw/hostinger-24x7/run-whatsapp-number-activation-once.sh
          bash -n openclaw/hostinger-24x7/whatsapp-number-activate.sh

      - name: Establish authorized native Kali SSH
        shell: bash
        run: |
          set -euo pipefail
          openclaw/hostinger-24x7/hostinger-recovery-controller.sh repair-ssh
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i "$SSH_KEY_PATH" "$HOSTINGER_USER@$HOSTINGER_HOST" 'systemctl is-active --quiet ssh.service && /usr/sbin/sshd -t && echo SAHJONY_NATIVE_KALI_SSH=READY'

      - name: Run existing-session activation and 24x7 gates
        shell: bash
        run: |
          set -euo pipefail
          remote_dir=/tmp/sahjony-whatsapp-number-activation
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i "$SSH_KEY_PATH")
          ssh "${ssh_opts[@]}" "$HOSTINGER_USER@$HOSTINGER_HOST" "rm -rf '$remote_dir' && install -d -m 700 '$remote_dir'"
          scp "${ssh_opts[@]}" openclaw/hostinger-24x7/run-whatsapp-number-activation-once.sh "$HOSTINGER_USER@$HOSTINGER_HOST:$remote_dir/run-whatsapp-number-activation-once.sh"
          scp "${ssh_opts[@]}" openclaw/hostinger-24x7/whatsapp-number-activate.sh "$HOSTINGER_USER@$HOSTINGER_HOST:$remote_dir/whatsapp-number-activate.sh"
          scp "${ssh_opts[@]}" openclaw/hostinger-24x7/whatsapp-guardian.sh "$HOSTINGER_USER@$HOSTINGER_HOST:$remote_dir/whatsapp-guardian.sh"
          scp "${ssh_opts[@]}" openclaw/hostinger-24x7/install-whatsapp-guardian.sh "$HOSTINGER_USER@$HOSTINGER_HOST:$remote_dir/install-whatsapp-guardian.sh"
          ssh "${ssh_opts[@]}" "$HOSTINGER_USER@$HOSTINGER_HOST" "SAHJONY_ACTIVATION_SRC_DIR='$remote_dir' bash '$remote_dir/run-whatsapp-number-activation-once.sh'"

      - name: Remove ephemeral management identity
        if: always()
        shell: bash
        run: |
          set +e
          key="$HOME/.ssh/whatsapp-number-activate"
          if test -s "$key" && test -s "$key.pub"; then
            pub_b64="$(base64 -w0 "$key.pub")"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -i "$key" "$HOSTINGER_USER@$HOSTINGER_HOST" "PUB_B64='$pub_b64' bash -c 'set -e; auth=/root/.ssh/authorized_keys; test -f \"\$auth\" || exit 0; pub=\$(printf %s \"\$PUB_B64\" | base64 -d); tmp=\$(mktemp); grep -vxF \"\$pub\" \"\$auth\" > \"\$tmp\" || true; cat \"\$tmp\" > \"\$auth\"; chmod 600 \"\$auth\"; rm -f \"\$tmp\"; rm -rf /tmp/sahjony-whatsapp-number-activation; echo SAHJONY_EPHEMERAL_KEY_REMOVED=1'"
          fi
          rm -f "$key" "$key.pub"
