name: Hostinger Native SSH Self-Heal V10

on:
  push:
    paths:
      - '.github/workflows/hostinger-native-ssh-self-heal-v10.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vm-767852-mutation
  cancel-in-progress: false

env:
  HOSTINGER_API_BASE: https://developers.hostinger.com
  VM_ID: '767852'
  HOST: '69.62.68.67'
  USER: root

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      PERSISTENT_SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare management identity and repair payload
        id: creds
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$API_TOKEN" ]] || { echo HOSTINGER_API_TOKEN_MISSING=1 >&2; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass jq netcat-openbsd >/dev/null
          install -d -m 700 ~/.ssh
          if [[ -n "${PERSISTENT_SSH_KEY:-}" ]]; then
            printf '%s\n' "$PERSISTENT_SSH_KEY" > ~/.ssh/hostinger_v10
            chmod 600 ~/.ssh/hostinger_v10
            ssh-keygen -y -f ~/.ssh/hostinger_v10 > ~/.ssh/hostinger_v10.pub
            echo MANAGEMENT_KEY_SOURCE=persistent_secret
          else
            ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/hostinger_v10
            echo MANAGEMENT_KEY_SOURCE=ephemeral_fallback
          fi
          RECOVERY_PASSWORD="$(openssl rand -hex 18)Aa1!"
          echo "::add-mask::$RECOVERY_PASSWORD"
          echo "recovery_password=$RECOVERY_PASSWORD" >> "$GITHUB_OUTPUT"
          base64 -w0 openclaw/hostinger-24x7/ssh-self-heal.sh > /tmp/ssh-self-heal.b64
          echo V10_PAYLOAD_READY=1

      - name: Require idle Hostinger action plane
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            actions="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/actions?page=1")"
            busy="$(jq '[.data[]? | select(.state=="sent" or .state=="started" or .state=="pending" or .state=="running" or .state=="queued")] | length' <<<"$actions")"
            jq -c '[.data[]? | {id,name,state,created_at,updated_at}] | .[0:8]' <<<"$actions"
            if [[ "$busy" == 0 ]]; then echo HOSTINGER_V10_CONTROL_PLANE_IDLE=1; exit 0; fi
            echo "v10_busy=$busy probe=$i/90"
            sleep 5
          done
          echo HOSTINGER_V10_CONTROL_PLANE_BUSY=1 >&2
          exit 3

      - name: Enter owned Recovery session
        id: recovery_start
        env:
          RECOVERY_PASSWORD: ${{ steps.creds.outputs.recovery_password }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg p "$RECOVERY_PASSWORD" '{root_password:$p}')"
          body="$(curl -fsS -X POST -H "Authorization: Bearer $API_TOKEN" -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$payload" "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/recovery")"
          id="$(jq -r '.id // empty' <<<"$body")"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo HOSTINGER_V10_RECOVERY_ACTION_MISSING=1 >&2; exit 4; }
          echo "action_id=$id" >> "$GITHUB_OUTPUT"
          echo "owned=true" >> "$GITHUB_OUTPUT"
          echo HOSTINGER_V10_RECOVERY_ACTION=$id

      - name: Wait for Recovery start
        env:
          ACTION_ID: ${{ steps.recovery_start.outputs.action_id }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            a="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/actions/$ACTION_ID")"
            s="$(jq -r '.state // empty' <<<"$a")"
            echo "v10_recovery_start=$i/120 state=${s:-unknown}"
            case "$s" in success) exit 0;; failed|failure|error|cancelled|canceled) jq -c . <<<"$a" >&2; exit 5;; esac
            sleep 5
          done
          exit 6

      - name: Repair original Kali SSH offline with canonical engine
        env:
          RECOVERY_PASSWORD: ${{ steps.creds.outputs.recovery_password }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$RECOVERY_PASSWORD"
          ok=false
          for i in $(seq 1 60); do
            if sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 -o PreferredAuthentications=password -o PubkeyAuthentication=no "$USER@$HOST" 'printf V10_RECOVERY_OK' 2>/tmp/v10-recovery.err | grep -q V10_RECOVERY_OK; then ok=true; break; fi
            if (( i == 1 || i % 10 == 0 || i == 60 )); then sed -n '1,12p' /tmp/v10-recovery.err || true; fi
            sleep 10
          done
          [[ "$ok" == true ]] || { echo HOSTINGER_V10_RECOVERY_SSH_FAILED=1 >&2; exit 7; }

          PUB_B64="$(base64 -w0 ~/.ssh/hostinger_v10.pub)"
          SCRIPT_B64="$(cat /tmp/ssh-self-heal.b64)"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -o PreferredAuthentications=password -o PubkeyAuthentication=no "$USER@$HOST" "PUB_B64='$PUB_B64' SCRIPT_B64='$SCRIPT_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          root=''
          for mp in /mnt/sdb1 /mnt; do
            if [[ -f "$mp/etc/os-release" && -x "$mp/usr/sbin/sshd" ]]; then root="$mp"; break; fi
          done
          if [[ -z "$root" ]]; then
            for dev in $(lsblk -prno NAME,FSTYPE,TYPE | awk '$3=="part" && $2!="" {print $1}'); do
              mkdir -p /mnt/sahjony-v10
              mount "$dev" /mnt/sahjony-v10 2>/dev/null || continue
              if [[ -f /mnt/sahjony-v10/etc/os-release && -x /mnt/sahjony-v10/usr/sbin/sshd ]]; then root=/mnt/sahjony-v10; break; fi
              umount /mnt/sahjony-v10 2>/dev/null || true
            done
          fi
          [[ -n "$root" ]] || { echo ORIGINAL_KALI_ROOT_NOT_FOUND=1 >&2; exit 20; }
          echo "ORIGINAL_KALI_ROOT=$root"

          install -d -m 700 "$root/root/.ssh"
          touch "$root/root/.ssh/authorized_keys"
          chmod 600 "$root/root/.ssh/authorized_keys"
          pub="$(printf '%s' "$PUB_B64" | base64 -d)"
          grep -qxF "$pub" "$root/root/.ssh/authorized_keys" || printf '%s\n' "$pub" >> "$root/root/.ssh/authorized_keys"

          printf '%s' "$SCRIPT_B64" | base64 -d > /tmp/sahjony-ssh-self-heal
          chmod 700 /tmp/sahjony-ssh-self-heal
          install -d -m 0755 "$root/usr/local/sbin"
          cp /tmp/sahjony-ssh-self-heal "$root/usr/local/sbin/sahjony-ssh-self-heal"
          chmod 0755 "$root/usr/local/sbin/sahjony-ssh-self-heal"

          ROOT_PREFIX="$root" /tmp/sahjony-ssh-self-heal

          echo '=== V10 offline proof ==='
          chroot "$root" /usr/sbin/sshd -t
          test ! -e "$root/etc/systemd/system/sahjony-sshd.service"
          test -L "$root/etc/systemd/system/multi-user.target.wants/ssh.service"
          grep -q '^d /run/sshd 0755 root root -$' "$root/etc/tmpfiles.d/sahjony-sshd.conf"
          echo HOSTINGER_V10_OFFLINE_NATIVE_SSH_REPAIRED=1
          sync
          REMOTE

      - name: Exit owned Recovery
        id: recovery_stop
        if: always() && steps.recovery_start.outputs.owned == 'true'
        shell: bash
        run: |
          set +e
          body="$(curl -sS -X DELETE -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/recovery")"
          id="$(jq -r '.id // empty' <<<"$body" 2>/dev/null)"
          if [[ "$id" =~ ^[0-9]+$ ]]; then
            echo "action_id=$id" >> "$GITHUB_OUTPUT"
            echo HOSTINGER_V10_STOP_ACTION=$id
          else
            echo HOSTINGER_V10_STOP_ACTION_NOT_RETURNED=1
          fi

      - name: Wait for Recovery stop
        if: always() && steps.recovery_stop.outputs.action_id != ''
        env:
          ACTION_ID: ${{ steps.recovery_stop.outputs.action_id }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            a="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/actions/$ACTION_ID")"
            s="$(jq -r '.state // empty' <<<"$a")"
            echo "v10_recovery_stop=$i/120 state=${s:-unknown}"
            case "$s" in success) exit 0;; failed|failure|error|cancelled|canceled) exit 8;; esac
            sleep 5
          done
          exit 9

      - name: Prove normal Kali SSH and allow one bounded restart
        id: normal_ssh
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            for i in $(seq 1 36); do
              if ssh -i ~/.ssh/hostinger_v10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=7 "$USER@$HOST" 'printf V10_NORMAL_SSH_OK' 2>/tmp/v10-normal.err | grep -q V10_NORMAL_SSH_OK; then
                echo HOSTINGER_V10_NORMAL_SSH_AUTHENTICATED=1
                return 0
              fi
              if (( i == 1 || i % 6 == 0 || i == 36 )); then
                echo "normal_ssh_probe=$i/36"
                sed -n '1,10p' /tmp/v10-normal.err || true
              fi
              sleep 5
            done
            return 1
          }
          if probe; then exit 0; fi

          echo HOSTINGER_V10_BOUNDED_RESTART=1
          body="$(curl -fsS -X POST -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/restart")"
          id="$(jq -r '.id // empty' <<<"$body")"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo HOSTINGER_V10_RESTART_ACTION_MISSING=1 >&2; exit 10; }
          for i in $(seq 1 120); do
            a="$(curl -fsS -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/json' "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$VM_ID/actions/$id")"
            s="$(jq -r '.state // empty' <<<"$a")"
            echo "v10_restart=$i/120 state=${s:-unknown}"
            case "$s" in success) break;; failed|failure|error|cancelled|canceled) exit 11;; esac
            sleep 5
          done
          sleep 15
          probe || { echo HOSTINGER_V10_NORMAL_SSH_STILL_FAILED=1 >&2; exit 12; }

      - name: Activate native self-heal on live Kali and verify invariants
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hostinger_v10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          /usr/local/sbin/sahjony-ssh-self-heal
          systemctl is-active --quiet ssh.service
          systemctl is-enabled --quiet ssh.service
          systemctl is-active --quiet sahjony-ssh-runtime-guard.timer
          systemctl is-enabled --quiet sahjony-ssh-runtime-guard.timer
          test -d /run/sshd
          test ! -e /etc/systemd/system/sahjony-sshd.service
          /usr/sbin/sshd -t
          ss -lnt '( sport = :22 )' | grep -q ':22'
          echo SAHJONY_HOSTINGER_NATIVE_SSH_GATE=READY
          REMOTE

      - name: Stabilize Docker OpenClaw without recreating state
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/hostinger_v10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null openclaw/hostinger-24x7/whatsapp-hostinger-only-guardian.sh "$USER@$HOST:/tmp/whatsapp-hostinger-only-guardian.sh"
          ssh -i ~/.ssh/hostinger_v10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          command -v docker >/dev/null
          systemctl is-active --quiet docker || systemctl start docker
          container="$(docker ps -a --format '{{.Names}} {{.Image}}' | awk 'tolower($0) ~ /openclaw/ {print $1; exit}')"
          [[ -n "$container" ]] || { echo OPENCLAW_CONTAINER_NOT_FOUND=1 >&2; exit 30; }
          docker update --restart unless-stopped "$container" >/dev/null
          if [[ "$(docker inspect -f '{{.State.Running}}' "$container")" != true ]]; then docker start "$container" >/dev/null; fi
          install -m 0755 /tmp/whatsapp-hostinger-only-guardian.sh /usr/local/sbin/sahjony-whatsapp-hostinger-guardian
          /usr/local/sbin/sahjony-whatsapp-hostinger-guardian || true
          echo "OPENCLAW_CONTAINER=$container"
          echo "OPENCLAW_RESTART_POLICY=$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' "$container")"
          docker exec "$container" sh -lc 'openclaw channels status --probe' || { echo OPENCLAW_WHATSAPP_PROBE_FAILED=1 >&2; exit 31; }
          echo SAHJONY_HOSTINGER_OPENCLAW_LOCAL_GATE=READY
          REMOTE

      - name: Final proof
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hostinger_v10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          systemctl is-active --quiet ssh.service
          systemctl is-active --quiet sahjony-ssh-runtime-guard.timer
          test -d /run/sshd
          ss -lnt '( sport = :22 )' | grep -q ':22'
          container="$(docker ps --format '{{.Names}} {{.Image}}' | awk 'tolower($0) ~ /openclaw/ {print $1; exit}')"
          [[ -n "$container" ]]
          [[ "$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' "$container")" =~ ^(unless-stopped|always)$ ]]
          docker exec "$container" sh -lc 'openclaw channels status --probe' >/tmp/openclaw-v10-probe.txt
          cat /tmp/openclaw-v10-probe.txt
          echo SAHJONY_HOSTINGER_LOCAL_RUNTIME=READY
          REMOTE
