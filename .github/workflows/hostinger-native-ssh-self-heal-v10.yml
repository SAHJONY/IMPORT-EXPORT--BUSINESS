name: Hostinger Native SSH Self-Heal V10 [RETIRED]

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo HOSTINGER_NATIVE_SSH_SELF_HEAL_V10_RETIRED=1
          echo USE_HOSTINGER_RECOVERY_CONTROLLER=1
          echo NATIVE_SSH_SERVICE_IS_AUTHORITATIVE=1
