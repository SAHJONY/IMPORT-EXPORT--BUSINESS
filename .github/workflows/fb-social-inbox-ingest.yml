name: FB Social Inbox Ingest

# Write-half of the Facebook -> SAHJONY social inbox pipeline.
# The fetch-half (facebook_ingest.py) runs where Juan's Facebook CLI session
# lives and has no database credentials; it hands the normalized items here
# as JSON, and this workflow upserts them into the app backend using the
# repository's Supabase server secrets. Triggered on demand via
# `gh workflow run fb-social-inbox-ingest.yml -f items_json="$(cat outbox.json)"`.

on:
  workflow_dispatch:
    inputs:
      items_json:
        description: 'JSON array of normalized social inbox items (from facebook_ingest.py --outbox)'
        required: true
        type: string

concurrency:
  group: fb-social-inbox-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upsert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ITEMS_JSON: ${{ inputs.items_json }}
    steps:
      - name: Verify required runtime configuration
        run: |
          python - <<'PY'
          import os, sys
          missing=[]
          if not os.getenv('SUPABASE_URL','').strip(): missing.append('SUPABASE_URL')
          if not (os.getenv('SUPABASE_SERVICE_ROLE_KEY','').strip() or os.getenv('SUPABASE_SECRET_KEY','').strip()):
              missing.append('SUPABASE_SERVICE_ROLE_KEY or SUPABASE_SECRET_KEY')
          if not os.getenv('ITEMS_JSON','').strip(): missing.append('items_json input')
          if missing:
              print('Missing required configuration:', ', '.join(missing))
              sys.exit(2)
          print('Required runtime configuration present.')
          PY
      - name: Upsert social inbox items
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request

          items = json.loads(os.environ['ITEMS_JSON'])
          if not isinstance(items, list):
              print('items_json must be a JSON array'); sys.exit(2)
          print(f'Items received: {len(items)}')
          if not items:
              print('Nothing to upsert.'); sys.exit(0)

          base = os.environ['SUPABASE_URL'].strip().rstrip('/')
          key = (os.environ.get('SUPABASE_SERVICE_ROLE_KEY','').strip()
                 or os.environ.get('SUPABASE_SECRET_KEY','').strip())

          def record_key(row: dict) -> str:
              # Mirrors insforge_backend._record_key for these rows:
              # rows carry external_id (ends with _id, not in the preferred list).
              ext = row.get('external_id')
              if ext not in (None, ''):
                  return f'external_id:{ext}'
              raise ValueError('row missing external_id')

          body = [
              {'logical_table': 'social_inbox_items',
               'record_key': record_key(r),
               'data': r}
              for r in items
          ]
          req = urllib.request.Request(
              f'{base}/rest/v1/sahjony_trade_records?on_conflict=logical_table,record_key',
              data=json.dumps(body).encode('utf-8'),
              method='POST',
              headers={
                  'apikey': key,
                  'Authorization': f'Bearer {key}',
                  'Content-Type': 'application/json',
                  'Prefer': 'resolution=merge-duplicates,return=representation',
              },
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              result = json.loads(resp.read().decode('utf-8') or '[]')
          print(f'Upserted: {len(result) if isinstance(result, list) else result}')
          PY
