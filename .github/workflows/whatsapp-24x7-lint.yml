name: WhatsApp 24x7 Lint

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/whatsapp-24x7-lint.yml'
      - '.github/workflows/whatsapp-24x7-control-plane.yml'
      - '.github/workflows/hostinger-runtime-recovery-engine.yml'
      - '.github/workflows/hostinger-whatsapp-recovery-v7.yml'
      - '.github/workflows/hostinger-whatsapp-pair-live.yml'
      - 'openclaw/hostinger-24x7/whatsapp-24x7-control-plane.sh'
      - 'openclaw/hostinger-24x7/whatsapp-hostinger-only-guardian.sh'
      - 'openclaw/hostinger-24x7/whatsapp-pairing-controller.sh'
      - 'openclaw/hostinger-24x7/hostinger-recovery-controller.sh'
      - 'openclaw/hostinger-24x7/openclaw-runtime-recovery.sh'
      - 'openclaw/hostinger-24x7/runtime-plan-doctor.sh'
      - 'openclaw/hostinger-24x7/ssh-self-heal.sh'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate Hostinger recovery Bash tools
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            openclaw/hostinger-24x7/whatsapp-24x7-control-plane.sh \
            openclaw/hostinger-24x7/whatsapp-hostinger-only-guardian.sh \
            openclaw/hostinger-24x7/whatsapp-pairing-controller.sh \
            openclaw/hostinger-24x7/hostinger-recovery-controller.sh \
            openclaw/hostinger-24x7/openclaw-runtime-recovery.sh \
            openclaw/hostinger-24x7/runtime-plan-doctor.sh \
            openclaw/hostinger-24x7/ssh-self-heal.sh
          do
            bash -n "$f"
            echo "OK $f"
          done

      - name: Validate pairing anti-loop invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          controller = pathlib.Path('openclaw/hostinger-24x7/whatsapp-pairing-controller.sh').read_text()
          workflow = pathlib.Path('.github/workflows/hostinger-whatsapp-pair-live.yml').read_text()
          forbidden = ['"force":true', "'force':true", 'force\\":true']
          for marker in forbidden:
              if marker in controller or marker in workflow:
                  raise SystemExit(f'FORCED_REPAIR_FORBIDDEN={marker}')
          if workflow.count('web.login.start'):
              raise SystemExit('PAIR_WORKFLOW_MUST_CALL_CONTROLLER_NOT_RAW_LOGIN=1')
          if 'pair_once' not in workflow or 'mark_client_lock' not in workflow:
              raise SystemExit('PAIRING_LOCK_MODES_MISSING=1')
          if 'whatsapp-pairing-controller.sh' not in workflow:
              raise SystemExit('PAIRING_CONTROLLER_NOT_WIRED=1')
          print('PAIRING_ANTI_LOOP_POLICY=PASS')
          PY

      - name: Reject unsafe early-exit pipelines in runtime planner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re
          path=pathlib.Path('openclaw/hostinger-24x7/openclaw-runtime-recovery.sh')
          text=path.read_text()
          bad=[]
          for n,line in enumerate(text.splitlines(),1):
              if re.search(r'\|\s*head\b|\|\s*tail\b', line):
                  bad.append((n,line.strip()))
          if bad:
              for n,line in bad:
                  print(f'unsafe truncation pipeline {path}:{n}: {line}')
              raise SystemExit(1)
          print('PIPEFAIL_SAFE_RUNTIME_PLANNER=1')
          PY

      - name: Validate workflow YAML structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import yaml

          paths = [
              pathlib.Path('.github/workflows/whatsapp-24x7-control-plane.yml'),
              pathlib.Path('.github/workflows/hostinger-runtime-recovery-engine.yml'),
              pathlib.Path('.github/workflows/hostinger-whatsapp-recovery-v7.yml'),
              pathlib.Path('.github/workflows/hostinger-whatsapp-pair-live.yml'),
              pathlib.Path('.github/workflows/whatsapp-24x7-lint.yml'),
          ]
          for path in paths:
              data = yaml.safe_load(path.read_text())
              if not isinstance(data, dict):
                  raise SystemExit(f'{path}: workflow root is not a mapping')
              jobs = data.get('jobs')
              if not isinstance(jobs, dict) or not jobs:
                  raise SystemExit(f'{path}: jobs mapping missing')
              print(f'OK {path}')
          PY
