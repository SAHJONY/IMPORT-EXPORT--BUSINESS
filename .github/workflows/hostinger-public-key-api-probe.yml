name: Hostinger Public Key API Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-public-key-api-probe.yml'
  workflow_dispatch:

# Capability probe. Creates one temporary account-level SSH key and deletes it.
# It does NOT attach the key to the VPS or modify the VPS.
permissions:
  contents: read

env:
  HOSTINGER_API_BASE: https://developers.hostinger.com
  HOSTINGER_VM_ID: '767852'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - name: Probe Hostinger public-key and Docker Manager capabilities
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HOSTINGER_API_TOKEN:-}" ]]
          auth=(-H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json')

          get_code(){ curl -sS -o "$2" -w '%{http_code}' "${auth[@]}" "$1" || true; }
          vm_code="$(get_code "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$HOSTINGER_VM_ID" /tmp/vm.json)"
          keys_code="$(get_code "$HOSTINGER_API_BASE/api/vps/v1/public-keys?page=1" /tmp/keys.json)"
          attached_code="$(get_code "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$HOSTINGER_VM_ID/public-keys?page=1" /tmp/attached.json)"
          docker_code="$(get_code "$HOSTINGER_API_BASE/api/vps/v1/virtual-machines/$HOSTINGER_VM_ID/docker" /tmp/docker.json)"
          echo "VM_DETAILS=$vm_code"
          echo "ACCOUNT_PUBLIC_KEYS=$keys_code"
          echo "VM_ATTACHED_PUBLIC_KEYS=$attached_code"
          echo "DOCKER_MANAGER_LIST=$docker_code"
          if [[ "$attached_code" != 200 ]]; then jq -c '{error,message}' /tmp/attached.json 2>/dev/null || true; fi
          if [[ "$docker_code" != 200 ]]; then jq -c '{error,message}' /tmp/docker.json 2>/dev/null || head -c 500 /tmp/docker.json || true; echo; fi
          [[ "$vm_code" == 200 && "$keys_code" == 200 ]]

          install -d -m 700 /tmp/hostinger-key-probe
          ssh-keygen -q -t rsa -b 3072 -N '' -f /tmp/hostinger-key-probe/key -C "api-probe-${GITHUB_RUN_ID}"
          pub="$(cat /tmp/hostinger-key-probe/key.pub)"
          name="sahjony-api-probe-${GITHUB_RUN_ID}"
          payload="$(jq -n --arg name "$name" --arg key "$pub" '{name:$name,key:$key}')"
          create_code="$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST "${auth[@]}" -H 'Content-Type: application/json' --data "$payload" "$HOSTINGER_API_BASE/api/vps/v1/public-keys" || true)"
          echo "ACCOUNT_PUBLIC_KEY_CREATE=$create_code"
          if [[ "$create_code" != 200 ]]; then
            jq -c '{error,message}' /tmp/create.json 2>/dev/null || head -c 500 /tmp/create.json || true
            echo
            rm -rf /tmp/hostinger-key-probe
            exit 45
          fi

          key_id="$(jq -r '.id // empty' /tmp/create.json)"
          [[ "$key_id" =~ ^[0-9]+$ ]]
          delete_code="$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE "${auth[@]}" "$HOSTINGER_API_BASE/api/vps/v1/public-keys/$key_id" || true)"
          echo "ACCOUNT_PUBLIC_KEY_DELETE=$delete_code"
          rm -rf /tmp/hostinger-key-probe
          [[ "$delete_code" == 200 ]]
          echo HOSTINGER_ACCOUNT_PUBLIC_KEY_CRUD=READY
          if [[ "$docker_code" == 200 ]]; then echo HOSTINGER_DOCKER_MANAGER=READY; else echo HOSTINGER_DOCKER_MANAGER=UNAVAILABLE; fi
